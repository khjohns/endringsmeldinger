        - generic [ref=e182]:
          - generic [ref=e183]: § 34.2 Generelle regler for vederlagsjustering
          - paragraph [ref=e184]: Vederlagsjusteringen skal fastsettes på grunnlag av kontraktens enhetspriser så langt disse passer. Der enhetspriser ikke passer, fastsettes vederlaget som regningsarbeid, eller ut fra annen avtalt metode.
          - paragraph [ref=e185]: Totalentreprenøren skal varsle uten ugrunnet opphold dersom han vil kreve vederlagsjustering, med opplysninger om hva kravet bygger på og om mulig kravets størrelse.
        - generic [ref=e186]:
          - generic [ref=e187]: § 34.4 Vederlagsjustering — regningsarbeid
          - paragraph [ref=e188]: Regningsarbeid avregnes etter nødvendige kostnader med et avtalt eller sedvanlig påslag for indirekte kostnader, risiko og fortjeneste. Totalentreprenøren skal føre løpende oversikt over timer og materialer.
          - paragraph [ref=e189]: Byggherren skal gis mulighet til å kontrollere omfanget fortløpende. Manglende dokumentasjon kan medføre at deler av kravet avvises.