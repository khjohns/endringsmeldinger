          - generic [ref=e152]: § 34.1 Retten til vederlagsjustering
          - paragraph [ref=e153]: Totalentreprenøren har krav på vederlagsjustering dersom det foreligger en endring etter kapittel V, eller dersom det foreligger andre forhold som byggherren bærer risikoen for etter kontrakten.
          - paragraph [ref=e154]: Kravet om vederlagsjustering må varsles uten ugrunnet opphold. Byggherren må påberope sen varsling skriftlig uten ugrunnet opphold (§5).
        - generic [ref=e178]:
          - generic [ref=e179]: § 34.2 Generelle regler for vederlagsjustering
          - paragraph [ref=e180]: Vederlagsjusteringen skal fastsettes på grunnlag av kontraktens enhetspriser så langt disse passer. Der enhetspriser ikke passer, fastsettes vederlaget som regningsarbeid, eller ut fra annen avtalt metode.
          - paragraph [ref=e181]: Totalentreprenøren skal varsle uten ugrunnet opphold dersom han vil kreve vederlagsjustering, med opplysninger om hva kravet bygger på og om mulig kravets størrelse.
        - generic [ref=e182]:
          - generic [ref=e183]: § 34.4 Vederlagsjustering — regningsarbeid
          - paragraph [ref=e184]: Regningsarbeid avregnes etter nødvendige kostnader med et avtalt eller sedvanlig påslag for indirekte kostnader, risiko og fortjeneste. Totalentreprenøren skal føre løpende oversikt over timer og materialer.
          - paragraph [ref=e185]: Byggherren skal gis mulighet til å kontrollere omfanget fortløpende. Manglende dokumentasjon kan medføre at deler av kravet avvises.