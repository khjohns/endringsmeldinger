# Hendelseskatalogen (spor M, fase 1b). Én oppføring per verdi i EventType.
#
# Rett her, ikke i hendelser.md eller Excel-fila. Begge lages av
#   /tmp/venv/bin/python docs/verktoy/datamodell.py
# og testene i backend/tests/test_datamodell/ feiler når en type mangler
# oppføring, når en oppføring er til overs, når avsender, modell eller
# behandler ikke stemmer med koden, og når de genererte filene er utdaterte.
#
# Feltene i `data` skrives ikke her. De genereres fra Pydantic-modellene i
# backend/models/events.py, og forretningsreglene fra BusinessRuleValidator.
#
# `ns8407_kilde` sier hvor bestemmelsen er hentet fra: «vedtak: …»
# (hovedplanen 3.1 eller en ADR), «kode: …» (koden oppgir den; ikke
# kontrollert mot standardteksten, som ikke ligger i repoet), «oppdragsgiver,
# dato» eller «ikke kontrollert». Flere kilder skilles med semikolon.
#
# Første runde 29.09. Belegg: K kjørt og observert, L lest i kode.

# ---------------------------------------------------------------------------
# Konvolutten: felles for alle hendelser, i egne kolonner i `hendelse`.
# L 29.09: SakEvent, CloudEventMixin.to_cloudevent og PostgresEventRepository._rad.
# ---------------------------------------------------------------------------

[[konvolutt]]
felt = "event_id"
kolonne = "event_id"
beskrivelse = "Unik ID. Settes av serveren; en verdi fra klienten avvises."

[[konvolutt]]
felt = "sak_id"
kolonne = "sak_id, subject"
beskrivelse = "Saken hendelsen hører til."

[[konvolutt]]
felt = "event_type"
kolonne = "event_type, type"
beskrivelse = "Hendelsestypen. `type` har i tillegg prefikset `no.oslo.koe.` (CloudEvents)."

[[konvolutt]]
felt = "tidsstempel"
kolonne = "time"
beskrivelse = "Når serveren tok imot hendelsen, i UTC. Settes av serveren; en verdi fra klienten avvises."

[[konvolutt]]
felt = "aktor_id"
kolonne = "actorid"
beskrivelse = "`app_users.id`, aldri et navn. Settes av serveren."

[[konvolutt]]
felt = "aktor_rolle"
kolonne = "actorrole"
beskrivelse = """
TE eller BH. Settes av serveren: kontraktsrollen i sesjonen, forfatterens
side for webhooken, og fast rolle i tjenestene som bare skriver den ene
sidens hendelser."""

[[konvolutt]]
felt = "aktor_team_id"
kolonne = "actorteam"
beskrivelse = "Catenda-team-ID til aktørens organisasjon. Settes av serveren."

[[konvolutt]]
felt = "kommentar"
kolonne = "comment"
beskrivelse = "Valgfri kommentar."

[[konvolutt]]
felt = "refererer_til_event_id"
kolonne = "referstoid"
beskrivelse = "Hendelsen dette er et svar på, for eksempel kravet et BH-svar gjelder."

[[konvolutt]]
felt = "(ingen)"
kolonne = "versjon"
beskrivelse = """
Løpenummeret i saken, satt av lageret. Det er ikke feltet `versjon` på
kravhendelsene, som ikke lagres."""

[[konvolutt]]
felt = "(ingen)"
kolonne = "prosjekt_id"
beskrivelse = "Stemples av lageret fra det autoriserte prosjektet."

# ---------------------------------------------------------------------------
# Grunnlag (ansvar)
# ---------------------------------------------------------------------------

[[hendelse]]
navn = "grunnlag_opprettet"
beskrivelse = """
TE varsler forholdet og sitt syn på ansvaret: kategori, beskrivelse og når
forholdet ble oppdaget. Varsler om vederlag, rigg/drift, produktivitet og frist
kan sendes i samme hendelse (ADR-001)."""
avsender = "TE"
spor = "grunnlag"
sakstype = ["standard"]
ns8407 = """
Avhenger av kategorien. Grunnlaget er § 33.1 a–c eller § 33.3, med utløsende
bestemmelse og varselkrav per underkategori i kategoritabellen, for eksempel
§ 32.2 for irregulær endring. Varslene i samme hendelse viser til § 34.1,
§ 34.1.3 og § 33.4."""
ns8407_kilde = "kode: backend/constants/grunnlag_categories.py; vedtak: ADR-001, beslutning 4"
modell = "GrunnlagEvent"
data = "GrunnlagData"
lagres_i = "hendelse"
innsending = [
    "POST /api/events og /api/events/batch",
    "Frontend: skjemaet for ny sak (NewCaseForm)",
]
tilstand = """
Grunnlaget blir `sendt`, versjon 1. Vederlag og frist går fra `ikke_relevant`
til `utkast`. Hvert varsel i `varsler` føres inn på vederlags- eller
fristsporet med innsendingsdatoen, og et spor som var `ikke_relevant` eller
`utkast`, blir `sendt`. Sakstittelen settes om den mangler."""
behandler = "_handle_grunnlag"
funn = []
belegg = "L 29.09: modellen, reglene, `_handle_grunnlag` og `_apply_konsekvensvarsler`, og kallet i NewCaseForm."

[[hendelse]]
navn = "grunnlag_oppdatert"
beskrivelse = """
TE reviderer grunnlaget: ny tittel, kategori, beskrivelse eller dato. Hele
grunnlaget sendes på nytt."""
avsender = "TE"
spor = "grunnlag"
sakstype = ["standard"]
ns8407 = "Som `grunnlag_opprettet`, uten varslene."
ns8407_kilde = "kode: backend/constants/grunnlag_categories.py"
modell = "GrunnlagEvent"
data = "GrunnlagData"
lagres_i = "hendelse"
innsending = [
    "POST /api/events og /api/events/batch",
    "Frontend: TeGrunnlagForm, eventuelt gjennom TEs interne kontroll (claimReview)",
]
tilstand = """
Versjonen øker. Et `avslatt` grunnlag går tilbake til `sendt`; andre statuser
står. Nye varsler avvises: de sendes fra vederlags- eller fristsporet
(NOTICE_TRACK, som `validate` sjekker før reglene)."""
behandler = "_handle_grunnlag"
funn = []
belegg = "L 29.09: modellen, `validate` og `_handle_grunnlag`."

[[hendelse]]
navn = "grunnlag_trukket"
beskrivelse = "TE trekker ansvarsgrunnlaget, og med det kravene i saken."
avsender = "TE"
spor = "grunnlag"
sakstype = ["standard"]
ns8407 = "Ingen egen bestemmelse."
ns8407_kilde = "oppdragsgiver, 29.09"
modell = "WithdrawalEvent"
data = "WithdrawalData"
lagres_i = "hendelse"
innsending = [
    "POST /api/events og /api/events/batch",
    "Frontend: Kontrollrommet",
]
tilstand = """
Grunnlaget blir `trukket`. Vederlag og frist som er aktive, det vil si ikke
`ikke_relevant`, `utkast` eller `trukket`, blir også `trukket` (kaskade).
Avvises når grunnlaget er låst, godkjent, ikke sendt, allerede trukket eller
oppgjort ved godtatt avslag."""
behandler = "_handle_grunnlag_trukket"
funn = ["SD-02"]
belegg = "L 29.09: `_handle_grunnlag_trukket` og `_rule_grunnlag_can_be_withdrawn`."

