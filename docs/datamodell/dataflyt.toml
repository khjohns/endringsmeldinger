navn = "prosjekter"

[[catenda]]
id = "medlemmer"
navn = "prosjektmedlemmer"

[[catenda]]
id = "team"
navn = "team og teammedlemmer"

[[catenda]]
id = "board"
navn = "topic board"

[[catenda]]
id = "topic"
navn = "topics"

[[catenda]]
id = "kommentar"
navn = "kommentarer"

[[catenda]]
id = "relasjon"
navn = "relaterte topics"

[[catenda]]
id = "dokument"
navn = "dokumentbiblioteket"

[[catenda]]
id = "dokumentreferanse"
navn = "dokumentreferanser"

