# Dataflyten mellom appens tabeller og Catenda (spor M, fase 1c). Kilden for
# arket «Dataflyt», flytdiagrammene i relasjoner.md og flyt-ID-ene i kolonne 6
# i tabellbeskrivelsen.
#
# Rett her, ikke i de genererte filene. Testene i verktoy/tester/test_datamodell/
# feiler når
#   - en kodereferanse ikke er deklarert i fila
#   - en pil går til noe som verken er en tabell, en Catenda-ressurs eller «appen»
# Ingen test finner et kall til Catenda i TS-serveren som mangler en pil.
#
# Én flyt er én handling. Hvert steg er en pil fra `fra` til hvert mål i `til`.
# `kode` er én kallkjede, fra der handlingen starter til klienten, på formen
# server/…/fil.ts:symbol. Siste ledd står på pilen i diagrammet: på en pil ut
# er det koden som gjør kallet, på en pil inn det som skriver tabellen. Har to
# veier ulike kjeder, eller to tabeller ulike skrivere, er de to steg. «appen» betyr at dataene brukes eller vises, men
# ikke lagres. Retning: inn (fra Catenda), ut (til Catenda) eller begge.
# `drift = true` merker en flyt bare driftsskript utløser; den tegnes i et eget
# diagram.
#
# Endepunktene er relative til https://api.catenda.com.
#
# Flytene C01–C17 og C20 gjaldt Python-stien og er tatt ut (#49). ID-ene brukes
# ikke på nytt. Belegg: L lest i koden, K kjørt og observert.

[[catenda]]
id = "webhook"
navn = "webhook-varsel"

[[catenda]]
id = "bruker"
navn = "innlogget bruker"

[[catenda]]
id = "medlemmer"
navn = "prosjektmedlemmer"

[[catenda]]
id = "team"
navn = "team og teammedlemmer"

[[catenda]]
id = "board"
navn = "topic board"

[[catenda]]
id = "topic"
navn = "topics"

[[catenda]]
id = "kommentar"
navn = "kommentarer"

# ---------------------------------------------------------------------------
# Drift
# ---------------------------------------------------------------------------

[[flyt]]
id = "C18"
drift = true
navn = "Prosjekt registreres av drift"
retning = "inn"
utloses_av = "`server/registrering.ts registrer`; teamene med `--bh`, `--te` og `--en-totalentreprenoer`."
beskrivelse = """
Drift oppgir Catenda-prosjekt, bibliotek, mappe, board og navn. Driftsskriptet
`server/registrering.ts registrer` registrerer prosjektet mot
`koe_drift.registrer_prosjekt` i SQL Server (F-1, #820). Det henter ikke navnet
fra Catenda, men kontrollerer et oppgitt board mot Catenda-prosjektet (#836).
Kontraktsteamene kontrolleres mot Catenda, og uten `--en-totalentreprenoer`
avvises de (DL-U14). Hva en ny registrering gjør med mappen, boardet og et bytte
av Catenda-prosjekt, står ved `koe.catenda_project_configs` i `tabeller.toml`."""
funn = []
belegg = "L 20.10: teamene gjennom `kjoer` og `registrer` i `server/registrering.ts` (#1072)."

[[flyt.steg]]
fra = "catenda:team"
til = ["koe.catenda_contract_teams"]
endepunkt = "GET /v2/projects/{catenda_project_id}/teams"
kode = [
    "server/registrering.ts:kjoer",
    "server/registrering.ts:catendaTeam",
    "server/registrering.ts:registrer",
]
data = "Kontroll av at teamene drift oppgir, finnes i Catenda-prosjektet. ID-ene kommer fra drift."

[[flyt.steg]]
fra = "catenda:board"
til = ["appen"]
endepunkt = "GET /opencde/bcf/3.0/projects/{topic_board_id}"
kode = ["server/registrering.ts:kjoer", "server/catenda.ts:CatendaOAuth"]
data = "`bimsync_project_id` for boardet drift oppgir, kontrollert mot Catenda-prosjektet (#836)."

[[flyt]]
id = "C19"
drift = true
navn = "Kontraktsteam endres av drift"
retning = "inn"
utloses_av = "`server/registrering.ts kontraktsteam` med `--bh`, `--te` og `--en-totalentreprenoer`."
beskrivelse = """
Driftsskriptet kontrollerer teamene mot Catenda-prosjektet og kaller
`koe_drift.sett_kontraktsteam`; har prosjektet saker, kan teamene bare få nye
team (F-1, #820). Uten `--en-totalentreprenoer` avvises teamene (DL-U14)."""
funn = []
belegg = "L 20.10: `kjoer` og `settKontraktsteam` i `server/registrering.ts`."

[[flyt.steg]]
fra = "catenda:team"
til = ["koe.catenda_contract_teams"]
endepunkt = "GET /v2/projects/{catenda_project_id}/teams"
kode = [
    "server/registrering.ts:kjoer",
    "server/registrering.ts:catendaTeam",
    "server/registrering.ts:settKontraktsteam",
]
data = "Kontroll av at teamene drift oppgir, finnes i Catenda-prosjektet."

[[flyt]]
id = "C21"
navn = "Webhooken fra Catenda til innboksen i TS-serveren"
retning = "inn"
utloses_av = """
Webhook fra Catenda til `POST /webhook/catenda/<hemmelig sti>` i TS-serveren
(W-1a, #819). Alle hendelsestyper tas imot, også `bcf.*`."""
beskrivelse = """
Stien sammenlignes med hemmeligheten i konstant tid, og en feil sti gir 404 som en
ukjent rute (INT-01). Kroppen lagres rå i `koe.innkommende_hendelse` før svaret 200,
og samme `event.id` lagres én gang. Feiler lagringen, er svaret 500, så Catenda
prøver igjen (INT-02). Behandlingen av innboksen er C22 (W-1b.1), og kommentaren
tilbake til topicen er C23 (W-1b.2)."""
funn = ["INT-01", "INT-02"]
belegg = "L 19.10: `server/webhook.ts`. K 19.10: `server/tester/webhook.test.ts`."

[[flyt.steg]]
fra = "catenda:webhook"
til = ["koe.innkommende_hendelse"]
endepunkt = "Innkommende POST fra Catenda"
kode = [
    "server/webhook.ts:taImot",
    "server/webhook.ts:mottaHendelse",
]
data = "Hele kroppen, med `event.id` og `event.type` i egne kolonner."

[[flyt]]
id = "C22"
navn = "Behandlingen av innboksen i TS-serveren"
retning = "inn"
utloses_av = """
Løkka i jobbkjøreren, etter jobbene: `behandleEnHendelse` i `server/jobber.ts` tar
den eldste hendelsen i `koe.innkommende_hendelse` uten utfall som ikke venter etter et
forsøk (W-1b.1, #819)."""
beskrivelse = """
Bare en ny topic gir en sak, og en endret topic når en tidligere hendelse for topicen
ble avvist fordi tittelen har tegn PDF-en av brevet ikke kan vise, og ingen har gitt en
sak (`tittel_kan_ikke_vises`, arbeidsvalgene 22.10 i #1138). Catenda signerer ikke kroppen, så av den brukes bare
topic-ID-en, boardet og Catenda-prosjektet, og prosjektet tas fra koblingen mellom de
to. Forfatteren, typen og tittelen leses fra topicen i Catenda, og en topic Catenda
ikke finner på boardet, gir ingen sak. En topic laget av integrasjonen selv gir ingen
sak (#741 punkt 17). Identiteten løses først når forfatteren står i medlemslisten fra
Catenda, med navnet og e-posten derfra, og siden avgjøres med kontraktsteamene i Catenda. En
topic fra TE gir en sak med bare topicens tittel (KT-U6), og saken kobles til topicen
i samme transaksjon, uten jobb for en ny topic. En topic fra BH gir ingen sak
(KT-U7). Hver hendelse får ett utfall i `koe.innkommende_behandling`, med boardet
topicen ble slått opp på. Svarer ikke Catenda eller basen, lagres forsøket i
`koe.innkommende_forsoek`, og hendelsen venter før neste forsøk, lenger for hvert
forsøk (#963). Kommentaren tilbake til topicen er C23."""
funn = []
belegg = "L 19.10: `server/hendelser.ts`, `server/jobber.ts`, `database/migrasjoner/20261020130000_innkommende_behandling.sql` og `database/migrasjoner/20261020140000_innkommende_forsoek_og_kommentar.sql`. L 22.10: `database/migrasjoner/20261022180000_tittel_kan_ikke_vises.sql`."

[[flyt.steg]]
fra = "catenda:bruker"
til = ["appen"]
endepunkt = "GET /v2/user"
kode = [
    "server/jobber.ts:behandleEnHendelse",
    "server/hendelser.ts:behandle",
    "server/catenda.ts:innboksintegrasjon",
    "server/catenda.ts:CatendaOAuth",
]
data = "Integrasjonens egen Catenda-ID (`egenId`), som skiller topics integrasjonen laget. Lagres ikke."

[[flyt.steg]]
fra = "catenda:topic"
til = ["appen"]
endepunkt = "GET /opencde/bcf/3.0/projects/{topic_board_id}/topics/{topic_guid}"
kode = [
    "server/jobber.ts:behandleEnHendelse",
    "server/hendelser.ts:behandle",
    "server/catenda.ts:innboksintegrasjon",
    "server/catenda.ts:CatendaOAuth",
]
data = """
Topicens tittel, type og forfatter (`bimsync_creation_author.user.ref`), med
integrasjonens token. Kroppen fra webhooken leses ikke for dem. 404 gir utfallet
`ugyldig_hendelse` uten sak."""

[[flyt.steg]]
fra = "catenda:medlemmer"
til = ["appen"]
endepunkt = "GET /v2/projects/{catenda_project_id}/members?userType=user (sidevis)"
kode = [
    "server/jobber.ts:behandleEnHendelse",
    "server/hendelser.ts:behandle",
    "server/catenda.ts:innboksintegrasjon",
    "server/catenda.ts:CatendaOAuth",
]
data = """
Om forfatteren er medlem av prosjektet, og navnet og e-posten som sendes til
`koe_api.catenda_identitet`. Uten medlemskap løses ingen identitet."""

[[flyt.steg]]
fra = "catenda:team"
til = ["appen"]
endepunkt = "GET /v2/projects/{catenda_project_id}/teams/{team_id}/members (sidevis), for hvert kontraktsteam"
kode = [
    "server/jobber.ts:behandleEnHendelse",
    "server/hendelser.ts:behandle",
    "server/autorisasjon.ts:kontraktssideUtenSesjon",
    "server/catenda.ts:innboksintegrasjon",
    "server/catenda.ts:CatendaOAuth",
]
data = "Forfatterens side og team. Blir `aktor_rolle` og `aktor_team_id` i `sak_opprettet`."

[[flyt.steg]]
fra = "catenda:webhook"
til = ["koe.sak_metadata", "koe.hendelse", "koe.sak_catenda_topic"]
endepunkt = "Hendelsen i innboksen"
kode = [
    "server/jobber.ts:behandleEnHendelse",
    "server/hendelser.ts:behandle",
    "server/kommandoer.ts:opprettSak",
]
data = """
Topicens tittel blir sakstittelen i `sak_opprettet`, og topicen og boardet blir
koblingen i `koe.sak_catenda_topic`, skrevet av `koe_api.koble_topic` fra
`koe_api.opprett_sak`. Kvitteringen i `koe.kvittering` har en kommando-ID avledet
av hendelsen i innboksen. Forfatteren løses til en brukerrad med navnet og e-posten
fra medlemslisten, som ved medlemssynkroniseringen, og bare for et medlem."""

[[flyt.steg]]
fra = "catenda:webhook"
til = ["koe.innkommende_behandling"]
endepunkt = "Hendelsen i innboksen"
kode = [
    "server/jobber.ts:behandleEnHendelse",
    "server/hendelser.ts:registrerBehandling",
]
data = "Utfallet, med prosjektet, saken, topicen og boardet når de er kjent."

[[flyt.steg]]
fra = "catenda:webhook"
til = ["koe.innkommende_forsoek"]
endepunkt = "Hendelsen i innboksen"
kode = [
    "server/jobber.ts:behandleEnHendelse",
    "server/hendelser.ts:registrerForsoek",
]
data = "Steget `behandling` og feilklassen med meldingen, når Catenda eller basen ikke svarte."

[[flyt]]
id = "C23"
navn = "Kommentaren tilbake til topicen fra innboksen i TS-serveren"
retning = "ut"
utloses_av = """
Løkka i jobbkjøreren, etter behandlingen av innboksen: `skrivEnKommentar` i
`server/jobber.ts` tar det eldste utfallet i `koe.innkommende_behandling` som skal ha
en kommentar, ikke har en kvittering og ikke venter etter et forsøk (W-1b.2, #819)."""
beskrivelse = """
Utfallet `sak_opprettet` gir en kommentar med lenke til saken og saksnummeret (KT-U6).
`topic_fra_bh` (KT-U7) og `sakstype_ikke_stoettet` (arbeidsvalget under OV-U1 i #819)
gir en kommentar om hvorfor ingen sak er opprettet. `tittel_kan_ikke_vises` gir en
kommentar med tegnene som må endres, men ikke når topicen har fått en sak (#1138). Kommentarene på topicen leses
først, og har integrasjonen skrevet samme tekst der alt, skrives ingen ny; da gir et
nytt forsøk etter et tapt svar én kommentar. Forfatteren må være integrasjonens
e-post, så en annen kan ikke hindre kommentaren ved å skrive teksten først. Uten
e-post kvitteres ingen kommentar, og kommentaren skrives på nytt (#972). Kommentaren skrives på boardet topicen ble slått opp på, med
integrasjonens token. Kvitteringen står i `koe.topic_kommentar`. Feiler et steg,
lagres forsøket i `koe.innkommende_forsoek`, og utfallet venter før neste forsøk."""
funn = []
belegg = "L 19.10: `server/jobber.ts`, `server/hendelser.ts`, `server/catenda.ts` og `database/migrasjoner/20261020140000_innkommende_forsoek_og_kommentar.sql`. L 22.10: `database/migrasjoner/20261022180000_tittel_kan_ikke_vises.sql`."

[[flyt.steg]]
fra = "catenda:bruker"
til = ["appen"]
endepunkt = "GET /v2/user"
kode = [
    "server/jobber.ts:skrivEnKommentar",
    "server/catenda.ts:innboksintegrasjon",
    "server/catenda.ts:CatendaOAuth",
]
data = "Integrasjonens e-post (`email`), som er `author` på kommentarene integrasjonen skrev (#972). Lagres ikke."

[[flyt.steg]]
fra = "catenda:kommentar"
til = ["appen"]
endepunkt = "GET /opencde/bcf/3.0/projects/{catenda_board_id}/topics/{catenda_topic_id}/comments"
kode = [
    "server/jobber.ts:skrivEnKommentar",
    "server/catenda.ts:innboksintegrasjon",
    "server/catenda.ts:CatendaOAuth",
]
data = """
Kommentarene på topicen, med ID, tekst og forfatter (`author`). Har integrasjonens
e-post skrevet samme tekst der, brukes den kommentarens ID. Lagres ikke."""

[[flyt.steg]]
fra = "koe.innkommende_behandling"
til = ["catenda:kommentar"]
endepunkt = "POST /opencde/bcf/3.0/projects/{catenda_board_id}/topics/{catenda_topic_id}/comments"
kode = [
    "server/jobber.ts:skrivEnKommentar",
    "server/catenda.ts:innboksintegrasjon",
    "server/catenda.ts:CatendaOAuth",
]
data = "Kommentaren for utfallet (`comment`), bare når integrasjonen ikke har skrevet samme tekst på topicen."

[[flyt.steg]]
fra = "catenda:kommentar"
til = ["koe.topic_kommentar"]
endepunkt = "Svaret fra Catenda"
kode = [
    "server/jobber.ts:skrivEnKommentar",
    "server/hendelser.ts:kvitterKommentar",
]
data = "ID-en til kommentaren i Catenda, funnet eller skrevet."

[[flyt.steg]]
fra = "catenda:kommentar"
til = ["koe.innkommende_forsoek"]
endepunkt = "Svaret fra Catenda, eller at det mangler"
kode = [
    "server/jobber.ts:skrivEnKommentar",
    "server/hendelser.ts:registrerForsoek",
]
data = "Steget `kommentar` og feilklassen med meldingen, når Catenda eller basen ikke svarte."
