# Dataflyten mellom appens tabeller og Catenda (spor M, fase 1c). Kilden for
# arket «Dataflyt», flytdiagrammene i relasjoner.md og flyt-ID-ene i kolonne 6
# i tabellbeskrivelsen.
#
# Rett her, ikke i de genererte filene. Testene i backend/tests/test_datamodell/
# feiler når
#   - et sted i backend kaller Catenda-klienten uten å stå som kode i en pil
#     eller under [[uten_flyt]]
#   - en kodereferanse ikke er definert i fila, eller en databasefunksjon ikke
#     finnes i katalog.json
#   - en pil går til noe som verken er en tabell, en Catenda-ressurs eller «appen»
#
# Én flyt er én handling. Hvert steg er en pil fra `fra` til hvert mål i `til`.
# `kode` er én kallkjede, fra der handlingen starter til klienten eller
# databasefunksjonen, på formen backend/…/fil.py:Klasse.funksjon eller
# databasefunksjon:navn. Siste ledd står på pilen i diagrammet: på en pil ut
# er det koden som gjør kallet, på en pil inn det som skriver tabellen. Har to
# veier ulike kjeder, eller to tabeller ulike skrivere, er de to steg. «appen» betyr at dataene brukes eller vises, men
# ikke lagres. Retning: inn (fra Catenda), ut (til Catenda) eller begge.
# `drift = true` merker en flyt bare driftsskript utløser; den tegnes i et eget
# diagram. Utviklerskript står under [[uten_flyt]] og tegnes ikke.
#
# Endepunktene er relative til https://api.catenda.com. `topic_board_id`,
# `library_id` og `folder_id` er de globale innstillingene i
# `settings.get_catenda_config()`, ikke prosjektets konfigurasjon, der ikke
# annet er sagt (INT-06).
#
# Første runde 29.09. Belegg: L lest i koden 29.09, K kjørt og observert.

autentisering = ["authenticate", "ensure_authenticated"]

[[catenda]]
id = "webhook"
navn = "webhook-varsel"

[[catenda]]
