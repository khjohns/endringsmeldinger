# ---------------------------------------------------------------------------
# Webhook fra Catenda
# ---------------------------------------------------------------------------

[[flyt]]
id = "C01"
navn = "Ny topic blir en sak"
retning = "inn og ut"
utloses_av = """
Webhook `issue.created` fra Catenda til `POST /webhook/catenda/<hemmelig sti>`.
Validatoren avviser `bcf.issue.created` (INT-03)."""
beskrivelse = """
Varselet rutes til et prosjekt gjennom `catenda_project_configs` og
`catenda_topic_board_configs`, og boardet kontrolleres mot Catenda før noe
skrives. Kan ikke forfatterens kontraktsside eller identitet avgjøres, opprettes
ingen sak. Saken får en kommentar med lenke tilbake på topicen."""
funn = ["INT-02", "INT-03"]
belegg = "L 29.09: ruta, `WebhookService`, resolveren og `SakCreationService`."

[[flyt.steg]]
fra = "catenda:webhook"
til = ["Webhook-reservasjon"]
endepunkt = "Innkommende POST fra Catenda"
kode = [
    "backend/routes/catenda_webhook_routes.py:webhook",
    "backend/lib/security/webhook_security.py:is_duplicate_event",
]
data = "Varselets ID, så samme varsel ikke behandles to ganger. Reserveres før behandlingen (INT-02)."

[[flyt.steg]]
fra = "catenda:board"
til = ["appen"]
endepunkt = "GET /opencde/bcf/3.0/projects/{topic_board_id}"
kode = [
    "backend/services/catenda_project_resolver.py:CatendaProjectResolver.resolve",
    "backend/services/catenda_project_resolver_factory.py:_make_bimsync_lookup.lookup",
]
data = "`bimsync_project_id` for boardet i varselet, kontrollert mot prosjektet i varselet og i registeret."

[[flyt.steg]]
fra = "catenda:topic"
til = ["sak_metadata", "hendelse"]
endepunkt = "GET /opencde/bcf/3.0/projects/{topic_board_id}/topics/{topic_guid}"
kode = [
    "backend/services/catenda_webhook_service.py:WebhookService.handle_new_topic_created",
    "backend/services/sak_creation_service.py:SakCreationService.create_sak",
]
data = """
Tittel og topictype, som blir sakstypen. `sak_metadata` får også topic-,
board- og prosjekt-ID; journalen får `sak_opprettet`. Boardet er det fra
varselet, ikke den globale innstillingen."""

[[flyt.steg]]
fra = "catenda:topic"
til = ["app_users", "app_identities"]
endepunkt = "GET /opencde/bcf/3.0/projects/{topic_board_id}/topics/{topic_guid}"
kode = [
    "backend/services/catenda_webhook_service.py:WebhookService._aktor_id",
    "backend/repositories/auth_repository.py:AuthRepository.identity",
    "databasefunksjon:koe_resolve_identity",
]
data = """
Forfatterens Catenda-ID (`bimsync_creation_author.user.ref`), løst til
`app_users.id`. Raden opprettes bare om den mangler; normalt finnes den fra
medlemssynkroniseringen (C04)."""

[[flyt.steg]]
fra = "catenda:team"
til = ["hendelse"]
endepunkt = "GET /v2/projects/{catenda_project_id}/teams/{team_id}/members"
kode = [
    "backend/services/catenda_webhook_service.py:WebhookService._contract_side",
    "backend/services/auth_service.py:AuthService.contract_membership_for_subject",
    "backend/lib/auth/catenda_oauth.py:CatendaOAuth.team_members",
]
data = """
Hvilket kontraktsteam forfatteren sitter i, for hvert team i
`catenda_contract_teams`. Gir `actorrole`; teamet lagres ikke for denne
hendelsen."""

[[flyt.steg]]
fra = "catenda:prosjekt"
til = ["appen"]
endepunkt = "GET /v2/projects/{catenda_project_id}"
kode = ["backend/services/catenda_webhook_service.py:WebhookService.handle_new_topic_created"]
data = "Prosjektnavnet, brukt i kommentaren."

[[flyt.steg]]
fra = "sak_metadata"
til = ["catenda:kommentar"]
endepunkt = "POST /opencde/bcf/3.0/projects/{topic_board_id}/topics/{topic_guid}/comments"
kode = ["backend/services/catenda_webhook_service.py:WebhookService.handle_new_topic_created"]
data = "Saks-ID, sakstype og lenke til saken i appen. Feiler kallet, står saken likevel."

[[flyt]]
id = "C02"
navn = "Endring på en topic"
retning = "inn"
utloses_av = "Webhook `issue.modified` eller `issue.status.changed` fra Catenda."
beskrivelse = """
Statusendringer og kommentarer i Catenda blir bare logget. Sakens status
kommer fra journalen, og Catenda endrer den ikke."""
funn = ["INT-03"]
belegg = "L 29.09: ruta og `handle_topic_modification`."

[[flyt.steg]]
fra = "catenda:webhook"
til = ["Webhook-reservasjon"]
endepunkt = "Innkommende POST fra Catenda"
kode = [
    "backend/routes/catenda_webhook_routes.py:webhook",
    "backend/lib/security/webhook_security.py:is_duplicate_event",
]
data = "Varselets ID."

[[flyt.steg]]
fra = "catenda:webhook"
til = ["appen"]
endepunkt = "Innkommende POST fra Catenda"
kode = ["backend/services/catenda_webhook_service.py:WebhookService.handle_topic_modification"]
data = "Topicens ID, slått opp i `sak_metadata`, og hva som er endret. Skrives bare til loggen."

# ---------------------------------------------------------------------------
# Innlogging, medlemskap og kontraktsside
# ---------------------------------------------------------------------------

[[flyt]]
id = "C03"
navn = "Innlogging"
retning = "inn"
utloses_av = "`GET /api/auth/catenda/callback` når Catenda sender brukeren tilbake."
beskrivelse = """
Innloggingen bruker brukerens eget token, som bare lever i forespørselen.
Sesjonen og det påbegynte innloggingsforsøket (`app_sessions`,
`app_oauth_attempts`) lages av appen og inneholder ingen data fra Catenda.
Innloggingen utløser også C04 for hvert registrert prosjekt brukeren ser."""
funn = []
belegg = "L 29.09: `auth_routes.callback`, `AuthService.login` og `CatendaOAuth`."

[[flyt.steg]]
fra = "catenda:token"
til = ["appen"]
endepunkt = "POST /oauth2/token"
kode = [
    "backend/routes/auth_routes.py:callback",
    "backend/lib/auth/catenda_oauth.py:CatendaOAuth.exchange",
]
data = "Brukerens tilgangstoken. Lagres ikke."

[[flyt.steg]]
fra = "catenda:bruker"
til = ["app_users", "app_identities"]
endepunkt = "GET /v2/user"
kode = [
    "backend/services/auth_service.py:AuthService.login",
    "backend/lib/auth/catenda_oauth.py:CatendaOAuth.user",
    "backend/repositories/auth_repository.py:AuthRepository.identity",
    "databasefunksjon:koe_resolve_identity",
]
data = "Catenda-ID, e-post og navn. E-post og navn oppdateres ved hver innlogging."

[[flyt.steg]]
fra = "catenda:prosjekt"
til = ["app_project_memberships"]
endepunkt = "GET /v2/projects (sidevis)"
kode = [
    "backend/services/auth_service.py:AuthService.login",
    "backend/lib/auth/catenda_oauth.py:CatendaOAuth.projects",
    "backend/repositories/auth_repository.py:AuthRepository.deactivate_user_projects",
]
data = """
Prosjektene brukeren ser i Catenda. Medlemskap i registrerte prosjekter
brukeren ikke lenger ser, deaktiveres."""

[[flyt]]
id = "C04"
navn = "Medlemslisten synkroniseres"
retning = "inn"
utloses_av = """
Innlogging (C03); tilgangskontrollen, når kopien er eldre enn
`AUTH_MEMBERSHIP_MAX_AGE_SECONDS` (standard 900 sekunder);
`POST /api/projects/<id>/members/sync`; og driftsskriptene
`sync_catenda_memberships.py` og `catenda_admin.py sync-members`."""
beskrivelse = """
Utenfor innloggingen brukes integrasjonsklientens token, aldri en brukers.
Et medlem som mangler i Catenda, deaktiveres; `viewer_override` beholdes."""
funn = []
belegg = """
L 29.09: `AuthService.sync` og `ensure_fresh`, kallerne, og
`koe_reconcile_memberships` i migrasjonene."""

[[flyt.steg]]
fra = "catenda:medlemmer"
til = ["app_project_memberships", "app_membership_sync"]
endepunkt = "GET /v2/projects/{catenda_project_id}/members?userType=user (sidevis)"
kode = [
    "backend/services/auth_service.py:AuthService.sync",
    "backend/lib/auth/catenda_oauth.py:CatendaOAuth.members",
    "backend/repositories/auth_repository.py:AuthRepository.reconcile",
    "databasefunksjon:koe_reconcile_memberships",
]
data = """
Hvert medlem med Catenda-ID, e-post, navn og rolle. Catenda-prosjektet er
prosjektets eget fra `catenda_project_configs`. Funksjonen oppdaterer
medlemskapene og skriver tidspunktet."""

[[flyt.steg]]
fra = "catenda:medlemmer"
til = ["app_users", "app_identities"]
endepunkt = "GET /v2/projects/{catenda_project_id}/members?userType=user (sidevis)"
kode = [
    "backend/services/auth_service.py:AuthService.sync",
    "backend/repositories/auth_repository.py:AuthRepository.reconcile",
    "databasefunksjon:koe_reconcile_memberships",
    "databasefunksjon:koe_resolve_identity",
]
data = "Hver person løst til en brukerrad. E-post og navn oppdateres fra medlemslisten."

[[flyt]]
id = "C05"
navn = "Kontraktsside og team ved skriving"
retning = "inn"
utloses_av = """
Hver rute med `require_contract_role`, og lesing av interne notater, utkast og
vedlegg som ikke er sendt."""
beskrivelse = """
Kontraktssiden og teamet leses fra Catenda ved hver forespørsel, uten
mellomlagring. Hvilke team som er TE og BH, står i `catenda_contract_teams`.
Treffer brukeren team på begge sider, får brukeren ingen side, og treffer
brukeren flere team på samme side, blir teamet tomt."""
funn = []
belegg = "L 29.09: `contract_role.py`, `event_visibility.py` og `AuthService.contract_membership`."

[[flyt.steg]]
fra = "catenda:team"
til = ["hendelse", "notat", "utkast", "vedlegg"]
endepunkt = "GET /v2/projects/{catenda_project_id}/teams/{team_id}/members (sidevis), for hvert kontraktsteam"
kode = [
    "backend/lib/auth/contract_role.py:require_contract_role",
    "backend/lib/auth/event_visibility.py:reader_contract_team",
    "backend/services/auth_service.py:AuthService.contract_membership",
    "backend/services/auth_service.py:AuthService.contract_membership_for_subject",
    "backend/lib/auth/catenda_oauth.py:CatendaOAuth.team_members",
]
data = """
Side og team. Blir `actorrole` og `actorteam` i hendelsen, `aktor_rolle` og
`aktor_team_id` i notatet, `team` og `kontraktsside` i utkastet, og
`lastet_opp_rolle` og `lastet_opp_team` i vedlegget."""

# ---------------------------------------------------------------------------
# Levering til Catenda
# ---------------------------------------------------------------------------

[[flyt]]
id = "C06"
navn = "Hendelse sendes til Catenda"
retning = "ut"
utloses_av = """
`POST /api/events` for en sak med topic, når Catenda er slått på.
`POST /api/events/batch` sender ikke til Catenda (RV-10)."""
beskrivelse = """
Hendelsen lagres først, og en feil i Catenda gjør ikke innsendingen
mislykket. Topic og board leses fra `sak_metadata`; prosjekt, bibliotek og
mappe fra de globale innstillingene (INT-06). Vedleggene i hendelsen sendes i
C08. Bare et frosset brev blir PDF; en hendelse uten brev får kommentar og
statussynk (B-03)."""
funn = ["INT-06", "RV-10"]
belegg = "L 03.10: `submit_event` og `_post_to_catenda` med hjelpefunksjonene."

[[flyt.steg]]
fra = "hendelse"
til = ["catenda:dokument"]
endepunkt = "POST /v2/projects/{catenda_project_id}/libraries/{library_id}/items"
kode = [
    "backend/routes/event_routes.py:_post_to_catenda",
    "backend/routes/event_routes.py:_upload_and_link_pdf",
    "backend/services/catenda_service.py:CatendaService.upload_document",
]
data = """
Det frosne brevet i hendelsen som PDF, og bare det. En hendelse uten brev
laster ikke opp noe."""

[[flyt.steg]]
fra = "hendelse"
til = ["catenda:dokumentreferanse"]
endepunkt = "POST /opencde/bcf/3.0/projects/{topic_board_id}/topics/{topic_guid}/document_references"
kode = [
    "backend/routes/event_routes.py:_upload_and_link_pdf",
    "backend/services/catenda_service.py:CatendaService.create_document_reference",
]
data = "Dokument-ID-en fra opplastingen, først med og så uten bindestreker."

[[flyt.steg]]
fra = "hendelse"
til = ["catenda:kommentar"]
endepunkt = "POST /opencde/bcf/3.0/projects/{topic_board_id}/topics/{topic_guid}/comments"
kode = [
    "backend/routes/event_routes.py:_post_catenda_comment",
    "backend/services/catenda_service.py:CatendaService.create_comment",
]
data = "Tekst laget av hendelsen og sakens tilstand, med lenke til saken."

[[flyt.steg]]
fra = "hendelse"
til = ["catenda:topic"]
endepunkt = "PUT /opencde/bcf/3.0/projects/{topic_board_id}/topics/{topic_guid}"
kode = [
    "backend/routes/event_routes.py:_sync_topic_status",
    "backend/services/catenda_service.py:CatendaService.update_topic_status",
]
data = "Ny topicstatus når sakens overordnede status er endret."

[[flyt.steg]]
fra = "catenda:svar"
til = ["catenda_delivery_status"]
endepunkt = "Ingen egne kall; utfallet av pilene over"
kode = [
    "backend/routes/event_routes.py:submit_event",
    "backend/services/catenda_delivery_status.py:CatendaDeliveryStatus.record",
]
data = """
`pending` før hendelsen lagres. Så `delivered` når kommentar og status
lyktes, og brevet er lastet opp når hendelsen har et; ellers `failed`."""

[[flyt]]
id = "C07"
navn = "Godkjent BH-svar publiseres"
retning = "ut"
utloses_av = "`POST /api/cases/<sak_id>/approvals` med `action: publish`, etter intern godkjenning."
beskrivelse = """
Svarene skrives til journalen, og leveringen går gjennom de samme kallene som
C06, med det godkjente brevet frosset i pakken. Leveringen krever at brevet
lastes opp. Kvitteringen står i `approval_outbox`, ikke i
`catenda_delivery_status`. Vedleggene sendes i C08."""
funn = ["INT-06"]
belegg = "L 29.09: `approvals` med `dispatch`, og `ApprovalService.deliver`."

[[flyt.steg]]
fra = "hendelse"
til = ["catenda:dokument"]
endepunkt = "POST /v2/projects/{catenda_project_id}/libraries/{library_id}/items"
kode = [
    "backend/routes/approval_routes.py:approvals.dispatch",
    "backend/routes/event_routes.py:_post_to_catenda",
    "backend/routes/event_routes.py:_upload_and_link_pdf",
]
data = "Det godkjente brevet som PDF."

[[flyt.steg]]
fra = "hendelse"
til = ["catenda:dokumentreferanse"]
endepunkt = "POST /opencde/bcf/3.0/projects/{topic_board_id}/topics/{topic_guid}/document_references"
kode = [
    "backend/routes/approval_routes.py:approvals.dispatch",
    "backend/routes/event_routes.py:_upload_and_link_pdf",
]
data = "Dokument-ID-en fra opplastingen."

[[flyt.steg]]
fra = "hendelse"
til = ["catenda:kommentar"]
endepunkt = "POST /opencde/bcf/3.0/projects/{topic_board_id}/topics/{topic_guid}/comments"
kode = [
    "backend/routes/approval_routes.py:approvals.dispatch",
    "backend/routes/event_routes.py:_post_catenda_comment",
]
data = "Kommentar laget av den siste publiserte hendelsen."

[[flyt.steg]]
fra = "hendelse"
til = ["catenda:topic"]
endepunkt = "PUT /opencde/bcf/3.0/projects/{topic_board_id}/topics/{topic_guid}"
kode = [
    "backend/routes/approval_routes.py:approvals.dispatch",
    "backend/routes/event_routes.py:_sync_topic_status",
]
data = "Topicstatus når sakens status er endret."

[[flyt.steg]]
fra = "catenda:svar"
til = ["approval_outbox"]
endepunkt = "Ingen egne kall; utfallet av pilene over"
kode = ["backend/services/approval_service.py:ApprovalService.deliver"]
data = "`delivered`, `failed` eller `not_configured`."

