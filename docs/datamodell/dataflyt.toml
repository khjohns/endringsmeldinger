    "backend/services/catenda_service.py:CatendaService.upload_document",
]
data = "Filinnholdet i `innhold`, med filnavnet, til mappen `folder_id`."

[[flyt.steg]]
fra = "catenda:dokument"
til = ["vedlegg"]
endepunkt = "Svar på opplastingen"
kode = [
    "backend/routes/vedlegg_routes.py:lever_vedlegg_for_hendelser",
    "backend/services/vedlegg_registry.py:VedleggRegistry.mark_uploaded",
]
data = """
Dokument-ID-en i Catenda, i `catenda_item_id`. Lagres før koblingen, så et
nytt forsøk ikke laster opp dokumentet to ganger."""

[[flyt.steg]]
fra = "vedlegg"
til = ["catenda:dokumentreferanse"]
endepunkt = "POST /opencde/bcf/3.0/projects/{topic_board_id}/topics/{topic_guid}/document_references"
kode = [
    "backend/routes/vedlegg_routes.py:lever_vedlegg_for_hendelser",
    "backend/services/catenda_service.py:CatendaService.create_document_reference",
]
