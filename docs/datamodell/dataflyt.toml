# ---------------------------------------------------------------------------
# Forsering, endringsordre og relaterte saker
# ---------------------------------------------------------------------------

[[flyt]]
id = "C10"
navn = "Forsering opprettes"
retning = "inn og ut"
utloses_av = "`POST /api/forsering/opprett`. Frontenden kaller ikke ruta."
beskrivelse = """
Lager topicen og relasjonene i Catenda og radene i `sak_relations`, men ingen
hendelse og ingen rad i `sak_metadata` (gjennomføringsnotatet for 1b,
avsnitt 3). Topicen og relasjonene legges på det globale boardet."""
