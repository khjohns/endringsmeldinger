eller gjennom `koe_drift.registrer_prosjekt` (F-1, #820). Begge sider må ha minst
ett team. Skriptet krever `--en-totalentreprenoer`, driftens bekreftelse på at
alle TE-teamene hører til samme totalentreprenør (DL-U14). Uten saker erstatter
listen teamene; står prosjektet i `koe.prosjekt_med_saker`, kan de bare få nye
team (svaret 18.10 i #764). Byttes Catenda-prosjektet, må teamene oppgis på nytt
(#836)."""
