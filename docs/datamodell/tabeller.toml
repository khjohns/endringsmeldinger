# Tabellregisteret (spor M, fase 1a). Kilden for tabellbeskrivelsen til IKT.
#
# Rett her, ikke i Excel-fila eller tabeller.md. Begge lages av
#   python3 docs/verktoy/datamodell.py
# og testene i verktoy/tester/test_datamodell/ feiler når de er utdaterte, når
# en tabell mangler oppføring, eller når en oppføring mangler tabell.
#
# Feltene og typene er forklart i docs/historikk/prompt-datamodell-og-funksjonskart-2026-09-29.md,
# avsnitt 5. Linjeskift i tekstfeltene slås sammen til mellomrom ved eksport.
# Kolonne 7 (relasjoner) lages fra relasjoner.toml og katalog.json, og
# flyt-ID-ene i kolonne 6 fra dataflyt.toml (fase 1c).
# «ikke kontrollert» er et gyldig svar og skal stå der det er sant.
#
# Første runde 29.09. Belegg: K kjørt og observert, L lest i kode eller
# migrasjon, D kontrollert i databasekatalogen tidligere, H historisk.

# ---------------------------------------------------------------------------
# SQL Server. Tabellene i skjemaet `koe`, bygget fra database/migrasjoner/ med
# runneren i server/migrering.ts, for datalaget i TS (DL-U1, #53). Navnet er
# kvalifisert med skjemaet
# (#558). Status «uavklart» betyr at kommandoene som skal skrive tabellen,
# ennå ikke er bygget (#53, del 3); «i bruk» at de er bygget, også før en
# HTTP-inngang kaller dem. Belegg for kolonnene og nøklene: K 16.10,
# katalogen i en base bygget fra migrasjonene (katalog.json).
# ---------------------------------------------------------------------------

