[[tabell]]
navn = "koe.app_project_memberships"
lagring = "SQL Server"
type = ["grunndata", "kopi"]
status = "i bruk"
beskrivelse = """
Medlemskapet i et prosjekt, fra Catenda. Leserollen er `viewer_override`.
`server/autorisasjon.ts` leser aktørens aktive medlemskap med
`koe_api.prosjektmedlemskap` (#658). `koe_api.brukerens_prosjekter` og
`koe_api.prosjekt`, kalt fra `server/prosjekter.ts`, leser bare prosjekter der
aktøren har et aktivt medlemskap (#660). `koe_api.medlemmer`, også kalt derfra,
leser de aktive medlemmene for en aktør med aktivt medlemskap (#820)."""
lagres_fra = """
`koe_api.synkroniser_medlemskap`, kalt fra `server/medlemskap.ts`, skriver
medlemslisten fra Catenda og gjør medlemmer som ikke står i den, inaktive.
`koe_api.deaktiver_ved_innlogging`, også kalt derfra, gjør brukerens medlemskap
inaktivt i koblede prosjekter som ikke står i brukerens liste fra Catenda.
`deactivated_at` er når medlemskapet sist ble gjort inaktivt, etter basens klokke;
en liste hentet før det gjør det ikke aktivt igjen (DL-U8). For en bruker uten
medlemskap fører innloggingen en rad i `koe.app_membership_absences`, og en liste
hentet før den gir ikke et nytt medlemskap (DL-U9). Tilgangskontrollen i
`server/autorisasjon.ts` og tilbakekallet i `server/innlogging.ts` kaller modulen
(F0b-5b). Blir koblingen opphevet, slettet eller endret, gjør triggeren
`koe.catenda_project_configs_kobling_endret` alle medlemskapene i prosjektet
inaktive med `deactivated_at` satt til tidspunktet for endringen (DL-U10).
`koe_api.sett_leserolle`, kalt fra `server/prosjekter.ts`, setter
`viewer_override` for et annet aktivt medlem når aktøren er aktiv admin uten
leserolle (#820)."""
fra_catenda = "Ja, medlemslisten i Catenda."
kan_gjenoppbygges = "ikke kontrollert"
personopplysninger = "E-post og visningsnavn."
skrivere = ["database/migrasjoner/20261020040000_deaktiverte_medlemmer.sql (`koe_api.synkroniser_medlemskap`, innført i `20261016140000_medlemskap.sql`, kalt fra `server/medlemskap.ts`)", "database/migrasjoner/20261018060000_innloggingslaas.sql (`koe_api.deaktiver_ved_innlogging`, innført i `20261016150000_deaktivering.sql`, kalt fra `server/medlemskap.ts`)", "database/migrasjoner/20261020000000_synkroniseringsgrense.sql (triggeren `koe.catenda_project_configs_kobling_endret`, innført i `20261017230000_koblingen.sql`)", "database/migrasjoner/20261019120000_medlemmer.sql (`koe_api.sett_leserolle`, kalt fra `server/prosjekter.ts`)", "database/migrasjoner/20261020170000_catenda_kobling.sql (`koe_drift.koble_catenda_identitet`, som flytter medlemskapene til brukeren identiteten kobles til)"]
funn = []
belegg = "L 17.10: migrasjonen og søk i `server/`. K 17.10: `server/tester/medlemskap.test.ts` (DL-U10)."

