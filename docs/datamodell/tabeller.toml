[[utenfor]]
navn = "Catenda: topics og kommentarer"
lagring = "Catenda"
beskrivelse = """
Hver sak er knyttet til en topic i Catenda (`sak_metadata.catenda_topic_id`).
En ny topic kan opprette en sak via webhook. Appen oppretter selv topics og
relasjoner mellom dem for forsering og endringsordre, og skriver kommentarer
på topicen."""
lagres_fra = """
Forserings- og endringsordretjenesten (`create_topic`,
`create_topic_relations`), webhook-tjenesten, synkroniseringstjenesten og
hendelsesrutene (`create_comment`). Kommentar skrives når en topic blir en sak
(C01), når en hendelse sendes med `POST /api/events` (C06), når et godkjent
BH-svar publiseres (C07), og etter tre av forseringsrutene (C14); se
`relasjoner.md`."""
belegg = """
L 29.09: kallene i tjenestene og rutene, og i fase 1c hvert kallsted mot
Catenda, kontrollert av testen for dataflyten."""

[[utenfor]]
navn = "Catenda: dokumentbiblioteket"
lagring = "Catenda"
beskrivelse = """
Vedlegg og brev lagres i Catendas dokumentbibliotek og knyttes til topicen
(P4). Appen har bare registeret i `vedlegg` og kvitteringene."""
lagres_fra = """
Hendelsesruta, publisering av godkjente BH-svar og leveringen av vedlegg (C06,
C07, C08). Opplastingen i webhook-tjenesten har ingen kaller."""
belegg = """
L 29.09: kallene til `upload_document` og `create_document_reference`.
Mappestrukturen og navngivingen er ikke kontrollert (B-03)."""

[[utenfor]]
navn = "Webhook-reservasjon"
lagring = "Redis eller minne"
beskrivelse = """
Hindrer at samme webhook fra Catenda behandles to ganger. Ligger i Redis med
utløpstid når `REDIS_URL` er satt, og ellers i minnet til prosessen, der den
forsvinner ved omstart."""
lagres_fra = "`lib/security/webhook_security.py`, ved hver webhook."
