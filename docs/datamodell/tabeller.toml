# Tabellregisteret (spor M, fase 1a). Kilden for tabellbeskrivelsen til IKT.
#
# Rett her, ikke i Excel-fila eller tabeller.md. Begge lages av
#   python3 docs/verktoy/datamodell.py
# og testene i backend/tests/test_datamodell/ feiler når de er utdaterte, når
# en tabell mangler oppføring, eller når en oppføring mangler tabell.
#
# Feltene og typene er forklart i docs/prompt-datamodell-og-funksjonskart-2026-09-29.md,
# avsnitt 5. Linjeskift i tekstfeltene slås sammen til mellomrom ved eksport.
# Kolonne 7 (relasjoner) lages fra relasjoner.toml og katalog.json, og
# flyt-ID-ene i kolonne 6 fra dataflyt.toml (fase 1c).
# «ikke kontrollert» er et gyldig svar og skal stå der det er sant.
#
# Første runde 29.09. Belegg: K kjørt og observert, L lest i kode eller
# migrasjon, D kontrollert i databasekatalogen tidligere, H historisk.

# ---------------------------------------------------------------------------
# PostgreSQL
# ---------------------------------------------------------------------------

[[tabell]]
navn = "hendelse"
lagring = "PostgreSQL"
type = ["transaksjon"]
status = "i bruk"
beskrivelse = """
Journalen. Én rad per formell hendelse i en sak: varsel, krav, svar,
endringsordre, forsering og liknende. Innholdet ligger i `data` (JSON) og
varierer med hendelsestypen; hendelseskatalogen (`hendelser.md`) beskriver
typene og feltene.
Sakens tilstand beregnes fra hendelsene. Radene har juridisk vekt."""
lagres_fra = """
Når en part sender noe i en sak: hendelsesrutene (enkeltvis og i batch), ny
sak, forsering, endringsordre og publisering av en godkjent BH-pakke. En ny
topic i Catenda gir også en rad, via webhook. Rader endres og slettes aldri av
appen; en rettelse er en ny hendelse. Basen håndhever ikke det (MS-02)."""
fra_catenda = """
Delvis. En ny topic i Catenda oppretter en sak med første hendelse via webhook.
Ellers kommer innholdet fra brukerne i appen."""
kan_gjenoppbygges = "nei. Journalen er kilden alt annet regnes fra."
personopplysninger = """
`actorid` peker på en bruker. Fritekst i `data` og `comment` kan inneholde
personopplysninger. Vurderingen hører til DPIA-en."""
skrivere = [
    "backend/routes/event_routes.py",
    "backend/services/sak_creation_service.py",
    "backend/services/forsering_service.py",
    "backend/services/endringsordre_service.py",
    "backend/services/approval_service.py",
    "backend/services/catenda_webhook_service.py (via sak_creation_service)",
]
funn = ["MS-01", "MS-02", "MS-03", "AR-02", "DM-06"]
belegg = """
K 29.09: kolonnene i testbasen og prosjektet, og skrankene (også CASCADE) i
testbasen. L 29.09: kallerne av `append`/`append_batch` og `create_sak`."""

[[tabell]]
navn = "leveringsoppdrag"
lagring = "PostgreSQL"
type = ["transaksjon"]
status = "rest"
beskrivelse = """
Leveringsoppdraget for et brev TS-serveren skrev fram til F0b-7 (LV-U1, B-03, dokumentet).
Én rad per brev, og ett brev er ett dokument i Catenda. `innhold` fryser det
som skal leveres: brevet slik det ble lagret, målet i Catenda, statusetiketten
og versjonene. Raden er uforanderlig; et nytt leveringsforsøk sender samme
innhold. Et lagret oppdrag beviser ikke at brevet er sendt eller mottatt.
Forsøk, feil og kvitteringer er ikke bygget (#371). Ingen skriver
tabellen lenger: TS-serveren skriver oppdraget i `koe.leveringsoppdrag` i SQL
Server (F0b-7, #661)."""
lagres_fra = """
Ingen steder etter F0b-7 (#661). Fram til da skrev TS-serveren oppdraget i samme
transaksjon som hendelsen i `hendelse`. Slettes bare med saken eller hendelsen
(kaskade)."""
fra_catenda = """
Nei. Målet (prosjekt, bibliotek, mappe og topic) leses fra prosjektets
Catenda-konfigurasjon og saksregisteret når brevet lagres."""
kan_gjenoppbygges = "nei. Oppdraget er det frosne brevet som skal leveres."
personopplysninger = """
`innhold` har avsenderens `aktor_id` og brevets fritekst."""
skrivere = []
funn = []
belegg = """
K 11.10: kolonnene, skrankene og triggeren i testbasen. L 17.10: ingen
skriver i `server/` etter at `pg` er tatt ut (#661)."""

