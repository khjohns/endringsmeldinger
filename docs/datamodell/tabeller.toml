#819). En hendelse uten rad er ikke behandlet. Bare en ny topic laget av TE gir en
sak, med topicens tittel (KT-U6); en topic fra BH gir ingen sak (KT-U7), og heller
ikke en topic som alt hører til en sak eller er laget av integrasjonen (#741 punkt
17). Saken og prosjektet står bare når utfallet er `sak_opprettet`, og prosjektet
når koblingen til Catenda-prosjektet og boardet ga det. Kjøretiden har ingen rett på
tabellen og skriver med `koe_api.registrer_behandling`. Boardet topicen ble slått
opp på, står med utfallet, så kommentaren skrives på samme board; prosedyren godtar
bare topicboardet til prosjektet med utfallet, eller boardet i topickoblingen til saken med
utfallet (punkt 8 i #972). Raden kan ikke
endres eller slettes; kommentaren tilbake til topicen (W-1b.2) står i
`koe.topic_kommentar` og endrer ikke utfallet. En topic fra TE med et tegn i
tittelen som PDF-en av brevet ikke kan vise, får `tittel_kan_ikke_vises` med tegnene i
`melding`, og en senere endring av topicen er da et nytt forsøk på opprettelsen,
til topicen har fått en sak (`koe_api.tittel_avvist_for_topic`, arbeidsvalgene 22.10
i #1138)."""
