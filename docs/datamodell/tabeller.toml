[[tabell]]
navn = "koe.catenda_project_configs"
lagring = "SQL Server"
type = ["grunndata"]
status = "uavklart"
beskrivelse = """
Koblingen mellom prosjektet i appen og Catenda-prosjektet, og om den er aktiv
(arbeidsvalget 16.10 i #53). Synkroniseringen avviser en liste fra et annet
Catenda-prosjekt. `server/medlemskap.ts` leser en aktiv kobling med
`koe_api.prosjektkobling` (#658, #638), og `koe_api.koblede_prosjekter` gir
prosjektene koblet til brukerens Catenda-prosjekter ved innlogging.
`koe_api.brukerens_prosjekter`, kalt fra `server/prosjekter.ts`, tar bare med
prosjekter med aktiv kobling (#660). Triggeren
`koe.catenda_project_configs_kobling_endret` gjør medlemskapene inaktive når
koblingen oppheves, slettes eller endres (DL-U10), og setter Catenda-ID-en i
synkroniseringsraden til NULL. Den tomme Catenda-ID-en er ikke lov.
`topic_board_id` er boardet for saker som opprettes i appen (KT-U4); uten det
avviser `koe_api.opprett_sak` saken (#741). `koe_api.opprett_sak` låser raden
før den leses, så en ny sak og en ny registrering eller nye kontraktsteam skrives
etter hverandre (#868). Triggeren
`koe.catenda_project_configs_endret` setter `updated_at` ved hver endring (#618)."""
lagres_fra = """
Driften registrerer koblingen med skriptet `server/registrering.ts`, som kaller
`koe_drift.registrer_prosjekt` (F-1, #820). En ny registrering skriver over
Catenda-prosjektet og biblioteket og gjør koblingen aktiv. Mappen og boardet
skrives over når de er oppgitt. Ellers står de hvis Catenda-prosjektet er det
samme, og fjernes hvis det er byttet. Mappen fjernes også når biblioteket er
byttet. Har prosjektet saker, avvises bytte av
Catenda-prosjekt, og uten saker krever et bytte nye kontraktsteam (#836)."""
fra_catenda = "Delvis. ID-ene til Catenda-prosjektet og boardet."
kan_gjenoppbygges = "nei"
personopplysninger = "Ingen kjente."
skrivere = ["database/migrasjoner/20261020122000_registrering_bibliotek.sql (`koe_drift.registrer_prosjekt`, kalt fra `server/registrering.ts`)"]
funn = []
belegg = "L 18.10: migrasjonene og søk i `server/`. K 18.10: `server/tester/jobber.test.ts` og `server/tester/registrering.test.ts`."

