# Handlingene og tilstandene i løsningen (#2003), etter regelen i OV-U97.
#
# Rett her, ikke i handlinger.md. Den lages av
#   /tmp/venv/bin/python docs/verktoy/datamodell.py
# Radene og utfallet i portene er fra avsnittet «Skjemaet» i
# docs/vurdering-handlinger-og-tilstander-2026-11-15.md, rettet etter svarene som står
# der («Svarene etter drøftingen») og etter OV-U99 og OV-U101. Portene står i
# «Drøftingen 15.11» i samme fil.
#
# Én rad per handling slik brukeren ser den, ikke per kommando. En kommando kan høre til
# flere rader, og en rad kan ha flere former.
#
# Feltene i en handling:
#   id          G1–G5 er grunnsettet og U1–U9 det som er utover det, som i vurderingsfila.
#               I1–I5 sendes som innlegg, O1–O3 er opphevet og V1–V4 venter.
#   part        TE, BH eller «TE og BH».
#   spor        forhold, vederlag og frist, eller tom for saken.
#   kilde       bestemmelsen i NS 8407 og vedtakene. Hver vedtaks-ID finnes i
#               vedtaksregisteret, og en opphevet ID står med den som opphever den.
#   finnes, form, naar, tilstander
#               utfallet i port 1–4.
#   status      grunnsett, naa, venter, innlegg eller opphevet (OV-U99, OV-U101).
#   noekler     handlingsnøklene i kjernen (`noekkel` i kjerne/kommandoer/forutsetninger.ts),
#               med `*` for elementet nøkkelen gjelder.
#   kommandoer  kommandotypene i kjernen (`Kommando` i kjerne/kommandoer/kommando.ts).
#   skjema      nøklene i `skjemaene` i src/lib/components/varden/Vardensak.svelte.
#   mangler     det som mangler i kjernen og Varden, eller «Ingen».
#
# [[betegnelse]] er tilstandene (port 0): sporets betegnelse (`BETEGNELSER` i
# kjerne/utledning/visning.ts) og sakens (`Saksbetegnelse`). Status er holder, endres,
# utgaar eller ny. Etikettene ved siden av betegnelsen er ikke med.
#
# [[avvik]] er den lukkede listen: handlingsnøkler kjernen tilbyr, men som har status
# venter, innlegg eller opphevet. Hvert avvik har issuet som fjerner det, og fjernes
# her i samme PR.

format = 1

