[[utsagn]]
art = "korrigering"
avsender = "TE"
beskrivelse = """
TEs korrigering av datoen pålegget ble mottatt eller TE ble klar over forholdet
(VS-U26), i et eget brev fra løsningen. `gjelder` er elementet med TEs siste
opplysning om datoen: grunnlagskravet eller en tidligere korrigering. Datoen står i
samme felt som i kravet, `paalegg_mottatt` eller `klar_over_forholdet`, og
korrigeringen har nøyaktig ett av dem. Ikke en kravversjon, avslår ikke byggherrens
svar og endrer ikke utfallet. Den nye opplysningen gjelder straks som TEs siste
opplysning, og et svar byggherren alt har gitt, står med virkningen det hadde. Godtas
også i et spor med enighet, når kravene er avgjort og i en lukket sak. En korrigering
sendt utenfor løsningen står som dokumentasjon. Brevet har tittelen «Korrigering av
datoen i sak <kode>», og TEs valgfrie forklaring står som utdypningen under den faste
teksten."""
felt = ["id", "art", "gjelder", "paalegg_mottatt", "klar_over_forholdet"]
grunnlag = "MM-U41, MM-U51, VS-U26, VS-U9, OV-U4, MM-U53, LV-U55"

[[utsagn]]
art = "kunnskapsdato"
avsender = "TE"
beskrivelse = """
TE supplerer eller endrer datoen TE ble klar over at økte utgifter etter punkt 34.1.3
annet ledd ville påløpe (`klar_over_utgiftene`), i et eget brev fra løsningen. `gjelder`
er varselet etter punkt 34.1.3: det registrerte varselet eller kravet som er det første
varselet løsningen kjenner. Ikke et nytt varsel og ikke en kravversjon. Den nye
opplysningen gjelder straks som TEs siste opplysning, og et svar byggherren alt har gitt,
står med virkningen det hadde. Godtas også i et spor med enighet, når kravene er avgjort og
i en lukket sak. Et slikt brev sendt utenfor løsningen står som korrespondanse. TEs
valgfrie forklaring står som utdypningen under den faste teksten."""
felt = ["id", "art", "gjelder", "klar_over_utgiftene"]
grunnlag = "VS-U82, VS-U83, VS-U84, VS-U85, VS-U86, MM-U59, MM-U53"

[[utsagn]]
art = "retting"
avsender = "TE"
beskrivelse = """
TEs retting av datoen for et varsel eller et krav TE har sendt utenfor løsningen og lagt til
som korrespondanse, i et eget brev fra løsningen. `gjelder` er varselet eller kravet, og
`dato` den nye datoen. Opplysningen i brevet med varselet eller kravet står uendret. Ikke en
kravversjon, og den endrer ikke hvilket krav eller svar som er gjeldende. En senere dato enn
den som gjelder, gjelder straks som premiss for nye svar og for det første varselet løsningen
kjenner. En tidligere dato gjelder først når byggherren godtar rettingen, og til da gjelder
datoen som gjaldt da rettingen ble sendt. Et svar byggherren alt har gitt, står med virkningen
det hadde. En retting sendt utenfor løsningen står som dokumentasjon."""
felt = ["id", "art", "gjelder", "dato"]
grunnlag = "MM-U59 punkt 8 og 18–23, MM-U61, VS-U58, VS-U86, OV-U123 punkt 17"

[[utsagn]]
art = "innlegg"
avsender = "TE eller BH"
beskrivelse = """
Innlegget i fritekst fra en av partene, i et eget brev fra løsningen. `gjelder` er
brevet innlegget viser til: et brev fra løsningen eller registrert korrespondanse i saken,
også et annet innlegg. Tittelen parten skrev, står i `brevtittel` med sakens kode, og
partens tekst står som utdypningen under henvisningen «<Part> viser til <brevet>:».
Vedleggene står i `dokumentasjon`. Ingen regel leser innlegget: det endrer ikke utfallet
eller et standpunkt, og sporet venter ikke på svar. Godtas fra begge parter, også i et
spor med enighet, i en lukket sak og i en sak løsningen ikke forstår. Et innlegg sendt
utenfor løsningen står som korrespondanse, og et registrert brev med innlegget gjør saken
ikke forstått. Protest, bestridelse og byggherrens senere begrunnelse sendes som innlegg
(MM-U48, KA-U46), og som den egne innsigelsen etter punkt 5 og påberopt passivitet
(VS-U89, VS-U90) er de ikke utsagnsarter: en lagret hendelse med dem gjør saken ikke
forstått."""
felt = ["id", "art", "gjelder"]
grunnlag = "OV-U97, MM-U47, MM-U48, MM-U44, MM-U56, GR-U27, LV-U53, LV-U27, KA-U46, B-17"

# ---------------------------------------------------------------------------
# Delene i svaret og dokumentet.
# ---------------------------------------------------------------------------

[[del]]
navn = "beslutningsgrunnlag"
beskrivelse = """
Appens vurdering da brevet ble sendt, atskilt fra det byggherren sa, og ikke
en rettslig avgjørelse (MM-U9): regelversjonen, laget hvert standpunkt står i
(`virkninger` med `lag`, et heltall fra 1, OV-U32), standpunktene ingen av
byggherrens innsigelser rammer (`upaavirket`), standpunktene uten virkning
(`uten_virkning`), brevlinjen, om svaret godkjenner hele kravet (`sammenfall`)
og, i grunnlaget, om § 32.2 gjaldt etter reglene og underkategorien da
(`varslingsplikt`). Hvert standpunkt står i `virkninger`, `upaavirket` eller
`uten_virkning`. Et registrert svar har appens vurdering ved registreringen
(OV-U6, OV-U80). Utfallet og vilkåret utledes og lagres ikke."""
felt = ["regelversjon", "virkninger", "upaavirket", "uten_virkning", "linje", "sammenfall", "varslingsplikt"]
grunnlag = "MM-U9, MM-U11, GR-U12, KA-U10, OV-U6, OV-U80, OV-U32"

[[del]]
navn = "brevtekst"
beskrivelse = """
Teksten i et brev appen sender, frosset da brevet ble skrevet: ett avsnitt per
krav, svar, utsagn og opplysning parten sier i brevet (`gjelder`), og ett for
vedleggene, som gjelder dokumentet, med den låste delen appen lager av valgene
(`laast`) og partens utdypning (`utdypning`) hver for seg. Har elementet punkter, står
det ett avsnitt per punkt etter hverandre, med punktet i elementet (`punkt`) og
overskriften med nummeret (`overskrift`), som også står først i `laast` (B-1 B i #1824).
Punktet med oversiktstabellen i et svar på vederlaget har nøkkelen til posten for hver
rad (`poster`), i samme rekkefølge som radene mellom kolonnene og summen (OV-U73,
svaret 16.11 i #1997). Det som ikke står i teksten, regnes ikke som meddelt. Appens vurdering står
ikke i teksten, og ingen regel leser den. Et registrert brev har ingen (MM-U17)."""
felt = ["gjelder", "punkt", "overskrift", "laast", "utdypning", "poster"]
grunnlag = "LV-U2, LV-U3, LV-U4, B-13 om begrunnelsestekst, KA-U22, KA-U25, OV-U73, MM-U50"

[[del]]
navn = "dokumentasjon"
beskrivelse = """
Vedleggene brevet binder, ett per vedlegg: ID-en i mellomlageret (`vedlegg_id`),
filnavnet (`filnavn`) og SHA-256 av innholdet (`innhold_sha256`). Klienten oppgir
ID-en, og serveren fyller inn filnavnet og summen fra mellomlageret i samme
transaksjon som brevet skrives og vedlegget bindes. Et registrert brev har brevet
som vedlegg."""
felt = ["vedlegg_id", "filnavn", "innhold_sha256"]
grunnlag = "LV-U14, LV-U1, OV-U4, KT-U5, arbeidsvalg 3, 4 og 10 i #790"

