# Utsagnene i et dokument som ikke er krav eller svar.

[[utsagn]]
art = "varsel"
avsender = "TE"
beskrivelse = "Varsel etter § 33.4 i fristen, § 34.1.2, § 34.1.3 tredje ledd, § 34.3.3 første ledd eller § 34.4 i vederlaget, eller § 32.2 i grunnlaget. Saken har høyst ett varsel per hjemmel, utenom § 34.3.3 og § 34.4, som gjelder kravpostene. Datoen det ble sendt, er en opplysning i samme dokument. I et brev fra appen uten den opplysningen er brevet varselet, og datoen er dokumentets tidspunkt fra serveren. Varselet etter § 32.2 er alltid registrert: fra appen er påberopelsen varselet. Varselet etter § 34.1.3 kan ha datoen TE oppgir å ha blitt klar over at utgiftene ville påløpe (`klar_over_utgiftene`); andre varsler har ikke feltet. Varselet etter § 34.3.3 eller § 34.4 kan ha beskrivelsen av arbeidet det gjelder (`arbeid`), påkrevd i et varsel sendt fra appen; andre varsler har ikke feltet. Et brev kan ha flere varsler, ett utsagn per varsel, men et brev fra appen har varsler i ett spor."
felt = ["id", "art", "hjemmel", "klar_over_utgiftene", "arbeid"]
grunnlag = "MM-U1, SK-12, VS-U15, OV-U25, VS-U34, VS-U38, VS-U48, VS-U52, VS-U82, VS-U86, VS-U87"

