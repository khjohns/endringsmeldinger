`aksepterer` er om byggherren aksepterer tilbudet eller godtar beregningsregelen.
Uten aksept står oppgjørsformen byggherren mener (`oensket_oppgjoersform`), som kan
mangle når byggherren krever et spesifisert tilbud (`krever_tilbud`) for en
