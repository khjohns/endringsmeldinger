# Hendelsestypene TS-kjernen skriver i `hendelse` (#320, B-10, B-17), i format 1.
#
# Rett her, ikke i kjernehendelser.md. Den lages av
#   /tmp/venv/bin/python docs/verktoy/datamodell.py
# Formen er skjemaene i kjerne/format/format.ts. Vakttesten
# kjerne/tester/register.test.ts feiler når en type, et spor, en art eller et
# felt står ett sted og ikke det andre. backend/tests/test_datamodell/ prøver
# formen på registeret og at markdown er generert.
#
# Pythons hendelsestyper (EventType) står i hendelser.toml. Etter B-17 skriver
# Python ikke i KOE-, EO- og forseringssakene, og TS-kjernen leser ikke Pythons
# rader. Designnotatet er docs/design-hendelsesformat-2026-10-09.md.
#
# `grunnlag` viser til vedtak i hovedplanen (3.1) eller avsnitt i designnotatet.

format = 1

# ---------------------------------------------------------------------------
# Typene. Kolonnen `format` er satt på hver rad TS-kjernen skriver.
# ---------------------------------------------------------------------------

[[hendelse]]
navn = "sak_opprettet"
beskrivelse = """
Saken er opprettet. Første rad i saken, i versjon 1, før grunnlagskravet.
`POST /api/kjerne/saker` i `server/app.ts` kaller opprettelsen i kjernen
(`opprettelse` i `kjerne/kommandoer/opprettelse.ts`), som godtar bare TE og gir
`format` og `data`, og så `opprettSak` i `server/kommandoer.ts`, som skriver
raden og også avviser en annen side enn TE (#370, #696)."""
felt = ["sakstittel", "sakstype"]
grunnlag = "B-17, LV-U2, DL-U6. Andre sakstyper enn `standard` hører til #309"

[[hendelse]]
navn = "dokument_registrert"
beskrivelse = """
Ett dokument fra én part: kravene, svarene, utsagnene og opplysningene i det.
Et brev med flere svar er én rad, og saksversjonen øker med én. Dokumentet har
minst ett krav, ett svar eller ett utsagn. Avsenderen er `actorrole`. Et brev
appen sender, har brevteksten (`brevtekst`); et registrert brev har ingen."""
felt = ["krav", "svar", "utsagn", "opplysninger", "dokumentasjon", "brevtekst"]
grunnlag = "MM-U10, LV-U2, designnotatet 4.1"

# ---------------------------------------------------------------------------
# Elementene i dokumentet. Hvert har en `id` (UUID) satt av serveren.
# ---------------------------------------------------------------------------

[[krav]]
spor = "grunnlag"
beskrivelse = """
En kravversjon av grunnlaget. `erstatter` er forrige kravversjon i sporet.
`hovedkategori` og `underkategori` er et par fra kjernens lukkede liste
(`KATEGORIER` i `kjerne/format/koder.ts`), for eksempel `endring` og
`irregulaer_endring`. Et ukjent par gjør raden ikke forstått. I underkategorien
`endringsordre` oppgir TE endringsordrens dato eller nummer (`endringsordre`),
og bare der. TE oppgir datoen varslingsplikten løper fra: i hovedkategorien
`endring`, unntatt `endringsordre`, datoen pålegget ble mottatt
(`paalegg_mottatt`), og i `svikt` og `andre_forhold` datoen TE ble klar over
forholdet (`klar_over_forholdet`). Feltet finnes bare i kategorien det hører til.
Et krav fra appen har det; et registrert krav kan mangle det. Kommandoen avviser
en dato etter skrivetidspunktet i norsk tid (`DATO_ETTER_BREVET`); ingen regel
vurderer rettidigheten. TEs beskrivelse av forholdet står i brevteksten, som
utdypningen under kravet."""
felt = ["id", "spor", "erstatter", "hovedkategori", "underkategori", "tittel", "endringsordre", "paalegg_mottatt", "klar_over_forholdet"]
grunnlag = "KA-U2, GR-U16, VS-U26, designnotatet 4.2"

[[krav]]
spor = "vederlag"
beskrivelse = "En kravversjon av vederlaget, i kroner over 0. `metode` er `tilbud` (§ 34.2.1)."
felt = ["id", "spor", "erstatter", "metode", "beloep"]
grunnlag = "KA-U2, KA-U8"

[[krav]]
spor = "frist"
beskrivelse = "En kravversjon av fristforlengelsen, i dager over 0."
felt = ["id", "spor", "erstatter", "dager"]
grunnlag = "KA-U2, KA-U8"

[[svar]]
spor = "grunnlag"
beskrivelse = """
Byggherrens svar på en kravversjon av grunnlaget. `gjelder` er kravversjonen,
`erstatter` svaret en revisjon erstatter. Grunnlaget har ingen utregning."""
felt = ["id", "spor", "gjelder", "erstatter", "standpunkter", "beslutningsgrunnlag"]
grunnlag = "KA-U1, MM-U9, designnotatet 4.2 og 4.3"

[[svar]]
spor = "vederlag"
beskrivelse = """
Byggherrens svar på en kravversjon av vederlaget, med serverens utregning.
`grunnlagskrav` er grunnlagsversjonen svaret ble regnet mot. Om svaret er
subsidiært til grunnlaget, leses av den og lagres ikke (#342)."""
felt = ["id", "spor", "gjelder", "erstatter", "grunnlagskrav", "standpunkter", "utregning", "beslutningsgrunnlag"]
grunnlag = "B-13, MM-U9, HF-U1, GR-U1, GR-U4"

[[svar]]
spor = "frist"
beskrivelse = """
Byggherrens svar på en kravversjon av fristen, med serverens utregning.
`grunnlagskrav` er grunnlagsversjonen svaret ble regnet mot (#342)."""
felt = ["id", "spor", "gjelder", "erstatter", "grunnlagskrav", "standpunkter", "utregning", "beslutningsgrunnlag"]
grunnlag = "B-13, MM-U9, HF-U1, GR-U1, GR-U4"

# Standpunktene i et svar, i rekkefølgen brevet setter dem. Arten avgjør
# feltene. Et standpunkt byggherren ikke har tatt, utelates (KA-U4).

[[standpunkt]]
art = "rettidighet"
spor = ["grunnlag", "vederlag", "frist"]
beskrivelse = """
Om varselet kom i tide: § 32.2 i grunnlaget, § 34.1.2 i vederlaget, § 33.4 i
fristen. `gjelder` er kravversjonen, eller et registrert varsel etter § 33.4."""
felt = ["id", "art", "gjelder", "hjemmel", "i_tide"]
grunnlag = "KA-U4, MM-U1, MM-U8, VS-U3"

[[standpunkt]]
art = "metode"
spor = ["vederlag"]
beskrivelse = """
§ 34.2.2: om byggherren aksepterer TEs tilbud. Uten aksept står metoden
byggherren mener vederlaget skal justeres etter (`oensket_metode`). Appen
avgjør ikke om § 34.3 eller § 34.4 gjelder."""
felt = ["id", "art", "hjemmel", "aksepterer", "oensket_metode"]
grunnlag = "VS-U3, KA-U4, arbeidsvalget i #479"

[[standpunkt]]
art = "spesifisering"
spor = ["frist"]
beskrivelse = """
§ 33.6.1: om TE spesifiserte kravet i tide. `gjelder` er kravversjonen. Ved
«nei» er `dager` det byggherren mener at byggherren måtte forstå at TE hadde
krav på, og det står prinsipalt."""
felt = ["id", "art", "gjelder", "hjemmel", "i_tide", "dager"]
grunnlag = "VS-U3, VS-U4, KA-U4, arbeidsvalget i #479"

[[standpunkt]]
art = "grunnlag"
spor = ["grunnlag"]
beskrivelse = """
Byggherrens standpunkt til grunnlaget: `godkjent`, `avslaatt` eller
`paalegg_frafalt`. Frafallet gjelder pålegget (§ 32.3 c), ikke TEs krav, og er
ikke en vurdering av ansvaret."""
felt = ["id", "art", "resultat"]
grunnlag = "§ 32.3 a–c, GR-U9, GR-U10"

[[standpunkt]]
art = "beloep"
spor = ["vederlag"]
beskrivelse = "Beløpet. Resultatet og beløpet står i svarets utregning, så de har ett hjem."
felt = ["id", "art"]
grunnlag = "B-13, designnotatet 4.3"

[[standpunkt]]
art = "hindring"
spor = ["frist"]
beskrivelse = "Om byggherren godtar at fremdriften hindres som følge av forholdet saken gjelder (§ 33.1)."
felt = ["id", "art", "oppfylt"]
grunnlag = "§ 33.1, vedtaket 05.10 (#211)"

[[standpunkt]]
art = "dager"
spor = ["frist"]
beskrivelse = "Dagene. Resultatet og dagene, også de subsidiære, står i svarets utregning."
felt = ["id", "art"]
grunnlag = "B-13, designnotatet 4.3"

# Utsagnene i et dokument som ikke er krav eller svar.

[[utsagn]]
art = "varsel"
avsender = "TE"
beskrivelse = "Varsel etter § 33.4. Datoen det ble sendt, er en opplysning i samme dokument. I et brev fra appen uten den opplysningen er brevet varselet, og datoen er dokumentets tidspunkt fra serveren."
felt = ["id", "art", "hjemmel"]
grunnlag = "MM-U1, SK-12, VS-U15"

[[utsagn]]
art = "trekk"
avsender = "TE"
beskrivelse = "TE trekker kravet. `gjelder` er gjeldende kravversjon i sporet."
felt = ["id", "art", "gjelder"]
grunnlag = "KA-U6, GR-U5"

[[utsagn]]
art = "aksept"
avsender = "TE"
beskrivelse = "TE godtar ett svar. `regelversjon` er den TE fikk se. Innholdet står i brevet."
felt = ["id", "art", "gjelder", "regelversjon"]
grunnlag = "KA-U1, KA-U10"

[[utsagn]]
art = "bestridelse"
avsender = "TE eller BH"
beskrivelse = """
En part bestrider en opplysning fra motparten: at dokumentet ble sendt eller
mottatt, eller at det var en endringsordre etter § 31.3. Uten virkning på
utfallet."""
felt = ["id", "art", "gjelder", "hva"]
grunnlag = "MM-U1, MM-U7"

[[utsagn]]
art = "ingen_krav"
avsender = "TE"
beskrivelse = "TE krever ikke noe i et spor som ikke er sendt. Har `spor` og ikke `gjelder`."
felt = ["id", "art", "spor"]
grunnlag = "KA-U12"

[[utsagn]]
art = "innsigelse"
avsender = "TE eller BH"
beskrivelse = """
Innsigelse etter § 5 tredje ledd: parten gjør gjeldende at motpartens varsel,
krav eller svar (`gjelder`) kom for sent. Registreres og vises uten virkning på
utfallet. Et senere svar fra appen gjentar innsigelsen (VS-U11). Et registrert
svar er dokumentasjon og leses ikke med innsigelsen (OV-U4)."""
felt = ["id", "art", "gjelder"]
grunnlag = "VS-U1, VS-U9, VS-U11, VS-U14, OV-U4"

[[utsagn]]
art = "protest"
avsender = "TE eller BH"
beskrivelse = """
Protest mot en innsigelse fra motparten. `gjelder` er innsigelsen, et standpunkt
om rettidighet der motparten sa at varselet kom for sent, eller et dokument, og
da gjelder protesten alle innsigelsene i det (MP-U6). Uten virkning på utfallet."""
felt = ["id", "art", "gjelder"]
grunnlag = "VS-U1, VS-U9, MP-U6"

[[utsagn]]
art = "passivitet"
avsender = "TE"
beskrivelse = """
TE påberoper byggherrens passivitet etter § 32.3 annet ledd. `gjelder` er TEs
varsel etter § 32.2, kravet i grunnlagssporet. Før og etter byggherrens svar.
Uten virkning på utfallet, og sperrer ikke svaret."""
felt = ["id", "art", "gjelder"]
grunnlag = "VS-U12, GR-U11"

[[utsagn]]
art = "begrunnelse"
avsender = "BH"
beskrivelse = """
Byggherrens senere begrunnelse av et svar. `gjelder` er svaret, også et svar som
er erstattet eller registrert. Fra appen står teksten i brevteksten, som
utdypningen under den faste setningen. Registrert har dokumentet ingen tekst, men
datoen det ble sendt og brevet som vedlegg (KA-U35). Endrer ingen standpunkter, og
godtas også når kravene er avgjort. Erstatter ikke begrunnelsen et svar fra appen
må ha."""
felt = ["id", "art", "gjelder"]
grunnlag = "KA-U34, KA-U35, KA-U18, KA-U24, MM-U12"

# ---------------------------------------------------------------------------
# Delene i svaret og dokumentet.
# ---------------------------------------------------------------------------

[[del]]
navn = "beslutningsgrunnlag"
beskrivelse = """
Appens vurdering da brevet ble sendt, atskilt fra det byggherren sa, og ikke
en rettslig avgjørelse (MM-U9): regelversjonen, hvordan brevet ordner
standpunktene (`virkninger` med `prinsipalt` eller `subsidiaert`), standpunktene
uten virkning (`uten_virkning`), brevlinjen, om svaret godkjenner hele kravet
(`sammenfall`) og, i grunnlaget, om § 32.2 gjaldt etter reglene og
underkategorien da (`varslingsplikt`). Hvert standpunkt står i `virkninger` eller
`uten_virkning`. Et registrert brev er dokumentasjon, og appen fryser ingen
vurdering av det (OV-U4). Utfallet og vilkåret utledes og lagres ikke."""
felt = ["regelversjon", "virkninger", "uten_virkning", "linje", "sammenfall", "varslingsplikt"]
grunnlag = "MM-U9, MM-U11, GR-U12, KA-U10, OV-U4"

[[del]]
navn = "brevtekst"
beskrivelse = """
Teksten i et brev appen sender, frosset da brevet ble skrevet: ett avsnitt per
krav, svar, utsagn og opplysning parten sier i brevet (`gjelder`), og ett for
vedleggene, som gjelder dokumentet, med den låste delen appen lager av valgene
(`laast`) og partens utdypning (`utdypning`) hver for seg. Det som ikke står i teksten, regnes ikke som meddelt. Appens vurdering står
ikke i teksten, og ingen regel leser den. Et registrert brev har ingen (MM-U17)."""
felt = ["gjelder", "laast", "utdypning"]
grunnlag = "LV-U2, LV-U3, LV-U4, B-13 om begrunnelsestekst, KA-U22, KA-U25"

[[del]]
navn = "dokumentasjon"
beskrivelse = """
Vedleggene brevet binder, ett per vedlegg: ID-en i mellomlageret (`vedlegg_id`),
filnavnet (`filnavn`) og SHA-256 av innholdet (`innhold_sha256`). Klienten oppgir
ID-en, og serveren fyller inn filnavnet og summen fra mellomlageret i samme
transaksjon som brevet skrives og vedlegget bindes. Et registrert brev har brevet
som vedlegg."""
felt = ["vedlegg_id", "filnavn", "innhold_sha256"]
grunnlag = "LV-U14, LV-U1, OV-U4, KT-U5, arbeidsvalg 3, 4 og 10 i #790"

[[del]]
navn = "utregning"
spor = "vederlag"
beskrivelse = "Serverens utregning: resultatet (`godkjent`, `delvis_godkjent`, `avslaatt` eller `tilbakeholdelse`) og det godkjente beløpet, og det subsidiære standpunktet ved preklusjon etter § 34.1.2."
felt = ["resultat", "godkjent_beloep", "subsidiaert_resultat", "subsidiaert_godkjent_beloep"]
grunnlag = "B-13, VS-U3"

[[del]]
navn = "utregning"
spor = "frist"
beskrivelse = "Serverens utregning: resultatet (`godkjent`, `delvis_godkjent` eller `avslaatt`) og de godkjente dagene, og det subsidiære standpunktet når det finnes."
felt = ["resultat", "godkjent_dager", "subsidiaert_resultat", "subsidiaert_godkjent_dager"]
grunnlag = "B-13, vedtaket 05.10 (#211)"

# Opplysningene om dokumentet, oppgitt av avsenderen. Et brev sendt i appen har
# ingen: sendt er registrert. Motparten kan bestride en opplysning (MM-U7).

[[opplysning]]
hva = "sendt"
beskrivelse = """
Når dokumentet ble sendt utenfor appen. Et dokument med `sendt` eller `mottatt`
uten `gjelder` er registrert korrespondanse. Med `gjelder` gjelder datoen et
varsel i dokumentet, for eksempel et varsel sendt før kravet det står i (HF-U1)."""
felt = ["id", "hva", "dato", "gjelder"]
grunnlag = "Modellforslaget 2.4, MM-U1"

[[opplysning]]
hva = "mottatt"
beskrivelse = "Når dokumentet ble mottatt, eller med `gjelder`, varselet i dokumentet."
felt = ["id", "hva", "dato", "gjelder"]
grunnlag = "Modellforslaget 2.4, MM-U7"

[[opplysning]]
hva = "endringsordre"
beskrivelse = """
Om registrert korrespondanse med et svar på grunnlaget var en endringsordre
etter § 31.3, oppgitt av den som registrerer, med vedlegget i `dokumentasjon`.
Registratorens vurdering, ikke en rettslig avgjørelse. Uten `gjelder` står den i
brevet selv. En senere avklaring er et nytt dokument med bare opplysningen, der
`gjelder` er det registrerte brevet, som ikke skrives om. Det står høyst én slik
opplysning per brev. Med opplysningen i brevet selv er byggherrens registrerte
godkjenning svaret på grunnlaget (OV-U6); ellers er brevet dokumentasjon uten
virkning (OV-U4). Opplysningen sperrer ikke trekket av grunnlaget."""
felt = ["id", "hva", "oppfylt", "gjelder"]
grunnlag = "§ 31.3, § 32.3 a, GR-U13, KA-U14, MM-U12, OV-U4, OV-U6"
