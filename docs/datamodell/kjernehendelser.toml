# Hendelsestypene TS-kjernen skriver i `hendelse` (#320, B-10, B-17), i format 1.
#
# Rett her, ikke i kjernehendelser.md. Den lages av
#   /tmp/venv/bin/python docs/verktoy/datamodell.py
# Formen er skjemaene i kjerne/format/format.ts og kjerne/spor/<spor>/format.ts. Vakttesten
# kjerne/tester/register.test.ts feiler når en type, et spor, en art eller et
# felt står ett sted og ikke det andre. verktoy/tester/test_datamodell/ prøver
# formen på registeret og at markdown er generert.
#
# Designnotatet er docs/design-hendelsesformat-2026-10-09.md.
#
# `grunnlag` viser til vedtak i hovedplanen (3.1) eller avsnitt i designnotatet.

format = 1

# ---------------------------------------------------------------------------
# Typene. Kolonnen `format` er satt på hver rad TS-kjernen skriver.
# ---------------------------------------------------------------------------

[[hendelse]]
navn = "sak_opprettet"
beskrivelse = """
Saken er opprettet. Første rad i saken, i versjon 1, før grunnlagskravet.
`POST /api/kjerne/saker` i `server/saker.ts` kaller opprettelsen i kjernen
(`opprettelse` i `kjerne/kommandoer/opprettelse.ts`), som godtar bare TE og gir
`format` og `data`, og så `opprettSak` i `server/kommandoer.ts`, som skriver
raden og også avviser en annen side enn TE (#370, #696)."""
felt = ["sakstittel", "sakstype"]
grunnlag = "B-17, LV-U2, DL-U6. Andre sakstyper enn `standard` hører til #309"

[[hendelse]]
navn = "dokument_registrert"
beskrivelse = """
Ett dokument fra én part: kravene, svarene, utsagnene og opplysningene i det.
Et brev med flere svar er én rad, og saksversjonen øker med én. Dokumentet har
minst ett krav, ett svar eller ett utsagn, eller er et brev registrert som
dokumentasjon. Avsenderen er `actorrole`, eller `avsender` når et brev registrert
som dokumentasjon er sendt av motparten (OV-U79). Et brev appen sender, har brevteksten
(`brevtekst`); et registrert brev har ingen. Et brev appen sender med krav, svar,
aksept, trekk eller innlegg, har også tittelen på brevet, frosset med teksten
(`brevtittel`, MM-U3, #1536), og hvert brev appen sender, har nummeret sitt i saken
(`brevnummer`, LV-U44; korrespondanse lagt til har ikke noe nummer før LV-U45 bygges, G-15 i BF-49) og merkingen, frosset da brevet ble skrevet
(`merking`, for eksempel K201-KOE-017-03, LV-U53, LV-U24). Med merkingen står Deres ref.:
merkingen på hvert av motpartens brev som brevet svarer på, godtar, bestrider eller viser til i et innlegg,
frosset da brevet ble skrevet (`deres_ref`, LV-U27, LV-U49, LV-U50, LV-U51); uten slike brev
står feltet ikke. Registrert korrespondanse har typen: brev, e-post, møtereferat, eller notat
og annet dokument (`korrespondansetype`, `brev`, `e_post`, `moetereferat` eller `notat`, OV-U79,
LV-U42), og et brev fra appen har den ikke. Et registrert brev kan ha sendemåten
(`sendemaate`, `post`, `pdf_e_post`, `prosjekthotell` eller `annen_maate`, OV-U79), og
annen korrespondanse har den ikke. All registrert korrespondanse kan ha den korte beskrivelsen
med egne ord (`beskrivelse`, OV-U79). Et brev registrert som
dokumentasjon har beskrivelsen med egne ord (`beskrivelse`), sporene det hører
til (`spor`, uten dem saken), datoen det ble sendt, brevet som vedlegg og
eventuelt avsenderen, og ikke noe annet. En retting av en slik registrering fra samme side viser til den
(`retter`): enten en fullstendig ny registrering, også som et krav, svar, aksept eller
varsel lagt til (D-13 i BF-49, OV-U123 punkt 23), eller, når brevet ikke hører
til saken, bare henvisningen og `ikke_i_saken`. Registreringen som rettes, står.
Et krav, et svar eller en aksept i registrert korrespondanse har samme virkning
som fra appen, med datoen avsenderen oppgir (`opplysninger` med `hva` = `sendt`).
Det som ikke kunne gis på den datoen, et svar på en kravversjon som da ikke var
gjeldende eller en aksept av et svar som da ikke var byggherrens gjeldende svar,
står uten virkning. Et krav sendt før totalentreprenørens siste krav i sporet
blir ikke gjeldende, men datoen regnes med for hvilket varsel som kom først
(OV-U102)."""
felt = ["krav", "svar", "utsagn", "opplysninger", "dokumentasjon", "brevtekst", "brevtittel", "brevnummer", "merking", "deres_ref", "korrespondansetype", "sendemaate", "beskrivelse", "spor", "retter", "ikke_i_saken", "avsender", "ikke_fylt_ut"]
grunnlag = "MM-U10, LV-U2, OV-U4, OV-U16, OV-U17, OV-U18, OV-U80, OV-U98, MM-U43 punkt 9, designnotatet 4.1. Navnene `retter` og `ikke_i_saken` er arbeidsvalget 22.10 i #1045. `brevtittel` er MM-U3 og svaret 03.11 i #1488. `brevnummer` er arbeidsvalget N3 A i #1497. `korrespondansetype` er D1 A i #1497, med `moetereferat` og `notat` fra kapittel D i kontraktsgrunnlaget (B i #2056). `sendemaate` er OV-U79, med verdiene fra skjemaet i Varden (#807). At sendemåten og beskrivelsen er valgfrie til skjemaet i Varden har dem, er arbeidsvalget 2 A 16.11 i #807. `merking` er avgjørelsen fra oppdragsgiver 04.11 i #1570. `deres_ref` er arbeidsvalget A-3 A i #1497. `avsender` er OV-U79 og OV-U80 (#2069): parten som sendte et brev registrert som dokumentasjon, bare når det er motparten av den som la det til. `ikke_fylt_ut` er svaret 27.11 i #807 (D-12 i BF-49): skjemaet for kravet eller svaret parten avbrøt, `krav` eller `svar`, bare i et brev registrert som dokumentasjon og ikke i et brev motparten sendte. Ingen regel leser det"

# ---------------------------------------------------------------------------
# Elementene i dokumentet. Hvert har en `id` (UUID) satt av serveren.
# ---------------------------------------------------------------------------

[[krav]]
spor = "forhold"
beskrivelse = """
En kravversjon av grunnlaget. `erstatter` er forrige kravversjon i sporet.
`hovedkategori` og `underkategori` er et par fra kjernens lukkede liste
(`KATEGORIER` i `kjerne/format/koder.ts`), for eksempel `endring` og
`irregulaer_endring`. Et ukjent par gjør raden ikke forstått. I underkategorien
`endringsordre` oppgir TE endringsordrens dato eller nummer (`endringsordre`),
og bare der. TE oppgir datoen varslingsplikten løper fra: i hovedkategorien
`endring`, unntatt `endringsordre`, datoen pålegget ble mottatt
(`paalegg_mottatt`), og i `svikt` og `andre_forhold` datoen TE ble klar over
forholdet (`klar_over_forholdet`). Feltet finnes bare i kategorien det hører til.
Et krav fra appen har det; et registrert krav kan mangle det. Kommandoen avviser
en dato etter skrivetidspunktet i norsk tid (`DATO_ETTER_BREVET`); ingen regel
vurderer rettidigheten. TEs beskrivelse av forholdet står i brevteksten, som
utdypningen under kravet."""
felt = ["id", "spor", "erstatter", "hovedkategori", "underkategori", "endringsordre", "paalegg_mottatt", "klar_over_forholdet"]
grunnlag = "KA-U2, GR-U16, VS-U26, designnotatet 4.2. Navnet på forholdet er sakstittelen (LV-U43), så kravet har ingen egen tittel"

[[krav]]
spor = "vederlag"
beskrivelse = """
En kravversjon av vederlaget, i kroner over 0. `kravposter` er justeringen ellers, én post per
del av arbeidet, hver med `id`, betegnelsen P1, P2 … fra serveren, beskrivelse og
oppgjørsform (`tilbud` etter punkt 34.2.1 med beløp, `enhetspriser` etter punkt 34.3 med
eventuelt justerte enhetspriser og anslag, `regningsarbeid` etter punkt 34.4 med eventuelt
kostnadsoverslag). En kravpost med regningsarbeid eller justerte enhetspriser kan ha `varsel`,
valget av varselet for posten: `{ art: "gitt", varsel }` viser til et varsel i saken, og
`{ art: "kravet" }` sier at kravet er varselet for posten. Valget er påkrevd når saken har et
varsel etter samme bestemmelse som ingen kravpost viser til, og kravet ellers ville vært varselet
for posten (VS-U87 punkt 23 og beslutningsdelen). `saerskilt` er postene utenfor: kravet etter punkt 34.1.3 annet ledd
(`produktivitet`) og rigg og drift (`rigg_og_drift`). Minst én kravpost eller én post utenfor
står. `trekker` er kravpostene fra forrige versjon TE trekker; hver kravpost i forrige versjon
er med eller trekkes. `trekker_saerskilt` er postene utenfor fra forrige versjon TE trekker
(`produktivitet`); posten etter punkt 34.1.3 annet ledd i forrige versjon er med eller trekkes.
Posten etter punkt 34.1.3 annet ledd kan ha datoen TE oppgir å ha blitt klar over at utgiftene
ville påløpe (`klar_over_utgiftene`), bare i den første versjonen med posten, når kravet er det
første varselet løsningen kjenner."""
felt = ["id", "spor", "erstatter", "kravposter", "saerskilt", "trekker", "trekker_saerskilt"]
grunnlag = "KA-U2, KA-U8, KA-U53, KA-U56, KA-U66, KA-U83, OV-U89 punkt 6 og 17, OV-U115 punkt 19–22, KA-U70, VS-U87 punkt 23, arbeidsvalget 07.11 i domenetabellen (#1663) og arbeidsvalg 3 og 4 26.11 i #2408"

[[krav]]
spor = "frist"
beskrivelse = """
En kravversjon av fristforlengelsen: `frister` har én rad per frist i kontrakten, med `id`,
dagene over 0 og fristen, enten `frist_id` i fristtabellen for prosjektet med nummeret og navnet
derfra, eller nummeret og navnet for en frist som ikke er registrert. Kravet har ingen sum.
`trekker` er fristene fra forrige versjon TE trekker. `gjelder` er byggherrens forespørsel
etter § 33.6.2 kravet svarer på, satt når kravet sendes mens forespørselen er ubesvart
(HF-U1, LV-U18 punkt 3)."""
felt = ["id", "spor", "erstatter", "gjelder", "frister", "trekker"]
grunnlag = "KA-U2, KA-U8, KA-U73, KA-U74, KA-U76, KA-U79, GFK-U23"

[[svar]]
spor = "forhold"
beskrivelse = """
Byggherrens svar på en kravversjon av grunnlaget. `gjelder` er kravversjonen,
`erstatter` svaret en revisjon erstatter. Grunnlaget har ingen utregning."""
felt = ["id", "spor", "gjelder", "erstatter", "standpunkter", "beslutningsgrunnlag"]
grunnlag = "KA-U1, MM-U9, designnotatet 4.2 og 4.3"

[[svar]]
spor = "vederlag"
beskrivelse = """
Byggherrens svar på en kravversjon av vederlaget, med serverens utregning.
`grunnlagskrav` er grunnlagsversjonen svaret ble regnet mot. Om svaret er
subsidiært til grunnlaget, leses av den og lagres ikke (#342). `akseptfrist` er
akseptfristen byggherren satte, en kalenderdag uten virkning i løsningen (HF-U23).
`bare_varselet: true` er svaret bare på varselet etter § 34.3.3 første ledd eller
§ 34.4 for kravpostene der kravet selv er varselet. Det har kravversjonen i
`gjelder`, bare standpunktene til varslene og justeringen for postene og ingen
utregning, og er ikke et svar på kravet (VS-U96 punkt 38 og 39)."""
felt = ["id", "spor", "gjelder", "bare_varselet", "erstatter", "paaberopelse", "akseptfrist", "standpunkter", "utregning", "beslutningsgrunnlag"]
grunnlag = "B-13, MM-U9, HF-U1, GR-U1, GR-U4, HF-U23, VS-U96"

[[svar]]
spor = "frist"
beskrivelse = """
Byggherrens svar på en kravversjon av fristen, med serverens utregning.
`grunnlagskrav` er grunnlagsversjonen svaret ble regnet mot (#342). `akseptfrist` er
akseptfristen byggherren satte, en kalenderdag uten virkning i løsningen (HF-U23).
Svaret på varselet etter § 33.4 som står alene har varselet i `gjelder`, bare
standpunktet til varselet og ingen utregning (VS-U96 punkt 32). Når kravet selv er
varselet, har svaret bare på varselet kravversjonen i `gjelder` og `bare_varselet: true`,
med det samme standpunktet, og er ikke et svar på kravet (punkt 38 og 39)."""
felt = ["id", "spor", "gjelder", "bare_varselet", "erstatter", "paaberopelse", "akseptfrist", "standpunkter", "utregning", "beslutningsgrunnlag"]
grunnlag = "B-13, MM-U9, HF-U1, GR-U1, GR-U4, HF-U23, VS-U96"

# Standpunktene i et svar, i rekkefølgen brevet setter dem. Arten avgjør
# feltene. Et standpunkt byggherren ikke har tatt, utelates (KA-U4).

[[standpunkt]]
art = "rettidighet"
spor = ["forhold", "vederlag", "frist"]
beskrivelse = """
Om varselet kom i tide: § 32.2 i grunnlaget, § 34.1.2, § 34.1.3, § 34.3.3 eller
§ 34.4 i vederlaget, § 33.4 i fristen. `gjelder` er kravversjonen, eller TEs varsel
etter § 33.4, § 34.1.2 eller § 34.1.3. Etter § 34.3.3 og § 34.4 er `gjelder`
kravposten. Når varselet etter § 34.1.3 kom for sent, er `begrenset_beloep` det
byggherren godkjenner for posten etter § 34.1.3 annet ledd etter begrensningen."""
felt = ["id", "art", "gjelder", "hjemmel", "i_tide", "begrenset_beloep"]
