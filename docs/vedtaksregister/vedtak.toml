[[gruppe.vedtak]]
id = "KA-U42"
dato = 2026-10-26
hvem = "oppdragsgiver"
kilde = ["#1301"]
sporsmal = '''
Byggeøkta har to domenespørsmål før den bygger beløpskontrollen. Begge gjelder hva «delvis» betyr etter KA-U9, så jeg stiller dem her i teksten og ikke med spørsmålsverktøyet.

**Spørsmål 1. Byggherren vurderer en post som «delvis», men godkjenner hele beløpet TE krevde.**
I dag godtar løsningen svaret og regner resultatet som «godkjent». Etter KA-U9 er standpunktet «godkjent» når beløpene er like, og «delvis» når byggherrens beløp er mindre gunstig for TE. Et beløp over det krevde avvises allerede.
- **A (anbefalt):** svaret avvises fordi vurderingen motsier beløpet, på samme måte som «godkjent» med et annet beløp. Beløpene sammenliknes i hele øre (OV-U59). Byggherren må da velge «godkjent» eller rette beløpet. Det følger av ordlyden i KA-U9 og av regelen om at det kjernen ikke kan tolke, avvises. Det er også slik #1301 er formulert: «Avgjør KA-U9 resultatet, avvises det med samme kontroll.»
- **B:** svaret godtas som i dag, og resultatet blir «godkjent». Brevet sier da «delvis» om et standpunkt løsningen leser som full godkjenning.

**Spørsmål 2. Byggherren vurderer en post som «delvis», men godkjenner 0 kr.**
I dag godtas svaret, og resultatet blir «avslått». KA-U9 sier ikke at dette er motstrid: 0 kr er mindre gunstig for TE enn kravet. #1301 nevner ikke tilfellet.
- **A (anbefalt):** ingen endring i denne PR-en. Svaret godtas som i dag, og tilfellet føres under «Åpne spørsmål» i PR-en, så det kan avgjøres senere.
- **B:** svaret avvises som motstrid mellom «delvis» og et avslag.

Etter det første svaret la orkestratoren fram et forslag til vedtakstekst, med to presiseringer: om regelen også gjelder byggherrens subsidiære beløpsvurdering (anbefalt ja), og at beløpene måles i hele øre etter OV-U59. Forslaget:

> **Presiserer KA-U9.** For et positivt tilleggskrav er byggherrens beløpsvurdering av en post, prinsipalt og subsidiært, «avslått» ved 0 kr, «delvis» ved mer enn 0 kr og mindre enn det krevde beløpet, og «godkjent» ved det krevde beløpet, sammenliknet i hele øre (OV-U59). En vurdering som motsier beløpet, avvises (spørsmål 1: A, spørsmål 2: B). Regelen gjelder ikke et nullutfall kjernen utleder av en innsigelse, som preklusjon etter § 34.1.2.

**Forholdet til andre vedtak.** presiserer KA-U9. I tråd med OV-U59.'''
valgt = "1A og 2B"
svar = '''
«1A og 2B, med avgrensningen til positive tilleggskrav. «Delvis» betyr da at byggherren godkjenner mer enn 0 kr og mindre enn det krevde beløpet for posten. Dette gjelder beløpsvurderingen, ikke et utledet nullutfall som følge av en innsigelse. Presiseringen av KA-U9 føres uttrykkelig.»

«Ja, regelen bør gjelde både prinsipale og subsidiære beløpsvurderinger, sammenliknet i hele øre. «Delvis» bør bety det samme i begge tilfellene.

Forslaget holder. Jeg ville bare fjernet «(spørsmål 1: A, spørsmål 2: B)» fra selve vedtaksteksten; det hører til beslutningsgrunnlaget.

Én presisering til forklaringen: Ved påberopt preklusjon kan byggherren fortsatt ha vurdert beløpet subsidiært. Kontrollen gjelder denne beløpsvurderingen, men ikke nullutfallet løsningen utleder av innsigelsen. Forslagets siste setning ivaretar dette.»'''
forhold = [{ art = "presiserer", vedtak = "ka-u9" }]
folge = '''
I tråd med OV-U59. Bygges i #1301.'''

[[gruppe.vedtak.alternativ]]
navn = "1A og 2B"
tekst = '''
For et positivt tilleggskrav er byggherrens beløpsvurdering av en post, prinsipalt og subsidiært, «avslått» ved 0 kr, «delvis» ved mer enn 0 kr og mindre enn det krevde beløpet, og «godkjent» ved det krevde beløpet, sammenliknet i hele øre (OV-U59). En vurdering som motsier beløpet, avvises. Regelen gjelder ikke et nullutfall kjernen utleder av en innsigelse, som preklusjon etter § 34.1.2.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "1B"
tekst = '''
Svaret godtas som i dag, og resultatet blir «godkjent». Brevet sier da «delvis» om et standpunkt løsningen leser som full godkjenning.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "2A"
tekst = '''
Ingen endring i denne PR-en. Svaret godtas som i dag, og tilfellet føres under «Åpne spørsmål» i PR-en, så det kan avgjøres senere.'''
forkastet = true

[[gruppe]]
tittel = "Aksept og enighet"

[[gruppe.vedtak]]
anker = "ka-u1"
vedtak = '''
KA-U1: TEs aksept gjelder hele det konkrete svaret byggherren har gitt på gjeldende
kravversjon i sporet, med alle standpunktene i det: preklusjon, vilkår, beløp eller
dager og subsidiære standpunkter. Aksepten peker på svarets hendelse. Venter sporet på
svar, eller gjelder svaret en tidligere kravversjon, avvises aksepten. Delvis enighet er
ikke aksept'''
vedtatt = "08.10, oppdragsgiver"
folge = '''
Presiserer SK-02 og SK-03 og målformen M2 under B-14. Utføres i kontrakten av
[KT-U1](#kt-u1) (08.10). Radene står i [domenetabellen](../domenetabell/README.md).
Snevret inn 10.10 av [FO-U5](#fo-u5), ikke bygget: aksepten av et fristavslag avvises så
lenge en forseringssak viser til avslaget. Bygget 08.10 for aksepten (#272): aksepten
viser til svaret i `refererer_til_event_id`, og regelen `CURRENT_RESPONSE` avviser alt
annet enn sporets gjeldende svar, også i grunnlaget. Før pekte aksepten ikke på noe
svar, og TE kunne godta svaret på en tidligere kravversjon (DT-01). At en ny kravversjon
opphever en aksept, er bygget 09.10 (SK-02). Oppdragsgiver godtok 09.10 restrisikoen at
en eldre aksept uten referanse bindes ved lesing til svaret som var gjeldende da den ble
lest, også når de gamle reglene tillot en revisjon etterpå. Appen har ingen reelle data.
Spørsmålet kom fra code-review i #297 (#274)'''

[[gruppe.vedtak]]
anker = "ka-u5"
vedtak = '''
KA-U5: godtar TE et svar som er delvis godkjent, blir sporet `GODKJENT` med byggherrens
beløp eller dager. Byggherrens tall er da avtalt, og sporet er oppgjort på linje med et
fullt godkjent krav'''
vedtatt = "08.10, oppdragsgiver"
folge = '''
Som i dag (rad KA-08b i [domenetabellen](../domenetabell/README.md)). Avklarer
arbeidshypotesen fra første del. Presisert 08.10 av [GR-U7](#gr-u7): aksepten gir
enighet om byggherrens beløp eller dager, og sporet er oppgjort når grunnlaget også er
avklart'''

[[gruppe.vedtak]]
anker = "gr-u7"
vedtak = '''
GR-U7: TE kan godta byggherrens gjeldende svar på vederlag eller frist uavhengig av
grunnlaget. Aksepten er enighet om sporets egne spørsmål: beløp eller dager, og
varslingen i sporet. Den er ikke enighet om ansvaret. Kravet er oppgjort først når
grunnlaget også er avklart: godkjent uten preklusjon etter § 32.2, eller frafalt. Godtar
TE avslaget på grunnlaget, lukkes saken, og enigheten om beløp eller dager får ingen
virkning. En enighet står: byggherren kan ikke revidere et godtatt svar (SK-03), heller
ikke mens grunnlaget venter på svar. Revisjonsretten etter GR-U4 gjelder svar som ikke
er godtatt. Godkjenner byggherren hele kravet i sporet, er partene enige uten aksept:
standpunktene faller sammen (presisert av oppdragsgiver samme dag, #274). Et slikt svar
er låst for revisjon på samme måte som et godtatt svar (presisert av oppdragsgiver
09.10, #274). Prinsippet er at partene kan legge beløpet dødt mens de er uenige om
grunnlaget; et subsidiært standpunkt er et avslag som viser hvor nær partene er.
Forkastet: GR-U6, og å avvise aksept av vederlag og frist til grunnlaget er godkjent
(det ville hindret sakens fremdrift)'''
vedtatt = "08.10, oppdragsgiver (#274)"
forhold = [{ art = "presiserer", vedtak = "ka-u5" }]
folge = '''
Erstatter GR-U6. DT-11 er lukket. Presisert av [GR-U10](#gr-u10) (09.10): for grunnlaget
er en godkjenning uten påberopt preklusjon enighet ved sammenfall. Presisert av
[KA-U15](#ka-u15) (10.10): hvordan et forbehold i byggherrens svar virker på sammenfall,
avgjøres før byggherren kan ta forbehold i et svar i TS-stien. Avgjort 10.10 av
[KA-U16](#ka-u16): første versjon har ingen egen forbeholdstype. Et registrert brev med
et forbehold appen ikke kan uttrykke, er ikke en ubetinget godkjenning. «Avklart» er en
navngitt betingelse som defineres rett av standpunktene ([MM-U13](#mm-u13), 10.10).
Byggestatus i Python: aksepten godtas uavhengig av grunnlaget (K 08.10). Statusen kaller
enigheten `godkjent`, som om kravet var oppgjort, og et svar som godkjenner hele kravet,
gir «allerede avsluttet» ved aksept; enighet og oppgjort som egne begreper prøves i
språkprøven (#274). At en enighet står mens grunnlaget venter, er bygget 09.10 (SK-03,
rad GR-23). At et fullt godkjent svar er låst for revisjon, er ikke bygget (#298)'''

[[gruppe.vedtak]]
anker = "gr-u6"
vedtak = '''
GR-U6: venter grunnlaget på nytt svar, avvises TEs aksept av et svar på vederlag eller
frist som er subsidiært til nytt svar. Når byggherren har svart på grunnlaget, også med
avslag, kan TE godta svaret, også et subsidiært. Byggherren beholder revisjonsretten
etter GR-U4 mens grunnlaget venter, og SK-03 gjelder når standpunktene ligger fast.
Forkastet: å la aksepten gjelde (rekkefølgen mellom aksept og revisjon ville avgjort
utfallet), og en aksept som faller ved revisjon (betinget aksept, i strid med KA-U1)'''
vedtatt = "08.10, oppdragsgiver"
folge = '''
**Erstattet 2026-10-08 av [GR-U7](#gr-u7)** før det ble bygget. Vinduet konstruerte en
regel modellen trengte, ikke kontrakten'''

[[gruppe.vedtak]]
anker = "gr-u8"
vedtak = '''
GR-U8: TE kan ikke godta et svar som godkjenner hele kravet. Partene er alt enige ved
sammenfall (GR-U7), og aksepten avvises uten at journalen endres. Forkastet: å godta
aksepten uten virkning'''
vedtatt = "09.10, oppdragsgiver etter review av PR #306"
folge = '''
Avgjør arbeidshypotesen i rad GR-25. Som i dag (`NOT_ALREADY_ACCEPTED`) i Python og i
målmodellen'''

[[gruppe.vedtak]]
anker = "ka-u6"
vedtak = '''
KA-U6: TE kan trekke et krav i et spor der partene er enige, betinget eller virksomt, så
lenge saken ikke er avsluttet. Enigheten får da ingen virkning, på samme måte som en ny
kravversjon opphever den (SK-02). Forkastet: at en enighet låser kravet mot trekk'''
vedtatt = "09.10, oppdragsgiver etter review av PR #306"
folge = '''
Presisert og snevret inn av vedtak samme dag og senere: etter [KA-U7](#ka-u7) (09.10)
avvises en ny kravversjon i et spor med enighet, mens trekket står. «Avsluttet» betyr at
kravene er avgjort ([KA-U11](#ka-u11), 09.10). Gjelder ikke grunnlaget når godkjenningen
av det er en endringsordre etter § 32.3 a ([KA-U13](#ka-u13), 09.10). Et trekk er bare
avkall på TEs eget krav og opphever ikke pålegg, endringsordre, utførelsesplikt eller
motpartens rettigheter etter en avtale ([KA-U14](#ka-u14), 10.10). KA-U14 kan snevre inn
KA-U6 der enigheten gir byggherren en rettighet, for eksempel et fradrag (KA-U9). Bygget
i målmodellen i språkprøven (#304), rad KA-26. Snevret inn 10.10 av [KA-U22](#ka-u22)
til byggedel 3: trekket avvises når appen ikke kan bevare byggherrens avtalte
rettigheter.'''

[[gruppe.vedtak]]
anker = "ka-u7"
vedtak = '''
KA-U7: en enighet binder begge parter. En ny kravversjon i et spor med enighet, betinget
eller virksom, avvises. Et godtatt avslag er en enighet på byggherrens premisser
(KA-U1). TE kan trekke kravet (KA-U6). Et krav på nytt grunnlag, for eksempel kostnader
som ikke var kjent, går i en ny sak, som etter KA-U3. En åpenbar skrivefeil hører til
B-16. Forkastet: at TE kan oppheve enigheten med en ny kravversjon, som i dag, og en ny
kravversjon bare med byggherrens samtykke'''
vedtatt = "09.10, oppdragsgiver etter lesning av NS 8407 § 5 og §§ 31–35"
folge = '''
Endrer SK-02 og vedtaket om ny kravversjon 05.10 for spor med enighet, og gjør det
overflødig at KA-U3 avhenger av om andre spor er åpne. Grunnlaget er § 34.2.2 første
ledd (et akseptert tilbud er avtalt vederlag); ingenting i § 33 eller § 34 lar TE gå fra
en avtale ensidig. Snevret inn 09.10 av [KA-U13](#ka-u13): et trekk av grunnlaget
avvises når godkjenningen av det er en endringsordre etter § 32.3 a. Presisert 10.10 av
[KA-U20](#ka-u20) for en enighet som bygger på et merket brev. Presisert 11.10 av
[MM-U19](#mm-u19): et registrert brev avvises ikke, men får ingen virkning. Ikke bygget:
i dag opphever en ny kravversjon enigheten (SK-02)'''

[[gruppe.vedtak]]
anker = "mm-u3"
vedtak = '''
MM-U3: virkningen av en enighet fastsettes når den inngås. Har TE godtatt et svar,
gjelder enigheten svaret med alle standpunktene slik det ble godtatt (KA-U1), også når
en senere regelendring ville gitt et standpunkt i svaret en annen virkning. Dagens
utledning kan vise at regelen er endret. Regelendringer som endrer avledet standpunkt i
saker uten enighet, følger B-13'''
vedtatt = "09.10, oppdragsgiver"
folge = '''
Presiserer B-13 (merknaden 05.10) for enigheter. Oppdragsgiver presiserte 09.10 etter
review (merknaden 09.10): innholdet i en enighet fastsettes når den inngås: svaret,
standpunktene og virkningen de hadde etter reglene da. Om vilkåret for virkning er
oppfylt, utledes løpende (GR-U7), så en betinget enighet blir virksom når grunnlaget
avklares. Første formulering, «virkningen av en enighet fastsettes når den inngås»,
kunne leses som at en betinget enighet ble stående betinget. Presisert 09.10 av
[KA-U10](#ka-u10): enigheten gjelder brevets virkning. Modellforslaget foreslår at
innholdet lagres som et enighetsgrunnlag i hendelsen som skaper enigheten. Presisert
10.10 av [KA-U20](#ka-u20) for en enighet som bygger på et merket brev. Ikke bygget. I
dag går et godtatt svar som var prinsipalt prekludert og subsidiært godkjent, fra
`LUKKET_AVSLATT` til grunnlag `godkjent` når § 32.2 ikke gjelder kategorien (K 09.10,
kjernen). Gjelder innsnevringen i #220. Forløp C i modellforslaget'''

[[gruppe.vedtak]]
anker = "ka-u10"
vedtak = '''
KA-U10: godtar TE byggherrens svar, gjelder enigheten svaret med den virkningen brevet
hadde da det ble sendt, slik beslutningsgrunnlaget i brevet uttrykker den (MM-U9). Det
gjelder også når reglene er endret mellom brevet og aksepten. Aksepten viser til svaret
og lagrer regelversjonen TE fikk se. Innholdet i enigheten leses fra
beslutningsgrunnlaget og kopieres ikke. Ved enighet ved sammenfall (GR-U8, GR-U10) er
brevet og enigheten samtidige. NS 8407 regulerer ikke appens regelversjoner, så valget
er produktatferd; det følger B-03 (brevet er det autoritative uttrykket for partens
standpunkt) og § 34.2.2 første ledd (et akseptert tilbud binder slik det sto).
Forkastet: at enigheten fryser virkningen etter reglene da aksepten ble registrert, som
en egen kopi i aksepten'''
vedtatt = "09.10, oppdragsgiver (#273, #308)"
forhold = [{ art = "presiserer", vedtak = "mm-u3" }]
folge = '''
Presiserer MM-U3: «fastsettes når den inngås» betyr brevets virkning, slik brevet ble
godtatt. Et avvik etter dagens regler vises som merknad (MM-U9). Hva
beslutningsgrunnlaget fryser, er presisert 09.10 av [MM-U11](#mm-u11): standpunktene og
sammenfallet. Utfallet og vilkåret utledes. Endret 10.10 av [MM-U17](#mm-u17) for
