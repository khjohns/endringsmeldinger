folge = '''
Bekrefter [MM-U11](#mm-u11): utregningen på tvers av brev følger gjeldende regler og
vises med merknad. Bygger på oppdragsgivers prinsipp 10.10: det som er meddelt, binder,
og en regelendring har ingen virkning for det brevene sier. Del av [B-10](#b-10). Ikke
bygget (#316)'''

[[gruppe.vedtak]]
anker = "mm-u17"
vedtak = '''
MM-U17: for et brev sendt utenfor appen og registrert i den, fryser
beslutningsgrunnlaget appens vurdering etter reglene ved registreringen, merket «appens
vurdering ved registreringen». Brevets innhold står som det ble sendt. Begrunnelsen er
