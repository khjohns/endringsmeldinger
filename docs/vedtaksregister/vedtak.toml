er KA-U7 og HF-U9, slik at en enighet om beregningsregelen kan endres ved ny enighet, uten at det forkastede alternativet i KA-U7 om ny kravversjon med samtykke gjeninnføres for beløp eller dager; utvider EO-U5 og presiserer EO-U8; presiserer OV-U37–OV-U40; presiserer MM-U12.'''

