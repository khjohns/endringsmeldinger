Feil hjemmel eller feil endringsordre før første ekte sak.

**Forholdet til andre vedtak.** Presiserer GR-U22 og GR-U19. I tråd med svaret 25.10 på spørsmål 8.'''
valgt = "H2"
svar = '''
«Enig med dere». Feil hjemmel eller feil endringsordre: H2. H1 er forkastet.'''
forhold = [{ art = "presiserer", vedtak = "gr-u22" }, { art = "presiserer", vedtak = "gr-u19" }]
