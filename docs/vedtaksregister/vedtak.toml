[[gruppe.vedtak]]
anker = "ov-u2"
vedtak = '''
OV-U2: i første versjon (OV-U1) føres forsering og endringsordre som egen sak utenfor
appen, og KOE-saken viser at de ikke støttes ennå. Sperren i FO-U5 virker bare når en
forseringssak i appen viser til avslaget. Godtar TE et fristavslag i appen etter å ha
