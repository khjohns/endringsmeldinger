sporsmal = '''
Den rettede ordlyden til de fem vedtakene ligger nå i PR #481: `forslag-vedtak.md` (`01356ae`). Ingenting er ført i vedtaksregisteret ennå. Svar «ja» på hele forslaget, eller rett enkeltpunkter. Punkt 1–5 er vedtakene, og punkt 6–12 er der forslaget går ut over det du har svart uttrykkelig. Anbefalingen min står ved hvert punkt.

1. **OV-U3, lukkingen (varig):** kravene er avgjort når grunnlaget er avklart og hvert krav TE har sendt, er trukket eller har en virksom enighet. Et spor uten krav hindrer ikke, og et varsel alene er ikke et krav. Visningen sier «Alle fremsatte krav er avgjort», og taushet er ikke et avkall. Når kravene er avgjort, avvises trekk, ny kravversjon og BHs revisjon. Innsigelse, registrering og TEs opplysning om varseldato godtas fortsatt. Et første krav i et tomt spor godtas. Saken er ikke avgjort før det nye kravet er det, og sperren for det som allerede var avgjort, står. Påminnelsen fra Astra vises ved innsending, uten avkrysning.
6. **BHs forespørsel etter § 33.6.2** godtas i et spor der TE bare har sendt et varsel, også når kravene er avgjort. *Anbefalt: ja.*'''
valgt = "Ja"
svar = '''
Ja'''
forhold = [
