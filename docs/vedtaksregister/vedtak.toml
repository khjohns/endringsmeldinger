[[gruppe.vedtak]]
id = "HF-U3"
dato = 2026-10-12
hvem = "oppdragsgiver"
kilde = ["#395"]
sporsmal = '''
#395: hvordan skal brevene lagres i Azure SQL? Prøven mot SQL Server viste at begge formene holder på det som er prøvd. I form (b) gikk innhold stille tapt når kopiene av formatet avvek, og formen falt bak formatet etter én dag (brevteksten i #410). Astra anbefaler (a), og to kontrollrunder fant ikke noe i (a) som strider mot vedtakene. Astra har trukket forslaget om å lagre ferdig PDF i samme transaksjon, så LV-U2 står: teksten er brevet. Valget må tas senest før den første reelle hendelsen (merknaden 11.10 til B-12).

A: ett dokument per brev – Hvert brev lagres samlet som ett dokument, og det er journalens eneste kilde. Tabellene for spørring og rapport lages av brevene, kan lages på nytt og brukes aldri til en bindende handling (B-10). Ukjent innhold bevares og stopper saken (HF-U1).

B: utsagnene i egne tabeller – Hvert utsagn lagres i egne tabeller, og de er kilden. Dokumentet lages av tabellene. Krever at hvert nytt felt får en tabellkolonne før det kan skrives.

C: vent på en prøve mot Azure – Valget venter til IKT har levert en database. Risikoene som bare Azure viser (kontekst i poolen og failover), er like for (a) og (b), så en slik prøve skiller dem ikke.'''
valgt = "A"
svar = '''
A'''
forhold = [{ art = "presiserer", vedtak = "hf-u1" }, { art = "presiserer", vedtak = "b-12-databasen" }]
folge = '''
Avgjør lagringsformen som [merknaden 11.10 til B-12](#b-12-merknad-2026-10-11) satte av. Før svaret ba oppdragsgiver om en forklaring av hvordan beløp, dager og grunnlag blir tilgjengelige for statistikk (#395). Vedtaket gjelder bare lagringsformen. Hva tabellene skal inneholde, avgjøres når rapporteringen og veien til Fabric bygges, og forbeholdet i B-12 står (oppdragsgiver 12.10, #395). Grunnlaget er prøven i PR #406 og sparringen i #395. Ikke bygget'''

