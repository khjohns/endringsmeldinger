sporsmal = '''
Hvilken form har saksnummeret (del 3a)? Saksnummeret står i brevteksten. LV-U4 punkt 1 lyder: «TE krever endringsordre for forholdet «<tittel>» i sak <saksnummer> («<sakstittel>»).» I dag brukes sakens ID som saksnummer. Python lager ulike former (SAK-ÅÅÅÅMMDD-TTMMSS, EO-ÅÅÅÅMMDD-<heks>, Catenda-ID). Design v2 anbefaler at appen lager ID-en selv, men det er ikke vedtatt. Formen blir en kontrakt når den første reelle hendelsen skrives (B-17). Alle tre alternativene presiserer LV-U4 punkt 1, og ingen strider mot et vedtak.

A: tilfeldig ID (Anbefalt) – «Saksnummeret er sakens identitet, en tilfeldig unik ID som appen lager når saken opprettes.» Enklest for 3a. C kan legges til senere, før den første reelle hendelsen, uten at ID-en endres.

B: løpenummer – «Saksnummeret er et lesbart løpenummer per prosjekt, som appen lager når saken opprettes, og det er sakens identitet.»

C: ID og løpenummer – «Saken har en tilfeldig unik ID som appen lager. Et lesbart løpenummer per prosjekt er saksnummeret i brevene.» Utvider LV-U4: saken får et nytt lagret felt, og kjernen må endres.'''
valgt = "A"
svar = '''
«A: tilfeldig ID (Anbefalt)»'''
