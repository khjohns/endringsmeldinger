[[gruppe.vedtak]]
id = "OV-U17"
dato = 2026-10-22
hvem = "oppdragsgiver"
kilde = ["#1045"]
sporsmal = '''
Spørsmålet «Hvem retter», ordrett slik det ble vist i spørsmålsverktøyet:

#1045, spørsmål 2 av 3: hvem retter en feil registrering? Du sluttet deg 17.10 til at et registrert brev som er dokumentasjon, med feil dato, spor eller sak, «rettes ved at den som registrerte, registrerer det på nytt med henvisning til den feilaktige registreringen. Det trengs ingen godkjenning.» (#276, punkt 12). OV-U4 sier: «Hver side registrerer bare sine egne brev, som etter KA-U20.» En kontraktsside kan ha flere team, for eksempel byggherren og en ekstern rådgiver, og en person kan slutte i prosjektet. Er «den som registrerte» personen, teamet eller siden? Svaret avgjør hvem som får tilbud om å rette. Anbefaling: «Samme side», fordi registreringen er sidens brev (OV-U4), og fordi en feil ellers blir stående når personen er borte.

Alternativene slik de ble vist:

Samme side (Recommended): En registrering av et brev sendt utenfor appen, som er dokumentasjon, rettes av samme side som registrerte den: hvem som helst på den siden kan registrere brevet på nytt med henvisning til den feilaktige registreringen, uten godkjenning. Forhold: presiserer avgjørelsen 17.10 (#276, punkt 12) og følger OV-U4 om at hver side registrerer sine egne brev.

Samme person: En registrering av et brev sendt utenfor appen, som er dokumentasjon, rettes bare av personen som registrerte den, uten godkjenning. Kan personen ikke rette den, står registreringen. Forhold: følger ordlyden i avgjørelsen 17.10 (#276, punkt 12).

Samme team: En registrering av et brev sendt utenfor appen, som er dokumentasjon, rettes av teamet som registrerte den: hvem som helst i teamet kan registrere brevet på nytt med henvisning til den feilaktige registreringen, uten godkjenning. Forhold: presiserer avgjørelsen 17.10 (#276, punkt 12), snevrere enn OV-U4s «hver side».'''
valgt = "Samme side"
svar = '''
«Samme side (Recommended)»'''
folge = '''
Svaret er gitt med spørsmålsverktøyet og står på #1045 (kommentaren 6343380408). Ikke bygget (#1045).'''

