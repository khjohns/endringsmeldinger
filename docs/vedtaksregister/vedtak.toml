[[gruppe.vedtak]]
id = "OV-U63"
dato = 2026-10-26
hvem = "oppdragsgiver"
kilde = ["#1282"]
sporsmal = '''
Spørsmål 10. Sammenhengen med fristkrav i andre saker (VG-G-03)

**Forholdet til andre vedtak.** Utvider VS-U18.'''
valgt = "B"
svar = '''
B, uten «automatisk». Arbeidsvalget om veiledningen (tidligere 11.2) inngår i B. Oppdragsgiver ordrett: «Jeg er enig med dere».'''
forhold = [{ art = "utvider", vedtak = "vs-u18" }]
folge = '''
Bygges i #1311.'''

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
Skjemaet for fristkravet ber ikke TE beskrive sammenhengen med fristkrav i andre saker. Veiledningen etter § 33.5 i fristkravet og fristsvaret sier at løsningen ikke tar hensyn til fristkrav i andre saker, og at forlengelsen i flere saker ikke uten videre kan legges sammen. Presiserer VS-U18, i tråd med EO-U8.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
Veiledningen etter § 33.5 i fristkravet oppfordrer TE til å beskrive i begrunnelsen hvordan kravet henger sammen med tidligere varslede forhold og med fristkrav i andre saker, der det har betydning for den samlede virkningen på fremdriften. Fristsvaret har tilsvarende veiledning, tilpasset byggherrens vurdering av kravet. Begge veiledningene sier at forlengelsen i flere saker ikke uten videre kan legges sammen. Skjemaene har ikke et eget felt for dette. Løsningen tar ikke hensyn til fristkrav i andre saker, kontrollerer ikke sammenhengen og summerer ikke dagene på tvers av saker (EO-U8). Utvider VS-U18.'''
anbefalt = true

[[gruppe.vedtak]]
id = "OV-U64"
dato = 2026-10-27
hvem = "oppdragsgiver"
kilde = ["#1336", "#1337", "#1338"]
sporsmal = '''
Bakgrunn: S-3 i bestillingen for BF-03 spurte om protesten skal bygges i samme leveranse som historien. Oppdragsgiver svarte 27.10: «Jeg støtter også A.» Alternativet lyder: «Ja. Protesten mot påberopelsen bygges, med brevteksten i LV-U4 punkt 8. Bestridelse, passivitet og merking er fortsatt utsatt.» Det forkastede alternativet lyder: «Nei. Historien bygges med registrering av et brev sendt utenfor appen som veien for M-1.»

**1. Hvem kan protestere mot hva, nå som protesten bygges?**

Bakgrunn: OV-U7 utsetter «protest mot en innsigelse» i sin helhet. Svaret «Jeg støtter også A» på S-3 lyder: «Ja. Protesten mot påberopelsen bygges, med brevteksten i LV-U4 punkt 8. Bestridelse, passivitet og merking er fortsatt utsatt.» LV-U4 punkt 8 har tre brevformer: protest mot innsigelsen i et brev, protest mot påberopelsen av for sen varsling i et svar, og protest mot innsigelsene i et brev. Punktet gjelder begge parter (VS-U14). Svaret sier ikke hvem som kan protestere, eller mot hvilken innsigelse.

Alternativene i vedtaksform (forholdet til OV-U7 er «snevrer inn» i alle tre). I alle tre er dette fortsatt utsatt etter OV-U7: «ingen krav», merking og avklaring, senere begrunnelse og datokontrollene, bestridelse og påberopt passivitet.

Revidert forslag (C med grenser), stilt 27.10: Oppdragsgiver la fram en vurdering fra Astra og spurte om orkestratoren var enig. Orkestratoren var enig i hovedsak. Begrunnelsen ble rettet: henvisningen til LV-U4 punkt 8 avgjør ikke omfanget; D-6 sier når en protest godtas, ikke hvem som kan protestere mot hva; at A og B trenger en sperre, viser ikke at C er minst; listen over det som fortsatt er utsatt var feil etter OV-U55.

Valget gjelder leveranseomfanget. Det følger ikke av svaret «Jeg støtter også A» alene.

**Forholdet til andre vedtak.** Snevrer inn OV-U7.'''
valgt = "C"
svar = '''
C, revidert med oppdragsgivers to presiseringer. Oppdragsgiver ordrett: «Ja, med to små presiseringer. C er nå et uttrykkelig valg om leveranseomfang, og begrunnelsen holder.

1. Bytt «registrert innsigelse» med «innsigelse fra motparten som løsningen støtter protest mot etter de nevnte vedtakene». «Registrert» kan forveksles med registrering av brev sendt utenfor løsningen etter OV-U4. Formuleringen bør ikke utilsiktet gi slike brev nye strukturerte virkninger.
2. D-6 kan godt prøves i BF-03. Jeg mente et kontrollpunkt, ikke nødvendigvis et eget brukerforløp eller en utsettelse. At D-6 står i bestillingen, betyr likevel ikke alene at det er prøvd. Forløpet må faktisk nå enighet, sende protesten og kontrollere at enighetens virkning består.

Innledningen kan dermed være:

«Løsningen støtter protest fra begge parter mot innsigelser fra motparten, innenfor de vedtatte protestreglene som er angitt nedenfor.»

Punkt 4 kan være:

«BF-03 prøver TEs protest mot påberopelsen i svaret, også etter enighet (D-6), og kontrollerer at protesten ikke endrer enighetens virkning. Byggherrens protest får eget brukerforløp før den tas i bruk.»»'''
forhold = [{ art = "snevrer inn", vedtak = "ov-u7" }]
folge = '''
Resten av OV-U7, slik den lyder etter senere vedtak (blant dem OV-U55), endres ikke av dette vedtaket.'''

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
Smal. TE kan protestere når byggherren i svaret påberoper at varselet kom for sent. Brevteksten er den midterste formen i LV-U4 punkt 8. Annen protest mot en innsigelse er fortsatt utsatt, også byggherrens.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
Mellom. TE kan protestere mot hver innsigelse fra byggherren, både en påberopelse i svaret og en egen innsigelse, med alle tre formene i LV-U4 punkt 8. Byggherrens protest er fortsatt utsatt.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Første forslag til C"
tekst = '''
Hel. Begge parter kan protestere mot en innsigelse fra den andre. Hele punktet om protest i OV-U7 bygges, med protestregelen i VS-U9, protestdelen av KA-U29 og hele LV-U4 punkt 8.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "C"
tekst = '''
Løsningen støtter protest fra begge parter mot innsigelser fra motparten, innenfor de vedtatte protestreglene som er angitt nedenfor. Hele punktet om protest i OV-U7 bygges, med protestregelen i VS-U9, protestdelen av KA-U29 og formene i LV-U4 punkt 8. Grensene:
1. Protesten viser til det bestemte brevet og den eller de innsigelsene den gjelder.
2. Den er ingen generell handling for å avslå eller bestride hele svaret.
3. Virkningen følger de vedtatte protestreglene. Løsningen avgjør ikke om protesten er berettiget eller om den opphever innsigelsen.
4. BF-03 prøver TEs protest mot påberopelsen i svaret, også etter enighet (D-6), og kontrollerer at protesten ikke endrer enighetens virkning. Byggherrens protest får eget brukerforløp før den tas i bruk.
Valget gjelder leveranseomfanget. Det følger ikke av svaret «Jeg støtter også A» alene.'''
anbefalt = true

[[gruppe.vedtak]]
id = "OV-U65"
dato = 2026-10-27
hvem = "oppdragsgiver"
kilde = ["#1338"]
sporsmal = '''
Spørsmål til oppdragsgiver 27.10: protest etter enighet (BF-03, G-5). Utløst av oppdragsgiver 27.10, ordrett: «Skjønner ikke hvorfor protest skal være mulig når partene er enig?» Versjon 2, rettet etter prøvingen mot vedtaksfila (subagent, 27.10).

**Spørsmål 1. Kan TE protestere mot en innsigelse TE har godtatt?**

Bakgrunn: Godtar TE byggherrens svar, gjelder aksepten hele svaret med alle standpunktene, også påberopelsen av at varselet kom for sent (KA-U1). Enigheten binder begge. En ny kravversjon avvises, men TE kan trekke kravet til kravene er avgjort (KA-U7, KA-U6, KA-U11). Enigheten om beløpet får virkning når grunnlaget er avklart (GR-U7). VS-U1 sier at en protest mot innsigelsen registreres og vises ved siden av den, uten å skille mellom før og etter en aksept. KA-U29 sier det samme for tilfellet der TE har godtatt byggherrens avslag av grunnlaget. OV-U64 punkt 4 krever at BF-03 prøver TEs protest mot påberopelsen i svaret også etter enighet, og kontrollerer at den ikke endrer enighetens virkning. Etter VS-U9 er en påberopelse i svaret én innsigelse: et senere svar gjentar den, den første innsigelsen og tidspunktet bevares, og en egen innsigelse etter svaret endrer ikke et tidligere svar eller en enighet. I dag avvises all protest som utsatt (OV-U7); OV-U64 bygger den.

- A. Som vedtatt. TE kan protestere mot en innsigelse også etter å ha godtatt svaret som inneholder den. Protesten registreres og vises uten virkning på utfallet, og enigheten står (VS-U1, KA-U29, OV-U64 punkt 4).
- B. Har TE godtatt et svar, avvises TEs protest mot en innsigelse som svaret inneholder eller gjentar, uansett hvilket brev innsigelsen først står i. Det gjelder også når TE har godtatt byggherrens avslag av grunnlaget. Meldingen sier at TE har godtatt svaret med innsigelsen. En protest mot en ny innsigelse byggherren sender etter aksepten, og som svaret ikke gjentar, godtas (VS-U1, VS-U9). En protest sendt før aksepten står (S-2 i BF-03). Vil TE likevel fastholde noe overfor byggherren, kan et brev sendt utenfor appen registreres (OV-U4). Snevrer inn VS-U1 og KA-U29, og endrer OV-U64 (vedtatt 27.10) punkt 4: BF-03 kontrollerer at protesten avvises etter aksept av svaret.

Anbefalt: B. Aksepten gjelder også innsigelsen (KA-U1), så en protest mot den strider mot TEs eget brev og kan leses som et forsøk på å gå fra enigheten. Avvisningen avgjør ikke noe kontrakten overlater til partene (MM-U12): TE har tatt standpunkt i aksepten, og den betyr det den sa da (MM-U3). Veien med registrert brev står åpen. At ingen bruker trenger protesten etter aksept, er en antakelse.

Valget styrer: G-5 og D-6 i BF-03.md og en eventuell tilstand i prototypen; avvisningen i kjernen når protesten bygges etter OV-U64. Avvisningen av en gjentatt innsigelse krever at relasjonen «svaret gjentar innsigelsen» er lagret (VS-U9, DM-06). Før den finnes, kan kjernen bare avvise protest mot innsigelsen i svarets egen hendelse.

**Oppfølging 27.10.** Spurt (tekst fra økta, i sammendrag): om skillet etter MM-U7 (bestridelse av en opplysning) skal stå, og om et prinsipp for begge parter skal føres i stedet, med utkastet «Har partene inngått en enighet, avvises protest, innsigelse og bestridelse fra hver av partene mot det enigheten omfatter, også det svaret inneholder eller gjentar. […]».'''
valgt = "B"
svar = '''
Oppdragsgiver 27.10, ordrett: «Ja B. Men er dette et vedtak?
Det er jo grunnleggende at du ikke kan protestere på noe som er avtalt? Vi har både vedtak og prinsipper som gjelder grunnleggende avtalerett»

Oppdragsgiver 27.10, ordrett, på oppfølgingen: «Skillet ditt - hvilken praktisk betydning har det? TE eller BH må i så fall ikke godta krav/svar. Det gjelder BH også»

Oppdragsgiver 27.10, ordrett (vedtaksteksten): «Dette er fortsatt et nytt produktvalg som må endre de tidligere protestreglene uttrykkelig. Jeg ville formulert det slik:

«Har partene inngått en enighet, avviser løsningen protest, innsigelse og bestridelse fra begge parter mot det enigheten omfatter. Sperren gjelder også standpunkter i svaret som inngår i enigheten. Det som ikke er omfattet av enigheten, følger de vanlige reglene. Et brev sendt utenfor løsningen kan fortsatt registreres etter OV-U4.»

«Som inngår i enigheten» er mer presist enn «det svaret inneholder eller gjentar», fordi et svar også kan gjengi standpunkter fra andre spor.

D-6 må da prøve avvisningen etter enighet. Før aksept bør visningen gjøre det tydelig at aksepten omfatter hele svaret i sporet, også påberopelser parten tidligere har protestert mot»'''
forhold = [{ art = "snevrer inn", vedtak = "ka-u29" }, { art = "snevrer inn", vedtak = "ov-u3" }, { art = "snevrer inn", vedtak = "ka-u11" }, { art = "snevrer inn", vedtak = "mm-u7" }, { art = "snevrer inn", vedtak = "vs-u1" }, { art = "snevrer inn", vedtak = "vs-u9" }, { art = "snevrer inn", vedtak = "ov-u7" }, { art = "endrer", vedtak = "ov-u64" }, { art = "presiserer", vedtak = "ka-u7" }]
folge = '''
Bygges i #1352.'''

