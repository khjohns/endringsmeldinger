sporsmal = '''
Hva sier byggherrens svar på vederlag eller frist når grunnlaget ikke er besvart?

Innledningen i svar-kommentaren på #1239 (kommentaren 6383634165), ordrett utenom lenken til versjon 4: Grunnlaget er versjon 4 (kommentaren 6383604340) og sparring 3. Oppdragsgiver svarte først, ordrett: «Jeg støtter følgende fra Astra.» Det var S″ og 2′ fra versjon 3, med Astras presiseringer. Prøvingen hadde funnet at S″ manglet HF-U7 og at 2′ brøt LV-U4 punkt 5 og KA-U16. Svaret ble derfor slått sammen med rettelsene og lagt fram slik, ordrett:

**Spørsmål 1, S⁗** (S″ + Astras presisering + HF-U7 + skillet mellom brev og visning)'''
valgt = "S⁗"
svar = '''
