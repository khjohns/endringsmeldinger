[[gruppe.vedtak]]
anker = "ka-u17"
vedtak = '''
KA-U17: «ingen krav» (KA-U12) er TEs avkall på krav om frist eller vederlag som følge av
forholdet i saken, også for følger som ikke er kjent, og brevet sier det uttrykkelig. Er
TE usikker, sender hen ikke «ingen krav». Et senere krav kan registreres i en ny sak,
