[[gruppe.vedtak]]
id = "VS-U24"
dato = 2026-10-15
hvem = "oppdragsgiver"
kilde = ["#500"]
sporsmal = '''
Modellen for innsigelser (#500). Kartleggingen bekrefter at dagens fristskjema løser
tilfellet. Byggherren tar stilling i svaret med ett ja/nei-standpunkt per bestemmelse
(§ 33.4, § 33.6.1, § 33.6.2). Den egne innsigelsen tilbys bare mot fristvarselet,
etter § 33.4. Kjernen har allerede samme form i svaret. Det som må rettes, er at
kjernen også leser en egen innsigelse mot et krav eller svar som en påberopelse etter
§ 33.4. A følger skjemaet, gir ingen ny lagret verdi, presiserer HF-U11 og snevrer inn
VS-U9 og VS-U11. B gir et nytt lagret felt, flere detaljvedtak og snevrer inn VS-U1 og
OV-U7. Hvilken modell skal gjelde?'''
valgt = "A"
svar = '''
A: og vi evt eget issue bør også sjekke denne problemstillingen for grunnlag og vederlag'''
forhold = [{ art = "presiserer", vedtak = "hf-u11" }, { art = "snevrer inn", vedtak = "vs-u9" }, { art = "snevrer inn", vedtak = "vs-u11" }, { art = "snevrer inn", vedtak = "vs-u14" }, { art = "snevrer inn", vedtak = "hf-u4" }, { art = "presiserer", vedtak = "ov-u7" }]
folge = '''
Spørsmålet kom etter svaret 15.10 på #500: «For slike tilfeller bør det knyttes til den aktuelle hjemmelen». Svaret ber om at problemstillingen også sjekkes for grunnlag og vederlag (#517). Forholdene til HF-U11, VS-U9 og VS-U11 sto i spørsmålet. Forholdene til VS-U14, HF-U4 og OV-U7 fant kontrollen av føringen 15.10: etter A blir TEs egen innsigelse ikke en påberopelse etter en bestemmelse (VS-U14), en innsigelse som gis opp etter HF-U4 kan bare gjelde et varsel, og innsigelsen mot varselet utledes etter VS-U3 (OV-U7). Bygget 16.10 i PR #535 (#500, #517 og del 2 av #498): en egen innsigelse er en påberopelse bare mot varselet etter § 33.4 og mot TEs varsel etter § 32.2, som er grunnlagskravet i hver versjon der § 32.2 gjelder kategorien (arbeidsvalget 15.10 i #500, GR-U11). Mot et annet krav eller et svar har den ingen virkning, og i vederlag er en innsigelse mot kravet ingen påberopelse (#517). En innsigelse mot et varsel byggherren har sagt kom i tide i et svar fra appen, avvises (HF-U4). REGELVERSJON 16, PROJEKSJONSVERSJON 17.'''

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
En påberopelse av at TE har varslet eller krevd for sent etter en bestemmelse står i byggherrens svar, med ett standpunkt for hver bestemmelse, som § 32.2, § 33.4, § 33.6.1 og § 34.1.2 (VS-U3, VS-U22). En egen innsigelse etter § 5 tredje ledd er en påberopelse etter en bestemmelse bare når det den gjelder, bare kan komme for sent etter én bestemmelse: varselet etter § 33.4, TEs varsel etter § 32.2, og senere de egne varslene etter § 34.1.2 og § 34.1.3 (OV-U5). Da gjentar svaret den eller gir den opp (VS-U9, VS-U11), og HF-U4 gjelder for den. En egen innsigelse mot et krav eller et svar registreres og vises med sendetid, det den gjelder, § 5 tredje ledd og partens begrunnelse. Den leses ikke som en påberopelse etter noen bestemmelse, og et senere svar gjentar den ikke og gir den ikke opp. Påberopelsen etter bestemmelsen står da i svaret. Appen avgjør ikke om innsigelsen og svaret til sammen kom i tide (VS-U1, MM-U12).'''

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
En påberopelse av at motparten har varslet, krevd eller svart for sent oppgir bestemmelsen, både i svaret og i en egen innsigelse etter § 5 tredje ledd. Den egne innsigelsen har samme form som standpunktet i svaret: det den gjelder, og bestemmelsen. Parten velger blant bestemmelsene som gjelder for det den gjelder, for eksempel § 33.4 eller § 33.6.1 mot det første fristkravet, og bare § 33.6.1 mot en senere kravversjon. Svaret gjentar eller gir opp bare en innsigelse etter samme bestemmelse mot det samme, og HF-U4 gjelder for begge. En innsigelse etter en bestemmelse appen ennå ikke kan utlede, avvises og sendes utenfor appen (OV-U1).'''
forkastet = true

[[gruppe.vedtak]]
id = "HF-U4"
dato = 2026-10-15
hvem = "oppdragsgiver"
kilde = ["#309", "#495"]
sporsmal = '''
1. § 33.4, PR #495. Forløp: byggherren påberoper i sitt svar at TE varslet for sent, og varselet appen kjenner da, er TEs første fristkrav. Senere oppgir TE at et varsel ble sendt utenfor appen på en tidligere dato. I et nytt svar sier byggherren uttrykkelig at dette varselet kom i tide. Så kommer et svar som ikke sier noe om varselet. Skal påberopelsen da regnes som oppgitt? VS-U20 sier at appen leser påberopelsen som oppgitt «når byggherren uttrykkelig har frafalt påberopelsen eller sagt at varselet kom i tide». Etter OV-U5 utvides ikke et tidligere svar til et senere oppgitt varsel. Mitt arbeidsvalg 15.10 (A1) var for strengt mot TE og har ikke belegg i vedtakene.
2. Avtaleretten gir et klart grunnlag. Etter løfteprinsippet er en part bundet av sitt eget utsagn når det er kommet til mottakerens kunnskap. Avtaleloven § 7 lar et utsagn kalles tilbake bare hvis tilbakekallet kommer fram før eller samtidig med utsagnet, og kommentaren sier at regelen er et generelt prinsipp også for andre løfter. Kapittel 1 gjelder når ikke annet følger av avtalen (§ 1), og NS 8407 regulerer ikke tilbakekall av et «i tide». Brukt på appen: byggherrens «i tide» kommer fram til TE når svaret sendes, og etter det kan det ikke tas tilbake i en revisjon. Unntaket for uendrede forhold (re integra) er en konkret vurdering som appen ikke gjør. Kan byggherren i en revisjon av et svar TE ikke har godtatt, ta tilbake at varselet kom i tide?
3. Løfteprinsippet rekker lenger enn «i tide». Det kan også binde byggherren til det hen har godkjent i et sendt svar, for eksempel 50 dager eller et beløp, slik GR-U10 allerede gjør for godkjent grunnlag. GR-U7 lar i dag byggherren revidere hele svaret til TE har godtatt det, også til ugunst for TE. Skal prinsippvedtaket nå gjelde bare rettidigheten og innsigelsen etter § 5, eller hele svaret?
4. Vedtaksteksten blir ført ordrett i vedtaksregisteret. Kan teksten (alternativ Ja) føres slik? Forholdet til andre vedtak: presiserer VS-U11, VS-U14 og VS-U20, og snevrer inn GR-U7 og VS-U9.
5. Kontrollen av HF-U4 fant ett avvik. Listen over forhold til andre vedtak mangler OV-U5. OV-U5 sier: «Byggherren kan revidere svaret så lenge det ikke er godtatt (SK-03, GR-U7).» HF-U4 avviser en ny påberopelse i en slik revisjon når byggherren har sagt «i tide». Det snevrer inn OV-U5 på samme måte som GR-U7. Skal «snevrer inn OV-U5» legges til?'''
valgt = "Ja"
svar = '''
1. Mulig jeg misforstår, men dette er enkelt i mitt hode: Hvis BH på et eller annet tidspunkt har sagt at varselet er gitt i tide, da er han bundet av det.
2. Nei (anbefalt)
3. Rettidighet nå (anbefalt)
4. Ja, før den
5. Legg til (anbefalt)'''
forhold = [{ art = "presiserer", vedtak = "vs-u11" }, { art = "presiserer", vedtak = "vs-u14" }, { art = "presiserer", vedtak = "vs-u20" }, { art = "snevrer inn", vedtak = "gr-u7" }, { art = "snevrer inn", vedtak = "vs-u9" }, { art = "snevrer inn", vedtak = "ov-u5" }]
folge = '''
Snevrer også inn [VS-U1](#vs-u1) (oppdragsgiver 15.10, svar 9 i #504). Bygget 15.10 i PR #518 (#498, del 1): et uttrykkelig «i tide» sendt fra appen sperrer «for sent» etter samme bestemmelse i senere svar og revisjoner (§ 33.4, § 34.1.2 og § 33.6.1), med regelkoden SAGT_I_TIDE og PROJEKSJONSVERSJON 16. Del 2 bygget 16.10 i PR #535 (#498): har byggherren sagt i et svar fra appen at varselet kom i tide, avvises en innsigelse mot det samme varselet med SAGT_I_TIDE. Det gjelder varselet etter § 33.4 og grunnlagskravet i hver versjon der § 32.2 gjelder kategorien (REGELVERSJON 16, PROJEKSJONSVERSJON 17). Endret 18.10 i PR #796 (#770, #776 p1): om § 32.2 gjelder kategorien, leses av det frosne svaret som sa «i tide» etter § 32.2 på en versjon i samme kategori, ikke av dagens regelsett (REGELVERSJON 19, PROJEKSJONSVERSJON 28).'''

[[gruppe.vedtak.alternativ]]
navn = "Ja"
tekst = '''
Har en part i et utsagn sendt fra appen uttrykkelig sagt at motpartens varsel, krav eller svar kom i tide etter en bestemmelse, eller uttrykkelig gitt opp sin innsigelse etter § 5 tredje ledd mot det, avviser appen en senere påberopelse fra samme part av at det samme varselet, kravet eller svaret kom for sent etter samme bestemmelse. Det gjelder også i en revisjon av svaret før motparten har godtatt det. Resten av svaret kan revideres som før (GR-U7). Utsagnet gjelder det det viser til (HF-U1). Et standpunkt om varselet står mot hver senere kravversjon (VS-U20). Et standpunkt etter § 33.4 sier ingenting om § 33.6.1, og omvendt. Taushet, et registrert brev og en konkret tolkning av et senere brev gir ikke slik virkning (VS-U11, OV-U4). Om parten likevel kan komme løs fra utsagnet, for eksempel fordi forholdene er uendrede eller utsagnet er ugyldig, avgjør ikke appen (MM-U12).'''

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
Revisjonsretten i GR-U7 gjelder hele svaret, også rettidigheten, til motparten har godtatt det.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "C"
tekst = '''
Har en part uttrykkelig sagt at et varsel eller krav kom i tide, eller frafalt en innsigelse, er parten bundet av det i saken. Appen leser ikke en senere påberopelse av det samme som gjeldende.'''
forkastet = true

[[gruppe.vedtak]]
id = "HF-U5"
dato = 2026-10-15
hvem = "oppdragsgiver"
kilde = ["#499"]
sporsmal = '''
1. Skal byggherren være bundet av det hen har innrømmet i et sendt svar, før TE har godtatt det? Avtaleretten tilsier ja. TEs vederlagskrav er et tilbud (§ 34.2.1). En full godkjenning er aksept. Et svar som godkjenner bare deler av kravet, er etter avtaleloven § 6 et avslag med et nytt tilbud, og det binder byggherren fra TE kjenner det (§ 7). Bindingen varer bare i akseptfristen (§§ 2–3). Den faller bort når TE sender en ny kravversjon, som er et avslag (§ 5). NS 8407 sier ingenting om å endre et svar. Den binder likevel byggherren ved taushet (§ 32.3, § 33.7, § 5), og det ville være inkonsekvent om en uttrykkelig godkjenning bandt mindre. I dag lar GR-U7 byggherren revidere hele svaret, også til ugunst for TE. Hvilken retning velger du?
2. Gjelder bindingen også fristforlengelse? NS 8407 kaller vederlagskravet et tilbud (§ 34.2.1), men sier ikke det samme om fristkravet. Der er byggherrens godkjenning av dager en innrømmelse, og avtaleloven gjelder bare analogisk. § 33.7 annet ledd sier likevel at innsigelser mot kravet tapes ved taushet. Det taler for at en uttrykkelig godkjenning binder minst like sterkt.
3. Fem detaljer gjenstår: (1) Et frafall etter GR-U9 kan fortsatt revideres fritt. (2) Sender TE en ny grunnlagsversjon, er byggherren fri for svar i vederlag og frist som var regnet mot den forrige versjonen (HF-U1). (3) Ingen akseptfrist i svaret i første versjon. (4) En blandet revisjon, som hever étt standpunkt og senker et annet, avvises. Sammenlikningen gjøres standpunkt for standpunkt. (5) Retting av åpenbare skrivefeil knyttes til B-16 før prinsippet bygges. Godtar du dem?
4. Hvordan skal akseptfristen fungere? Valgfri fra første versjon, valgfri senere, eller påkrevd i hvert svar?
5. Hva skjer når TE godtar byggherrens svar etter at akseptfristen er ute? Etter avtaleloven § 4 første ledd er en aksept som kommer for sent, et nytt tilbud fra TE.
6. Etter kontrollen: aksepten omgjort til en ny kravversjon med innholdet i byggherrens svar strider mot KA-U10, KA-U1 og HF-U1. Skal en sen aksept lagres som TEs nye tilbud om å godta svaret slik det står, med en ny handling for byggherren, eller avvises, slik at TE sender en ny kravversjon?
7. Kan vedtaksteksten føres slik den ble lagt fram etter vurderingen?
8. Kontrollen av HF-U5 fant at OV-U3 ikke har noen sperre for aksept. Kan setningen rettes til «Sperren for aksept i FO-U5 gjelder også for en aksept etter fristen», med de rettede forholdene (GR-U6 ut, KA-U1 snevres inn, KA-U10 og FO-U5 utvides)?'''
valgt = "Bundet, med akseptfrist"
svar = '''
1. Bundet, med akseptfrist
2. Avtaleloven gjelder ikke analogisk. Det er klart at dette er tilbud og løfter. Frist kan dessuten også verdsettes - antall dager ganget med dagmulktskrav.
3. Ja, alle fem (anb.)
4. Valgfri, nå (anbefalt)
5. Nytt tilbud er vel minst handling for partene samlet sett. Men hvor mye kompliserer det logikk i appen?
6. Ny handling for BH (anb.)
7. Ja, prøv de to setningene og før teksten
8. Ja, rett og før (anb.)'''
forhold = [{ art = "snevrer inn", vedtak = "gr-u4" }, { art = "snevrer inn", vedtak = "gr-u7" }, { art = "snevrer inn", vedtak = "mm-u9" }, { art = "snevrer inn", vedtak = "ov-u5" }, { art = "snevrer inn", vedtak = "ka-u1" }, { art = "utvider", vedtak = "ka-u10" }, { art = "utvider", vedtak = "fo-u5" }, { art = "presiserer", vedtak = "gr-u9" }, { art = "presiserer", vedtak = "hf-u4" }]
folge = '''
Detalj 3 i spørsmål 3 («Ingen akseptfrist i svaret i første versjon») falt bort med svaret på spørsmål 4. Del 1 bygget 16.10 i PR #622 (#502): en revisjon av et svar TE ikke har godtatt, sammenliknes standpunkt for standpunkt med svaret den erstatter (grunnlag, beløp, dager, hindring og aksept av beregningsmåten), og en revisjon som senker ett standpunkt, avvises med regelkoden SENKER_INNROEMMELSE, også når den hever et annet. Del 2 av #502 (akseptfristen) er ikke med.'''

[[gruppe.vedtak.alternativ]]
navn = "Bundet, med akseptfrist"
tekst = '''
Appen behandler TEs krav og byggherrens svar som tilbud og løfter etter avtaleloven kapittel 1, i grunnlaget, i vederlag og i fristforlengelse. Et svar som ikke stemmer med kravet, er avslag i forening med nytt tilbud (avtaleloven § 6). I en revisjon av et svar TE ikke har godtatt, avviser appen en endring som senker noe byggherren har innrømmet i svaret: godkjent grunnlag, godkjent beløp eller godkjente dager, prinsipalt eller subsidiært, eller en innsigelse hen har gitt opp. Sammenlikningen gjøres standpunkt for standpunkt, slik standpunktene står i brevene (MM-U11), og en revisjon som senker ett standpunkt, avvises også når den hever et annet. En revisjon som bare endrer i TEs favør, er tillatt, og oppfordringen i MM-U9 gjelder bare en slik revisjon. Bindingen i appen varer til TE godtar svaret, til TE sender en ny kravversjon (avtaleloven § 5), eller til en akseptfrist byggherren har satt i svaret, er ute (avtaleloven § 2). En aksept etter fristen er et nytt tilbud fra TE om å godta svaret slik det står (avtaleloven § 4). Byggherren kan godta eller avslå tilbudet, og godtar byggherren, er partene enige om svaret slik brevet uttrykker det (KA-U10). Sperren for aksept i FO-U5 gjelder også for en aksept etter fristen. HF-U4 gjelder også etter at akseptfristen er ute, og mot en ny kravversjon TE sender etter fristen. Svar i vederlag og frist som ble gitt mens en tidligere grunnlagsversjon gjaldt, binder ikke etter en ny grunnlagsversjon (HF-U1). Oppgir TE et varsel etter svaret, kan byggherren ta stilling til rettidigheten etter den bestemmelsen på nytt, unntatt det HF-U4 gjelder (OV-U5). Et frafall etter GR-U9 kan fortsatt revideres. Et registrert brev binder ikke i appen (OV-U4). Om byggherren likevel er løst, for eksempel fordi rimelig tid etter avtaleloven § 3 er ute, forholdene er uendrede eller svaret er ugyldig, avgjør ikke appen (MM-U12). Retting av åpenbare skrivefeil avgjøres i B-16.'''

[[gruppe.vedtak.alternativ]]
navn = "Bundet uten akseptfrist"
tekst = '''
Byggherren er bundet av det hen har innrømmet i et sendt svar til TE godtar svaret eller sender en ny kravversjon, uten at byggherren kan sette en akseptfrist.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Ikke bundet"
tekst = '''
Revisjonsretten i GR-U7 gjelder hele svaret til TE har godtatt det. Bindingen etter HF-U4 gjelder bare rettidigheten.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Sen aksept avvises"
tekst = '''
Appen avviser en aksept etter fristen. TE kan i stedet sende en ny kravversjon, som er det nye tilbudet (avtaleloven § 4).'''
forkastet = true

[[gruppe.vedtak]]
id = "HF-U6"
dato = 2026-10-15
hvem = "oppdragsgiver"
kilde = ["#504"]
sporsmal = '''
1. **Prinsippvedtakene.** Kan F1–F8 føres som prinsippvedtak med forholdene som står
under hvert forslag? *Anbefaling: ja.*

Forslaget F1 Bindingen, med forholdet slik det står under forslaget:
Forhold: utvider HF-U4 og HF-U5 til varsler og avkall og til begge parter. Følger av
HF-U5 («tilbud og løfter»). Vedtaket 05.10 om at hver oppdatering er en ny
kravversjon, står som unntaket.'''
valgt = "Ja"
svar = '''
Ja til alle anbefalingene'''
forhold = [{ art = "utvider", vedtak = "hf-u4" }, { art = "utvider", vedtak = "hf-u5" }]
folge = '''
Utvidelsen av HF-U4 og HF-U5 gjelder varsler og avkall og begge parter. Følger av HF-U5 («tilbud og løfter»). Vedtaket 05.10 om at hver oppdatering er en ny kravversjon, står som unntaket. Grunnlaget er vurderingen av vedtakene mot NS 8407 og avtaleloven (#504). Byggestatus er ikke vurdert.'''

[[gruppe.vedtak.alternativ]]
navn = "Ja"
tekst = '''
Appen behandler varsler, krav, svar og avkall en part sender, som løfter etter
avtaleloven kapittel 1. Et utsagn binder parten fra det er kommet fram til
motparten (avtaleloven § 1 første ledd og § 7). En senere hendelse fra samme part
kan ikke ta tilbake eller svekke det parten har gitt motparten. Unntaket er TEs nye
kravversjon, som er et nytt tilbud (HF-U8). En revisjon av et svar TE ikke har godtatt,
avvises ikke når den bare endrer i TEs favør (HF-U5). Hvilke hendelser appen avviser
for å verne bindingen, står i vedtakene om svaret (HF-U4, HF-U5), enigheten (HF-U9) og
avkallet (HF-U10). Gjelder NS 8407 noe annet, går kontrakten foran (avtaleloven § 1 første
ledd). Om parten likevel er løst fra utsagnet, avgjør ikke appen (MM-U12).'''

