[[gruppe.vedtak]]
id = "VS-U21"
dato = 2026-10-12
hvem = "oppdragsgiver"
kilde = ["#309", "#407"]
sporsmal = '''
Et brev fra byggherren kan være sendt utenfor appen og registrert i den. Brevet kan si at TE var «for sent» uten å si hva det gjelder: varselet (§ 33.4, kravet tapes), det spesifiserte kravet (§ 33.6.1, TE har bare krav på det byggherren måtte forstå) eller begge. I et brev fra appen spør skjemaet om hver for seg. HF-U1: «Hvert utsagn viser uttrykkelig til det det gjelder.» Hvordan skal appen vite hva et registrert brev påberoper?

A: Når et brev fra byggherren registreres, angir den som registrerer, hva brevet påberoper: at varselet kom for sent etter § 33.4, at kravet ble spesifisert for sent etter § 33.6.1, eller begge. Det gjelder også når kravet var varselet. Appen avgjør ikke det ut fra saken. Sier brevet ikke hvor mange dager byggherren mener TE måtte forstå, registreres påberopelsen etter § 33.6.1 uten tall, og brevet kan merkes (KA-U16, KA-U20).
Forhold: følger HF-U1 og presiserer VS-U9. For registrerte brev gjør A unntak fra tallkravet i VS-U4. Anbefalt.

B: Appen leser påberopelsen ut fra saken. Har TE varslet før kravet, gjelder den spesifiseringen etter § 33.6.1. Ellers gjelder den varselet etter § 33.4.
Forhold: strider mot HF-U1, og gir ikke rom for begge påberopelsene samtidig.

Spørsmålet står i versjon 2 av spørsmålspakken for byggedel 2 på #309 (K4), og erstatter J2 i versjon 1.'''
valgt = "A"
svar = '''
A: den som registrerer (Anbefalt)'''
forhold = [{ art = "presiserer", vedtak = "vs-u9" }, { art = "snevrer inn", vedtak = "vs-u4" }]
folge = '''
Følger [HF-U1](#hf-u1). Ikke bygget'''

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
Når et brev fra byggherren registreres, angir den som registrerer, hva brevet påberoper: at varselet kom for sent etter § 33.4, at kravet ble spesifisert for sent etter § 33.6.1, eller begge. Det gjelder også når kravet var varselet. Appen avgjør ikke det ut fra saken. Sier brevet ikke hvor mange dager byggherren mener TE måtte forstå, registreres påberopelsen etter § 33.6.1 uten tall, og brevet kan merkes (KA-U16, KA-U20).'''

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
Appen leser påberopelsen ut fra saken. Har TE varslet før kravet, gjelder den spesifiseringen etter § 33.6.1. Ellers gjelder den varselet etter § 33.4.'''
forkastet = true

[[gruppe.vedtak.sitat]]
kilde = "hovedplanen"
tekst = "Hvert utsagn viser uttrykkelig til det det gjelder"
utdrag = true


