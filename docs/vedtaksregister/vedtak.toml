[[gruppe.vedtak]]
anker = "vs-u7"
vedtak = '''
VS-U7: TE kan senere registrere et varsel etter § 34.1 med datoen det ble sendt. Det er
første registrering, ikke en flytting av et varsel som alt er registrert (SK-12, MM-U1).
En preklusjon byggherren har påberopt, blir da uavklart, og TE kan ikke godta svaret før
