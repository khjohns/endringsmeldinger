[[gruppe.vedtak]]
id = "LV-U9"
dato = 2026-10-17
hvem = "oppdragsgiver"
kilde = ["#741"]
sporsmal = '''
Spørsmålet «Før topic», ordrett slik det ble vist i spørsmålsverktøyet:

En sak som opprettes i appen, skal få en topic i Catenda (KT-U3). Topicen lages etter at saken er lagret. Det tar normalt sekunder, men kan ta lengre tid hvis Catenda er nede, og TE sender ofte grunnlagskravet straks. Det som leveres for et brev, fryses når brevet lagres (LV-U1). Appen regner bindingen og akseptfristen fra sendingen og avgjør ikke når brevet er kommet fram (LV-U7). Kan TE sende brev i saken før topicen finnes? Anbefalt: A, fordi TE ikke skal hindres i å varsle i appen fordi Catenda er nede.

Alternativene slik de ble vist:

Ja, leveringen venter (Recommended): Vedtakstekst: «En sak som er opprettet i appen, kan få brev før den har fått sin topic i Catenda. Brevet er sendt når det er lagret i appen, og appen regner bindingen og akseptfristen fra sendingen (LV-U7). Leveringen til Catenda venter til saken har fått topicen, og brevet leveres da til den. Brevet og vedleggene er frosset da brevet ble lagret (LV-U1), og topicen er sakens og endres ikke. Forkastet: at TE må vente med å sende til topicen finnes, og at brevet leveres uten henvisning til topicen.» Presiserer KT-U3 og LV-U7.

Nei, vent på topicen: Vedtakstekst: «En sak som er opprettet i appen, kan ikke få brev før den har fått sin topic i Catenda. Kan topicen ikke lages, sender partene brevet utenfor appen og registrerer det senere (OV-U4). Forkastet: at brevet sendes i appen før topicen finnes.» Strider ikke mot et vedtak, men gjør sendingen avhengig av Catenda.

Ja, lever uten topic: Vedtakstekst: «Et brev som sendes før saken har fått sin topic, leveres til Catenda som dokument uten henvisning til topicen og knyttes ikke til den senere. Forkastet: at leveringen venter på topicen.» Snevrer inn KT-U3 for de første brevene.'''
valgt = "Ja, leveringen venter"
svar = '''
«Ja, leveringen venter (Recommended)»'''
forhold = [
  { art = "presiserer", vedtak = "kt-u3" },
  { art = "presiserer", vedtak = "lv-u7" },
]
folge = '''
Ikke bygget (#741).'''

