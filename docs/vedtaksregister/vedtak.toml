  { art = "presiserer", vedtak = "mm-u13" },
]
folge = '''
Presiseringen av GR-U3: «oppgjort» gjelder kravene som er sendt. Presiseringen av MM-U13:
OV-U3 er der «avklart» brukes etter KA-U11. Ikke bygget. Når endringsordre som egen sak
bygges, må EO-U2 og EO-U5 («et spor TE fortsatt kan sende, hindrer») tas stilling til
etter OV-U3. Når «ingen krav» bygges, må KA-U12 endres, fordi det ikke lenger trengs for
å lukke saken. TFR-05 er forenlig når «resten» leses som at verken vederlag eller frist er
sendt.'''

[[gruppe.vedtak.alternativ]]
navn = "Ja"
tekst = '''
kravene i saken er avgjort når grunnlaget er avklart etter GR-U7, TE har sendt minst ett vederlags- eller fristkrav, og hvert vederlags- og fristkrav TE har sendt, er trukket eller har en virksom enighet. Et spor der TE ikke har sendt et krav, hindrer ikke; et varsel alene er ikke et krav (KA-U2). Det gjelder også vederlagssporet i en sak med hovedkategorien force majeure, der KA-U23 lar sporet hindre til TE sier «ingen krav». Visningen sier «Alle fremsatte krav er avgjort», og de fremsatte kravene er kravene TE har sendt. Den sier ikke at saken er oppgjort eller at TE ikke har flere krav, og taushet er ikke et avkall. Når kravene er avgjort, avvises enhver kommando som kan endre utfallet for grunnlaget og kravene som er sendt: trekk, ny kravversjon og byggherrens revisjon, også av et frafall. En innsigelse etter § 5 tredje ledd fra en av partene, en registrering etter OV-U4 og TEs opplysning om varseldato etter OV-U5 godtas. I et spor der TE ikke har sendt et krav, godtas et varsel, byggherrens forespørsel etter § 33.6.2 og TEs første krav, også når kravene er avgjort. Det første kravet går i samme sak; KA-U3 gjelder kravene som er sendt. Når TE sender det første kravet i sporet, er ikke lenger alle fremsatte krav avgjort før det nye kravet er avgjort. Et varsel alene endrer ikke dette. Sperren for grunnlaget og kravene som allerede var avgjort, står. Kravet får datoen det sendes, ikke datoen for tidligere aktivitet i saken. Ved innsending av det første kravet i et spor viser skjemaet, uten avkrysning: «Du sender nå det første kravet i dette sporet. Appen vurderer ikke om varslings- og kravfrister er overholdt. Tidligere varsler kan være relevante.» Skjemaet viser også varslene i sporet, sendt fra appen eller med dato oppgitt etter OV-U5. Påminnelsen erstatter ikke spørsmålene om varsling og rettidighet. Appen avgjør ikke om et senere krav er avskåret.'''

[[gruppe.vedtak.alternativ]]
