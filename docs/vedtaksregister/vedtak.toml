[[gruppe.vedtak]]
id = "OV-U54"
dato = 2026-10-25
hvem = "oppdragsgiver"
kilde = ["#1282"]
sporsmal = '''
Spørsmål 5b. En ny kravversjon som avslag på byggherrens svar (HF-U8)

**Forholdet til andre vedtak.** Endrer HF-U8 og presiserer HF-U5: bortfallet av et tilbud som fortsatt binder byggherren, følger av avslaget i brevet. At et svar på en tidligere kravversjon ikke kan godtas i løsningen, følger fortsatt av versjonsmodellen (HF-U8). Utvider LV-U4. Snevrer også inn vedtaket 05.10 om at hver oppdatering av et vederlags- eller fristkrav er en ny kravversjon.'''
valgt = "B"
svar = '''
B, sammen med 5-A, med leveransekravet i B: rettingen etter MM-U21 bygges før første ekte sak. Det går lenger enn hovedplanens krav før produksjon, som åpner for en manuell prosess (B-16). Oppdragsgiver ordrett: «Dere virker enige så da er jeg fornøyd med deres anbefaling.»'''
forhold = [{ art = "endrer", vedtak = "hf-u8" }, { art = "presiserer", vedtak = "hf-u5" }, { art = "utvider", vedtak = "lv-u4" }, { art = "snevrer inn", vedtak = "ka-u2" }, { art = "snevrer inn", vedtak = "gr-u22" }, { art = "presiserer", vedtak = "mm-u21" }]
folge = '''
Snevrer også inn vedtaket 05.10 om at hver oppdatering av et vederlags- eller fristkrav er en ny kravversjon.'''

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
I løsningen er en ny kravversjon TEs avslag på byggherrens tilbud i svaret på gjeldende kravversjon i samme spor, også med uendrede verdier, når svaret har et standpunkt som fortsatt binder byggherren etter HF-U5: godkjent grunnlag, beløp eller dager, prinsipalt eller subsidiært. Bestemmelsen gjelder bare når en ny kravversjon ellers er tillatt (KA-U7, OV-U3); et svar som har gitt enighet, åpner ikke for en ny kravversjon. Brevet sier avslaget uttrykkelig: ‹TE avslår byggherrens tilbud i svaret i brev <n> av <dato> og fremsetter det reviderte kravet nedenfor.› Har svaret ikke et slikt standpunkt, for eksempel et helt avslag (HF-U15), et frafall (GR-U20) eller et svar der akseptfristen er ute (HF-U5, HF-U18), sier brevet bare at kravet erstatter TEs tidligere krav. Finnes det et svar på gjeldende kravversjon, sier skjemaet før TE sender hva den nye versjonen gjør med det: avslår den et tilbud som fortsatt binder byggherren, sier skjemaet det, også når TEs aksept er sperret (FO-U5); kan svaret ellers godtas, også etter akseptfristen (HF-U18), sier skjemaet at det ikke kan godtas her når versjonen er sendt (HF-U8). Det gjelder også når TE bare endrer en opplysning. Skjemaet sier også at et uttrykkelig standpunkt om at et varsel kom i tide, og et avkall, står (HF-U4, HF-U8). Avslaget gjelder tilbudet i svaret i samme spor; en ny grunnlagsversjon avslår ikke svarene på vederlag og frist (HF-U21). En innsigelse byggherren har fremsatt, bevares som påberopelse med tidspunktet (VS-U9), uten at løsningen avgjør om den er virksom, og et frafall står (GR-U20). Den nye teksten gjelder bare nye brev (MM-U9). Endrer HF-U8 og presiserer HF-U5: bortfallet av et tilbud som fortsatt binder byggherren, følger av avslaget i brevet. At et svar på en tidligere kravversjon ikke kan godtas i løsningen, følger fortsatt av versjonsmodellen (HF-U8). Utvider LV-U4.'''

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
I løsningen er en ny kravversjon TEs avslag på byggherrens tilbud i svaret på gjeldende kravversjon i samme spor, også med uendrede verdier, når svaret har et standpunkt som fortsatt binder byggherren etter HF-U5: godkjent grunnlag, beløp eller dager, prinsipalt eller subsidiært. Bestemmelsen gjelder bare når en ny kravversjon ellers er tillatt (KA-U7, OV-U3); et svar som har gitt enighet, åpner ikke for en ny kravversjon. Brevet sier avslaget uttrykkelig: ‹TE avslår byggherrens tilbud i svaret i brev <n> av <dato> og fremsetter det reviderte kravet nedenfor.› Har svaret ikke et slikt standpunkt, for eksempel et helt avslag (HF-U15), et frafall (GR-U20) eller et svar der akseptfristen er ute (HF-U5, HF-U18), sier brevet bare at kravet erstatter TEs tidligere krav. Finnes det et svar på gjeldende kravversjon, sier skjemaet før TE sender hva den nye versjonen gjør med det: avslår den et tilbud som fortsatt binder byggherren, sier skjemaet det, også når TEs aksept er sperret (FO-U5); kan svaret ellers godtas, også etter akseptfristen (HF-U18), sier skjemaet at det ikke kan godtas her når versjonen er sendt (HF-U8). Det gjelder også når TE bare endrer en opplysning. Skjemaet sier også at et uttrykkelig standpunkt om at et varsel kom i tide, og et avkall, står (HF-U4, HF-U8). Avslaget gjelder tilbudet i svaret i samme spor; en ny grunnlagsversjon avslår ikke svarene på vederlag og frist (HF-U21). En innsigelse byggherren har fremsatt, bevares som påberopelse med tidspunktet (VS-U9), uten at løsningen avgjør om den er virksom, og et frafall står (GR-U20). Den nye teksten gjelder bare nye brev (MM-U9). Endrer HF-U8 og presiserer HF-U5: bortfallet av et tilbud som fortsatt binder byggherren, følger av avslaget i brevet. At et svar på en tidligere kravversjon ikke kan godtas i løsningen, følger fortsatt av versjonsmodellen (HF-U8). Utvider LV-U4. En endring som bare retter en faktisk opplysning TE har oppgitt i kravet, som en dato, et nummer eller en henvisning, uten å endre det TE krever, er en korrigering. Korrigeringen er et eget utsagn etter MM-U21, ikke en ny kravversjon, og lar svaret stå. En ny kravversjon som bare retter en slik opplysning, avvises, og TE sender korrigeringen i stedet. Rettingen etter MM-U21 bygges før første ekte sak, og det som står åpent om den under B-16, avgjøres da. Snevrer i tillegg inn vedtaket 05.10 om at hver oppdatering av et vederlags- eller fristkrav er en ny kravversjon, KA-U2 og GR-U22, og presiserer MM-U21.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "C"
tekst = '''
HF-U8 står. Brevet sier som i dag at kravet erstatter TEs tidligere krav.'''
forkastet = true

[[gruppe.vedtak]]
id = "OV-U55"
dato = 2026-10-25
hvem = "oppdragsgiver"
kilde = ["#1282"]
sporsmal = '''
Spørsmål 5b. En ny kravversjon som avslag på byggherrens svar (HF-U8)

**Forholdet til andre vedtak.** Endrer svaret 25.10 på spørsmål 5b (5b-B). Utvider GR-U22 til endringsordren. Snevrer inn MM-U21 for opplysninger i fritekst. Endrer OV-U7: TEs utdyping og byggherrens senere begrunnelse etter KA-U34 bygges i første versjon; datokontrollene for registrert begrunnelse (KA-U36–KA-U39) står utsatt. Utvider OV-U3 og LV-U4. Følger mønsteret i KA-U34. Presiserer GR-U16. Snevrer inn MM-U21, fordi rettingen alltid krever byggherrens aksept. Snevrer inn EO-U5 mens forslaget står åpent. Utvider OV-U3 og LV-U4.'''
valgt = "Revurderingen av 5b"
svar = '''
«Enig med dere». Revurderingen av 5b, med låsen, utdypingen, byggherrens senere begrunnelse etter KA-U34 og rettingen av betegnelsen på endringsordren: ja. Den endrer 5b-B.'''
forhold = [{ art = "endrer", vedtak = "ov-u54" }, { art = "utvider", vedtak = "gr-u22" }, { art = "snevrer inn", vedtak = "mm-u21" }, { art = "endrer", vedtak = "ov-u7" }, { art = "utvider", vedtak = "ov-u3" }, { art = "utvider", vedtak = "lv-u4" }, { art = "presiserer", vedtak = "gr-u16" }, { art = "snevrer inn", vedtak = "eo-u5" }]
folge = '''
Følger mønsteret i KA-U34. Bygges i #1308. Låsen og betegnelsen bygges i #569.'''

[[gruppe.vedtak.alternativ]]
navn = "Revurderingen av 5b"
tekst = '''
Når TE har sendt grunnlaget, står hovedkategorien, underkategorien og, i underkategorien endringsordre, hvilken endringsordre kravet bygger på. En ny grunnlagsversjon kan ikke endre dem. Datoopplysningen i grunnlagskravet om når pålegget ble mottatt eller TE ble klar over forholdet, endres bare etter egne regler. Vil TE påberope en annen hjemmel eller en annen endringsordre, går det i en ny sak etter GR-U22. En enighet i saken står (KA-U7). Om enigheten og bindingen følger kravene til en ny sak, avgjøres særskilt.
TE kan sende en utdypende begrunnelse med henvisning til kravet. TE velger i skjemaet mellom en utdyping og en ny kravversjon, og skjemaet sier følgen av hvert valg. Utdypingen endrer ikke kravets strukturerte opplysninger og behandles ikke som en ny kravversjon. Den endrer ikke i seg selv løsningens utledning av tidligere svar eller enigheter, og den godtas også i et spor med enighet og når kravene er avgjort. Sporet venter ikke på et nytt svar i løsningen. Byggherren kan ta utdypingen med i et senere svar eller i en revisjon som ellers er tillatt (HF-U5). Brevet sier: ‹TE utdyper sitt krav om <grunnlaget / justering av vederlaget / fristforlengelse> i brev <n> av <dato>. Utsagnet endrer ikke hjemmelen eller hvilken endringsordre saken gjelder:›, og TEs tekst følger. Tidligere utsagn og dokumentkoblinger står uendret. Løsningen tolker ikke teksten for å avgjøre om den inneholder et endret krav eller andre rettslige utsagn. Byggherren kan på samme måte sende en senere begrunnelse for sitt svar etter KA-U34. Ingen av dem endrer strukturerte standpunkter, åpner en enighet eller gir adgang til å svekke tidligere innrømmelser.
En ny grunnlagsversjon med samme hjemmel er fortsatt mulig der GR-U22 og sperrene etter enighet (KA-U7, OV-U3) tillater den, og den avslår byggherrens tilbud i grunnlagssporet etter avslagsregelen. Varseldatoen etter OV-U11 og rettinger fra byggherren følger MM-U21.
Endrer svaret 25.10 på spørsmål 5b (5b-B). Utvider GR-U22 til endringsordren. Snevrer inn MM-U21 for opplysninger i fritekst. Endrer OV-U7: TEs utdyping og byggherrens senere begrunnelse etter KA-U34 bygges i første versjon; datokontrollene for registrert begrunnelse (KA-U36–KA-U39) står utsatt. Utvider OV-U3 og LV-U4. Følger mønsteret i KA-U34.
TE kan foreslå å rette betegnelsen i grunnlagskravet, med henvisning til brevet med den. Brevet sier: ‹TE foreslår at betegnelsen på endringsordren i brev <n> av <dato> rettes fra <gammel> til <ny>. Betegnelsene gjelder samme endringsordre. Forslaget gjelder til <dato> og faller bort uten aksept.› TE setter en akseptfrist. Før sending er forslaget et utkast; det sendte forslaget binder TE som et tilbud (HF-U5, HF-U6, LV-U7) og kan ikke trekkes i løsningen. Bindingen varer til byggherren godtar eller avslår det, eller fristen er ute. Det finnes høyst ett åpent forslag om betegnelsen i saken; det hindrer ikke et forslag om særskilte vilkår, og omvendt. Lukkes saken mens forslaget står åpent, faller det bort. Forslaget og aksepten går gjennom godkjenningen etter fullmakten, som et svar gjør. Taushet har ingen virkning i løsningen. Godtar byggherren, bekrefter begge parter at betegnelsene gjelder samme dokument, og feltet får den nye betegnelsen. Løsningen registrerer partenes bekreftelse og kontrollerer ikke at betegnelsene gjelder samme dokument. Tidligere brev og betegnelser beholdes og vises. Mens forslaget står åpent, kan saken ikke inngå i en endringsordre; sperren opphører når forslaget er godtatt, avslått eller har falt bort. Forslaget godtas også i et spor med enighet og når kravene er avgjort, og det endrer ikke utfallet. Presiserer GR-U16. Snevrer inn MM-U21, fordi rettingen alltid krever byggherrens aksept. Snevrer inn EO-U5 mens forslaget står åpent. Utvider OV-U3 og LV-U4.'''

[[gruppe.vedtak]]
id = "OV-U56"
dato = 2026-10-25
hvem = "oppdragsgiver"
kilde = ["#1282"]
sporsmal = '''
Spørsmål 5b. En ny kravversjon som avslag på byggherrens svar (HF-U8)

Leveransekravet, alternativene

**Forholdet til andre vedtak.** Endrer leveransekravet i svaret 25.10 på spørsmål 5b.'''
valgt = "L2"
svar = '''
«Enig med dere». Leveransekravet: L2. L1 er forkastet. Rettingen av varseldatoen etter OV-U11 bygges før første ekte sak: ja. Den står i L2.'''
forhold = [{ art = "endrer", vedtak = "ov-u54" }]
folge = '''
Bygges i #276. Rettingen av varseldatoen etter OV-U11 bygges i #1309.'''

[[gruppe.vedtak.alternativ]]
navn = "L1"
tekst = '''
Den fullstendige rettingsflyten etter MM-U21 bygges før første ekte sak.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "L2"
tekst = '''
Før første ekte sak bygges TEs utdyping av et krav, retting av betegnelsen på endringsordren, TEs retting av datoen i grunnlagskravet for når pålegget ble mottatt eller TE ble klar over forholdet, og, hvis vedtatt, TEs retting av datoen TE ble klar over at utgiftene etter § 34.1.3 ville påløpe, og TEs retting av datoen for et varsel sendt utenfor løsningen etter OV-U11, som beholder sin egen modell. For andre rettinger skal det før første ekte sak finnes en avklart og gjennomførbar korrigeringsprosess; den kan være manuell. Det som står åpent om rettingen under B-16 i hovedplanen (aktørrettigheter, godkjenning og innsyn for motparten), avgjøres for den manuelle prosessen før første ekte sak. Den fullstendige rettingsflyten etter MM-U21 kan bygges senere. Endrer leveransekravet i svaret 25.10 på spørsmål 5b.'''
anbefalt = true

[[gruppe.vedtak]]
id = "OV-U57"
