[[gruppe.vedtak]]
id = "GFK-U3"
dato = 2026-10-18
hvem = "oppdragsgiver"
kilde = ["runde 7 (#764)", "#818"]
sporsmal = '''
Hvilken fullmakt kreves for fristdager når dagmulktssatsen mangler (B-06)?

Fullmakten for et svar regnes av beløpet, og fristdager regnes om til beløp med dagmulktssatsen (GFK-06). B-06 i 3.4 spør hva som gjelder når satsen ikke er registrert; i dag regnes dagene da som 0 kr (GFK-01).

A. Hele kjeden (anbefalt): «Mangler dagmulktssatsen, kan fristdagene ikke verdsettes, og fristsporet behandles som et krav som ikke er tallfestet: det krever hele kjeden.»
B. Svaret avvises: «Mangler dagmulktssatsen, kan et svar som godkjenner fristdager, ikke sendes fra appen før satsen er registrert.»
C. Manuell verdsetting: «Mangler dagmulktssatsen, oppgir den som utarbeider svaret en verdi per dag, og fullmakten regnes av den. Verdien står i godkjenningen.»

Anbefaling: A.

Belegg, ordrett fra vedtakene:
