forkastet = true

[[gruppe.vedtak]]
id = "LV-U10"
dato = 2026-10-17
hvem = "oppdragsgiver"
kilde = ["#497"]
sporsmal = '''
Spørsmålet «Brevtekst», ordrett slik det ble vist i spørsmålsverktøyet:

Når byggherren gjør gjeldende at TEs varsel kom for sent, sier brevet i dag hvilket brev varselet står i, med datoen for det brevet. Har TE oppgitt at varselet ble sendt utenfor appen tidligere, står ikke den datoen i brevet. Er ingen varsel registrert, gjelder påberopelsen TEs første krav, som skjemaet viser som det første varselet appen kjenner, men brevet sier det ikke. Det som ikke står i teksten, er ikke meddelt (LV-U3). Hva skal brevet si? Anbefalt: A, fordi påberopelsen skal vise uttrykkelig til varselet (HF-U1), og fordi det første varselet appen kjenner, er appens kunnskap og ikke byggherrens utsagn.

Alternativene slik de ble vist:

Gjengi TEs dato (Recommended): Vedtakstekst: «Når byggherren tar stilling til om et varsel kom i tide, viser brevet til varselet slik TE har meddelt det: brevet varselet står i, og, når TE har oppgitt at varselet ble sendt utenfor appen, datoen TE oppga, for eksempel «TEs varsel om fristforlengelse etter NS 8407 § 33.4, som TE i brev 4 av 4. oktober 2026 oppgir ble sendt 28. september 2026». Gjelder påberopelsen et krav fordi ingen tidligere varsel er registrert, sier brevet at den gjelder varselet i TEs krav i brev <n> av <dato>. Brevet sier ikke at varselet er det første appen kjenner; det står i skjemaet og visningen. Endret tekst gjelder bare nye brev (MM-U9). Forkastet: at brevet bare nevner brevet, og at brevet sier at varselet er det første byggherren har mottatt.» Utvider ordlyden i LV-U4 punkt 5.

Også «første varsel mottatt»: Vedtakstekst: «Når byggherren tar stilling til om et varsel kom i tide, viser brevet til brevet varselet står i og til datoen TE oppga for et varsel sendt utenfor appen. Gjelder påberopelsen et krav fordi ingen tidligere varsel er registrert, sier brevet at kravet i brev <n> av <dato> er det første varselet byggherren har mottatt i saken. Endret tekst gjelder bare nye brev (MM-U9). Forkastet: at brevet bare viser til kravet.» Utvider ordlyden i LV-U4 punkt 5.

Som i dag: Vedtakstekst: «Brevet viser bare til brevet varselet står i, med datoen for det brevet. Datoen TE oppga og at varselet er det første appen kjenner, står i visningen og ikke i brevet. Forkastet: å gjengi TEs dato i brevet.» Strider ikke mot et vedtak.'''
valgt = "Gjengi TEs dato"
svar = '''
«Gjengi TEs dato (Recommended)»'''
forhold = [{ art = "utvider", vedtak = "lv-u4" }]
folge = '''
Utvidelsen gjelder ordlyden i LV-U4 punkt 5. Ikke bygget (#497).'''

[[gruppe.vedtak.alternativ]]
navn = "Gjengi TEs dato"
tekst = '''
Når byggherren tar stilling til om et varsel kom i tide, viser brevet til varselet slik TE har meddelt det: brevet varselet står i, og, når TE har oppgitt at varselet ble sendt utenfor appen, datoen TE oppga, for eksempel «TEs varsel om fristforlengelse etter NS 8407 § 33.4, som TE i brev 4 av 4. oktober 2026 oppgir ble sendt 28. september 2026». Gjelder påberopelsen et krav fordi ingen tidligere varsel er registrert, sier brevet at den gjelder varselet i TEs krav i brev <n> av <dato>. Brevet sier ikke at varselet er det første appen kjenner; det står i skjemaet og visningen. Endret tekst gjelder bare nye brev (MM-U9). Forkastet: at brevet bare nevner brevet, og at brevet sier at varselet er det første byggherren har mottatt.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Også «første varsel mottatt»"
tekst = '''
Når byggherren tar stilling til om et varsel kom i tide, viser brevet til brevet varselet står i og til datoen TE oppga for et varsel sendt utenfor appen. Gjelder påberopelsen et krav fordi ingen tidligere varsel er registrert, sier brevet at kravet i brev <n> av <dato> er det første varselet byggherren har mottatt i saken. Endret tekst gjelder bare nye brev (MM-U9). Forkastet: at brevet bare viser til kravet.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Som i dag"
tekst = '''
Brevet viser bare til brevet varselet står i, med datoen for det brevet. Datoen TE oppga og at varselet er det første appen kjenner, står i visningen og ikke i brevet. Forkastet: å gjengi TEs dato i brevet.'''
forkastet = true

