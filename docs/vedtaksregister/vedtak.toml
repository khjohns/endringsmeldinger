KA-U36 sier at en registrert begrunnelse med sendt-dato før svaret den begrunner, avvises, og at kontrollen «gjelder bare når svaret har en dato». Vedtaket sier ikke hvilken dato et svar byggherren sendte fra appen, har. Appen vet bare når den registrerte svaret, og brevet viser den datoen («brev <n> av <dato>»). Hvilken lesning gjelder? Valget blir et nytt vedtak som presiserer KA-U36.

