navn = "B"
tekst = '''
At et varsel registrert etter svaret gjør preklusjonen eller begrensningen uavklart og sperrer TEs aksept.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "C"
tekst = '''
Å utsette MM-U8 og VS-U7 i stedet for å endre dem.'''
forkastet = true

