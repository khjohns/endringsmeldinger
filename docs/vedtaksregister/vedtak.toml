forkastet = true

[[gruppe.vedtak]]
id = "OV-U22"
dato = 2026-10-22
hvem = "oppdragsgiver"
kilde = ["#1047"]
sporsmal = '''
Spørsmål 1, «Begrensning per særskilt krav»: Totalentreprenøren kan kreve to særskilte justeringer etter § 34.1.3: én for kapitalytelser, rigging, drift og nedrigging (første ledd) og én for nedsatt produktivitet og forstyrrelser på annet arbeid (annet ledd). Varselet er særskilt for hver av dem, og datoen settes én gang for hver (OV-U8, som presiserer SK-12: «Datoen for hvert av de to varslene settes én gang.»). VS-U5 sier hva byggherren gjør når hen påberoper at et særskilt varsel kom for sent: «VS-U5: påberoper byggherren at TEs særskilte varsel etter § 34.1.3 kom for sent, oppgir byggherren prinsipalt det beløpet hen godtar etter begrensningen hen påberoper, som kan være null, og subsidiært det beløpet hen godtar hvis innsigelsen ikke fører fram.» Vedtaket sier ikke om beløpene oppgis for hvert særskilte krav eller samlet. VS-U7 sier: «Etterregistreringen gjør preklusjonen uavklart bare når varselet gjelder det preklusjonen gjaldt.» Hvordan oppgir byggherren beløpene? Anbefalt: A, fordi varslene og tapet av retten gjelder hvert krav for seg, og fordi det da er mulig å se hvilken begrensning som blir uavklart.'''
valgt = "For hvert særskilt krav"
svar = '''
«For hvert særskilt krav (Recommended)»'''
forhold = [{ art = "presiserer", vedtak = "vs-u5" }, { art = "presiserer", vedtak = "vs-u24" }]
folge = '''
Svaret er gitt med spørsmålsverktøyet 22.10. Spørsmålet og alternativene står ordrett på #1047 (kommentaren 6348199156). Ikke bygget (#1047). Merknad 23.10: «blir bare begrensningen for det kravet uavklart (VS-U7)» leses etter [OV-U5](#ov-u5) (oppdragsgiver 23.10, «OV-U5 gjelder», #1047, kommentaren 6365944474). Svaret står med virkningen det hadde, og TE kan godta det. Visningen viser at standpunktet for det ene særskilte kravet gjaldt et annet varsel.'''

[[gruppe.vedtak.alternativ]]
navn = "For hvert særskilt krav"
tekst = '''
Påberoper byggherren at et særskilt varsel etter § 34.1.3 kom for sent, oppgir byggherren det prinsipale og det subsidiære beløpet etter VS-U5 for det særskilte kravet varselet gjelder: kravet om økte utgifter til kapitalytelser, rigging, drift og nedrigging, eller kravet om økte utgifter på grunn av nedsatt produktivitet eller forstyrrelser på annet arbeid. Påberopelsen gjelder det ene kravet. Oppgir totalentreprenøren senere et varsel om det kravet, blir bare begrensningen for det kravet uavklart (VS-U7). Presiserer VS-U5. Presiserer VS-U24 for § 34.1.3: ett standpunkt for hvert særskilte krav.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Samlet for begge"
tekst = '''
Påberoper byggherren at ett eller begge de særskilte varslene etter § 34.1.3 kom for sent, oppgir byggherren ett samlet prinsipalt og ett samlet subsidiært beløp etter VS-U5 for de særskilte kravene. Oppgir totalentreprenøren senere et varsel om ett av dem, blir hele den samlede begrensningen uavklart. Presiserer VS-U5 og VS-U7.'''
forkastet = true

[[gruppe.vedtak.sitat]]
kilde = "hovedplanen"
tekst = "Datoen for hvert av de to varslene settes én gang."

[[gruppe.vedtak.sitat]]
kilde = "hovedplanen"
tekst = "påberoper byggherren at TEs særskilte varsel etter § 34.1.3 kom for sent, oppgir byggherren prinsipalt det beløpet hen godtar etter begrensningen hen påberoper, som kan være null, og subsidiært det beløpet hen godtar hvis innsigelsen ikke fører fram."

[[gruppe.vedtak.sitat]]
kilde = "hovedplanen"
tekst = "Etterregistreringen gjør preklusjonen uavklart bare når varselet gjelder det preklusjonen gjaldt."

[[gruppe.vedtak]]
id = "OV-U23"
dato = 2026-10-22
hvem = "oppdragsgiver"
kilde = ["#1047"]
sporsmal = '''
Spørsmål 2, «Særskilt krav uten annen justering»: Etter § 34.1.3 første og annet ledd kan totalentreprenøren kreve særskilt justering av vederlaget for økte utgifter som følge av forhold etter § 34.1.1 og § 34.1.2. Bestemmelsen krever ikke at totalentreprenøren samtidig krever en annen justering av vederlaget. Formatet i kjernen krever i dag et beløp over null for justeringen ellers, og ingen vedtak sier noe om dette. Et eksempel er et forhold byggherren har risikoen for, som ikke gir annet tilleggsarbeid, men som forlenger riggtiden. Kan totalentreprenøren kreve bare et særskilt krav? Anbefalt: A, fordi bestemmelsen ikke binder det særskilte kravet til at det kreves noe annet.'''
valgt = "Ja, alene"
svar = '''
«Ja, alene (Recommended)»'''
folge = '''
Svaret er gitt med spørsmålsverktøyet 22.10. Spørsmålet og alternativene står ordrett på #1047 (kommentaren 6348199156). Ikke bygget (#1047).'''

[[gruppe.vedtak.alternativ]]
navn = "Ja, alene"
tekst = '''
Totalentreprenøren kan sende et vederlagskrav med bare ett eller begge de særskilte kravene etter § 34.1.3, uten et beløp for justeringen ellers. Byggherren tar stilling til de særskilte kravene som ellers. Appen avgjør ikke om utgiftene er en følge av forholdet saken gjelder.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Nei, bare sammen"
tekst = '''
Et særskilt krav etter § 34.1.3 kan bare sendes i et vederlagskrav som også har et beløp over null for justeringen ellers. Har totalentreprenøren bare et særskilt krav, sendes det utenfor appen.'''
forkastet = true

[[gruppe.vedtak]]
id = "OV-U24"
dato = 2026-10-22
hvem = "oppdragsgiver"
kilde = ["#1047"]
sporsmal = '''
Spørsmål 3, «Kravet som første særskilte varsel»: OV-U5 forutsetter at vederlagskravet kan være det første varselet appen kjenner etter § 34.1.2 og § 34.1.3, når ikke noe varsel er registrert. Byggherren tar da stilling til rettidigheten med kravet som varsel. Varselet etter § 34.1.3 skal være særskilt for hvert av de to kravene, og etter OV-U8 kan det sendes også etter vederlagskravet. Det er derfor ikke avgjort hvilken kravversjon som er det første kjente varselet om et særskilt krav, når den første versjonen av vederlagskravet ikke hadde med det særskilte kravet. Anbefalt: A, fordi et krav som ikke nevner et særskilt krav, ikke varsler om det.'''
valgt = "Første versjon med kravet"
svar = '''
«Første versjon med kravet (Recommended)»'''
forhold = [{ art = "presiserer", vedtak = "ov-u5" }]
folge = '''
Svaret er gitt med spørsmålsverktøyet 22.10. Spørsmålet og alternativene står ordrett på #1047 (kommentaren 6348199156). Ikke bygget (#1047).'''

[[gruppe.vedtak.alternativ]]
navn = "Første versjon med kravet"
tekst = '''
Er ikke noe særskilt varsel etter § 34.1.3 registrert for et særskilt krav, er det første varselet appen kjenner om det kravet den første versjonen av vederlagskravet som krever det. En tidligere versjon uten det særskilte kravet regnes ikke som varsel om det. Det utledede varselet låses ikke (MM-U1: «SK-12 låser et varsel som er registrert, ikke et varsel som bare er utledet.»), så totalentreprenøren kan fortsatt registrere eller sende et særskilt varsel etter OV-U8 og VS-U7. Presiserer OV-U5.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Første vederlagskrav"
tekst = '''
Er ikke noe særskilt varsel etter § 34.1.3 registrert, er det første varselet appen kjenner den første versjonen av vederlagskravet, også om et særskilt krav som først kom med i en senere versjon. Appen avgjør ikke om den første versjonen varslet om det særskilte kravet. Presiserer OV-U5.'''
forkastet = true

[[gruppe.vedtak.sitat]]
kilde = "hovedplanen"
tekst = "SK-12 låser et varsel som er registrert, ikke et varsel som bare er utledet."

[[gruppe.vedtak]]
id = "OV-U25"
dato = 2026-10-22
hvem = "oppdragsgiver"
kilde = ["#1047"]
sporsmal = '''
Spørsmål R2-1, «Kontraktsgrunnlaget for § 34.1.3»: Kontraktsgrunnlaget (Del II pkt. B.2.16) erstatter første setning i § 34.1.3 tredje ledd: bare krav etter annet ledd (nedsatt produktivitet og forstyrrelser) krever særskilt varsel uten ugrunnet opphold, og bare der tapes retten ved for sent varsel. Krav om rigg og drift etter første ledd har da ingen særskilt varslingsplikt og ingen preklusjon etter § 34.1.3. OV-U8 og SK-12 forutsetter to særskilte varsler. Hvilken tekst følger appen? Anbefalt: A, fordi det er kontraktsgrunnlaget oppdragsgivers kontrakter bygger på.

R2-1 ble stilt etter svaret på spørsmål 4 i første runde, som står ordrett slik:

Spørsmål 4, «Teknisk anbefaling»: Godtar du den tekniske anbefalingen for #1047 samlet? (1) De to særskilte kravene står som egne poster med eget beløp i samme vederlagskrav og revideres med det, uten egne spor. (2) Lagrede navn: hjemmelen «34.1.3» med et felt «post» (rigg_drift eller produktivitet) på varselet og på byggherrens standpunkt om rettidigheten, og beløpene i «saerskilt.rigg_drift.beloep» og «saerskilt.produktivitet.beloep». (3) Justerte enhetspriser etter § 34.3.3, tilbakeholdelse etter § 30.2 og forsering er ikke med i #1047 og får egne issues.

Alternativene til spørsmål 4:

«Ja, samlet (Recommended)»: «Byggeøktene bygger etter punkt 1–3.»
«Nei, jeg retter»: «Skriv hvilket punkt og hva i «Other».»'''
valgt = "Del II som standard"
svar = '''
Spørsmål 4 (den tekniske anbefalingen), svar i «Other»: «Enig i anbefaling her og tidligere spørsmål, kontrakt lest isolert. Men dette må leses i tråd med kontraktsgrunnlaget i repo kontrakt». R2-1: «Del II som standard (Recommended)».'''
forhold = [
  { art = "endrer", vedtak = "ov-u8" },
  { art = "snevrer inn", vedtak = "ov-u22" },
  { art = "snevrer inn", vedtak = "ov-u23" },
  { art = "snevrer inn", vedtak = "ov-u24" },
]
folge = '''
Svaret er gitt med spørsmålsverktøyet 22.10. Spørsmålet og alternativene står ordrett på #1047 (kommentaren 6348199156). Spørsmål 1–3 er OV-U22, OV-U23 og OV-U24. Endrer også SK-12. Ikke bygget (#1047).'''

[[gruppe.vedtak.alternativ]]
navn = "Del II som standard"
tekst = '''
Appen følger § 34.1.3 slik kontraktsgrunnlaget (Del II pkt. B.2.16) endrer den: særskilt varsel og tap av retten ved for sent varsel gjelder bare kravet om økte utgifter på grunn av nedsatt produktivitet og forstyrrelser på annet arbeid. Kravet om økte utgifter til kapitalytelser, rigging, drift og nedrigging har ingen særskilt varslingsplikt etter § 34.1.3, og byggherren kan ikke påberope at det er varslet for sent. Endrer OV-U8 og SK-12 for første ledd; svarene på spørsmål 1–3 gjelder da bare annet ledd.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "NS 8407 uendret"
tekst = '''
Appen følger § 34.1.3 slik standarden lyder, med særskilt varsel for begge kravene. Avvik i kontraktsgrunnlaget må partene håndtere utenfor appen.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Per kontrakt"
tekst = '''
Appen lar hver kontrakt angi om Del II pkt. B.2.16 gjelder, og reglene følger innstillingen. Krever en kontraktsinnstilling og eget issue før #1047 kan bygges ferdig.'''
forkastet = true

[[gruppe.vedtak]]
id = "OV-U26"
dato = 2026-10-23
