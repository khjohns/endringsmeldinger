[[gruppe.vedtak]]
anker = "lv-u2"
vedtak = '''
LV-U2: i et brev appen sender, godkjenner avsenderen brevteksten appen lager av brevets
utsagn, og det er den teksten som fryses som brevet. Teksten avsenderen godkjenner, og
teksten som fryses, er den samme. Et dokument som leveres, er en tro gjengivelse av den
frosne teksten. Det kan lages etter at brevet er lagret, men det bevares fra første gang
det lages, og hvert leveringsforsøk sender det samme dokumentet. Forkastet: at
avsenderen godkjenner det ferdige dokumentet, som da må lages før brevet lagres'''
vedtatt = "11.10, oppdragsgiver etter sparring (#391)"
forhold = [{ art = "presiserer", vedtak = "lv-u1" }]
folge = '''
Presiserer [LV-U1](#lv-u1) og invariant 6: det som fryses i transaksjonen, er
brevteksten og vedleggene, og dokumentet lages bare av det som er frosset ved commit. I
tråd med [B-03, dokumentet](#b-03-dokument) og [B-17](#b-17) (Python kan gjengi og
levere frosne brev). Presisert 11.10 av [LV-U3](#lv-u3): hvert utsagn med virkning står
i brevteksten. Presisert 11.10 av [LV-U4](#lv-u4): ordlyden. Et registrert brev står som
det ble sendt ([MM-U17](#mm-u17)). Brevteksten bygges i #369; at dokumentet (PDF)
gjengir teksten tro, prøves med en test der. At dokumentet lages etter commit og bevares
første gang, gjelder #371. Hvor lenge det bevares, er B-05. Ikke bygget'''

[[gruppe.vedtak]]
anker = "lv-u3"
vedtak = '''
LV-U3: brevteksten i et brev appen sender, lages av alle partens utsagn i brevet, slik
at hvert utsagn som får virkning, står i teksten mottakeren leser, for eksempel et krav,
et standpunkt eller «ingen krav». Det som ikke står i teksten, regnes ikke som meddelt.
Forkastet: at strukturerte opplysninger som ikke står i teksten, er en del av det som er
meddelt'''
vedtatt = "11.10, oppdragsgiver etter sparring (#391)"
forhold = [{ art = "presiserer", vedtak = "lv-u2" }]
folge = '''
Presiserer [LV-U2](#lv-u2). I tråd med [MM-U9](#mm-u9) og [KA-U25](#ka-u25). Appens
vurdering i beslutningsgrunnlaget er ikke partens meddelelse ([HF-U2](#hf-u2),
[MM-U12](#mm-u12)) og omfattes ikke. Et registrert brev står som det ble sendt
([MM-U17](#mm-u17)); det appen ikke kan uttrykke, følger [KA-U16](#ka-u16). Presisert
11.10 av [LV-U4](#lv-u4): ordlyden. Bygges i #369 med en test som viser at hvert utsagn
med virkning står i teksten. Ikke bygget'''

[[gruppe.vedtak]]
anker = "lv-u4"
vedtak = '''
LV-U4: brevtekstene appen lager av utsagnene, har denne ordlyden. Endret tekst gjelder
bare nye brev (MM-U9). (1) Grunnlagskravet gjengir kontraktens betegnelser for
hovedkategorien og underkategorien. Endring (§ 33.1 a), unntatt underkategorien
endringsordre: «TE krever endringsordre for forholdet «<tittel>» i sak <saksnummer>
(«<sakstittel>»). Grunnlaget er <underkategori> (NS 8407 § <hjemmel>).» Der § 32.2
gjelder, i tillegg: «TE varsler etter NS 8407 § 32.2 at TE påberoper seg at pålegget
innebærer en endring.» Underkategorien endringsordre (§ 31.3): «TE gjør gjeldende krav
som følge av en endringsordre fra byggherren for forholdet «<tittel>» i sak <saksnummer>
(«<sakstittel>») (NS 8407 § 31.3).» Uten tittel: «… for forholdet i sak <saksnummer>
(«<sakstittel>») …». Tittelen er TEs navn på forholdet, ikke endringsordrens. Etter
teksten kommer: «TE viser til endringsordren «<dato eller nummer>».» Vederlag og frist
kreves i egne krav (§ 34.1.1, § 33.1 a). Svikt og andre forhold (§ 33.1 b–c): «TE gjør
gjeldende krav som følge av <underkategori> (NS 8407 § <hjemmel>, jf. § 33.1 <b/c> og §
34.1.2) for forholdet «<tittel>» i sak <saksnummer> («<sakstittel>»).» Ny versjon:
«Kravet erstatter TEs krav i brev <n> av <dato>.» (2) Vederlagskravet: «TE krever
justering av vederlaget med <beløp> kr eks. mva. Kravet er et tilbud etter NS 8407 §
34.2.1.» Beløpet er uten merverdiavgift, og teksten sier «eks. mva.». (3) Fristkravet:
«TE krever fristforlengelse på <n> dager (NS 8407 § 33.6.1).» Varselet: «TE opplyser at
varsel om fristforlengelse etter NS 8407 § 33.4 ble sendt <dato>.» (4) Svarets
innledning nevner sporet: «Byggherrens svar på grunnlaget [på kravet om justering av
vederlaget / på kravet om fristforlengelse] i TEs krav i brev <n> av <dato>:». En
revisjon: «Svaret erstatter byggherrens svar i brev <n> av <dato>.» Standpunktene står
én setning hver, med «Prinsipalt:», «Subsidiært:» og «Videre subsidiært:» der brevet
ordner dem. (5) Standpunktene. Verbene er ikke navnet på et utsagn: «godtar» og «aksept»
er TEs aksept (HF-U2, KA-U1), og «akseptert» et tilbud er § 34.2.2. Rettidighet, for
sent: «Byggherren gjør gjeldende at TEs varsel etter NS 8407 § 32.2 [varselet om
fristforlengelse etter § 33.4] kom for sent.» Gjentar svaret en innsigelse: «, jf.
innsigelsen i brev <n> av <dato>». Rettidighet, i tide: «Byggherren gjør ikke gjeldende
at varselet kom for sent.» Etter en innsigelse: «Byggherren gir opp innsigelsen etter NS
8407 § 5 i brev <n> av <dato> og gjør ikke gjeldende at varselet kom for sent.» (VS-U11:
«gi opp … uttrykkelig».) Grunnlaget: «Byggherren godkjenner grunnlaget.» Avslag der §
32.2 gjelder: «Byggherren avslår kravet på endringsordre (NS 8407 § 32.3 første ledd
b).» Ellers: «Byggherren avslår grunnlaget.» Frafall: «Byggherren frafaller pålegget mot
å utstede endringsordre for allerede utført arbeid (NS 8407 § 32.3 første ledd c).»
Brevet bruker ordlyden i § 32.3 c og lover endringsordren for allerede utført arbeid,
også når den etter GR-U3 og OV-U2 utstedes utenfor appen i første versjon. Hindring:
«Byggherren legger til grunn [legger ikke til grunn] at fremdriften hindres som følge av
forholdet (NS 8407 § 33.1).» I force majeure er hjemmelen § 33.3, med samme ordlyd. Om
forholdet var utenfor TEs kontroll, hører til grunnlagssvaret (VS-U13). Beløp og dager:
«Byggherren godkjenner <beløp/dager>.» / «Byggherren godkjenner <x> av de krevde <y>.» /
«Byggherren avslår kravet.» (6) Aksepten: «TE godtar byggherrens svar på <grunnlaget /
kravet om justering av vederlaget / kravet om fristforlengelse> i brev <n> av <dato>.»
Når svaret er subsidiært fordi grunnlaget er avslått eller prekludert, legger brevet
til: «TE er enig i beløpet [antallet dager], men ikke i byggherrens standpunkt til
grunnlaget.» Ellers står bare aksepten. (7) Innsigelsen: «<Part> gjør gjeldende at
<motpartens varsel / krav / svar> i brev <n> av <dato> kom for sent (NS 8407 § 5 tredje
ledd).» (8) Protesten (begge parter, VS-U14): «<Part> protesterer mot innsigelsen i brev
<n> av <dato>» / «… mot påberopelsen av for sen varsling i svaret i brev <n> av <dato>»
/ «… mot innsigelsene i brev <n> av <dato>». (9) Passiviteten (VS-U12, før og etter et
svar): «TE gjør gjeldende at byggherren ikke svarte uten ugrunnet opphold på TEs varsel
etter NS 8407 § 32.2 i brev <n> av <dato>, og at pålegget derfor anses å innebære en
endring (NS 8407 § 32.3 annet ledd).» (10) Bestridelsen: «<Part> bestrider opplysningen
i brev <n> av <dato> om at <opplysningen>», der opplysningen er: «brevet ble sendt
[mottatt] <dato>», eller «varselet etter § 33.4 i brevet ble sendt [mottatt] <dato>» når
den gjelder et varsel; «brevet var en endringsordre etter NS 8407 § 31.3», eller «brevet
ikke var en endringsordre etter NS 8407 § 31.3», etter det den som registrerte, oppga;
«brevet har et forbehold eller annet innhold som ikke er uttrykt i appen». (11)
Merkingen: «<Part> opplyser at brev <n> av <dato> har et forbehold eller annet innhold
som ikke er uttrykt i appen, og som gjelder <grunnlaget, vederlaget, fristen>.» (12)
Avklaringen (KA-U20, KA-U30): «<Part> bekrefter at standpunktene i brev <n> av <dato> om
<grunnlaget, vederlaget, fristen> gjelder uten forbehold fra og med dette brevet.» (13)
Kravversjonen i trekket (KA-U22: «<kravversjonen, entydig identifisert>»): «TE trekker
kravet om justering av vederlaget [om fristforlengelse] i sak <saksnummer>
(«<sakstittel>»), fremsatt i brev <n> av <dato> (<beløp/dager>). Trekket er avkall på
dette kravet, også det byggherren har godkjent.» Brevet <n> er det med den gjeldende
kravversjonen. «<tittel>» i KA-U22 leses som sakstittelen; det er en tolkning av
vedtaket. Forkastet for setningen om endringsordren i punkt 1: «Nei» – «Feltet lagres og
vises i appen, men står ikke i brevteksten.» Forkastet for punkt 6: «Nei, bare aksepten»
– «Brevet sier bare at TE godtar svaret. At enigheten bare gjelder beløpet eller dagene,
følger av GR-U7 og vises i appen, men står ikke i brevet.»'''
vedtatt = "11.10, oppdragsgiver (#369, #410)"
forhold = [
  { art = "presiserer", vedtak = "lv-u2" },
  { art = "presiserer", vedtak = "lv-u3" },
  { art = "presiserer", vedtak = "ka-u22" },
]
folge = '''
Spørsmålene står i versjon 4 av spørsmålene på #410 (V5), svarene på #369 (5.1–5.13).
Setningen om endringsordren i punkt 1 er oppdragsgivers svar 11.10 i oppfølgingen på
#369 (spørsmål 3), etter [LV-U3](#lv-u3) og [HF-U1](#hf-u1). Andre brevtekster står i
[GR-U14](#gr-u14), [VS-U15](#vs-u15), [KA-U22](#ka-u22) og [KA-U25](#ka-u25), og teksten
når grunnlaget er avslått eller prekludert, er arbeidsvalget etter B-13 (05.10). At
beløpet i vederlagskravet er uten merverdiavgift, er en ny regel; om «eks. mva.» også
står ved beløp i svar og trekk, er et arbeidsvalg, fordi byggherrens beløp sammenliknes
med kravets ([KA-U9](#ka-u9), B-13). Presiserer [LV-U2](#lv-u2) og [LV-U3](#lv-u3):
ordlyden i tekstene appen lager av utsagnene. De faste tekstene i [KA-U22](#ka-u22) og
[KA-U25](#ka-u25) står uendret; punkt 13 presiserer kravversjonen og «<tittel>» i
KA-U22. Ordlyden for et grunnlagssvar som er en endringsordre, står i [GR-U14](#gr-u14),
og for TEs eget varsel etter § 33.4 i [VS-U15](#vs-u15). Grunnlagskravet er ikke et
varsel etter § 33.4 eller § 34.1.2 ([VS-U15](#vs-u15)). Endringsordrens dato eller
nummer er påkrevd i grunnlagskravet ([GR-U16](#gr-u16)). Grunnlagskravet i force majeure
(§ 33.3) kan ikke uttrykkes i formatet ennå (#367), og teksten kommer med #367. Punkt 6
gjengir [GR-U7](#gr-u7) i brevet («Den er ikke enighet om ansvaret»); spørsmålet foreslo
setningen «Aksepten er ikke enighet om grunnlaget.», og oppdragsgiver valgte i
oppfølgingen den tydeligere teksten. Vedleggene og henvisningen «brev <n> av <dato>» er
også arbeidsvalg og føres i paragrafmatrisen. Endret 12.10 av [LV-U5](#lv-u5):
setningene for «i tide» og etter en innsigelse i punkt 5 nevner varselet. Ikke bygget.
Brevteksten bygges i #369. Punkt 8–12 bygges ikke i første versjon (OV-U7).'''

[[gruppe.vedtak]]
anker = "lv-u5"
vedtak = '''
LV-U5: brevteksten for rettidighet, i tide ([LV-U4](#lv-u4) punkt 5), nevner varselet
den gjelder: «Byggherren gjør ikke gjeldende at TEs varsel etter NS 8407 § 32.2
[varselet om fristforlengelse etter § 33.4] kom for sent.» Samme form som «for sent».
Det samme gjelder setningen etter en innsigelse i LV-U4 punkt 5: «Byggherren gir opp
innsigelsen etter NS 8407 § 5 i brev <n> av <dato> og gjør ikke gjeldende at varselet
kom for sent.» Endret tekst gjelder bare nye brev (MM-U9). Forkastet: «B: som i dag» –
at teksten blir «Byggherren gjør ikke gjeldende at varselet kom for sent.», med
begrunnelsen «Sammenhengen i brevet holder.»'''
vedtatt = "12.10, oppdragsgiver (#414)"
forhold = [{ art = "endrer", vedtak = "lv-u4" }]
folge = '''
Endrer [LV-U4](#lv-u4) punkt 5, setningene for «i tide» og etter en innsigelse. Grunnen:
i et svar der byggherren tidligere har påberopt at TEs varsel etter § 32.2 kom for sent,
kan «varselet» i neste setning, som gjelder varselet etter § 33.4, leses som at
byggherren gir opp den påberopelsen (#414, reviewet av samspillet i PR #410). Setningen
etter en innsigelse blir: «Byggherren gir opp innsigelsen etter NS 8407 § 5 i brev <n>
av <dato> og gjør ikke gjeldende at TEs varsel etter NS 8407 § 32.2 [varselet om
fristforlengelse etter § 33.4] kom for sent.» Spørsmålet og svaret står på #414. Ikke
bygget. Bygges i #410'''

[[gruppe.vedtak]]
id = "LV-U6"
dato = 2026-10-12
hvem = "oppdragsgiver"
kilde = ["#414", "#410"]
sporsmal = '''
Brevteksten (LV-U4 punkt 5 og LV-U5) har «Byggherren gjør gjeldende at TEs varsel etter NS 8407 § 32.2 [varselet om fristforlengelse etter § 33.4] kom for sent.» Klammen er teksten i et svar på fristkravet. Leses den ordrett, blir setningen «… at varselet om fristforlengelse etter § 33.4 kom for sent.» Koden skriver «… at varselet om fristforlengelse etter NS 8407 § 33.4 kom for sent.», både for «for sent» og «i tide». Det er samme form som «NS 8407 § 32.2» og som fristkravet i punkt 3 («etter NS 8407 § 33.4 ble sendt»). Hvilken tekst skal brevet ha?

A: med «NS 8407» – Som koden: «varselet om fristforlengelse etter NS 8407 § 33.4». Klammen leses som at «NS 8407» står i begge, som i resten av brevene. Jeg fører det som et vedtak som presiserer LV-U4 punkt 5 og LV-U5, gjennom det nye registeret.

B: ordrett, uten «NS 8407» – «varselet om fristforlengelse etter § 33.4». Én linje i koden, testene og to versjonsøkninger i en ny PR etter #410.'''
valgt = "A"
svar = '''
A: med «NS 8407»'''
