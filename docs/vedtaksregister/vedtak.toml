tekst = '''
TEs begrunnelse etter § 33.6.2 annet ledd bokstav b registreres som TEs svar på forespørselen, og § 33.6.1 gjelder for kravet som senere fremmes (femte ledd). Påberoper byggherren uttrykkelig at begrunnelsen kom for sent, utledes virkningen som etter § 33.6.2 tredje ledd. Mener byggherren at begrunnelsen ikke er et svar etter annet ledd, registreres og vises det standpunktet uten utledet virkning, som når TE ikke svarer.'''

