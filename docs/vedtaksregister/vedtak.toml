Ved kravet som venter på svar viser løsningen begge partenes registrerte brev som hører til sporet eller saken og ikke er rettet, med avsenderen, beskrivelsen som avsenderens beskrivelse og merknaden ‹Appen vurderer ikke innholdet›. Utvider OV-U20 og OV-U4.'''
