'''

[[gruppe.vedtak]]
vedtak = '''
B-03 hovedvalg: hver innsending får sitt eget brev, som gjelder én part og ett spor, og
brevet er det autoritative uttrykket for partens standpunkt. Saksrapporten sendes ikke
lenger automatisk til Catenda. En rapport kan senere legges ved et brev, men bare hvis
den er feilfri eller har et tydelig forbehold om at brevet gjelder'''
vedtatt = "03.10, oppdragsgiver"
folge = '''
Presisert 09.10 av [MM-U10](#mm-u10): «ett spor» utgår, og et brev kan ha utsagn i flere
spor. Saksrapporten er pensjonert 03.10 (#140). En hendelse uten brev får bare kommentar
og statussynk i Catenda, og en PDF fra klienten avvises. Om hvert brev blir et eget
dokument i Catenda eller en revisjon av ett dokument per part og spor, sto åpent under
B-03. Avgjort 10.10 av [B-03, dokumentet](#b-03-dokument): ett dokument per brev'''

[[gruppe.vedtak]]
anker = "b-03-dokument"
vedtak = '''
B-03, dokumentet: hvert brev som leveres til Catenda, blir ett dokument der, også når
det har utsagn i flere spor. Brevet leveres samlet, slik det er lagret ([HF-U1](#hf-u1))
og frosset i leveringsoppdraget ([LV-U1](#lv-u1)). Dokumentet revideres ikke, heller
ikke ved en retting, som følger B-16. Dokumentnøkkel, navnestandard og avstemming etter
tapt svar fra Catenda velges av utviklerne i #310, innenfor dette og LV-U1. Forkastet:
ett dokument per part og spor, med revisjoner, fordi et brev med svar i flere spor da
deles på flere dokumenter og ikke er én enhet i Catenda'''
vedtatt = "10.10, oppdragsgiver (#321)"
folge = '''
Avgjør det som sto åpent under B-03 etter [MM-U10](#mm-u10). B-03 er dermed avgjort og
flyttet fra 3.4. Endrer ikke B-16. Om `failOnDocumentExists` skal være `true`, avgjøres
med dokumentnøkkelen og navnestandarden i #310. Konfliktsvaret ved `true` er ikke
observert (avsnitt 7). Ikke bygget (#310)'''

[[gruppe.vedtak]]
anker = "mm-u9"
vedtak = '''
MM-U9: et sendt brev beholder virkningen det hadde da det ble sendt. En endring i appens
regler endrer ikke virkningen av et brev som allerede er sendt: virkningen leses fra
beslutningsgrunnlaget i brevet, og nye regler gjelder bare nye brev. Gir dagens regler
et standpunkt i brevet en annen virkning, vises avviket som en merknad som oppfordrer
byggherren til å revidere svaret (GR-U4). Forkastet: at dagens regler vurderer sendte
brev på nytt, og at et avvik sperrer aksepten (MM-U4–MM-U6); og å fryse virkningen, men
gi byggherren «vurder revisjon» som ventende handling'''
vedtatt = "09.10, oppdragsgiver"
forhold = [
  { art = "opphever", vedtak = "mm-u4" },
  { art = "opphever", vedtak = "mm-u5" },
  { art = "opphever", vedtak = "mm-u6" },
]
folge = '''
Opphever MM-U4, MM-U5 og MM-U6. Snevrer inn merknaden 05.10 til vedtaket om regelversjon
under B-13. MM-U3 og MM-U8 står. Presisert av [MM-U11](#mm-u11) (09.10), som gjør et
unntak for regelen som setter sammen standpunktene til et utfall, og av
[MM-U12](#mm-u12) (10.10): beslutningsgrunnlaget bevarer appens vurdering da brevet ble
sendt, og den er ikke en rettslig avgjørelse. Endret 10.10 av [MM-U17](#mm-u17) for
registrerte brev: appens vurdering følger reglene ved registreringen, ikke da brevet ble
sendt. Et svar uten lagret beslutningsgrunnlag finnes ikke etter B-17: hvert svar TS
skriver, også registrert korrespondanse, får beslutningsgrunnlaget fra standpunktene
slik brevet uttrykker dem (oppdragsgiver 09.10; kontrolleres i #310). Målmodellen i
språkprøven (#304) bygger MM-U4–MM-U6'''

[[gruppe.vedtak]]
anker = "mm-u10"
vedtak = '''
MM-U10: et brev er fra én part og kan inneholde utsagn i flere spor. Byggherren kan i
samme brev svare på grunnlag, vederlag og frist, gjøre innsigelser etter § 5 og sende en
forespørsel etter § 33.6.2. TE kan i samme brev sende krav, varsel, aksept og trekk.
Hvert svar gjelder én kravversjon, og en aksept gjelder ett svar (KA-U1). § 5 første
ledd krever at varsler, krav og svar fremsettes skriftlig, ikke at hvert av dem står i
et eget brev. Forkastet: ett spor per brev, som ordlyden i B-03, og flere spor per brev
bare for byggherren'''
vedtatt = "09.10, oppdragsgiver (#273)"
folge = '''
Presiserer B-03: «ett spor» utgår. Om brevet blir ett dokument i Catenda, eller en
revisjon av ett dokument per part og spor, er avgjort 10.10 av [B-03,
dokumentet](#b-03-dokument): ett dokument per brev. Lagringsformatet for et brev med
flere utsagn er #273. Ikke bygget'''

[[gruppe.vedtak]]
anker = "mm-u11"
vedtak = '''
MM-U11: beslutningsgrunnlaget i byggherrens svar fryser hvert standpunkt med virkningen
det hadde da brevet ble sendt: prinsipalt eller subsidiært, preklusjon, godkjent eller
avslått, beløp eller dager. Det fryser også om svaret godkjenner hele kravet
(sammenfall). Utfallet i sporet og vilkåret for en enighet utledes av de frosne
standpunktene, og ingen regel leser et lagret utfall. Endres regelen som setter
standpunktene sammen til et utfall, kan utfallet av et sendt brev endre seg.
Sammensetningen følger § 32.3 a–c og vedtakene om prinsipale og subsidiære standpunkter,
som GR-U7. Forkastet: at hvert svar i tillegg fryser utfallet per spor og vilkåret for
enigheten'''
vedtatt = "09.10, oppdragsgiver (#273)"
forhold = [{ art = "presiserer", vedtak = "mm-u9" }]
folge = '''
Presiserer MM-U9 og KA-U10. Gjør et unntak fra MM-U9 for regelen som setter sammen
standpunktene til et utfall. Den følger gjeldende regler, også for sendte brev.
Beslutningsgrunnlaget fryser også om § 32.2 gjaldt ([GR-U12](#gr-u12), 10.10), som
appens vurdering ([GR-U13](#gr-u13), 10.10). At et standpunkt er uten virkning, er
appens vurdering og lagres atskilt fra det byggherren sa ([HF-U2](#hf-u2),
[MM-U12](#mm-u12); 10.10). Presisert 10.10 av [MM-U13](#mm-u13): reglene stiller
kontraktsspørsmålet til utsagnene. Bekreftet 10.10 av [MM-U16](#mm-u16): det nye regler
kan endre, er appens utledning av utfallet, også på tvers av brev, mens standpunktene i
brevene står (MM-U9). Før en regelendring rulles ut, regnes alle saker med gamle og nye
regler, og en sak der utfallet endres, viser en merknad. Endret 10.10 av
[MM-U17](#mm-u17) for registrerte brev: appens vurdering følger reglene ved
registreringen, ikke da brevet ble sendt. Lagringsformatet står i
[designnotatet](../design-hendelsesformat-2026-10-09.md) (#273). Ikke bygget'''

[[gruppe.vedtak]]
anker = "mm-u12"
vedtak = '''
MM-U12: et sendt brev bevares slik det ble sendt, og beslutningsgrunnlaget bevarer
appens vurdering da brevet ble sendt, for eksempel at et standpunkt er uten virkning
eller at § 32.2 gjaldt. Vurderingen er ikke en rettslig avgjørelse, og den blir ikke
riktig eller bindende fordi den er frosset. Det samme gjelder registratorens vurdering
av ekstern korrespondanse. Appen avgjør ikke det kontrakten overlater til partene, en
oppmann eller domstolene. En senere avklaring registreres som et nytt utsagn, uten at
brevet eller historikken skrives om. Formen følger B-16'''
vedtatt = "10.10, oppdragsgiver (#273)"
forhold = [{ art = "presiserer", vedtak = "mm-u9" }]
folge = '''
Presiserer MM-U9 og MM-U11. Endret 10.10 av [MM-U17](#mm-u17) for registrerte brev:
appens vurdering følger reglene ved registreringen, ikke da brevet ble sendt. Ikke
bygget'''

[[gruppe.vedtak]]
anker = "mm-u4"
vedtak = '''
MM-U4: TE kan bare godta et svar når brevet stemmer med dagens utledning av svaret. Har
