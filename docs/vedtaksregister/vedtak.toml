[[gruppe.vedtak]]
anker = "ka-u11"
vedtak = '''
KA-U11: kravene i saken er avgjort når grunnlaget er avklart etter GR-U7, hvert
vederlags- og fristkrav er trukket eller har en virksom enighet, og det ikke finnes et
spor TE fortsatt kan sende (EO-U2, GR-U3). Er kravene avgjort, avvises hver kommando som
kan endre utfallet: trekk, ny kravversjon, varsel etter § 33.4 og byggherrens revisjon,
også av et frafall. En bestridelse av en opplysning godtas (MM-U7). «Saken er avsluttet»
i KA-U6 og MM-U7 betyr at kravene er avgjort. Predikatet leses av utsagnene og
relasjonene, ikke av status. Grunnlaget er KA-U7 (ingen part går ensidig fra en
enighet), § 34.2.2 første ledd og § 31.3 annet ledd. Forkastet: ingen samlet sperre,
slik at hvert spor bare sperres av sine egne predikater; og en sperre per spor, der en
virksom enighet sperrer trekk'''
vedtatt = "09.10, oppdragsgiver (#308)"
forhold = [{ art = "presiserer", vedtak = "gr-u9" }]
folge = '''
Presiserer KA-U6, MM-U7 og GR-U9. Presisert 09.10 av [KA-U12](#ka-u12): «ingen krav»
teller som trukket. Et godtatt avslag av grunnlaget (SK-01) og et trukket grunnlag
(GR-U5) sperrer med egne predikater. Presisert 10.10 av [KA-U20](#ka-u20) for en enighet
som bygger på et merket brev. Presisert 11.10 av [KA-U26](#ka-u26), [KA-U28](#ka-u28) og
[KA-U29](#ka-u29), og av [MM-U19](#mm-u19) for registrerte brev. Ikke bygget'''

[[gruppe.vedtak]]
anker = "ka-u28"
vedtak = '''
KA-U28: når kravene er avgjort, godtas en avklaring etter KA-U20 fra den som sendte
brevet, når den ikke endrer noe standpunkt, for eksempel en ny ubetinget godkjenning med
samme innhold. Avklaringen opphever sperren etter KA-U26. En revisjon som endrer et
standpunkt, avvises fortsatt (KA-U11)'''
vedtatt = "11.10, oppdragsgiver (#309, #394)"
forhold = [
  { art = "presiserer", vedtak = "ka-u11" },
  { art = "presiserer", vedtak = "ka-u20" },
]
folge = '''
Presiserer [KA-U11](#ka-u11) og [KA-U20](#ka-u20). Avklaringen er ikke en revisjon etter
[GR-U10](#gr-u10) eller [KA-U7](#ka-u7). En senere merking når kravene er avgjort,
endrer ikke utfallet og godtas, etter KA-U11 og [KA-U26](#ka-u26). Ikke bygget. Bygges ikke i første versjon (OV-U7).'''

[[gruppe.vedtak]]
anker = "ka-u29"
vedtak = '''
KA-U29: når TE har godtatt byggherrens avslag av grunnlaget, godtas de samme utsagnene
som når kravene er avgjort, blant dem bestridelse av en opplysning, innsigelse etter § 5
tredje ledd, protest mot innsigelsen, påberopt passivitet etter § 32.3 annet ledd og
merking etter KA-U20. De registreres og vises uten virkning på utfallet i appen. Det som
kan endre utfallet, for eksempel et nytt svar som endrer et standpunkt, avvises fortsatt'''
vedtatt = "11.10, oppdragsgiver (#309, #394)"
forhold = [
  { art = "presiserer", vedtak = "ka-u11" },
  { art = "utvider", vedtak = "mm-u7" },
]
folge = '''
Utvider det som godtas etter [KA-U11](#ka-u11) og [MM-U7](#mm-u7) til et godtatt avslag
av grunnlaget ([GR-U7](#gr-u7), SK-01). Innsigelsen følger [VS-U9](#vs-u9) og
[VS-U14](#vs-u14), passiviteten [VS-U12](#vs-u12). At innsigelse, protest og påberopt
passivitet godtas når kravene er avgjort, er et arbeidsvalg etter KA-U11 og MM-U7
(paragrafmatrisen). Ikke bygget. Delene om bestridelse, protest, påberopt passivitet og merking bygges ikke i første versjon (OV-U7). Delvis bygget, kontrollert 20.10 (#417): etter et godtatt avslag av grunnlaget avvises de bindende handlingene med GRUNNLAG_AVVIST, og innsigelsen etter § 5 godtas (`forutsetninger` i `kjerne/kommandoer/forutsetninger.ts`, `grunnlagAvvist` i `kjerne/utledning/utled.ts`), med bevis-saken F-MM-A5a. Bestridelse og merking avvises med IKKE_I_FOERSTE_VERSJON. Protest og påberopt passivitet godtas fortsatt; avvisningen etter OV-U7 er ikke bygget, som Følge hos [OV-U7](#ov-u7) sier.'''

[[gruppe.vedtak]]
anker = "ka-u13"
vedtak = '''
KA-U13: et trekk av grunnlaget avvises når byggherrens godkjenning av det er en
endringsordre etter § 32.3 første ledd a, altså i underkategoriene under ENDRING som §
32.2 gjelder for (GR-U11), og partene dermed er enige ved sammenfall (GR-U10). Når TE
har mottatt endringsordren, «blir han forpliktet til å utføre endringsarbeidet» (§ 31.3
annet ledd). Et trekk av vederlag eller frist står som i KA-U6. Et spor TE ikke vil
kreve, lukkes med «ingen krav» (KA-U12). I kategoriene SVIKT, ANDRE og FORCE_MAJEURE, og
i underkategorien EO, der endringsordren er utstedt etter § 31.3 og binder TE uavhengig
av KOE-saken, står KA-U6 og KA-U7: TE kan trekke grunnlaget også når partene er enige om
det, fordi trekket bare gir fra seg TEs eget krav. Før byggherren har svart, og etter
avslag eller frafall, kan TE trekke grunnlaget som før (GR-U5). Trekket er i alle
tilfeller sperret når TE har godtatt et avslag av grunnlaget (SK-01) eller kravene er
avgjort (KA-U11). Forkastet: å godta trekket etter ordlyden i KA-U6, slik at alle spor
trekkes og endringsordren etter § 32.3 a mister virkning; og å la forbudet gjelde all
enighet om grunnlaget, også der godkjenningen ikke er en endringsordre'''
vedtatt = "09.10, oppdragsgiver (#308)"
forhold = [{ art = "snevrer inn", vedtak = "ka-u7" }]
folge = '''
Snevrer inn KA-U6 og KA-U7 for grunnlaget når godkjenningen er en endringsordre. Om
godkjenningen er en endringsordre, avgjøres etter [GR-U12](#gr-u12) og [GR-U13](#gr-u13)
(10.10). Presisert 10.10 av [KA-U14](#ka-u14): sperren følger endringsordren etter
GR-U13 og gjelder til det er avklart om brevet oppfyller § 31.3. Forskjellen fra
underkategorien EO er begrunnet i hvordan appen håndterer trekket, ikke i at
endringsordrene har ulik rettslig bindende kraft. Snevret inn 10.10 av [KA-U22](#ka-u22)
til byggedel 3: trekket avvises når appen ikke kan bevare byggherrens avtalte
rettigheter. Ikke bygget. Det vedtaket sier om «ingen krav», gjelder ikke i første versjon; et spor som ikke er sendt, følger OV-U3 (OV-U7). Bygget, kontrollert 20.10 (#417): trekket av grunnlaget avvises med GRUNNLAG_ER_ENDRINGSORDRE når byggherrens godkjenning, sendt fra appen, er en endringsordre (`trekkAvGrunnlagetErSperret` i `kjerne/utledning/utled.ts`), med bevis-sakene F-MM-G10 og F-MM-G13–G20 og feilinnføringene fra F23 i `kjerne/tester/feilinnfoering.ts`. Delen om «ingen krav» er utsatt etter OV-U7.'''

[[gruppe.vedtak]]
anker = "ka-u14"
vedtak = '''
KA-U14: trekk etter KA-U6 innebærer bare avkall på TEs eget, uttrykkelig identifiserte
krav. Trekket opphever ikke pålegg, endringsordre, utførelsesplikt eller motpartens
rettigheter etter en avtale. Enighet om grunnlaget sperrer derfor ikke i seg selv slikt
avkall. Dersom appen ikke kan gjennomføre trekket uten å gi det videre virkninger, skal
handlingen sperres. Et trekk av grunnlaget er avkall på alle krav i saken, også godkjent
vederlag og godkjent fristforlengelse (GR-U5), og brevet sier det tydelig. Er
godkjenningen av grunnlaget en endringsordre etter § 32.3 første ledd a (GR-U13), er
endringsordren byggherrens svar i grunnlagssporet i KOE-saken. Et trekk av grunnlaget
ville da gitt journalen den videre virkningen at endringsordren leses som bortfalt, og
det sperres (KA-U13). TE gir avkall på vederlag og frist ved å trekke dem (KA-U6) eller
med «ingen krav» (KA-U12). I underkategorien EO står endringsordren i en egen EO-sak og
berøres ikke av trekket i KOE-saken, så KA-U6 står. Forskjellen er begrunnet i hvordan
appen håndterer trekket, ikke i at endringsordrene har ulik rettslig bindende kraft.
Registrert korrespondanse: Om brevet oppfyller § 31.3, må avklares før appen tillater
trekk som kan berøre endringsordren. Manglende opplysning er ikke tilstrekkelig til å
konkludere. Er det avklart at brevet ikke er en endringsordre, kan TE trekke grunnlaget
som avkall etter KA-U6 og GR-U5. Trekket opphever ikke et eventuelt pålegg eller en
utførelsesplikt. Brev og visning fremstiller ikke et trekk som at pålegget,
endringsordren eller utførelsesplikten er bortfalt. Forkastet: at all bindende enighet
om grunnlaget sperrer trekket, og at sperren gjelder enighet ved sammenfall uavhengig av
§ 31.3'''
vedtatt = "10.10, oppdragsgiver (#273)"
forhold = [{ art = "presiserer", vedtak = "ka-u13" }]
folge = '''
Presiserer KA-U6, KA-U13 og GR-U5. Avgrenser [EO-U1](#eo-u1): en slik endringsordre er
svaret i grunnlagssporet i KOE-saken, ikke en EO-sak. Kan snevre inn KA-U6 der enigheten
gir byggherren en rettighet, for eksempel et fradrag (KA-U9). Krav til brevteksten
(#309, #310) og visningen (#313). Gjennomført i brevteksten 10.10 av [KA-U22](#ka-u22),
som også sperrer et trekk av grunnlaget når appen ikke kan bevare byggherrens avtalte
rettigheter. Ikke bygget. Det vedtaket sier om «ingen krav», gjelder ikke i første versjon; et spor som ikke er sendt, følger OV-U3 (OV-U7).'''

[[gruppe.vedtak]]
vedtak = '''
Aksept av avslag gir `AVSLATT_AKSEPTERT`'''
vedtatt = "19.09"
folge = '''
TFR-01'''

[[gruppe]]
tittel = "Grunnlag, frafall og trekk av grunnlaget"

[[gruppe.vedtak]]
anker = "gr-u1"
vedtak = '''
GR-U1: en ny kravversjon av grunnlaget åpner sporet også når underkategorien er uendret,
som for vederlag og frist. Svaret på forrige versjon faller i tilstanden og står i
journalen, grunnlaget venter på nytt svar, og en aksept av forrige svar avvises (KA-U1).
Et svar på vederlag eller frist som var subsidiært, forblir subsidiært til sporet eller
grunnlaget besvares igjen, som ved endret underkategori'''
vedtatt = "08.10, oppdragsgiver"
folge = '''
Ikke bygget (DT-04). Utvider vedtaket om endret underkategori 05.10 (#215) til alle
grunnlagsversjoner etter et svar som ikke er låst'''

[[gruppe.vedtak]]
anker = "gr-u2"
vedtak = '''
GR-U2: et grunnlag byggherren har godkjent og som er låst, kan ikke endres, heller ikke
underkategorien. Vedtaket om endret underkategori 05.10 (#215) gjelder svar som ikke er
låst: avslått, prekludert etter § 32.2 og frafalt'''
vedtatt = "08.10, oppdragsgiver"
folge = '''
Presisert 09.10 av [GR-U10](#gr-u10): «låst» er enighet ved sammenfall. Som i dag:
`NOT_LOCKED` avviser oppdateringen'''

[[gruppe.vedtak]]
anker = "gr-u10"
vedtak = '''
GR-U10: har byggherren godkjent grunnlaget uten å påberope preklusjon, er partene enige
ved sammenfall, og byggherren er bundet. Byggherren kan ikke revidere godkjenningen.
Etter § 32.3 a er svaret en endringsordre. «Låst» er ikke lenger et eget begrep, men
enighet. Frafall (GR-U9) er byggherrens standpunkt og kan fortsatt revideres'''
vedtatt = "09.10, oppdragsgiver"
forhold = [
  { art = "presiserer", vedtak = "gr-u7" },
  { art = "presiserer", vedtak = "gr-u2" },
]
folge = '''
Presiserer GR-U2 og GR-U7. Retter avviket i målmodellen som #312 beskriver. At svaret er
en endringsordre etter § 32.3 a, gjelder underkategoriene som § 32.2 gjelder for
(GR-U11, [KA-U13](#ka-u13); 09.10), også et svar som ikke sier noe om varslingen
([GR-U12](#gr-u12); 10.10). Endret 10.10 av [GR-U13](#gr-u13): svaret er en
endringsordre bare når § 31.3 også er oppfylt'''

[[gruppe.vedtak]]
anker = "gr-u3"
vedtak = '''
GR-U3: etter frafall (§ 32.3 c) blir saken `OMFORENT` når vederlag og frist er oppgjort,
ved godkjenning eller godtatt avslag. Endringsordren for utført arbeid utstedes i en
egen EO-sak (#69) med egen fullmakt (GFK-06), ikke reaktivt fra KOE-saken;
`kan_utstede_eo` er `false` i KOE-saken'''
vedtatt = "08.10, oppdragsgiver"
folge = '''
Som i dag: `OMFORENT` med godkjente krav og `kan_utstede_eo`. Godtatte avslag ga
`UKJENT` på vedtaksdatoen og gir `OMFORENT` fra 09.10 (SK-04). Presiserer vedtaket om
`FRAFALT` 05.10. Presisert 08.10 av [EO-U1](#eo-u1), som ikke er bygget: `eo_utstedt` i
en KOE-sak avvises, og `kan_utstede_eo` betyr at KOE-saken kan inngå i en EO-sak'''

[[gruppe.vedtak]]
anker = "gr-u4"
vedtak = '''
GR-U4: reviderer byggherren svaret på vederlag eller frist mens grunnlaget venter på
nytt svar, er det nye svaret prinsipalt. Det blir subsidiært når grunnlaget avslås eller
prekluderes, fordi det utledes av grunnlaget (vedtaket om svar når grunnlaget er
avslått, 05.10)'''
vedtatt = "08.10, oppdragsgiver"
folge = '''
Som i dag i projeksjonen, fullmakten og brevet'''

[[gruppe.vedtak]]
anker = "gr-u5"
vedtak = '''
GR-U5: trekker TE grunnlaget, trekkes alle krav som er sendt, også et vederlag eller en
frist byggherren har godkjent, fordi ansvarsgrunnlaget bærer dem. Saken blir
`LUKKET_TRUKKET`'''
vedtatt = "08.10, oppdragsgiver"
folge = '''
Vedtaket var som i Python på vedtaksdatoen (kaskaden i `_handle_grunnlag_trukket`). Spor
som ikke er sendt: SD-02 (05.10). Senere vedtak, ikke bygget i Python: trekket avvises
når godkjenningen av grunnlaget er en endringsordre etter § 32.3 a ([KA-U13](#ka-u13),
09.10), og brevet sier tydelig at trekket er avkall på alle krav i saken, også godkjent
vederlag og godkjent fristforlengelse ([KA-U14](#ka-u14), 10.10). Snevret inn 10.10 av
[KA-U22](#ka-u22) til byggedel 3: trekket avvises når appen ikke kan bevare byggherrens
avtalte rettigheter.'''

[[gruppe.vedtak]]
anker = "gr-u9"
vedtak = '''
GR-U9: TE kan ikke godta byggherrens frafall (§ 32.3 c). Frafallet er byggherrens
standpunkt, ikke en enighet; grunnlaget er avklart uten aksept (GR-U7), byggherren
beholder revisjonsretten, og TE kan sende ny kravversjon (GR-U2). Forkastet: å la
aksepten låse frafallet for revisjon'''
vedtatt = "09.10, oppdragsgiver etter review av PR #306"
folge = '''
Presisert 09.10 av [KA-U11](#ka-u11): revisjonsretten og TEs nye kravversjon gjelder til
kravene er avgjort. Bygget i målmodellen i språkprøven (#304), rad GR-26'''

[[gruppe.vedtak]]
anker = "gr-u11"
vedtak = '''
GR-U11: § 32.2 gjelder alle underkategorier under ENDRING unntatt EO, som i dag. Hver
bestemmelse viser selv til § 32.2: § 14.4 (LOV_GJENSTAND), § 14.6 annet ledd (VALGRETT),
§ 15.2 (LOV_PROSESS), § 21.4 annet ledd (SAMORD), § 24.2.2 fjerde ledd (SVAR_VARSEL) og
§ 26.3 (GEBYR). IRREG er § 32.1 direkte. Henvisningen tar med preklusjonen i § 32.2 og
byggherrens svarplikt i § 32.3, med passivitetsregelen'''
vedtatt = "09.10, oppdragsgiver etter lesning av NS 8407 § 5 og §§ 31–35"
folge = '''
Avgjør #220, uten innsnevring. Vedtaket om `grunnlag_varslet_i_tide` under B-13 er
uendret'''

[[gruppe.vedtak]]
anker = "gr-u12"
vedtak = '''
GR-U12: godkjenner byggherren grunnlaget uten å påberope preklusjon i en underkategori
der § 32.2 gjaldt da brevet ble sendt (GR-U11), er svaret en endringsordre etter § 32.3
første ledd a, også når brevet ikke sier noe om varslingen. Det gjelder også registrert
korrespondanse. Beslutningsgrunnlaget fryser derfor om § 32.2 gjaldt, som en del av
virkningen brevet hadde (MM-U9, MM-U11). Frontenden varsler byggherren og betegner
svaret som en endringsordre, slik at byggherren tydelig forstår virkningen. Forkastet:
at godkjenningen bare er en endringsordre når brevet har et utsagn om varslingen'''
vedtatt = "10.10, oppdragsgiver (#308)"
folge = '''
Presiserer GR-U10 og KA-U13, og utvider formen i MM-U11. Endret 10.10 av
[GR-U13](#gr-u13): endringsordren krever også § 31.3, og om § 32.2 gjaldt, fryses som
appens vurdering. Endret 10.10 av [MM-U17](#mm-u17) for registrerte brev: appens
vurdering følger reglene ved registreringen, ikke da brevet ble sendt. Ikke bygget på
vedtaksdatoen: kjernen leste da om brevet har et utsagn etter § 32.2 (#308). Bygget i
kjernen 10.10 (merknaden 10.10 til FK, runde 2). Frysingen hører til formatet (#273),
varselet og betegnelsen til frontenden (#313). Utvidet i kjernen 18.10 i PR #796 (#770, #776 p1): om § 32.2 gjelder kategorien i kravet en innsigelse gjelder, leses i utledningen og kommandoene av det frosne beslutningsgrunnlaget i svaret som sa «i tide» etter § 32.2 på en versjon i samme kategori, ikke av dagens regelsett (`innsigelsenEtterITide`). Brevteksten spør regelsettet når brevet skrives.'''

[[gruppe.vedtak]]
anker = "gr-u13"
vedtak = '''
GR-U13: byggherrens godkjenning av grunnlaget er en endringsordre etter § 32.3 første
ledd a bare når også § 31.3 er oppfylt: endringsordren «skal være skriftlig og gi
beskjed om at det kreves en endring, samt hva endringen går ut på», og den «må være gitt
av byggherrens representant, jf. punkt 9, eller av en person med skriftlig fullmakt til
å utstede slike». For brev sendt fra appen sørger appen for det: brevet sier at
endringen kreves og viser til pålegget i varselet, og fullmakten kontrolleres i
godkjenningsflyten (GFK-06). For registrert korrespondanse oppgir den som registrerer,
om brevet var en endringsordre etter § 31.3. Opplysningen er registratorens vurdering og
ikke en rettslig avgjørelse. Mangler opplysningen, vet appen ikke om brevet er en
endringsordre, og manglende opplysning er ikke nok til å konkludere (KA-U14). Om § 32.2
gjaldt (GR-U12), fryses i beslutningsgrunnlaget som appens vurdering etter reglene og
underkategorien da brevet ble sendt, med regelversjonen, atskilt fra det byggherren sa
(MM-U12). Forkastet: at en godkjenning uten påberopt preklusjon i en underkategori med
varslingsplikt alene er en endringsordre, og at manglende opplysning om § 31.3 betyr at
brevet ikke er en endringsordre'''
vedtatt = "10.10, oppdragsgiver (#273)"
forhold = [{ art = "endrer", vedtak = "gr-u10" }, { art = "endrer", vedtak = "gr-u12" }]
folge = '''
Endrer GR-U10 og GR-U12: endringsordren krever også § 31.3. Endret 10.10 av
[MM-U17](#mm-u17) for registrerte brev: om § 32.2 gjaldt, fryses som appens vurdering
etter reglene ved registreringen, ikke da brevet ble sendt. Krav til skrivestien (#310):
hvert grunnlagssvar fra appen som godkjenner grunnlaget uten påberopt preklusjon der §
32.2 gjelder, får brevteksten etter § 31.3 og går gjennom fullmakten. Hvordan
opplysningen registreres og avklares, avgjøres med kommandoen i #310. Endret 11.10 av
[GR-U14](#gr-u14) («varselet» leses som kravversjonen svaret gjelder; ordlyden) og
utvidet av [GR-U15](#gr-u15) (beskrivelsen av pålegget i TEs varsel). Ikke bygget'''

[[gruppe.vedtak]]
anker = "gr-u14"
vedtak = '''
GR-U14: et grunnlagssvar fra appen som etter GR-U12 og GR-U13 er en endringsordre, sier:
«Byggherren godkjenner grunnlaget. Svaret er en endringsordre etter NS 8407 § 32.3
første ledd a, jf. § 31.3: byggherren krever at endringen utføres slik pålegget er
beskrevet i TEs krav i brev <n> av <dato>: «<TEs beskrivelse av pålegget>».» Brevet <n>
er det med kravversjonen svaret gjelder (HF-U1), også etter en ny kravversjon.
Byggherrens låste tekst siterer da en fritekst fra TE som appen ikke tolker (KA-U19).
Byggherren står bak sitatet som beskrivelse av endringen. Setningen velges når
byggherren godkjenner grunnlaget uten å påberope preklusjon, og § 32.2 gjaldt. Den er
byggherrens utsagn: byggherren ser og godkjenner den (GR-U12), og den er derfor ikke
appens vurdering. Er TEs krav sendt utenfor appen og registrert, viser setningen til det
registrerte brevet uten sitat: «… byggherren krever at endringen utføres slik pålegget
er beskrevet i TEs krav i brev <n> av <dato>.» Forkastet for registrerte krav:
«Byggherren beskriver» – «Byggherren må selv beskrive endringen i godkjenningen. Uten en
slik beskrivelse avvises godkjenningen.» og «Avvis godkjenningen» – «En slik godkjenning
avvises i appen, og byggherren må svare utenfor appen.»'''
vedtatt = "11.10, oppdragsgiver (#369, #410)"
forhold = [{ art = "endrer", vedtak = "gr-u13" }]
folge = '''
Spørsmålet står i versjon 4 av spørsmålene på #410, svaret på #369 (V4 a). Varianten for
registrerte krav er oppdragsgivers svar 11.10 i oppfølgingen på #369 (spørsmål 1): det
registrerte brevet bærer selv beskrivelsen, og ordlyden følger GR-U13. Endrer
[GR-U13](#gr-u13) («brevet sier at endringen kreves og viser til pålegget i varselet»):
«varselet» leses som TEs krav i kravversjonen svaret gjelder. Beskrivelsen i TEs varsel
følger [GR-U15](#gr-u15). Fullmakten kontrolleres i godkjenningsflyten (GFK-06) og
bygges i #310; ingen reelle brev sendes før #310 ([OV-U1](#ov-u1)). Ikke bygget. Teksten
bygges i #369'''

[[gruppe.vedtak]]
anker = "gr-u15"
vedtak = '''
GR-U15: TEs varsel etter § 32.2 fra appen må ha en beskrivelse av pålegget. Følgen for
TE: et varsel uten beskrivelse avvises i appen. Varselet skal gis «uten ugrunnet
opphold» (§ 32.2), så TE kan miste tid eller må varsle utenfor appen og registrere
varselet. Forkastet: «byggherren beskriver endringen i utdypningen, og en slik
godkjenning avvises uten den», og «en godkjenning som ville vært en endringsordre,
avvises når varselet ikke har en beskrivelse. Byggherren må da svare utenfor appen.»'''
vedtatt = "11.10, oppdragsgiver (#369, #410)"
forhold = [{ art = "utvider", vedtak = "gr-u13" }]
folge = '''
Spørsmålet står i versjon 4 av spørsmålene på #410, svaret på #369 (V4 b, «Hva endringen
går ut på, når TEs varsel ikke beskriver pålegget»). Utvider [GR-U13](#gr-u13):
beskrivelsen er det endringsordren i [GR-U14](#gr-u14) viser til som hva endringen går
ut på (§ 31.3). Varselet etter § 32.2 står i TEs grunnlagskrav ([LV-U4](#lv-u4), punkt
1). Et registrert varsel kan stå uten beskrivelse; det følger av alternativet selv («må
varsle utenfor appen og registrere varselet»), og [GR-U14](#gr-u14) har ordlyden for et
registrert krav. Ikke bygget Bygget, kontrollert 20.10 (#417): et varsel fra TE etter § 32.2 uten beskrivelse, eller med bare mellomrom, avvises med BESKRIVELSE_MANGLER (`kravetsUtdypning` i `kjerne/kommandoer/nyttelast.ts`), med test i `kjerne/tester/brevtekst.test.ts`, og TE-skjemaet sender beskrivelsen (`src/lib/kjernesak/grunnlagskrav.ts`). Unntaket for et registrert varsel er ikke kontrollert.'''

[[gruppe.vedtak]]
anker = "gr-u16"
vedtak = '''
GR-U16: i TEs grunnlagskrav i underkategorien endringsordre (§ 31.3) oppgir TE
endringsordrens dato eller nummer, og opplysningen er påkrevd. Det gjelder også når et
slikt krav sendt utenfor appen registreres: den som registrerer, må oppgi
endringsordrens dato eller nummer, og ellers avvises registreringen. Forkastet: «Bare
fra appen» – «Feltet er påkrevd i krav fra appen. Et registrert brev står som det ble
sendt (MM-U17) og kan stå uten feltet, slik et registrert brev kan stå uten begrunnelse
(KA-U24).»'''
vedtatt = "11.10, oppdragsgiver (#369, #410)"
folge = '''
Spørsmålet: «skal TE oppgi endringsordrens dato eller nummer? Det er et nytt felt i
grunnlagskravet.» Anbefalingen, som oppdragsgiver godtok: «TE oppgir endringsordrens
dato eller nummer, som et påkrevd felt.» Spørsmålet står i versjon 4 av spørsmålene på
#410 (V5 punkt 1), svaret på #369 (5.1b). At kravet også gjelder registrerte krav, er
oppdragsgivers svar 11.10 i oppfølgingen på #369 (spørsmål 2). Dato eller nummer er
registratorens opplysning ([MM-U12](#mm-u12), som opplysningen om § 31.3 i
[GR-U13](#gr-u13)), ikke brevets innhold, så [MM-U17](#mm-u17) og [KA-U16](#ka-u16)
står. I tråd med [HF-U1](#hf-u1): et utsagn viser uttrykkelig til det det gjelder.
Brevteksten gjengir opplysningen ([LV-U4](#lv-u4), punkt 1). Ikke bygget Bygget, kontrollert 20.10 (#417): formkontrollen krever endringsordrens dato eller nummer i underkategorien endringsordre og avviser feltet i andre underkategorier (`kategorisperre` i `kjerne/kommandoer/nyttelast.ts`), et registrert krav uten feltet er ikke forstått, og brevteksten gjengir opplysningen (`kjerne/frosset/brevtekst.ts`), med test i `kjerne/tester/koder.test.ts`, `kjerne/tester/brevtekst.test.ts` og `src/lib/components/kontraktsbord/__tests__/NewCaseKjerne.test.ts`.'''

[[gruppe.vedtak]]
vedtak = '''
B-13 endret underkategori etter byggherrens svar på grunnlaget krever nytt svar.
Låsingen og § 32.2-vurderingen fra det forrige svaret faller bort, og grunnlaget venter
på svaret igjen. Journalen beholder det forrige svaret som historikk. Forkastet: å
avvise endringen, og å la projeksjonen regne det gamle svaret av gjeldende underkategori'''
vedtatt = "05.10, oppdragsgiver"
folge = '''
Utvidet 08.10 av [GR-U1](#gr-u1) til alle grunnlagsversjoner etter et svar som ikke er
låst, og snevret inn 08.10 av [GR-U2](#gr-u2): gjelder svar som ikke er låst. Bygget
05.10 i projeksjonen (#215). Hele svaret faller i tilstanden, også resultatet. Et svar
på vederlag eller frist som var gitt subsidiært, forblir subsidiært til sporet eller
grunnlaget besvares igjen (oppdragsgiver 05.10). Merknad 16.10: [GR-U19](#gr-u19) snevrer inn denne raden: underkategorien kan bare endres når § 32.2 gjelder likt før og etter.'''

[[gruppe.vedtak]]
vedtak = '''
B-13 svar på vederlag og frist når grunnlaget er avslått eller prekludert (§ 32.2):
journalen og sporstatusen har resultatet av beløpene og dagene, som et subsidiært
standpunkt som får virkning hvis grunnlaget senere godkjennes. Brev og fullmakt sier
«prinsipalt avslått (grunnlaget)» med det subsidiære resultatet. At hele svaret er
subsidiært, utledes av grunnlaget og lagres ikke i hendelsen'''
vedtatt = "05.10, oppdragsgiver"
folge = '''
Redaksjonell retting 10.10 (oppdragsgiver): en doblet frase, «med det subsidiære
resultatet», er fjernet fra vedtaksteksten; meningen er uendret. Ordbytte 11.10
(oppdragsgiver, #384): «ansvarsgrunnlaget» er byttet til «grunnlaget», også i
brevteksten, etter [HF-U2](#hf-u2). Innholdet er uendret. Bygget i brev og fullmakt
(#168). Ordet ble byttet i brevet 10.10 (#313). Saksvisningen i frontend: #214'''

[[gruppe.vedtak]]
vedtak = '''
B-13 `grunnlag_varslet_i_tide` avvises utenfor § 32.2 (endring som ikke er formell
endringsordre). Fullmakt og brev snevres inn til samme omfang'''
vedtatt = "24.09, oppdragsgiver"
folge = '''
Forretningsreglene avviser feltet utenfor § 32.2 fra 04.10 (#63). Fra 05.10 bruker
fullmakt, brev, projeksjonen og skjemaet samme regel,
`regler.grunnlag.er_grunnlag_subsidiaert` og speilet `erGrunnlagetSubsidiaert` (#186);
før brukte status, fullmakt/brev og skjema tre ulike omfang. En eldre hendelse med
feltet `false` ved EO prekluderer ikke'''

[[gruppe.vedtak]]
vedtak = '''
B-13 «frafalt» (§ 32.3 c) avvises utenfor irregulær endring og valgrett'''
vedtatt = "24.09, oppdragsgiver"
folge = '''
Bygget 04.10 i forretningsreglene (#63). Merknad 15.10: [GR-U18](#gr-u18) tillater frafall også ved samordning og svar på varsel, og forkastet at denne raden står.'''

[[gruppe.vedtak]]
vedtak = '''
Byggherren kan svare «avslått» og samtidig påberope at grunnlaget er varslet for sent (§
32.2). Begge grunner gjelder; preklusjonen er hovedgrunnen, og avslaget gjelder
subsidiært'''
vedtatt = "05.10, oppdragsgiver"
folge = '''
Godtas i dag (K 05.10). Brev, visning og standpunkt må vise begge, med preklusjonen
først (B-14, M1)'''

[[gruppe.vedtak]]
vedtak = '''
