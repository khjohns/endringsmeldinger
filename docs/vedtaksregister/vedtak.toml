[[gruppe.vedtak.alternativ]]
navn = "D"
tekst = '''
TE kan endre sin opplysning etter VS-U26 om når pålegget ble mottatt eller TE ble klar over forholdet, i et eget brev med henvisning til brevet med opplysningen. Brevet er ikke en ny kravversjon og avslår ikke byggherrens svar. Det sier: ‹TE oppgir nå at <pålegget ble mottatt \| TE ble klar over forholdet> <dato>. I brev <n> av <dato> oppga TE <dato>.› Den nye opplysningen gjelder straks som TEs siste opplysning, uten byggherrens godkjenning, også når datoen er senere. Den nye opplysningen erstatter ikke innholdet i tidligere brev eller premissene i tidligere svar. Tidligere opplysninger beholdes og vises, og visningen sier hvilken opplysning et svar gjaldt. Løsningen avgjør ikke hvilken opplysning som er riktig, når varslingsfristen begynte å løpe eller om varselet var rettidig. En ny grunnlagsversjon kan ikke endre datoen. Den gjengir TEs siste opplysning, med henvisning til brevet med korrigeringen, og endrer ikke tidligere brev eller premissene i tidligere svar. I underkategorien endringsordre, der TE ikke oppgir noen slik dato, avvises brevet. Brevet godtas også i et spor med enighet og når kravene er avgjort, og det endrer ikke utfallet. Et svar byggherren alt har gitt, står med virkningen det hadde. Byggherren tar stilling til opplysningen i et senere svar der rettidigheten etter den aktuelle bestemmelsen behandles, eller i en revisjon som ellers er tillatt (HF-U5). Sporet venter ikke på et nytt svar i løsningen, og løsningen avgjør ikke om korrigeringen gir byggherren en plikt etter kontrakten (MM-U12). Korrigeringen gir ikke byggherren adgang til å svekke et svar som alt er gitt. En påberopelse byggherren alt har fremsatt, bevares med tidspunktet (VS-U9). Har byggherren i et utsagn sendt fra løsningen uttrykkelig sagt at varselet kom i tide, eller gitt opp innsigelsen, står det (HF-U4). Snevrer inn MM-U21 for datoopplysningen i VS-U26, og snevrer inn GR-U22. Presiserer VS-U26. Utvider OV-U3 og LV-U4. OV-U11 står. OV-U41 avgjøres i alternativ E.'''

[[gruppe.vedtak.alternativ]]
navn = "E"
tekst = '''
TE kan endre opplysningen om når TE ble klar over at økte utgifter på grunn av nedsatt produktivitet eller forstyrrelser på annet arbeid ville påløpe (§ 34.1.3 annet ledd), i et eget utsagn med henvisning til varselet det gjelder. Den nye opplysningen gjelder straks som TEs siste opplysning, uten byggherrens godkjenning, også når datoen er senere. Den erstatter ikke innholdet i tidligere brev eller premissene i tidligere svar. Alle datoene TE har oppgitt, beholdes og vises, og visningen sier hvilken opplysning et svar gjaldt. Løsningen avgjør ikke hvilken dato som faktisk eller rettslig skal legges til grunn, og beregner ikke rettidighet eller preklusjonsvirkning. Et svar byggherren alt har gitt, står med virkningen det hadde. Byggherren tar stilling i et senere svar der rettidigheten behandles, eller i en revisjon som ellers er tillatt (HF-U5). Sporet venter ikke på et nytt svar i løsningen. Endringen gjelder bare TEs opplysning om når TE faktisk ble klar over det, ikke varseldatoen etter OV-U11 og ikke når TE burde ha blitt klar over det. Endrer OV-U41 på punktet om retting til TEs fordel. Snevrer inn MM-U21.'''

[[gruppe.vedtak]]
id = "OV-U53"
dato = 2026-10-25
hvem = "oppdragsgiver"
kilde = ["#1282"]
sporsmal = '''
Spørsmål 5. TEs opplysning om mottaksdato eller kunnskapsdato i grunnlagskravet (VG-D-01)

**Forholdet til andre vedtak.** Endrer OV-U41 på punktet om retting til TEs fordel. Snevrer inn MM-U21.'''
valgt = "E"
svar = '''
«Enig med dere». Spørsmål 5, alternativ E: ja. Det endrer OV-U41.'''
forhold = [{ art = "endrer", vedtak = "ov-u41" }, { art = "snevrer inn", vedtak = "mm-u21" }]
folge = '''
Bygges i #1171.'''

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
TEs opplysning om når pålegget ble mottatt eller TE ble klar over forholdet, settes én gang i grunnlagskravet. En ny grunnlagsversjon kan ikke endre den. TE retter den etter MM-U21 med henvisning til brevet med opplysningen. En tidligere dato er en retting i byggherrens favør og erstatter den tidligere opplysningen i løsningen straks. En senere dato er en retting til TEs fordel og erstatter ikke den tidligere opplysningen i løsningen før byggherren har godtatt den. Alle datoene TE har oppgitt, beholdes og vises som TEs utsagn. Rettingen endrer ikke virkningen av et svar byggherren allerede har gitt. Virkningen av en senere ny kravversjon følger HF-U8. Løsningen avgjør ikke når varslingsfristen begynte å løpe, eller om varselet var rettidig. Utvider rettingsmodellen i OV-U41 til datoopplysningen i VS-U26, presiserer VS-U26 og snevrer inn GR-U22. Følger MM-U21.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
TE kan i en ny grunnlagsversjon endre sin opplysning om når pålegget ble mottatt eller TE ble klar over forholdet. Adgangen gjelder bare når en ny grunnlagsversjon ellers er tillatt, og åpner ikke for en ny versjon etter enighet eller etter at kravene i saken er avgjort (KA-U7, OV-U3). Endres datoen, viser brevet både den nye datoen og datoen TE oppga i forrige versjon, med henvisning til det tidligere brevet. Tidligere opplysninger og brev står uendret, og alle datoene TE har oppgitt, beholdes og vises som TEs utsagn. Den nye datoen er TEs opplysning, ikke en dato løsningen har fastslått som riktig. En opplysning om når TE faktisk ble klar over forholdet, fastslår ikke når TE burde ha blitt klar over det. Byggherren tar stilling til rettidigheten i svaret der rettidigheten etter den aktuelle bestemmelsen behandles, og kan der godta eller bestride datoen. Et svar på vederlag eller frist som alt er gitt, står etter en ny grunnlagsversjon (HF-U21). En ny grunnlagsversjon åpner ikke i seg selv for et nytt svar eller en revisjon i vederlags- eller fristsporet. Byggherren kan behandle den endrede opplysningen i et senere svar på en tillatt ny kravversjon i det aktuelle sporet, eller i en revisjon som ellers er tillatt etter HF-U5, GR-U7 og OV-U3. Har byggherren i et utsagn sendt fra løsningen uttrykkelig sagt at varselet kom i tide, eller gitt opp innsigelsen, avvises en senere påberopelse av at det samme varselet kom for sent etter samme bestemmelse, også etter en endret dato (HF-U4). En påberopelse byggherren alt har fremsatt, bevares med tidspunktet, og et senere svar gjentar den som utgangspunkt (VS-U9, VS-U11). Løsningen avgjør ikke når varslingsfristen begynte å løpe, eller om varselet var rettidig. Når opplysningen endres gjennom en ny grunnlagsversjon etter GR-U22, behandles endringen etter reglene for nye kravversjoner og ikke etter rettingsmodellen i MM-U21. Dette innebærer ikke i seg selv at det foreligger et nytt rettslig krav eller at noen varslingsfrist begynner på nytt. Brevsetningen gjelder bare nye brev (MM-U9). Presiserer GR-U22 og VS-U26, snevrer inn MM-U21 for endring av datoopplysningen i VS-U26 gjennom en tillatt ny grunnlagsversjon, og utvider LV-U4.'''

[[gruppe.vedtak.alternativ]]
navn = "C"
tekst = '''
En ny grunnlagsversjon kan endre TEs opplysning om når pålegget ble mottatt eller TE ble klar over forholdet. Den nye datoen gjelder straks som TEs opplysning, og brevet viser bare den. Presiserer GR-U22 og VS-U26, og snevrer inn MM-U21 for endring av datoopplysningen i VS-U26 gjennom en tillatt ny grunnlagsversjon.'''

