folge = '''
Bygget 16.10 i PR #654 (#574, #595 punkt 1): et krav, svar, aksept og trekk i et registrert brev gir ingen virkning i utledningen, unntatt et svar som er byggherrens endringsordre etter OV-U6 (`dokumentasjonIBrevet` i `kjerne/utledning/utled.ts`). Et varsel med datoen TE oppgir, har fortsatt virkning (OV-U5). Gjeldende krav er bare kravversjoner med virkning, altså ikke i et registrert brev. OV-U4 sier ikke hva endringene av VS-U11 og VS-U8 er. Leses endringen av VS-U11 som setningene om registrerte svar, er den bygget med dette: et registrert svar gir eller opphever ingen innsigelse (`harSagtITide`). Leses endringen av VS-U8 som bestridelsen av datoen, er den ikke bygget: bestridelsen er utsatt etter OV-U7, og kommandoen godtas fortsatt (`forutsetninger.ts`). Ikke bygget i PR #654: visningen ved «venter på svar» (T2) og fristveiledningen, som viser at motparten har registrert brev i sporet. Kjernen har ingen kommando som registrerer et krav eller svar (`skriving.ts`). Reglene i OV-U4 for at en registrering godtas når kravene er avgjort, etter godtatt avslag, etter trukket grunnlag og i en sak som ikke er forstått, holder for en begrunnelse, registrert eller fra appen, unntatt i en sak som ikke er forstått (KA-U34 i `forutsetninger.ts`). Et registrert varsel, som har virkning etter OV-U5, avvises i alle fire tilfellene (`forutsetninger.ts`). I en sak som ikke er forstått, er det etter OV-U4. `ingen_krav` i et registrert brev har fortsatt virkning (åpent spørsmål 8 i PR #654, #587 med #493). Begrunnelse, innsigelse, protest, passivitet og bestridelse i et registrert brev leses som før (bestridelse, protest og passivitet er utsatt etter OV-U7; resten av #587). Funnene fra reviewet av PR #654: #669. Revisjonskontrollen etter HF-U5 med et registrert svar imellom: #626. Endret 18.10 i PR #796 (#770): bestridelse, også av datoen og av § 31.3, avvises med IKKE_I_FOERSTE_VERSJON etter OV-U7, og kommandoen tilbys ikke lenger. Leseren leser fortsatt en bestridelse i journalen.'''

[[gruppe.vedtak.alternativ]]
navn = "Ja"
tekst = '''
i første versjon er et brev sendt utenfor appen og registrert i den dokumentasjon. Det vises ved sporene eller saken den som registrerer, velger, med datoen avsenderen oppgir, brevet som vedlegg og merknaden «Appen vurderer ikke innholdet». Appen utleder ingenting av det: ingen standpunkt, enighet, sperre eller uavklart utfall, og den fryser ingen vurdering av det. Unntakene står i OV-U5 og OV-U6. Partene tar brevet i betraktning når de svarer i appen. En senere begrunnelse sendt utenfor appen registreres også som dokumentasjon. Hver side registrerer bare sine egne brev, som etter KA-U20. Skjemaet sier, i stedet for det KA-U19 sier om sperren, at et brev sendt utenfor appen ikke endrer det parten sender fra appen, og at parten er bundet av det hen sender fra appen. Ved «venter på svar» og fristveiledningen viser visningen at motparten har registrert brev i sporet. Registreringen godtas også når kravene er avgjort (OV-U3), når TE har godtatt avslaget på grunnlaget, og når grunnlaget er trukket. Er saken ikke forstått (MM-U2), godtas registreringen, men ikke unntakene i OV-U5 og OV-U6.'''

