[[gruppe.vedtak]]
id = "GFK-U5"
dato = 2026-10-18
hvem = "oppdragsgiver"
kilde = ["runde 8 (#764)", "#818"]
sporsmal = '''
S1 (header «Godkjenner»): Fullmaktshaveren (f.eks. adm. dir.) er typisk ikke i Catenda eller i et team (ditt svar i #818). I dag ser bare innloggede prosjektmedlemmer (Catenda) saken, og et svar til godkjenning er et utkast som bare teamet som skrev det, ser (B-04 punkt 3). Hvordan skal fullmaktshaveren se og godkjenne svaret i første versjon?
«Prosjektmedlem, ikke teammedlem (Recommended)»: Godkjenneren logger inn med Catenda og er medlem av prosjektet, men trenger ikke være med i teamet. Utvider skjermingen av utkast: et svar til godkjenning er også synlig for godkjennerne i kjeden (B-04 punkt 3).
«Må være i teamet nå»: Godkjenneren må være medlem av byggherrens team, som i dag. Skjermingen av utkast er uendret.
«Egen innlogging nå»: Godkjennere uten Catenda logger inn med virksomhetens egen innlogging, og kjeden hentes fra organisasjonshierarkiet. Styrer: godkjenningsinngangene venter til dette er bygget.

O1 (header «S-1b»): Du svarte at fullmaktshaveren logger inn med Entra ID, som bygges senere, og at fullmakten følger rollen i HR-dataene. Skal godkjenningen bygges nå eller vente?
«Venter på Entra og HR (Recommended)»: Godkjenningsinngangene bygges når innloggingen med Entra ID og rollene fra HR-dataene finnes, så de ikke bygges på fullmaktsregisteret som nå skal endres. Runde 8 tar V-3, registreringen av prosjekt og team (F-1) og navn ved visning (F-1b).
«Bygges nå, Entra senere»: Godkjenningen bygges nå for den som har registrert fullmakt, uavhengig av team. Til Entra ID finnes, kan bare en godkjenner med Catenda-innlogging godkjenne. Utvider skjermingen av utkast til godkjennerne i kjeden (B-04 punkt 3).'''
valgt = "Venter på Entra og HR"
svar = '''
Fritt svar på S1, som ikke passet på et alternativ og ble fulgt opp med O1: «Egen innlogging ka. Entra id. Bygges senere»

O1: «Venter på Entra og HR (Recommended)»'''

[[gruppe.vedtak.alternativ]]
navn = "Venter på Entra og HR"
tekst = '''
Godkjenningsinngangene bygges når innloggingen med Entra ID og rollene fra HR-dataene finnes, så de ikke bygges på fullmaktsregisteret som nå skal endres.'''
anbefalt = true

