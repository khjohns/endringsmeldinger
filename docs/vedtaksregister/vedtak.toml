[[gruppe.vedtak]]
id = "HF-U16"
dato = 2026-10-16
hvem = "oppdragsgiver"
kilde = ["#502"]
sporsmal = '''
Akseptfristen (HF-U5, HF-U15, #502), spørsmål 1: når er fristen ute? Eksempel: BH godkjenner 300 av 500 000 kr 10. mars med akseptfrist 24. mars. Avtaleloven § 2 første ledd: aksepten må «være kommet frem til ham, før fristen er ute». Kommentar 7 til § 2, som viser til forarbeidene: en frist «inden 15de juni» holder om aksepten kommer fram «i løpet av den 15de juni». NS 8407 § 6 forlenger en frist som ender på en lørdag, helligdag eller høytidsdag, men verken § 6 eller avtaleloven sier om det gjelder en akseptfrist byggherren setter selv.

- **A: utløp ved dagens slutt (Anbefalt).** «Akseptfristen er en dato i svaret, og den er ute ved utgangen av datoen i norsk tid. En aksept som appen registrerer senest den dagen, regner appen som i tide. Om aksepten kom fram i tide etter avtaleloven § 2, avgjør ikke appen (MM-U12). Byggherren kan ikke sette en frist som ligger før datoen for svaret, eller som faller på en lørdag, helligdag eller høytidsdag (NS 8407 § 6).» Presiserer HF-U5 og HF-U15.
- **B: appen forlenger etter § 6.** «Akseptfristen er en dato i svaret, og den er ute ved utgangen av datoen. Faller den på en lørdag, helligdag eller høytidsdag, forlenger appen den til nærmest følgende virkedag (§ 6).» Presiserer HF-U5, men strider mot MM-U12 og HF-U13: appen avgjør da om § 6 gjelder, og leser fristen annerledes enn den står i brevet.'''
valgt = "A"
svar = '''
A: utløp ved dagens slutt (Anbefalt)'''
forhold = [{ art = "presiserer", vedtak = "hf-u5" }, { art = "presiserer", vedtak = "hf-u15" }, { art = "presiserer", vedtak = "hf-u8" }]
folge = '''
Spørsmålene 1–4 om akseptfristen kom fra kartleggingen av #502 16.10. Forholdene til HF-U5 og HF-U15 sto i spørsmålet. Forholdet til HF-U8, som sier når svaret faller bort, fant kontrollen av føringen 16.10. Ikke bygget (#502).'''

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
Akseptfristen er en dato i svaret, og den er ute ved utgangen av datoen i norsk tid. En aksept som appen registrerer senest den dagen, regner appen som i tide. Om aksepten kom fram i tide etter avtaleloven § 2, avgjør ikke appen (MM-U12). Byggherren kan ikke sette en frist som ligger før datoen for svaret, eller som faller på en lørdag, helligdag eller høytidsdag (NS 8407 § 6).'''

[[gruppe.vedtak.alternativ]]
