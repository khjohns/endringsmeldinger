tekst = '''
Et registrert brev blir ikke et eget dokument i Catenda, fordi det alt er sendt utenfor appen. Brevet som ligger ved, lagres i Catenda som vedlegg (P4). Visningen sier at brevet er sendt utenfor appen, ikke at levering mangler.'''
