[[gruppe.vedtak]]
id = "HF-U20"
dato = 2026-10-16
hvem = "oppdragsgiver"
kilde = ["#502"]
sporsmal = '''
Akseptfristen (HF-U15, HF-U17), funn i den samlede vurderingen. Et helt avslag har ingen akseptfrist (HF-U15), og et svar uten akseptfrist kan ikke få en ved revisjon (HF-U17). Eksempel: byggherren avslår et krav på 500 000 kr helt 10. mars. 20. mars reviderer byggherren svaret til 300 000 kr. Etter ordlyden kan det reviderte svaret aldri få en akseptfrist, selv om byggherren kommer TE i møte. Grunnen til regelen i HF-U17 er at en frist ikke skal forkorte en binding som allerede finnes. Et helt avslag binder ingenting. Hva skal gjelde?

- **Ja, frist tillatt (Anbefalt).** «Reviderer byggherren et helt avslag til et svar som godkjenner et beløp eller dager, prinsipalt eller subsidiært, uten å stemme med kravet, kan det reviderte svaret ha en akseptfrist.» Presiserer HF-U17. Følger av HF-U6, fordi et helt avslag ikke har gitt TE noe å miste.
- **Nei, HF-U17 står.** «Et svar uten akseptfrist kan ikke få en ved revisjon, heller ikke når det reviderte svaret godkjenner noe for første gang.» HF-U17 står som den er. Byggherren må da sende et nytt svar uten frist, eller la være å revidere.'''
valgt = "Ja, frist tillatt"
svar = '''
Ja, frist tillatt (Anbefalt)'''
forhold = [{ art = "presiserer", vedtak = "hf-u17" }]
folge = '''
Følger av HF-U6. Funnet kom fra den samlede vurderingen av vedtakene som oppdragsgiver bestilte 16.10. Ikke bygget (#502).'''

