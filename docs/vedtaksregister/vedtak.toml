Snevrer inn [KA-U27](#ka-u27), delen om merket brev, etter [KA-U26](#ka-u26): sperren
gjelder i de sporene merkingen gjelder. Det andre KA-U27 avviser trekket for, et
fradrag, er uendret. Av «en enighet trekket rammer» i KA-U27 følger at et trekk av
grunnlaget avvises, i samme eksempel, når brevet er merket bare for vederlaget og ikke
avklart, fordi trekket rammer enigheten om vederlaget ([GR-U5](#gr-u5)). I skjemaet er
alle spor utgangspunktet når den som merker, oppgir sporene (KA-U26). Ikke bygget. Bygges ikke i første versjon (OV-U7).'''

