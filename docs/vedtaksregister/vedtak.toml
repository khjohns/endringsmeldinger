kilde = ["#1047"]
sporsmal = '''
Spørsmål A1, «Varselet etter § 34.1.3»: Etter OV-U25 gjelder kravet om særskilt varsel i § 34.1.3 tredje ledd, slik Del II pkt. B.2.16 endrer det, bare kravet etter annet ledd: økte utgifter på grunn av nedsatt produktivitet eller forstyrrelser på annet arbeid. LV-U19 gir brevteksten for varselet etter § 34.1.2, og ingen vedtak gir teksten for varselet etter § 34.1.3. Hvilken brevtekst skal varselet ha? Anbefalt: A, fordi varselet etter tredje ledd skal være særskilt for kravet etter annet ledd, og ordlyden i annet ledd sier hvilket krav det er.'''
valgt = "Med kravet etter annet ledd"
svar = '''
«Med kravet etter annet ledd (Recommended)»'''
forhold = [{ art = "presiserer", vedtak = "ov-u5" }]
folge = '''
Svaret er gitt med spørsmålsverktøyet 23.10. Spørsmålet og alternativene står ordrett på #1047 (kommentaren 6357614532), og svaret i kommentaren 6357708663. Spørsmålet kaller vedtaket A1. Bygges i #1185.'''

[[gruppe.vedtak.alternativ]]
navn = "Med kravet etter annet ledd"
tekst = '''
Brevteksten for TEs varsel etter § 34.1.3: «TE varsler etter NS 8407 § 34.1.3 tredje ledd at TE vil kreve særskilt justering av vederlaget etter annet ledd for økte utgifter på grunn av nedsatt produktivitet eller forstyrrelser på annet arbeid som følge av forholdet i sak <saksnummer> («<sakstittel>»).» Opplysningen om et varsel sendt utenfor appen: «TE opplyser at varsel om særskilt justering for nedsatt produktivitet eller forstyrrelser etter NS 8407 § 34.1.3 tredje ledd ble sendt <dato>.» Endret tekst gjelder bare nye brev (MM-U9). Presiserer OV-U5.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Bare bestemmelsen"
tekst = '''
Brevteksten for TEs varsel etter § 34.1.3: «TE varsler etter NS 8407 § 34.1.3 tredje ledd at TE vil kreve særskilt justering av vederlaget etter annet ledd som følge av forholdet i sak <saksnummer> («<sakstittel>»).» Opplysningen om et varsel sendt utenfor appen: «TE opplyser at varsel om særskilt justering etter NS 8407 § 34.1.3 tredje ledd ble sendt <dato>.» Endret tekst gjelder bare nye brev (MM-U9). Presiserer OV-U5.'''
forkastet = true

