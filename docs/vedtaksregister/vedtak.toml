Vedtak om retning. Ingen produksjonskode er portet. Grunnlaget er [arkitekturforslaget,
avsnitt 7](../forslag-maalarkitektur-og-beslutningsproeve-2026-10-07.md#anbefaling) og
B-15. Oppdragsgiver bestemte 09.10 (merknaden 09.10 til B-14): TS-kjernen bygges i en
egen permanent mappe fra #308, for eksempel `kjerne/` i roten, med typesjekk, prettier,
arkitekturtest og regelversjonsvakt i CI. Kjernen er ren kode og avhenger ikke av B-18.
#308 flytter målmodellen dit. Valget godkjenner fortsatt ikke prøvekoden som
produksjonskjerne. Valget av serverlag er [B-18](#b-18) (10.10)'''

[[gruppe.vedtak]]
anker = "b-17"
vedtak = '''
B-17: TS tar over skrivingen i KOE-saker samlet, ikke én kommando om gangen. TS eier
KOE-domenet: kommandoene, valideringen, utledningen, journalhendelsene,
beslutningsgrunnlaget og enighetsgrunnlaget. Byttet omfatter alle som skriver i eller
påvirker en KOE-sak: skjemaer, API, batch, godkjenningspublisering, webhooks og
bakgrunnsjobber. Ingen Python-funksjon skal endre KOE-journalen etter byttet, heller
ikke indirekte gjennom endringsordre eller forsering. Python kan beholde levering og
integrasjon: gjengi og levere frosne brev, Catenda og tekniske leveringsresultater.
Python tolker ikke KOE-journalen for å avgjøre hva et brev betyr eller hva partene kan
gjøre. Andre sakstyper kan bli i Python med en uttrykkelig kontrakt mot TS. Dagens
testsaker forkastes, og det bygges ingen kompatibilitetsleser for gamle Python-rader;
bevis-sakene og domenetabellen føres videre. TS-kjernen bygges og prøves trinnvis, men
skrivestien aktiveres samlet. Forkastet: gradvis overtakelse av enkeltkommandoer med to
skrivere i samme sak (2.8 i
[modellforslaget](../forslag-maalmodell-2026-10-09.md#28-overgangsgrensen)), fordi
kompatibilitet begge veier koster mer enn den gir uten reelle data'''
vedtatt = "09.10, oppdragsgiver etter målmodellen (#304)"
folge = '''
Erstatter overgangsgrensen i 2.8 som arbeidshypotese. B-10 (#273) gjelder fortsatt, men
formatet velges uten hensyn til at dagens Python-kjerne skal lese det.
Serverplasseringen er [B-18](#b-18). Oppdragsgiver bestemte samme dag (merknaden 09.10
til B-17): endringsordre- og forseringssakene går til TS sammen med KOE-sakene. EO-U2 og
EO-U3 krever at kandidatkontrollen og eksklusiviteten avgjøres i samme transaksjon som
KOE-saken, og B-17 forbyr Python å endre KOE-saken indirekte. F2 slik den er skrevet,
utgår, og #309 og #310 utvides. Arbeidspakken er FK (avsnitt 5). Presisert 10.10 for
formatet av [HF-U2](#hf-u2). Python kan beholde levering og integrasjon så lenge de ikke
leser eller skriver i databasen selv, og bare til de flyttes ([B-19](#b-19))'''

[[gruppe.vedtak]]
anker = "ov-u1"
vedtak = '''
OV-U1: første versjon av TS-stien, den som skriver den første reelle hendelsen (#310),
dekker KOE-saken med de tre sporene: grunnlaget (§ 32, også § 32.2 og endringsordre
etter § 32.3 første ledd a i KOE-saken, GR-U12 og GR-U13), fristen og vederlaget, med
svar, aksept, trekk, «ingen krav», innsigelse etter § 5, forespørsel etter § 33.6.2 og
registrering av brev sendt utenfor appen. Forsering (§ 33.8, FO-U1–FO-U6), endringsordre
som egen sak (EO-sak, EO-U1–EO-U9) og justering av enhetspriser (§ 34.3.3) avvises til
de er bygget, etter #310. Det den ennå ikke kan, avvises og forenkles ikke. B-17 står:
etter byttet skriver Python ikke i noen av de tre sakstypene. Vedtakene om det som
avvises, står; avgrensningen gjelder bare rekkefølgen de bygges i. Forkastet:
endringsordre som egen sak i første versjon, som ville krevd at B-01 ble avgjort nå; og
hele domenet før #310, slik rekkefølgen i FK var'''
vedtatt = "10.10, oppdragsgiver (#358)"
folge = '''
Endrer rekkefølgen i FK (avsnitt 5): #310 kommer før byggedel 4 av #309 (endringsordre
og forsering) og før § 34.3.3 i byggedel 3. Hvilke bestemmelser i § 33 og § 34 som hører
til første versjon, skal paragrafmatrisen for #309 (PR #350) vise, innenfor
