første ekte sak venter til overføringen er vedtatt og bygget.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "H2"
tekst = '''
I første versjon oppretter TE en ny sak med riktig hjemmel eller endringsordre. Det er opprettelse av en ny sak, ikke overføring eller retting av den gamle, og den skjer uten trekk. Den gamle saken bevares, og sakene viser til hverandre. Før sending sier skjemaet: ‹Den nye saken endrer ikke krav, svar eller enigheter i den tidligere saken. Løsningen avgjør ikke om kravet omfattes av en tidligere enighet, eller om varsling og frister er ivaretatt.› Nøkkeltallene kan telle krav om samme forhold i begge sakene, og løsningen trekker ikke fra det ene; det dekkes av opplysningen om at krav i flere saker kan gjelde samme kostnad. Overføringen tilbys først når virkningen er vedtatt (#569). Presiserer GR-U22 og GR-U19. I tråd med svaret 25.10 på spørsmål 8.'''
anbefalt = true

[[gruppe.vedtak]]
id = "OV-U58"
dato = 2026-10-25
hvem = "oppdragsgiver"
kilde = ["#1282"]
sporsmal = '''
Spørsmål 6. Beløp med øre (VG-F-02)

6a. Presisjonen:

**Forholdet til andre vedtak.** ny regel. Presiserer OV-U39 («beløpet TE krever, i kroner ekskl. mva.»). At beløp i dag rundes av til øre, er ikke vedtatt.'''
valgt = "A"
svar = '''
«Støtter meg til Astra: 6a-A og 6b-A. De nye funnene styrker anbefalingen.»'''
forhold = [{ art = "presiserer", vedtak = "ov-u39" }]
folge = '''
Bygges i #1285 og #1301.'''

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
Beløp parten krever eller godkjenner, prinsipalt og subsidiært, også et anslått beløp ved regning (VS-U28), beløpet for hver post og beløpet etter en påberopt begrensning, oppgis i kroner med høyst to desimaler. Desimalkommaet bevares: 100 000,40 er 100 000 kroner og 40 øre. Et beløp med brøkdeler av øre, eller i et format løsningen ikke støtter, avvises tydelig. Det rundes ikke av og gjøres ikke om ved å fjerne skilletegn. Kontrollen gjøres på verdien parten sendte, før kontrollen av beløpene, resultatet, kravet om begrunnelse og sammenfallet utledes. Avsluttende nuller godtas når verdien fortsatt er et helt antall øre. Antatt kostnad ved forsering (FO-U2) og beløp i en endringsordre (EO-U8) følger samme regel når de bygges (OV-U1). Beregningsverdiene i OV-U39 og avrundingen av regnestykket står uendret.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
Beløp parten krever eller godkjenner, prinsipalt og subsidiært, også et anslått beløp ved regning (VS-U28), beløpet for hver post og beløpet etter en påberopt begrensning, oppgis i hele kroner. Et beløp med desimaler som ikke er null, avvises og rundes ikke av. Antatt kostnad ved forsering (FO-U2) og beløp i en endringsordre (EO-U8) følger samme regel når de bygges (OV-U1). Grensen gjelder ikke beregningsverdiene i OV-U39.'''
forkastet = true

[[gruppe.vedtak]]
id = "OV-U59"
dato = 2026-10-25
hvem = "oppdragsgiver"
kilde = ["#1282"]
sporsmal = '''
Spørsmål 6. Beløp med øre (VG-F-02)

6b. Sammenlikningen:

**Forholdet til andre vedtak.** endrer B-13 «til nærmeste krone» for beløp. Dagene endres ikke. Presiserer HF-U7: «krone» i «i kravets egen enhet: krone eller dag» er enheten, og beløpet sammenliknes med øre. I tråd med KA-U9. OV-U40 står uendret.'''
valgt = "A"
svar = '''
«Støtter meg til Astra: 6a-A og 6b-A. De nye funnene styrker anbefalingen.»'''
forhold = [{ art = "presiserer", vedtak = "hf-u7" }]
folge = '''
Endrer B-13 «til nærmeste krone» for beløp. Dagene endres ikke. I tråd med KA-U9. Bygges i #1285 og #1301.'''

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
Løsningen sammenlikner beløpene i krav og svar i hele øre, uten avrunding til hele kroner. Et beløp som er mindre gunstig for TE enn det krevde (KA-U9), er ikke full godkjenning av beløpet, selv om beløpene blir like når de rundes til hele kroner. De andre vilkårene for sammenfall står uendret. Løsningen avgjør ikke om partene likevel har inngått avtale etter en konkret rettslig vurdering (MM-U12).'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
Som i dag (B-13).'''
forkastet = true

[[gruppe.vedtak]]
id = "OV-U60"
dato = 2026-10-25
hvem = "oppdragsgiver"
kilde = ["#1282"]
sporsmal = '''
Spørsmål 7. Datoene bak forlengelsen i posten for rigg og drift (VG-G-02)

**Forholdet til andre vedtak.** utvider OV-U39 og presiserer OV-U37. I tråd med KT-U8 og MM-U23. Kontrollen av rekkefølgen er et produktvalg; den følger ikke av formelen i B.2.16.'''
valgt = "B"
svar = '''
B. Oppdragsgiver ordrett: «7B og 8A».'''
forhold = [{ art = "utvider", vedtak = "ov-u39" }, { art = "presiserer", vedtak = "ov-u37" }]
folge = '''
I tråd med KT-U8 og MM-U23. Bygges i #1171.'''

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
Saken viser ikke en egen overtakelsesdato. TE begrunner forlengelsen ut fra datoene kontraktsgrunnlaget bruker: faktisk igangsetting på byggeplass og den nye overtakelsesdatoen TE legger til grunn.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
TE oppgir i posten datoen TE legger til grunn for faktisk igangsetting på byggeplass, og den nye overtakelsesdatoen TE legger til grunn ved beregningen av forlengelsen. Løsningen avviser en ny overtakelsesdato som ikke er etter datoen for igangsetting. Datoene står i brevet og visningen som TEs opplysninger. Løsningen fastslår ikke at datoene er riktige eller at overtakelsesdatoen er avtalt. Byggherren kan oppgi egne datoer i svaret; de står som byggherrens opplysninger og erstatter ikke TEs. Datoer byggherren ikke oppgir, er ikke tatt stilling til, og løsningen fyller dem ikke inn med TEs. Datoene følger det OV-U39 sier om de andre verdiene, men inngår ikke i regnestykket. Avvikende datoer hindrer ikke i seg selv at løsningen registrerer enighet om beløpet, og løsningen avgjør ikke hva enigheten omfatter. Løsningen beregner eller kontrollerer ikke forlengelsen ut fra datoene, kontrollerer ikke datoene mot perioden og sammenlikner ikke datoene mellom saker. TE begrunner fortsatt hvilken forlengelse posten gjelder, og avgrensningen mot krav i andre saker.'''
anbefalt = true

[[gruppe.vedtak]]
id = "OV-U61"
dato = 2026-10-25
hvem = "oppdragsgiver"
kilde = ["#1282"]
sporsmal = '''
Spørsmål 8. Nøkkeltallene i prosjektoversikten (VG-G-04)

**Forholdet til andre vedtak.** presiserer MM-U28 og arbeidsvalgene 20.10 og 22.10 (#1029, #1052). I tråd med MM-U2, GR-U7, KA-U6, KA-U22, OV-U4, OV-U6, OV-U10, OV-U31, OV-U36 og OV-U37.'''
valgt = "A"
svar = '''
A. Oppdragsgiver ordrett: «7B og 8A».'''
forhold = [{ art = "presiserer", vedtak = "mm-u28" }]
folge = '''
Presiserer også arbeidsvalgene 20.10 og 22.10 (#1029, #1052). I tråd med MM-U2, GR-U7, KA-U6, KA-U22, OV-U4, OV-U6, OV-U10, OV-U31, OV-U36 og OV-U37. Bygges i #1310.'''

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
Nøkkeltallene for vederlag sier hva summene bygger på. ‹Krevd vederlag› er summen av TEs gjeldende krav i saker løsningen forstår og der kravet står, også når kravene er avgjort. Et trukket krav og en sak som er avsluttet ved et godtatt avslag på grunnlaget eller et trukket grunnlag, er ikke med. ‹Enighet om vederlag› er summen av beløpene løsningen leser som virksom enighet, enten TE har godtatt svaret eller svaret stemmer med kravet. Betinget enighet vises særskilt. En enighet uten virkning, som etter et godtatt avslag på grunnlaget, et trukket grunnlag eller et trukket vederlagskrav, er ikke med. En enighet uten beløp telles som antall, atskilt fra kronesummen. Byggherrens svar som TE ikke har godtatt, regnes ikke som enighet. Svar med et subsidiært standpunkt som TE ikke har godtatt, vises særskilt med beløpet byggherren godtar om ingen påberopelse fører fram. Hele beløpet i disse svarene er med, også poster som er godkjent prinsipalt, og merkingen sier det, og at beløpet ikke er enighet. Svar med bare prinsipale standpunkter som ikke er godtatt, er ikke med i noen sum. Samme beløp telles ikke både som svar og som enighet. Saker løsningen ikke forstår, er ikke med i noen sum, og oversikten sier ved summene hvor mange de er. Beløp i dokumenter som bare er registrert som dokumentasjon etter OV-U4, inngår ikke i summene. Byggherrens svar på grunnlaget avgjør om enigheten om et beløp er betinget eller virksom, også når svaret er en endringsordre registrert etter OV-U6. Kompensasjonen for rigg og drift i uendret byggetid er ikke med. Krav i flere saker kan gjelde samme kostnad, og løsningen kontrollerer det ikke.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
Nøkkeltallene står som i MM-U28.'''
forkastet = true

[[gruppe.vedtak]]
id = "OV-U62"
dato = 2026-10-26
hvem = "oppdragsgiver"
kilde = ["#1282"]
sporsmal = '''
Spørsmål 9. Hvilke registrerte brev som vises ved kravet (VG-H-03)

**Forholdet til andre vedtak.** Utvider OV-U20 og OV-U4.'''
valgt = "B"
svar = '''
B, med forholdet til OV-U4. Oppdragsgiver ordrett: «Jeg er enig med dere».'''
forhold = [{ art = "utvider", vedtak = "ov-u20" }, { art = "utvider", vedtak = "ov-u4" }]
folge = '''
Bygges i #1304.'''

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
Ved kravet som venter på svar viser løsningen den som leser, motpartens registrerte brev som hører til sporet eller saken og ikke er rettet: TE ser byggherrens, og byggherren ser TEs. Presiserer OV-U20.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
