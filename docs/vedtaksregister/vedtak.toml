[[gruppe.vedtak]]
anker = "ka-u33"
vedtak = '''
KA-U33: TEs krav om fristforlengelse fra appen må ha en begrunnelse, som utdypningen
under kravets låste tekst. § 33.6.1 sier at TE skal «angi og begrunne det antall dager
han krever som fristforlengelse», og § 33.7 viser til «et begrunnet krav med angivelse
av antallet dager fristforlengelse». Følgen er at skjemaet krever tekst, som KA-U24 gjør
for byggherren. Appen vurderer ikke om begrunnelsen er tilstrekkelig. Forkastet: «nei,
begrunnelsen er valgfri. Et krav uten begrunnelse sendes da fra appen, og om kravet er
«begrunnet» etter § 33.7, avgjør ikke appen.»'''
vedtatt = "11.10, oppdragsgiver (#369, #410)"
folge = '''
Spørsmålet står i versjon 4 av spørsmålene på #410, svaret på #369 (V3). I tråd med
[KA-U24](#ka-u24) for byggherrens svar og [KA-U19](#ka-u19): appen tolker ikke
utdypningen. Brevteksten for fristkravet står i [LV-U4](#lv-u4), punkt 3. Ikke bygget.
Skjemaet hører til #313'''

[[gruppe.vedtak]]
anker = "ka-u12"
vedtak = '''
KA-U12: TE kan si uttrykkelig at det ikke kreves vederlag eller fristforlengelse i et
spor som ikke er sendt («ingen krav»). Utsagnet lukker sporet på samme måte som et
trekk: det teller som trukket i KA-U11 og som oppgjort i EO-U5. Det er ikke et krav på 0
(KA-U8). Har byggherren godkjent grunnlaget, er godkjenningen endringsordren (§ 32.3
første ledd a, GR-U10). Har byggherren ikke svart på grunnlaget, kan byggherren svare
ved å utstede en endringsordre i en EO-sak som viser til KOE-saken (§ 32.3 første ledd
a). KOE-saken trekkes ikke. Forkastet: at byggherren utsteder endringsordren i en egen
EO-sak og TE trekker KOE-saken, fordi journalen da sier at TE trakk kravet om endring,
og fordi en godkjenning av grunnlaget allerede er en endringsordre; og å la begge veier
stå åpne'''
vedtatt = "09.10, oppdragsgiver (#308)"
forhold = [
  { art = "presiserer", vedtak = "ka-u11" },
  { art = "presiserer", vedtak = "eo-u5" },
]
folge = '''
Presiserer KA-U8, KA-U11 og EO-U5. Presisert 10.10 av [KA-U15](#ka-u15): TE kan si
«ingen krav» i fristsporet etter et varsel om fristforlengelse, men ikke før grunnlaget
er sendt, og hva TE gir avkall på, avgjøres før «ingen krav» tas i bruk. Presisert 10.10
av [KA-U17](#ka-u17): «ingen krav» er avkall, også for følger som ikke er kjent. At
godkjenningen er endringsordren, gjelder underkategoriene som § 32.2 gjelder for
(GR-U11, [KA-U13](#ka-u13); 09.10), og krever også § 31.3 ([GR-U13](#gr-u13); 10.10).
Ikke bygget: utsagnet er en ny kommando i #309. Hvordan EO-saken viser til KOE-saken når
den er byggherrens svar på grunnlaget, er avgjort 10.10 av [EO-U6](#eo-u6). Merknad
11.10 (oppdragsgiver): «på samme måte som et trekk» gjelder at sporet lukkes
([KA-U11](#ka-u11), [EO-U5](#eo-u5)). Hvor langt avkallet rekker, står i
[KA-U17](#ka-u17) og [KA-U25](#ka-u25) for «ingen krav» og i [KA-U14](#ka-u14) og
[KA-U22](#ka-u22) for et trekk. Bygges ikke i første versjon (OV-U7). Kontrollert 20.10 (#417): kjernen har kommandoen «ingen krav» med sperrene etter KA-U15, og utledningen og brevteksten leser den (`forutsetninger` i `kjerne/kommandoer/forutsetninger.ts`, `kjerne/utledning/utled.ts`, `kjerne/frosset/brevtekst.ts`), med test i `kjerne/tester/kjerne.test.ts` og bevis-sakene F-MM-IK1–IK6. Grensesnittet tilbyr ikke kommandoen. Avvisningen etter OV-U7 er ikke bygget, som Følge hos [OV-U7](#ov-u7) sier.'''

[[gruppe.vedtak]]
