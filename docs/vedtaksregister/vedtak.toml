[[gruppe.vedtak]]
anker = "ka-u16"
vedtak = '''
KA-U16: første versjon har ingen egen type for forbehold i byggherrens svar. Byggherren
bruker standpunktene som finnes. I et brev fra appen utleder appen virkningen av
standpunktet i den faste teksten. Den tolker ikke utdypningen, og vurderingen er appens
(MM-U12). Brevet er fortsatt det autoritative uttrykket for byggherrens standpunkt
(B-03). Et registrert brev med et forbehold appen ikke kan uttrykke, bevares med
teksten, men regnes ikke som en ubetinget godkjenning, og bindende handlinger som bygger
på det, sperres til det er avklart. Det gjelder ethvert ekte registrert brev med noe
appen ikke kan uttrykke: det bevares og forkastes ikke, og bindende handlinger som
bygger på det, sperres etter mønsteret i MM-U2. Begrunnelsen er at et forbehold ikke er
én ting, men for eksempel et delvis avslag, et vilkår, en avgrensning, et subsidiært
standpunkt eller en reservasjon om senere vurdering. Forkastet foreløpig: å støtte
utvalgte typer forbehold nå, der hver type får eget vedtak når den bygges; at et svar
med forbehold ikke gir sammenfall; at forbeholdet registreres uten virkning; og å forby
registrering av brev med forbehold'''
vedtatt = "10.10, oppdragsgiver etter sparring (#309)"
folge = '''
Endrer ingen vedtak. [KA-U15](#ka-u15) er dermed oppfylt for forbehold. Et forbehold kan
ikke lagres som ett felt. Presisert 10.10 av [KA-U19](#ka-u19) for brev fra appen og av
[KA-U20](#ka-u20) for registrerte brev: sperren følger det som faktisk bygger på det
appen ikke kan uttrykke. Presisert 11.10 av [KA-U26](#ka-u26). Ikke bygget (#309)'''

[[gruppe.vedtak]]
anker = "ka-u19"
vedtak = '''
KA-U19: i et brev fra appen beregner appen virkningen ut fra valgene parten gjør, og
tolker ikke utdypningen (KA-U16). Skjemaet sier det fast, uten å tolke teksten: appen
beregner virkningen ut fra valgene, og et forbehold appen ikke kan uttrykke, sendes
utenfor appen og registreres. Det som bygger på forbeholdet, sperres da (KA-U16,
KA-U20). Brevet får ingen ekstra tekst om dette, og hele brevet er fortsatt det
autoritative uttrykket for partens standpunkt (B-03). Forkastet: en fast setning i
brevet om hvor standpunktene står, fordi den ikke løser en motstrid mellom den faste
teksten og utdypningen; og ingen veiledning. Utsatt: et varsel styrt av ord i
utdypningen'''
vedtatt = "10.10, oppdragsgiver etter sparring (#309)"
forhold = [{ art = "presiserer", vedtak = "ka-u16" }]
folge = '''
Presiserer [KA-U16](#ka-u16) for brev fra appen og besvarer spørsmålet fra PR #356.
Gjelder også brev fra TE. Ikke bygget. Skjemaet hører til #313'''

[[gruppe.vedtak]]
anker = "ka-u20"
vedtak = '''
KA-U20: et registrert brev med noe appen ikke kan uttrykke (KA-U16), merkes av den som
registrerer. I første versjon registrerer hver side bare sine egne brev. Det er en
avgrensning av produktet, ikke et krav i kontrakten, og heller ikke avsenderens
vurdering ved registreringen blir rettslig bindende fordi den fryses (MM-U12). Sperren
gjelder handlingene som faktisk bygger på det appen ikke kan uttrykke. Bygger bare
handlingene i ett spor på forbeholdet, sperres de; kan avhengigheten ikke avgrenses, for
eksempel når en godkjenning av grunnlaget er betinget av prisen, sperres bredere. En
part kan også senere merke et registrert brev, som et nytt utsagn om det gamle brevet
med sendetid (MM-U12), og motparten kan bestride merkingen (MM-U7). Historikken skrives
ikke om. En enighet som faktisk er inngått, står (KA-U7, MM-U3), men appen fastslår ikke
at en enighet finnes når en part har merket at brevet den bygger på, hadde et forbehold:
uenigheten vises, og framtidige handlinger som bygger på enigheten, sperres. Sperren
oppheves av et nytt utsagn fra den som sendte brevet, sendt fra appen eller registrert,
som sier hva som avklares, og som uttrykker et standpunkt appen kan representere, for
eksempel en revisjon der den er tillatt (GR-U10, KA-U7), eller en ny ubetinget
godkjenning. Det nye utsagnet gjør ikke det gamle brevet ubetinget fra sendetidspunktet.
Appen kontrollerer at utsagnet kan representeres, ikke om tvisten er løst. Forkastet: at
alt som bygger på brevet, eller hele saken, sperres uansett avhengighet; at merking bare
kan skje ved registreringen; og at bare en revisjon opphever sperren. Utsatt: at
mottakeren registrerer motpartens brev uten at mottakerens vurdering styrer bindende
handlinger'''
vedtatt = "10.10, oppdragsgiver etter sparring (#309)"
forhold = [
  { art = "presiserer", vedtak = "ka-u16" },
  { art = "presiserer", vedtak = "ka-u7" },
  { art = "presiserer", vedtak = "mm-u3" },
  { art = "presiserer", vedtak = "ka-u11" },
]
folge = '''
Presiserer [KA-U16](#ka-u16): «det» i «bygger på det» leses som det appen ikke kan
uttrykke, og «til det er avklart» som et nytt utsagn som kan representeres. Presiserer
også [KA-U7](#ka-u7), [MM-U3](#mm-u3) og [KA-U11](#ka-u11) for en enighet som bygger på
et merket brev. Gjelder også en endringsordre med pris og tid etter [OV-U2](#ov-u2).
Følgen av at hver side registrerer sine egne brev: mottakeren kan ikke svare på eller
godta et brev i appen før avsenderen har registrert det, men kan svare utenfor appen og
registrere sitt eget svar. Presisert 11.10 av [KA-U26](#ka-u26) og [KA-U28](#ka-u28).
Ikke bygget. Kjernen hører til #309, registreringen til #310. Merkingen bygges ikke i første versjon (OV-U7).'''

[[gruppe.vedtak]]
anker = "ka-u26"
vedtak = '''
KA-U26: når en part har merket at et registrert brev hadde et forbehold appen ikke kan
uttrykke (KA-U20), sperres de bindende handlingene som bygger på det appen ikke kan
uttrykke, i de sporene merkingen gjelder. Blant dem er TEs aksept av svaret, at saken
inngår i en endringsordre (EO-U5), og trekk av grunnlaget når godkjenningen ellers ville
vært en endringsordre. At brevet ikke regnes som en ubetinget godkjenning (KA-U16), gir
sperren, ikke et uavklart grunnlag: utfallet leses som før, et svar med forbehold kan gi
sammenfall, og en enighet som faktisk er inngått, står (KA-U20). Visningen sier at et
brev er merket og at partene er uenige, og slår ikke fast at det finnes en enighet. Den
som merker, oppgir hvilke spor merkingen gjelder. En merking åpner aldri en sak der
kravene er avgjort. Forkastet: at et merket svar ikke gir sammenfall og at grunnlaget da
regnes som uavklart'''
vedtatt = "11.10, oppdragsgiver (#309, #394)"
forhold = [
  { art = "presiserer", vedtak = "ka-u16" },
  { art = "presiserer", vedtak = "ka-u20" },
  { art = "presiserer", vedtak = "eo-u5" },
  { art = "presiserer", vedtak = "ka-u11" },
]
folge = '''
Presiserer [KA-U16](#ka-u16), [KA-U20](#ka-u20), [EO-U5](#eo-u5) (sperren mot at saken
inngår i en endringsordre) og [KA-U11](#ka-u11) (en merking åpner ikke en avgjort sak).
Merknaden i [GR-U7](#gr-u7) sier at et slikt brev «er ikke en ubetinget godkjenning», og
«avklart» defineres av standpunktene ([MM-U13](#mm-u13)). I skjemaet er alle spor
utgangspunktet når den som merker, oppgir sporene. Ikke bygget. Bygges ikke i første versjon (OV-U7).'''
[[gruppe.vedtak]]
id = "KA-U34"
dato = 2026-10-12
hvem = "oppdragsgiver"
kilde = ["#309"]
sporsmal = '''
Senere begrunnelse fra byggherren, i alle spor: hva brevet sier, og når det kan sendes.

Belegg:
- § 32.3 tredje ledd: «Byggherren skal uten ugrunnet opphold etter at han har avslått kravet begrunne sitt avslag.» Bestemmelsen gjelder bare grunnlaget.
- KA-U24: «Kravet er appens atferd: for byggherrens svar i § 31–§ 35 krever NS 8407 begrunnelse bare i § 32.3 tredje ledd, og at innsigelser tapes når de ikke fremsettes i tide (§ 33.7 annet ledd), gir ikke samme plikt.»
- KA-U18 og KA-U24: «En begrunnelse som kommer senere, er et eget utsagn.»
- KA-U21: «En senere begrunnelse har ingen automatisk virkning på utfallet i appen, uten at det betyr at den er uten rettslig betydning.»
- KA-U31: «Et brev med svar i flere spor har én begrunnelse per svar som krever det, og den låste delen og begrunnelsen står da sammen per svar.»
- KA-U11: «Er kravene avgjort, avvises hver kommando som kan endre utfallet: trekk, ny kravversjon, varsel etter § 33.4 og byggherrens revisjon, også av et frafall.»
- LV-U3: «Det som ikke står i teksten, regnes ikke som meddelt.»

A: Byggherren kan sende en senere begrunnelse fra appen, per spor. Brevet sier: «Byggherren begrunner sitt svar på <grunnlaget / kravet om justering av vederlaget / kravet om fristforlengelse> i brev <n> av <dato>:», og byggherrens tekst følger. Begrunnelsen endrer ingen standpunkter. Den godtas også når kravene er avgjort, fordi den ikke kan endre utfallet. Den erstatter ikke begrunnelsen et svar fra appen må ha. Appen vurderer ikke om den er tilstrekkelig eller kom i tide.
Forhold: utvider LV-U4; presiserer KA-U18, KA-U24 og KA-U11; følger KA-U21 og MM-U12.

B: Utsagnet bygges, men i første versjon av TS-stien kan en senere begrunnelse bare registreres i et brev sendt utenfor appen. Brevteksten fra appen avgjøres etter første versjon av TS-stien.
Forhold: utvider OV-U1.

C: En senere begrunnelse kan ikke sendes fra appen før etter første versjon av TS-stien. Et brev sendt utenfor appen med en senere begrunnelse registreres og bevares likevel, etter KA-U16.
Forhold: utvider OV-U1.'''
valgt = "A"
svar = '''
A'''
forhold = [{ art = "utvider", vedtak = "lv-u4" }, { art = "presiserer", vedtak = "ka-u18" }, { art = "presiserer", vedtak = "ka-u24" }, { art = "presiserer", vedtak = "ka-u11" }]
folge = '''
Følger [KA-U21](#ka-u21) og [MM-U12](#mm-u12). Ikke bygget. Bygges ikke i første versjon (OV-U7).'''

