[[gruppe.vedtak]]
id = "GFK-U1"
dato = 2026-10-18
hvem = "oppdragsgiver"
kilde = ["runde 7 (#764)", "#818"]
sporsmal = '''
Hvem registrerer byggherrens fullmakter i appen?

Byggherrens interne godkjenning av svar regnes etter fullmakter (GFK-06), og § 31.3 krever at en endringsordre gis av byggherrens representant eller en person med skriftlig fullmakt. I dag står fullmaktene i appens oppsett, satt av driften; de skal flyttes til databasen, og da må det avgjøres hvem som fører dem.

A. Byggherren registrerer i appen (anbefalt): «Fullmaktene i appen gjengir fullmakter byggherren har gitt; appen gir ingen fullmakt selv. De registreres i appen av personer byggherren har utpekt til det, og bare for personer på byggherrens side. Hver endring står med tidspunkt og hvem som registrerte den, og en godkjenning vurderes etter fullmaktene som gjaldt da den ble gitt.»
B. Representanten registrerer: «Fullmaktene i appen gjengir fullmakter byggherren har gitt. Bare byggherrens representant etter § 9 kan registrere dem i appen. Hver endring står med tidspunkt og hvem som registrerte den.»
C. Driften setter dem opp: «Fullmaktene settes opp i appens oppsett av driften etter skriftlig bestilling fra byggherren. Appen viser ikke hvem som har endret dem.»

Anbefaling: A.

Belegg, ordrett fra vedtakene:
- B-04 punkt 2 (merknaden 23.09): «**En godkjenning** som ble gitt mens godkjenneren hadde fullmakt, står.»'''
valgt = "Driften setter dem opp"
svar = '''
«Driften setter dem opp»'''
folge = '''
Ikke bygget. Presiserer vedtaket 18.09 «Policy nøkles på `user_id`» og B-04 punkt 2.'''

