[[gruppe.vedtak]]
id = "OV-U41"
dato = 2026-10-24
hvem = "oppdragsgiver"
kilde = ["#1171"]
sporsmal = '''
Versjon 3 av spørsmålene i runde 46, punkt 4: Datoen TE ble klar over utgiftene, § 34.1.3 annet ledd (#1171, OV-U34)

**Forholdet til andre vedtak.** Presiserer OV-U34 og følger OV-U8, både at et nytt særskilt varsel avvises når det er sendt eller oppgitt et om det samme, og at appen ikke avgjør når TE ble eller burde ha blitt klar over utgiftene. Utvider OV-U5: varselet fra appen og brevet som oppgir et varsel sendt utenfor appen får én opplysning i tillegg til varseldatoen. Utvider OV-U24: når vederlagskravet er det første varselet appen kjenner, bærer det kunnskapsdatoen. Følger MM-U21 og er ikke et unntak fra det: en annen dato er et nytt utsagn med henvisning, varselet står uendret, en retting til TEs fordel erstatter den tidligere opplysningen i appen først når byggherren godtar den, og en retting i byggherrens favør gjelder som en revisjon i hans favør. Hvilken retning en retting har, leses av de to datoene TE selv har oppgitt; det er ingen vurdering av når TE ble eller burde ha blitt klar over utgiftene (OV-U8). Følger MM-U12: rettingsmodellen avgjør ikke hvilken dato som skal legges til grunn. Å supplere en dato TE ikke har oppgitt før, er ingen retting, men første opplysning, som i MM-U1 («Det er første registrering, ikke en flytting»). SK-12 og HF-U13 låser varseldatoen, ikke kunnskapsdatoen, og A endrer ikke det. MM-U21 og MM-U26 er ikke bygget, så rettingen av kunnskapsdatoen bygges med dem eller med #1171. Strider ikke mot et vedtak.'''
valgt = "versjon 3"
svar = '''
«Ja til versjon 3»'''
forhold = [{ art = "presiserer", vedtak = "ov-u34" }, { art = "utvider", vedtak = "ov-u5" }, { art = "utvider", vedtak = "ov-u24" }]
folge = '''
Spørsmålene er versjon 3 av runde 46, laget etter oppdragsgivers svar på versjon 2 («Øvrige spørsmål- se vurdering fra astra og vurder selv:») og den juridiske sparringen. Oppdragsgivers svar 24.10 gjelder hele versjon 3. Alternativet «versjon 3» er alternativ A i punkt 4, med rettelsene i versjon 3. Bygges i #1171.'''

[[gruppe.vedtak.alternativ]]
navn = "versjon 3"
tekst = '''
TE kan oppgi datoen TE ble klar over at økte utgifter på grunn av nedsatt produktivitet eller forstyrrelser på annet arbeid ville påløpe. Datoen kan stå i det særskilte varselet etter § 34.1.3 annet ledd, i vederlagskravet når det er det første varselet appen kjenner om det kravet (OV-U24), og i brevet der TE oppgir datoen for et særskilt varsel sendt utenfor appen (OV-U5). Opplysningen er valgfri og er TEs utsagn om når TE faktisk ble klar over det. Den sier ikke når TE burde ha blitt klar over det. Brevet viser den ved siden av varseldatoen: «TE oppgir å ha blitt klar over at utgiftene ville påløpe <dato>.» TE kan senere supplere en dato som ikke ble oppgitt, eller oppgi en annen dato, som et nytt utsagn med henvisning til varselet det gjelder, uten å sende et nytt varsel. Varselet og det TE oppga før, står uendret. I appens rettingsmodell er en senere dato enn den TE oppga før, en retting til TEs fordel etter MM-U21: den erstatter ikke den tidligere opplysningen i appen før byggherren har godtatt den. En tidligere dato er en retting i byggherrens favør og erstatter den tidligere opplysningen i appen straks (MM-U21). Alle datoene TE har oppgitt, beholdes og vises som TEs utsagn. Dette avgjør ikke hvilken dato som faktisk eller rettslig skal legges til grunn. Byggherren tar stilling til rettidigheten i svaret, og kan der godta eller bestride datoen, eller mene at TE burde ha blitt klar over det tidligere. Appen beregner ikke rettidighet eller preklusjonsvirkning av datoene. Et svar byggherren alt har gitt, står med virkningen det hadde (OV-U5). Appen har ingen annen kunnskapsdato for § 34.1.3. Presiserer OV-U34. Utvider OV-U5 for det særskilte varselet etter § 34.1.3 annet ledd. Utvider OV-U24: det utledede varselet kan bære kunnskapsdatoen. Følger MM-U21.'''

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
