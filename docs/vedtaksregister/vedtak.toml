[[gruppe.vedtak]]
anker = "vs-u9"
vedtak = '''
VS-U9: påberoper byggherren i et svar at TE har varslet eller svart for sent, er
påberopelsen innsigelsen etter § 5 tredje ledd. En egen innsigelse kan sendes før svaret
og etter svaret. Et senere svar viser til innsigelsen og gjentar den. Regelen fra
metodeprøven om hva en protest gjelder (MP-U6), tas inn i appen. At en innsigelse kan
sendes etter svaret, gjør den ikke rettidig. Den gjenoppliver ikke en tapt innsigelse og
endrer ikke et tidligere svar eller en enighet (GR-U10, KA-U7). Den første innsigelsen
og tidspunktet bevares, og en gjentakelse gir ingen ny frist. Forkastet: innsigelsen
alltid som eget utsagn'''
vedtatt = "10.10, oppdragsgiver etter sparring (#309)"
forhold = [
  { art = "presiserer", vedtak = "vs-u1" },
  { art = "utvider", vedtak = "vs-u1" },
]
folge = '''
Presiserer og utvider [VS-U1](#vs-u1): etter svaret er en egen innsigelse et nytt valg,
og VS-U1 sier bare at en innsigelse ikke avvises fordi den kommer etter at TE har
spesifisert kravet. Tar [MP-U6](#mp-u6) inn i appen. Unntaket i § 5 tredje ledd gjelder
fortsatt: «Dette gjelder ikke for krav, og for forespørsler etter 40.4, som fremsettes
for første gang i eller i forbindelse med sluttoppgjøret.» Unntak 10.10 i
[VS-U11](#vs-u11): byggherren kan gi opp innsigelsen uttrykkelig i et senere svar fra
appen. Utvidet 11.10 av [VS-U14](#vs-u14) til TE som mottaker. Ikke bygget (#309). Protestregelen bygges ikke i første versjon (OV-U7).'''

[[gruppe.vedtak]]
anker = "vs-u11"
vedtak = '''
VS-U11: byggherren kan i et senere svar fra appen gi opp sin egen innsigelse etter § 5
uttrykkelig. Svaret fra appen gjentar innsigelsen som utgangspunkt, og gir byggherren
den opp, sier brevet det. Det er partens nye utsagn som endrer standpunktet. Den første
innsigelsen og tidspunktet bevares, og en gjentakelse gir ingen ny frist. Gjelder
innsigelsen TEs varsel etter § 32.2, blir godkjenningen en endringsordre når vilkårene i
GR-U12 og GR-U13 er oppfylt. Appen utleder ikke at innsigelsen er oppgitt av taushet
alene (HF-U1): et registrert svar som ikke sier noe om rettidigheten, leses med
innsigelsen. Et registrert svar som uttrykkelig gir opp innsigelsen, registreres med det
standpunktet. Om et senere brev etter en konkret tolkning innebærer at innsigelsen er
oppgitt, avgjør ikke appen. Kan appen ikke uttrykke en motstrid, gjelder KA-U16.
Forkastet: at byggherren ikke kan gi opp innsigelsen i et svar fra appen'''
vedtatt = "10.10, oppdragsgiver etter sparring (#309)"
folge = '''
Gjør et unntak fra [VS-U9](#vs-u9) («Et senere svar viser til innsigelsen og gjentar
den»): gjentakelsen er utgangspunktet, ikke et krav. Utvidet 11.10 av [VS-U14](#vs-u14)
til TE som mottaker. Ikke bygget (#309)'''

[[gruppe.vedtak]]
anker = "vs-u14"
vedtak = '''
VS-U14: VS-U9 og VS-U11 gjelder tilsvarende når TE mottar et varsel, krav eller svar fra
byggherren og påberoper at det kom for sent, fordi § 5 tredje ledd gjelder «en part».
Påberopelsen i TEs svar er innsigelsen etter § 5, og TE kan gi den opp uttrykkelig i et
senere svar fra appen. Delen av VS-U11 om TEs varsel etter § 32.2 har ikke noe
