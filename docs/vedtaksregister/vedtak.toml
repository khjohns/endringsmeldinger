Målformen M2 er presisert 08.10 av [KA-U1](#ka-u1). Retningen for språket er vedtatt
09.10 (raden under), og B-15 er avgjort 09.10 ([B-15](#b-15)). B-16 står åpen (3.4)'''

[[gruppe.vedtak]]
vedtak = '''
B-14, språket: TypeScript er retning for den delte domenekjernen, som brukes både i
nettleseren og på serveren. Valget godkjenner ikke `sprakprove/kjerne/` som
produksjonskjerne. Deler kan gjenbrukes, og andre formes på nytt etter modellforslaget i
#300. Valget mellom serverlaget i SvelteKit, en egen backend og en eventuell permanent
Python-worker tas ikke her. Før en større portering kommer gjennomgangen av målmodellen
og overgangsgrensene (#300)'''
vedtatt = "09.10, oppdragsgiver etter språkprøven (#274)"
