En endringsordre byggherren registrerer etter OV-U6 og som viser til et registrert krav eller svar, gjelder som svar på gjeldende kravversjon av grunnlaget sendt fra appen, når en slik finnes. Finnes ingen, avvises registreringen. Forkastet: å avvise registreringen når et krav fra appen finnes.'''
forkastet = true

