[[gruppe.vedtak]]
id = "HF-U21"
dato = 2026-10-16
hvem = "oppdragsgiver"
kilde = ["#578", "#502"]
sporsmal = '''
Byggherrens svar på vederlag og frist etter en ny grunnlagsversjon med samme hjemmel (HF-U5 detalj 2). I dag gjelder dette: svarene binder ikke byggherren etter den nye versjonen, så hen kan revidere dem fritt, men godtar TE før revisjonen, blir partene enige (KA-U1, GR-U7). Eksempel: byggherren avslår grunnlaget og godkjenner subsidiært 300 000 av 500 000 kr. TE sender en ny versjon med utfylt beskrivelse. Byggherren vil så revidere til 100 000 kr. Etter GR-U22 er hjemmelen den samme, så grunnlaget for detalj 2 er svekket. En ny versjon er heller ikke et avslag på svaret (avtaleloven § 5).

- **A: bindingen står (Anbefalt).** «En ny grunnlagsversjon med samme hjemmel endrer ikke bindingen i byggherrens svar på vederlag eller fristforlengelse. Den er ikke et avslag på dem (avtaleloven § 5). Bindingen varer som etter HF-U5 og HF-U8. Et subsidiært standpunkt forblir subsidiært (GR-U1).» Opphever detalj 2 i HF-U5. Revisjonen i eksempelet avvises.
- **C: som i dag.** «Etter en ny grunnlagsversjon kan byggherren revidere sitt svar på vederlag og fristforlengelse fritt. Godtar TE svaret før det er revidert, er partene enige (KA-U1, GR-U7).» Presiserer HF-U5. Revisjonen i eksempelet er tillatt så lenge TE ikke har godtatt.
- **B: aksept er nytt tilbud.** «Etter en ny grunnlagsversjon binder svaret ikke. Godtar TE det, er aksepten et nytt tilbud som byggherren kan godta eller avslå (HF-U18, HF-U19).» Strider mot GR-U7 og snevrer inn KA-U1.'''
valgt = "A: bindingen står"
svar = '''
A: bindingen står (Anbefalt)'''
forhold = [{ art = "endrer", vedtak = "hf-u5" }, { art = "presiserer", vedtak = "hf-u8" }, { art = "presiserer", vedtak = "gr-u1" }]
folge = '''
Setningen i HF-U5 «Svar i vederlag og frist som ble gitt mens en tidligere grunnlagsversjon gjaldt, binder ikke etter en ny grunnlagsversjon (HF-U1).» gjelder ikke lenger. Resten av HF-U5 står. Forholdet til GR-U1 fant kontrollen av føringen 16.10: vedtaksteksten viser til at et subsidiært standpunkt forblir subsidiært. Spørsmålet var S2 i den samlede vurderingen 16.10 (#578). Bygget 16.10 i PR #622 (#502, del 1): bindingen i svar på vederlag og frist står etter en ny grunnlagsversjon med samme hjemmel. En revisjon sammenliknes med svaret den erstatter, uansett hvilken grunnlagsversjon svaret ble gitt mot, og en revisjon som senker et standpunkt, avvises med regelkoden SENKER_INNROEMMELSE. Et nytt svar på samme kravversjon avvises som før med ALLEREDE_SVART.'''

[[gruppe.vedtak.alternativ]]
navn = "A: bindingen står"
tekst = '''
En ny grunnlagsversjon med samme hjemmel endrer ikke bindingen i byggherrens svar på vederlag eller fristforlengelse. Den er ikke et avslag på dem (avtaleloven § 5). Bindingen varer som etter HF-U5 og HF-U8. Et subsidiært standpunkt forblir subsidiært (GR-U1).'''

[[gruppe.vedtak.alternativ]]
navn = "C: som i dag"
tekst = '''
Etter en ny grunnlagsversjon kan byggherren revidere sitt svar på vederlag og fristforlengelse fritt. Godtar TE svaret før det er revidert, er partene enige (KA-U1, GR-U7).'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "B: aksept er nytt tilbud"
tekst = '''
Etter en ny grunnlagsversjon binder svaret ikke. Godtar TE det, er aksepten et nytt tilbud som byggherren kan godta eller avslå (HF-U18, HF-U19).'''
forkastet = true

[[gruppe.vedtak]]
id = "HF-U22"
dato = 2026-10-16
hvem = "oppdragsgiver"
kilde = ["#578", "#502"]
sporsmal = '''
Etter akseptfristen binder svaret ikke byggherren i appen (HF-U17), så hen kan senke dager hen har godkjent. Etter vår tolkning kan innsigelsen likevel være tapt fordi den ikke kom innen svarfristen i § 33.7 annet ledd (for enhetspriser § 34.3.3 annet ledd). Under forsering kan TE ikke godta svaret (FO-U5), så akseptfristen løper alltid ut. Forsering og justering av enhetspriser er ikke bygget i første versjon (OV-U1), så nå gjelder dette bare dager etter § 33.7.

- **B nå, forsering senere (Anbefalt).** «Senker byggherren etter akseptfristen dager eller beløp hen har godkjent, viser appen § 33.7 annet ledd eller § 34.3.3 annet ledd med frist og bestemmelse, uten å trekke konklusjonen (VS-U2).» Presiserer VS-U2. Om fristsvaret binder under forsering, avgjøres når forsering bygges.
- **A: binder under forsering.** Som B, og i tillegg: «Så lenge en forseringssak viser til avslaget og TE derfor ikke kan godta svaret (FO-U5), faller svaret ikke bort ved akseptfristen, og en revisjon som senker godkjente dager, avvises (FO-U7).» Snevrer inn HF-U17 og utvider FO-U7. Vedtas nå, bygges med forsering.'''
valgt = "B nå, forsering senere"
svar = '''
B nå, forsering senere (Anbefalt)'''
forhold = [{ art = "presiserer", vedtak = "vs-u2" }, { art = "presiserer", vedtak = "hf-u17" }]
folge = '''
Alternativ A er ikke forkastet: om fristsvaret binder under forsering (FO-U5, FO-U7), avgjøres når forsering bygges (OV-U1). Forholdet til HF-U17 fant kontrollen av føringen 16.10: vedtaket sier hva appen viser når byggherren senker etter akseptfristen, som HF-U17 tillater. Spørsmålet var S4 i den samlede vurderingen 16.10 (#578). Ikke bygget (#502).'''

[[gruppe.vedtak.alternativ]]
navn = "B nå, forsering senere"
tekst = '''
Senker byggherren etter akseptfristen dager eller beløp hen har godkjent, viser appen § 33.7 annet ledd eller § 34.3.3 annet ledd med frist og bestemmelse, uten å trekke konklusjonen (VS-U2).'''

[[gruppe.vedtak.alternativ]]
navn = "A: binder under forsering"
tekst = '''
Så lenge en forseringssak viser til avslaget og TE derfor ikke kan godta svaret (FO-U5), faller svaret ikke bort ved akseptfristen, og en revisjon som senker godkjente dager, avvises (FO-U7).'''
