sporsmal = '''
Overskriften slik den står i kommentaren på #1095 (Q3, varsel etter § 34.1.2 der TE krever endring). Kommentaren har overskriften og alternativene, ingen spørsmålstekst.

Alternativene slik de står i kommentaren:

Godtas, uten virkning (Recommended): TE kan sende varsel etter § 34.1.2 fra appen i alle kategorier. Der TE krever endring (§ 33.1 a), er det ikke krav om varsel (§ 34.1.1). Skjemaet sier det, og varselet registreres og vises uten at appen utleder noen virkning av det. Byggherren tar ikke stilling til rettidigheten etter § 34.1.2 i en slik sak. Forhold: presiserer OV-U5.

Bare svikt og andre forhold: Varsel etter § 34.1.2 kan bare sendes og oppgis i svikt og andre forhold (§ 33.1 b–c). Der TE krever endring, avvises det, fordi TE har krav på justering uten varsel (§ 34.1.1). Forhold: snevrer inn OV-U5.'''
