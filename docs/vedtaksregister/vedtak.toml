[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
Godkjenner byggherren oppgjør som fast sum i et svar som etter løsningens regler gir sammenfall med kravet (GR-U7), og er svaret ikke gitt under forbeholdet for ubesvart grunnlag (GR-U26), sier brevet: ‹Byggherren godkjenner oppgjør som fast sum med beløpet som fremgår av svaret.› Ellers gjelder LV-U32. Endringen gjelder bare den faste setningen. Den endrer ikke hvordan utdypningen behandles eller når løsningen registrerer enighet (GR-U7, KA-U16), og den fastslår ikke at svaret er uten forbehold. Endrer LV-U32.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
