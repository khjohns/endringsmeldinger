[[gruppe.vedtak]]
id = "OV-U18"
dato = 2026-10-22
hvem = "oppdragsgiver"
kilde = ["#1045"]
sporsmal = '''
Spørsmålet «Feil sak», ordrett slik det ble vist i spørsmålsverktøyet:

#1045, spørsmål 3 av 3: hvordan rettes en registrering som står i feil sak? Avgjørelsen 17.10 (#276, punkt 12) sier at et registrert brev med feil sak rettes ved at brevet registreres på nytt med henvisning til den feilaktige registreringen. Hver sak har sin egen hendelsesstrøm, og en henvisning fra én sak til en annen må kontrolleres mot prosjektgrensen hver gang den leses. Svaret avgjør om appen trenger en henvisning mellom saker, og hva den feilaktige saken viser etterpå. Anbefaling: «Retting i begge saker», fordi hver sak da forklarer seg selv uten en henvisning mellom saker, og originalen står (#276).

Alternativene slik de ble vist:

Retting i begge saker (Recommended): Står en registrering av et brev sendt utenfor appen i feil sak, registrerer samme side i den saken en retting med henvisning til den feilaktige registreringen, som sier at brevet ikke hører til saken. Registreringen står i historikken og vises som rettet, og appen viser den ikke lenger ved sporene eller saken. Brevet registreres i riktig sak som en ny registrering, uten henvisning til den andre saken. Forhold: presiserer avgjørelsen 17.10 (#276, punkt 12) for feil sak.

Henvisning mellom saker: Står en registrering av et brev sendt utenfor appen i feil sak, registreres brevet i riktig sak med henvisning til den feilaktige registreringen i den andre saken. Begge sakene viser henvisningen, og den feilaktige registreringen vises som flyttet. Forhold: følger ordlyden i avgjørelsen 17.10 (#276, punkt 12). Krever en henvisning mellom saker som prosjektgrensen må kontrollere.

Feil sak rettes ikke: En registrering av et brev sendt utenfor appen i feil sak rettes ikke i appen. Brevet registreres i riktig sak, og den feilaktige registreringen står. Forhold: endrer avgjørelsen 17.10 (#276, punkt 12), som tar med feil sak.'''
valgt = "Retting i begge saker"
svar = '''
«Retting i begge saker (Recommended)»'''
