sporsmal = '''
Spørsmålet «Topic fra TE», ordrett slik det ble vist i spørsmålsverktøyet:

Vedtaket 29.09 sier at saker kan opprettes fra en topic i Catenda. Når TE lager en topic, oppretter appen KOE-saken. Hva betyr selve topicen i saken? Ingen vedtak avgjør det i dag.

Alternativene slik de ble vist:

Bare opprettelsen (Recommended): Saken opprettes med topicens tittel. Topicen er ikke et varsel eller krav i appen, og TE må sende varsel og krav fra appen. Mener TE at topicen var varselet etter § 32.2, oppgir TE datoen i et brev fra appen etter OV-U5. Appen avgjør ikke selv om topicen var et varsel.

Registreres som brev utenfor appen: Saken opprettes, og integrasjonen registrerer topicen som et brev sendt utenfor appen, med datoen topicen ble laget. Appen utleder ingenting av den: ingen standpunkt og ingen frist. Utvider OV-U4, der den som registrerer, oppgir datoen og velger hvor brevet vises.

Varsel etter § 32.2: Topicen regnes som TEs varsel etter § 32.2, med datoen topicen ble laget, og fristene i appen løper fra den. Endrer OV-U5, der TE selv oppgir datoen for et varsel sendt utenfor appen.'''
