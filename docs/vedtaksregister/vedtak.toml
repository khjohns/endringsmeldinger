[[gruppe.vedtak]]
anker = "hf-u1"
vedtak = '''
HF-U1: et brev lagres samlet eller ikke i det hele tatt, og det er entydig fra lagringen
hvilket brev hver del hører til. Å knytte deler sammen i ettertid er ikke nok. Hvert
utsagn viser uttrykkelig til det det gjelder: kravet og kravversjonen, svaret eller
varselet. En revisjon viser for eksempel til svaret den erstatter, og en aksept til
svaret den godtar. Henvisningen skal stemme med brevet, og rekkefølgen i journalen
brukes aldri til å avgjøre hva et utsagn gjelder. Inneholder en hendelse noe kjernen
ikke kjenner, er saken ikke forstått (MM-U2), og ingenting hoppes over. En vurdering
parten ikke har gjort, lagres ikke, og at den mangler, er ikke et standpunkt. Om
tausheten likevel får virkning, følger av VS-U2. Forkastet: å knytte et utsagn til et
krav eller et varsel etter rekkefølgen i journalen, og å hoppe over et ukjent felt'''
vedtatt = "10.10, oppdragsgiver (#273)"
folge = '''
Strategivedtaket for lagringsformatet under B-10. Formen er et teknisk valg: én rad per
dokument etter [designnotatet](../design-hendelsesformat-2026-10-09.md), til
lagringsformen avgjøres sammen med B-12 ([merknaden 11.10](#b-12-merknad-2026-10-11)).
Versjonering, utrulling og tilbakerulling mellom TS-versjoner er avgjort 10.10 med
[B-10](#b-10) (#316). Ikke bygget'''

[[gruppe.vedtak]]
anker = "b-10"
vedtak = '''
B-10: appen holder sakens versjon, formatets versjon og reglenes versjon atskilt fra
versjonene som regnet ut det lagrede resultatet for saken. Et lagret resultat brukes
bare når det er regnet ut med de samme versjonene som appen og saken har. Ellers regnes
saken ut på nytt fra journalen, og visningen følger MM-U15. En bindende handling prøves
alltid mot journalen. Å regne ut på nytt lagrer bare det nye resultatet. Det endrer
aldri journalen, frosne brev, beslutnings- og enighetsgrunnlag eller
leveringsdokumenter, og det utløser ingen levering. Et nytt format tas i bruk slik at en
tilbakerulling til forrige utgivelse ikke stopper noen sak. Rulles appen lenger tilbake,
stoppes sakene med et nyere format etter MM-U2, og de listes før tilbakerullingen. En
regelendring endrer ikke virkningen av et sendt brev (MM-U9). Endrer den utfallet på
tvers av brev (MM-U11), gjelder MM-U16. Appens vurdering i registrert korrespondanse
fryses etter MM-U17. Forkastet: å oppgradere eller skrive om lagrede hendelser til et
nytt format; å bruke et lagret resultat regnet med en annen versjon, også en nyere etter
en tilbakerulling; og å la en eldre utgivelse hoppe over det den ikke kjenner'''
vedtatt = "10.10, oppdragsgiver etter sparring (#316)"
folge = '''
Flyttet fra 3.4. Lagringsformatet er [HF-U1](#hf-u1) og [HF-U2](#hf-u2), og visningen,
regelendringen og registrert korrespondanse er [MM-U15](#mm-u15), [MM-U16](#mm-u16) og
[MM-U17](#mm-u17). Merknadene 07.10, 09.10 og 10.10 til B-10 fra 3.4 står under tabellen
og beskriver B-10 før vedtaket. Teknisk form: saksversjonen er `hendelse.versjon`,
formatversjonen `hendelse.format`, og regelversjonen står i hvert beslutningsgrunnlag og
hver aksept. Versjonene som regnet ut det lagrede resultatet, står ved resultatet i
`sak_metadata`. Et nytt format rulles ut i to trinn, først i en utgivelse som leser det
og så i en som skriver det, og de to trinnene er også en driftsrutine. Forkastet: å
skrive et nytt format i samme utgivelse som først leser det. Kompatibiliteten prøves i
en tabellstyrt test, som beskrives i [designnotatet for
formatet](../design-hendelsesformat-2026-10-09.md), og utviklerne dokumenterer
kompatibiliteten for hver reell formatendring. Raden i 3.4 sa at `UP042` (`StrEnum`) i
Python avhenger av B-10. Hva vedtaket betyr for den regelen, er ikke avklart (#357).
Bygget: saksversjonen, kolonnen `format` og regelversjonen i beslutningsgrunnlaget og
aksepten (L 10.10, `kjerne/format.ts`). Ikke bygget: versjonene ved det lagrede
resultatet, utrullingen i to trinn, utregningen på nytt og den tabellstyrte testen. #316
bygger dem'''

[[gruppe.vedtak]]
anker = "mm-u15"
vedtak = '''
MM-U15: er det lagrede resultatet for en sak regnet ut med andre versjoner enn appen og
saken har (B-10), regnes saken ut før den vises. Oversikten viser siste kjente status
for saken, merket «Oppdateres». Det gjelder bare visningen: en bindende handling prøves
alltid mot journalen'''
vedtatt = "10.10, oppdragsgiver (#316)"
folge = '''
Del av [B-10](#b-10). Ikke bygget (#316)'''

[[gruppe.vedtak]]
anker = "mm-u16"
vedtak = '''
MM-U16: før en regelendring rulles ut, regnes alle saker med gamle og nye regler. En
rapport over hver sak der utfallet endres, legges ved vedtaket om regelendringen.
Rapporten viser utfallet før og etter, og hvilke handlinger som dermed tillates eller
