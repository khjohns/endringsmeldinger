Lagt fram slått sammen med rettelsene, med S⁗ i spørsmål 1 og 2‴ i spørsmål 2: Ja til begge'''
forhold = [{ art = "endrer", vedtak = "gr-u4" }, { art = "utvider", vedtak = "gr-u4" }, { art = "endrer", vedtak = "ka-u16" }, { art = "presiserer", vedtak = "gr-u1" }, { art = "presiserer", vedtak = "gr-u7" }, { art = "presiserer", vedtak = "gr-u10" }, { art = "presiserer", vedtak = "hf-u7" }, { art = "presiserer", vedtak = "hf-u21" }, { art = "presiserer", vedtak = "ov-u32" }, { art = "presiserer", vedtak = "ov-u33" }, { art = "utvider", vedtak = "lv-u4" }]
folge = '''
Bygges i #1239'''

[[gruppe.vedtak.alternativ]]
navn = "S⁗"
tekst = '''
Når byggherren svarer på vederlag eller frist mens gjeldende versjon av grunnlaget ikke er besvart og grunnlaget ikke er avklart ved frafall (GR-U23), sier brevet: «Byggherren har ennå ikke svart på grunnlaget i TEs krav i brev <n> av <dato>. Standpunktene nedenfor gjelder under forutsetning av at grunnlaget for kravet foreligger.» Dette gjelder også det første svaret. Forbeholdet fryses når brevet sendes, og er ikke et lag. I appen er forbeholdet ikke et vilkår etter HF-U7: godkjenner byggherren hele det krevde beløpet eller antallet dager, er partene enige om beløpet eller dagene uten aksept (GR-U7). Grunnlaget er fortsatt uavklart, og svaret registreres ikke som ubetinget godkjenning av hele kravet. Vil byggherren unngå forbeholdet for ubesvart grunnlag, besvarer byggherren grunnlaget i samme brev. Avslås grunnlaget eller påberopes preklusjon, gjelder i stedet den subsidiære strukturen for denne innsigelsen. Besvares grunnlaget senere, endres ikke teksten og lagene i det sendte brevet. Visningen viser standpunktet sammen med det senere grunnlagssvaret: som avklart når grunnlaget er godkjent, og som subsidiært når grunnlaget er avslått eller preklusjon er påberopt. Avslaget er byggherrens standpunkt, ikke appens avgjørelse av om betingelsen er oppfylt.'''

[[gruppe.vedtak.alternativ]]
navn = "A: GR-U4 står"
tekst = '''
Et svar på vederlag eller frist som byggherren gir mens en ny versjon av grunnlaget venter på svar, er prinsipalt. Byggherrens svar på en tidligere versjon av grunnlaget er ikke forbehold for det. Svaret blir subsidiært når byggherren avslår den nye versjonen eller påberoper preklusjon etter § 32.2. Vil byggherren beholde avslaget som forbehold, svarer byggherren på den nye versjonen i samme brev. Et svar gitt før den nye versjonen forblir subsidiært til sporet eller grunnlaget besvares igjen.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "S: sparringens tekst"
tekst = '''
Når byggherren svarer på vederlag eller frist mens ansvarsgrunnlaget er ubesvart, uttrykker brevet at standpunktene gjelder under forutsetning av at totalentreprenøren har rett til vederlagsjustering eller fristforlengelse. Forbeholdet bygger på at ansvarsgrunnlaget er uavklart, ikke på automatisk videreføring av et tidligere grunnlagsavslag. Vil byggherren svare uten dette forbeholdet, må byggherren samtidig avklare grunnlaget.'''
forkastet = true

[[gruppe.vedtak]]
id = "GR-U27"
dato = 2026-10-28
hvem = "oppdragsgiver"
kilde = ["#1336", "#1338"]
sporsmal = '''
Åpent spørsmål 2 av forslaget til samlet tilslutning, runde 7 av #1338, 28.10, ordrett ([versjon 4](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6467391758)):

**2. Lukkes en KOE-sak uten endringsordre når TE har godtatt avslaget på grunnlaget eller trukket grunnlaget?** I dag lukkes saken da: GR-U7 («Godtar TE avslaget på grunnlaget, lukkes saken»), GR-U5 (trekket), vedtaket 05.10 for #213 (saken er `LUKKET_AVSLATT` og «regnes som lukket for nye hendelser») og KA-U29 («Det som kan endre utfallet … avvises fortsatt»). I KA-U13 står «Trekket er i alle tilfeller sperret når TE har godtatt et avslag av grunnlaget (SK-01)». Svaret 1A sier at begge parter kan sende nye strukturerte standpunkter fram til endringsordren. En slik sak får aldri en endringsordre.
- A. Ja. TEs aksept av avslaget på grunnlaget og TEs trekk av grunnlaget lukker saken i arbeidsflyten, som i dag. Innlegg og dokumentasjon godtas etterpå. GR-U7, GR-U5, vedtaket for #213, KA-U29 og KA-U13 står på dette punktet, og punkt 12 gjelder ikke disse sakene.
- B. Nei. Saken står åpen for nye strukturerte standpunkter fra begge parter. Vedtakene over endres, og punkt 12 gjelder også disse sakene.
- *Anbefalt: A.* A avviker fra svaret «EO er hendelsen som lukker KOE-saken i appen». Grunnen er at det ikke finnes noe endringsordren kan formalisere når TE har gitt opp kravet om endring ved eget avkall (HF-U10). Uten A står saken åpen uten sluttpunkt.'''
valgt = "A"
svar = '''
Oppdragsgiver 28.10, ordrett: «2. A: TEs uttrykkelige aksept av avslaget på grunnlaget eller trekk av grunnlaget lukker KOE-saken. Skjemaet viser dette før sending, og statusen viser hvorfor saken er avsluttet. Innlegg og dokumentasjon kan fortsatt legges til.»

Svaret gjaldt spørsmål 1–3 i [versjon 4](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6467391758) samlet ([svaret](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6468031356)). Det sluttet ordrett: «Skill fortsatt mellom registrert enighet og en rettslig konklusjon. Tidligere brev bevares uendret, og løsningen avgjør ikke om senere erklæringer endrer det som tidligere er avtalt.»'''
forhold = [{ art = "presiserer", vedtak = "gr-u7" }, { art = "presiserer", vedtak = "gr-u5" }, { art = "snevrer inn", vedtak = "mm-u33" }, { art = "snevrer inn", vedtak = "mm-u34" }]

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
TEs uttrykkelige aksept av avslaget på grunnlaget eller trekk av grunnlaget lukker KOE-saken. Skjemaet viser dette før sending, og statusen viser hvorfor saken er avsluttet. Innlegg og dokumentasjon kan fortsatt legges til. GR-U7, GR-U5, vedtaket for #213, KA-U29 og KA-U13 står på dette punktet, og punkt 12 i MM-U34 gjelder ikke disse sakene.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
Saken står åpen for nye strukturerte standpunkter fra begge parter. Vedtakene over endres, og punkt 12 gjelder også disse sakene.'''

