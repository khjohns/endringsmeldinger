I første versjon tar løsningen bare imot vederlagskrav som tilbud om oppgjør som fast sum (§ 34.2.1). Et krav etter kontraktens enhetspriser (§ 34.3.1) eller regningsarbeid (§ 34.4), kostnadsoverslaget og varslene etter § 30.2 og § 34.4 sendes utenfor løsningen og registreres etter OV-U4. Skjemaet sier det når TE vil kreve etter en beregningsregel. Forhold: endrer VS-U28; snevrer inn OV-U14; presiserer OV-U4.'''
