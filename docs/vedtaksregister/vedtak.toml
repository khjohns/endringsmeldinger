Ett board per sakstype: Vedtakstekst: «Hvert prosjekt angir i konfigurasjonen ett topic-board per sakstype (KOE-sak, endringsordre og forsering) for saker som opprettes i appen. Forkastet: ett board for alle sakstyper.» Presiserer KT-U3.

Brukeren velger board: Vedtakstekst: «Den som oppretter saken, velger blant prosjektets aktive topic-boards. Forkastet: at konfigurasjonen angir boardet.» Strider mot KT-U3 («prosjektets konfigurasjon angir») og er et forslag om å endre det.'''
