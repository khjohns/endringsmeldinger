fra byggherren i appen, først ved § 34.3.3, som avvises i første versjon (OV-U1). En
egen innsigelse fra TE mot et varsel, krav eller svar fra byggherren gjelder alt etter
VS-U1. Formatet for innsigelsen forutsetter likevel ikke at bare byggherren kan påberope
sen varsling. Forkastet: ulike regler for partene'''
vedtatt = "11.10, oppdragsgiver etter sparring (#309)"
forhold = [
