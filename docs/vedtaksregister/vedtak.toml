Byggherren tar i svaret stilling til beløpet for justeringen ellers og til beløpet for kravet om særskilt justering etter § 34.1.3 annet ledd hver for seg, med godkjent, delvis godkjent eller avslått for hver. Svarets samlede resultat regnes av beløpene. Gjør byggherren gjeldende at varselet etter § 34.1.3 kom for sent, gjelder VS-U5 og OV-U22 for beløpet for det særskilte kravet. Presiserer OV-U23. Presiserer VS-U5 og OV-U22 for et svar uten påberopelse.'''
