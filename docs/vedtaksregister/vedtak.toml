[[gruppe.vedtak]]
id = "GR-U21"
dato = 2026-10-16
hvem = "oppdragsgiver"
kilde = ["#510", "#557"]
sporsmal = '''
Frafall og ny grunnlagsversjon (GR-U20, PR #557), funnet i reviewet. Eksempel: TE varsler en irregulær endring 1. mars, og byggherren frafaller pålegget 10. mars (§ 32.3 c). 20. mars sender TE grunnlagsversjon 2 som en lovendring. Det tillater GR-U19, fordi § 32.2 gjelder likt. Etter GR-U18 er frafall ikke tillatt ved lovendring eller gebyr, fordi endringen da ikke er byggherrens eget pålegg. Etter GR-U20 kan byggherren svare på en ny versjon bare med frafall eller endringsordre. Her er den eneste veien da en godkjenning, som blir en endringsordre. Spørsmålet 16.10 bygde på at versjonen gjelder samme pålegg, og det stemmer ikke her. Hva skal gjelde?

- **A: svar fritt på v2 (Anbefalt).** «Er den nye grunnlagsversjonen i en underkategori der frafall ikke er tillatt (GR-U18), kan byggherren svare på den som etter GR-U1. Løftet om endringsordre for arbeid som alt er utført etter pålegget, står (GR-U17).» Presiserer GR-U20 og GR-U18. Byggherren blir ikke tvunget til en endringsordre for en lovendring.
- **B: frafallet binder alltid.** «Frafallet binder også ved en ny grunnlagsversjon i en annen underkategori. Byggherren kan ikke avslå den, og en godkjenning er en endringsordre.» Presiserer GR-U20, men snevrer inn GR-U18: byggherren må i praksis gi en endringsordre for en lovendring.
- **C: sperr bytte etter frafall.** «Etter et frafall kan TE ikke sende en ny grunnlagsversjon i en underkategori der frafall ikke er tillatt.» Snevrer inn GR-U19. Det sperrer en handling TE kan trenge, for eksempel når TE ser at endringen egentlig kommer av en lov.'''
valgt = "A"
svar = '''
A: svar fritt på v2 (Anbefalt)'''
forhold = [{ art = "presiserer", vedtak = "gr-u20" }, { art = "presiserer", vedtak = "gr-u18" }]
folge = '''
Spørsmålet kom fra reviewet av PR #557 16.10. Ikke bygget (#510).'''

[[gruppe.vedtak.alternativ]]
