[[gruppe.vedtak]]
id = "OV-U12"
dato = 2026-10-17
hvem = "oppdragsgiver"
kilde = ["#669"]
sporsmal = '''
Spørsmålet «EO registrert», ordrett slik det ble vist i spørsmålsverktøyet:

Byggherren kan registrere sin egen endringsordre, sendt utenfor appen, som svar på gjeldende kravversjon av grunnlaget, også som revisjon av et svar som ikke er godtatt (OV-U6). Andre brev sendt utenfor appen er dokumentasjon uten virkning (OV-U4). Har TE også sendt kravet utenfor appen, eller viser endringsordren til et registrert svar, svarer den på noe appen ikke regner som krav eller svar. I dag stopper saken da som ikke forstått. OV-U6 forkastet at endringsordren bare er dokumentasjon. Hva skal skje? Anbefalt: A, fordi et svar skal vise til det det gjelder (HF-U1), og fordi inngangen kan avvise i stedet for å stoppe saken.

Alternativene slik de ble vist:

Avvis som svar (Recommended): Vedtakstekst: «En endringsordre byggherren registrerer etter OV-U6, må være svar på en kravversjon TE har sendt fra appen, eller revisjon av et svar sendt fra appen. Viser den til et krav eller svar som bare er registrert som dokumentasjon (OV-U4), avvises registreringen som svar, med beskjed om at kravet må være sendt fra appen. Byggherren kan registrere brevet som dokumentasjon etter OV-U4. Forkastet: at saken stopper som ikke forstått, og at registreringen gjelder et annet krav enn det endringsordren viser til.» Snevrer inn OV-U6 og gjør for dette tilfellet unntak fra det forkastede alternativet «At endringsordren bare er dokumentasjon.»

Gjelder kravet fra appen: Vedtakstekst: «En endringsordre byggherren registrerer etter OV-U6 og som viser til et registrert krav eller svar, gjelder som svar på gjeldende kravversjon av grunnlaget sendt fra appen, når en slik finnes. Finnes ingen, avvises registreringen. Forkastet: å avvise registreringen når et krav fra appen finnes.» Presiserer OV-U6 og snevrer inn HF-U1, fordi appen avgjør hva svaret gjelder.

Saken stopper: Vedtakstekst: «En slik registrering gjør saken ikke forstått (MM-U2), og ingen bindende handling godtas før en kjerne som forstår den, er rullet ut. Forkastet: å avvise registreringen.» Følger MM-U2 og er dagens atferd.'''
valgt = "Avvis som svar"
svar = '''
«Avvis som svar (Recommended)»'''
forhold = [{ art = "snevrer inn", vedtak = "ov-u6" }]
folge = '''
Gjør for dette tilfellet unntak fra det forkastede alternativet «At endringsordren bare er dokumentasjon.» i OV-U6. Ikke bygget (#669).'''

[[gruppe.vedtak.alternativ]]
navn = "Avvis som svar"
tekst = '''
En endringsordre byggherren registrerer etter OV-U6, må være svar på en kravversjon TE har sendt fra appen, eller revisjon av et svar sendt fra appen. Viser den til et krav eller svar som bare er registrert som dokumentasjon (OV-U4), avvises registreringen som svar, med beskjed om at kravet må være sendt fra appen. Byggherren kan registrere brevet som dokumentasjon etter OV-U4. Forkastet: at saken stopper som ikke forstått, og at registreringen gjelder et annet krav enn det endringsordren viser til.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Gjelder kravet fra appen"
