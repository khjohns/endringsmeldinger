[[gruppe.vedtak]]
id = "OV-U13"
dato = 2026-10-17
hvem = "oppdragsgiver"
kilde = ["#669"]
sporsmal = '''
Spørsmålet «Avklaring», ordrett slik det ble vist i spørsmålsverktøyet:

Byggherren oppgir i registreringen av sin egen endringsordre at brevet oppfyller § 31.3 (OV-U6). OV-U6 sier at det for andre registrerte brev ikke oppgis om brevet er en endringsordre. MM-U12 sier at en senere avklaring registreres som et nytt utsagn, og GR-U13 overlot til byggingen hvordan opplysningen avklares. Avklaringer av registrerte brev er utsatt i første versjon (OV-U7). I dag godtas en senere avklaring og vises, men den gir ingen virkning. Hva skal skje med en senere avklaring av § 31.3? Anbefalt: A, fordi den følger OV-U6 og utsettelsen i OV-U7.

Alternativene slik de ble vist:

Avvis i første versjon (Recommended): Vedtakstekst: «Opplysningen om at et registrert brev er en endringsordre etter § 31.3, gis i første versjon bare når byggherren registrerer sin egen endringsordre som svar (OV-U6). En senere avklaring av § 31.3 avvises i første versjon, med beskjed om at den kan registreres som dokumentasjon. Den bygges med merking og avklaring av registrerte brev (OV-U7). Forkastet: å godta avklaringen med eller uten virkning.» Presiserer OV-U6 og GR-U13 og utsetter for § 31.3 det MM-U12 sier om en senere avklaring.

Vis uten virkning: Vedtakstekst: «En senere avklaring av § 31.3 registreres som et nytt utsagn med part og dato (MM-U12) og vises, men gir ingen virkning i første versjon. Forkastet: å avvise avklaringen.» Følger MM-U12, men endrer setningen i OV-U6 om at det ikke oppgis for andre registrerte brev.

Gir virkning som registrering: Vedtakstekst: «En senere avklaring av at byggherrens registrerte svar på grunnlaget var en endringsordre, gir fra avklaringen samme virkning som en registrering etter OV-U6, når vilkårene i OV-U6 ellers er oppfylt. Forkastet: at opplysningen bare kan gis i registreringen.» Endrer OV-U6 og OV-U4.'''
valgt = "Avvis i første versjon"
svar = '''
«Avvis i første versjon (Recommended)»'''
forhold = [
  { art = "presiserer", vedtak = "ov-u6" },
  { art = "presiserer", vedtak = "gr-u13" },
]
folge = '''
Utsetter for § 31.3 det MM-U12 sier om en senere avklaring. Ikke bygget (#669).'''

