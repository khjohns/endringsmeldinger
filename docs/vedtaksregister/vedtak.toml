[[gruppe.vedtak]]
anker = "hf-u2"
vedtak = '''
HF-U2: begrepene i hendelsene TS skriver, følger kontrakten. Byggherrens standpunkt til
grunnlaget heter «grunnlag», ikke «ansvar», med verdiene godkjent, avslått og frafalt,
fordi frafall av et pålegg ikke er en vurdering av ansvar. «Frafalt» betyr at byggherren
frafaller pålegget etter § 32.3 første ledd c, ikke at TE frafaller et krav. «Hindring»
betyr at fremdriften hindres som følge av forholdet saken gjelder (§ 33.1). «Prinsipalt»
og «subsidiært» er slik brevet ordner byggherrens standpunkter. At et standpunkt er uten
virkning, er appens vurdering. Det lagres atskilt fra det byggherren sa, og vises ikke
som noe byggherren har sagt. De øvrige begrepene står som foreslått: svar, krav med
versjoner, rettidighet, beløp og dager, sammenfall, aksept, trekk, varsel, bestridelse,
«ingen krav» og opplysning. Feltnavnene velges av utviklerne innenfor dette, og gamle og
nye navn står i navnetabellen i [domenetabellen](../domenetabell/README.md)'''
vedtatt = "10.10, oppdragsgiver (#273)"
folge = '''
Presiserer «Språk» i `AGENTS.md` og B-17 for formatet. «Hindring» gjelder også § 33.3
etter [VS-U13](#vs-u13) (11.10). Teknisk valg innenfor vedtaket: kodene som deles med
`kontrakt.json` og Python, som kategoriene, metodene og resultatverdiene, står uendret i
formatet til de er avklart i et eget issue før TS skriver den første reelle hendelsen.
Ikke bygget'''

[[gruppe.vedtak]]
anker = "mm-u13"
vedtak = '''
MM-U13: en regel i kjernen stiller det presise kontraktsspørsmålet til utsagnene, for
eksempel om grunnlaget er godkjent, om pålegget er frafalt og om preklusjon er påberopt.
Ingen regel leser en samlebetegnelse i stedet for spørsmålet, heller ikke en som er
utledet og ikke lagret. Unntaket er «avklart» etter GR-U7, som er en navngitt betingelse
som defineres rett av standpunktene og brukes bare der vedtakene sier det (GR-U7, KA-U11
og EO-U5). Forkastet: at reglene leser en utledet samlebetegnelse der vedtakene ikke
sier det'''
vedtatt = "10.10, oppdragsgiver (#329)"
forhold = [{ art = "presiserer", vedtak = "mm-u11" }]
folge = '''
Presiserer «Kontrakten først» i `AGENTS.md` og MM-U11. Bygget i kjernen 10.10 (#340):
`grunnlagAvklart` og `grunnlagAvvist` leser standpunktene direkte, og `grunnlagAvvist`
krever TEs aksept. Før leste de `utfall()`, som slo sammen godkjent og frafalt (§ 32.3
første ledd a og c) til «avklart», og avslag og preklusjon til «avvist» (L 10.10).
Arkitekturtesten avgrenser «avklart» til reglene GR-U7 og KA-U11 gjelder. En importert
verdi kan bare avgrenses per modul (#344)'''

[[gruppe.vedtak]]
anker = "b-18"
vedtak = '''
B-18: valget av serverlag for TS-kjernen overlates til utviklerne og IT innenfor tre
krav: én autoritativ regelbehandling, kontrollert adgang til bindende handlinger og
historikk som kan etterprøves. Flere tjenester kan rulles ut som én samlet utgivelse.
IKT-spørsmålet står i #78'''
vedtatt = "10.10, oppdragsgiver (#311)"
folge = '''
Grunnlaget er [vurderingen](../vurdering-b18-serverplassering-2026-10-10.md).
Utviklernes valg er en egen Node/TS-server med Python ved siden av for innlogging,
levering og Catenda, forutsatt at IKT ikke har et krav som utelukker det (#78).
Alternativene var serverlaget i SvelteKit og at TS også tar levering og Catenda. Flyttet
fra 3.4. Hostingen i B-12 er uendret. Oppdragsgiver 10.10 (#347, #78): skiva i #347
bygges i testmiljøet etter utviklernes valg uten å vente på IKT; har IKT et krav som
utelukker valget, vurderes serverlaget på nytt, men skiva viser integrasjonen uansett.
Endret 11.10 av [B-19](#b-19): innloggingen flyttes til TS, og backenden samles der.
Ikke bygget'''

[[gruppe.vedtak]]
anker = "b-19"
vedtak = '''
B-19: backenden samles i TS. Det Python gjør mot databasen, flyttes til TS før databasen
byttes til Azure SQL, først innloggingen og sesjonen, identiteten og synkroniseringen av
medlemskap, og ellers blant annet webhookens innboks. Databasen byttes før eller sammen
med KOE-byttet ([B-17](#b-17)), og Python-lagrene skrives ikke om for Azure SQL.
Leveringen og Catenda kan bli i Python så lenge de ikke leser eller skriver i databasen
selv, til de flyttes. Forkastet: å skrive om Python-lagrene for Azure SQL som en
mellomfase'''
vedtatt = "11.10, oppdragsgiver (#375)"
