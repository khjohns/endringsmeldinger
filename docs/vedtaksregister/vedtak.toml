[[gruppe.vedtak]]
id = "LV-U26"
dato = 2026-10-22
hvem = "oppdragsgiver"
kilde = ["#1166"]
sporsmal = '''
Spørsmål M2, «Logo og skrift»: Malen bruker skriften Oslo Sans Office og Oslo kommunes logo. Repoet er offentlig. PDF-en bruker i dag Noto Sans og Noto Sans Math, med åpen lisens, og appen avviser tegn skriftene ikke har (#801). En annen skrift endrer hvilke tegn appen godtar i brevteksten. Den nedlastede PDF-en lages på nytt av det som er frosset, så logo og skrift må fryses eller være faste for at den skal bli lik den leverte (LV-U2). Hvor kommer logo og skrift fra? Anbefalt: A.

Alternativene til M2:

«Noto Sans, logo i innstillingene (Recommended)»: «PDF-en beholder Noto Sans. Logoen legges i prosjektinnstillingene eller driftsmiljøet, ikke i det offentlige repoet, og fryses med brevet når det sendes. Oslo Sans vurderes i et eget issue, med lisensen for innbygging i PDF fra en server og hvilke tegn som da avvises. Presiserer LV-U2.»
«Oslo Sans og logo i repoet»: «Skriften og logoen legges i repoet og bygges inn i PDF-en. Forutsetter at kommunen tillater det i et offentlig repo; oppdragsgiver avklarer lisensen. Tegn Oslo Sans ikke har, avvises i brevteksten. Presiserer LV-U2.»
«Uten logo»: «PDF-en beholder Noto Sans og får ingen logo. Malens oppsett følges ellers.»

Svaret på M2 passet ikke på et alternativ, og oppfølgingen er dette spørsmålet:

Spørsmål M2b, «Oslo Sans»: Pakken @oslokommune/punkt-assets er MIT-lisensiert og har Oslo Sans og logoen. Lisensen inne i skriftfila er strengere: Oslo Sans er eksklusivt lisensiert til Oslo kommune, bare for materiell knyttet til kommunens virksomhet, og rettighetene kan ikke overdras til tredjeparter. Innbygging i PDF er tillatt. Byggherrens brev er kommunens materiell; totalentreprenørens brev er det ikke, og etter M1 får de avsenderens profil. Hvordan brukes skriften og logoen? Anbefalt: A.'''
valgt = "Oslo Sans for byggherren"
svar = '''
M2: «Ser ut til å være MIT lisens? https://www.npmjs.com/package/@oslokommune/punkt-assets». M2b: «Oslo Sans for byggherren (Recommended)».'''
forhold = [{ art = "presiserer", vedtak = "lv-u2" }, { art = "presiserer", vedtak = "lv-u25" }]
folge = '''
Svaret er gitt med spørsmålsverktøyet 22.10. Spørsmålene og alternativene står ordrett på #1166 (kommentaren 6349572568). Spørsmålet kaller vedtaket M2b, og M1 er LV-U25. Ikke bygget (#1177).'''

[[gruppe.vedtak.alternativ]]
navn = "Oslo Sans for byggherren"
tekst = '''
Byggherrens brev bruker Oslo Sans og logoen fra @oslokommune/punkt-assets, som en avhengighet med fast versjon og ikke kopiert inn i repoet. Totalentreprenørens brev bruker Noto Sans. Tegn Oslo Sans ikke har, vises med Noto Sans og Noto Sans Math, så appen godtar de samme tegnene som i dag (#801). Skriften og logoen er faste for versjonen og fryses med brevet, så den nedlastede PDF-en blir lik den leverte (LV-U2). Presiserer LV-U2 og M1.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Oslo Sans for alle"
tekst = '''
Alle brev bruker Oslo Sans fra pakken, også totalentreprenørens, fordi brevene lages i kommunens app og formularet er byggherrens. Logoen bare på byggherrens brev (M1). Forutsetter at oppdragsgiver avklarer at skriftlisensen dekker totalentreprenørens brev. Presiserer LV-U2 og M1.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Noto Sans, logo fra pakken"
tekst = '''
Alle brev beholder Noto Sans. Byggherrens brev får logoen fra pakken. Presiserer LV-U2.'''
forkastet = true

