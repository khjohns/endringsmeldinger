[[gruppe.vedtak]]
vedtak = '''
SK-12: datoen og metoden for et varsel fra TE settes én gang. Et senere krav med en
annen dato avvises. Gjelder varselet om fristforlengelse (§ 33.4) og varslene om
rigg/drift og produktivitetstap (§ 34.1.3), som DRF-03'''
vedtatt = "05.10, oppdragsgiver"
folge = '''
Presisert 09.10 av [MM-U1](#mm-u1) for et varsel som bare er utledet. Utvidet 10.10 av
[VS-U6](#vs-u6) til § 34.1.2. Ikke bygget. I dag overskriver hvert nytt krav varselet
(SK-12)'''

[[gruppe.vedtak]]
anker = "mm-u1"
vedtak = '''
MM-U1: SK-12 låser et varsel som er registrert, ikke et varsel som bare er utledet. Er
et fristkrav sendt uten registrert varsel etter § 33.4, kan TE senere registrere
varselet med datoen det ble sendt, også når den er tidligere enn kravet. Det er første
registrering, ikke en flytting. Byggherrens svar står. En preklusjon i svaret gjaldt
varselet slik det var registrert da, og er uavklart til byggherren tar stilling.
Byggherren kan bestride at varselet ble sendt eller mottatt. Preklusjonen faller ikke av
seg selv. Forkastet: å regne det utledede varselet som satt, og å la preklusjonen falle
uten byggherrens standpunkt'''
vedtatt = "09.10, oppdragsgiver"
folge = '''
Presiserer vedtaket om SK-12 05.10 for
[#264](https://github.com/khjohns/endringsmeldinger/issues/264). Presisert 09.10 av
[MM-U8](#mm-u8) og [MM-U7](#mm-u7). Utvidet 10.10 av [VS-U7](#vs-u7) til § 34.1. Ikke
bygget. I dag regner `_handle_frist` det spesifiserte kravet som varsel når varselet
mangler. Forløp D i
[modellforslaget](../forslag-maalmodell-2026-10-09.md#forløp-d-et-varsel-registrert-etter-et-senere-krav)'''

[[gruppe.vedtak]]
anker = "mm-u8"
vedtak = '''
MM-U8: MM-U4 gjelder også når en ny opplysning, ikke bare en regelendring, gjør at
dagens utledning av svaret avviker fra brevet. Registrerer TE et varsel etter at
byggherren har påberopt preklusjon for det utledede varselet, er preklusjonen uavklart,
og TE kan ikke godta svaret før byggherren har svart på nytt. En enighet inngått før
opplysningen står (MM-U3). Forkastet: å la TE godta svaret slik brevet uttrykte det'''
vedtatt = "09.10, oppdragsgiver etter review av PR #306"
forhold = [{ art = "presiserer", vedtak = "mm-u1" }]
folge = '''
Presiserer MM-U1. MM-U4, som vedtaksteksten viser til, er opphevet 09.10 av
[MM-U9](#mm-u9), som gjelder regelendringer. MM-U8 gjelder en ny opplysning og står.
Utvidet 10.10 av [VS-U7](#vs-u7) til § 34.1, ikke bygget. Bygget i målmodellen i
språkprøven (#304), forløp D. Leses etter [OV-U5](#ov-u5), som endret MM-U8 13.10: et svar
byggherren alt har gitt, står med virkningen det hadde, og TE kan godta det (oppdragsgiver
23.10, #1047)'''

[[gruppe.vedtak]]
anker = "mm-u7"
vedtak = '''
MM-U7: en part kan bestride en opplysning fra motparten, for eksempel at et varsel ble
mottatt, også etter at saken er avsluttet. Bestridelsen registreres uten virkning på
utfallet. At saken er avsluttet, sperrer kommandoer som kan endre utfallet, ikke
partenes standpunkt til en opplysning. Forkastet: å la en avsluttet sak sperre alle
handlinger'''
vedtatt = "09.10, oppdragsgiver etter review av PR #306"
