4. **OV-U6, BHs endringsordre:** BH registrerer den som sin godkjenning av grunnlaget. Registreringen går gjennom fullmakten (GFK-06), og partene er enige ved sammenfall. At brevet er en endringsordre, gir ingen egen virkning og ingen sperre mot TEs trekk. Skjemaet skiller BHs valgte standpunkt fra resten av dokumentet.
11. **OV-U6 gjelder bare underkategorier der § 32.2 gjelder,** og appens vurdering ved registreringen fryses etter MM-U17. *Anbefalt: ja.*'''
