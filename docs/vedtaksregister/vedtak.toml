handling og må svare på nytt etter gjeldende regler, så lenge svaret ikke er godtatt
(GR-U4). Byggherren blir dermed aldri bundet til et utfall brevet ikke uttrykte (B-03),
og TE godtar alltid hele svaret slik det står (KA-U1). Kostnaden er at saken venter på
byggherren. Forkastet: å la TE godta med utfallet etter dagens regler, og å fryse
utfallet etter reglene da svaret ble sendt (det ville endret MM-U3)'''
vedtatt = "09.10, oppdragsgiver etter review av modellforslaget"
folge = '''
