Spørsmålet «Vedlegg i brev», runde 6, ordrett slik det ble vist i spørsmålsverktøyet:

Vedlegg i TS-stien (#790), spørsmål 3. I dag bærer hendelsen bare vedleggets ID. Hendelsen er append-only, og feltene blir kontrakter når den første reelle hendelsen er skrevet. RP-U1 sier at hele brevinnholdet skal gå tapsfritt til rapporteringen. Hva skal brevet selv lagre om hvert vedlegg? Valget styrer formatet på vedleggslisten i brevet, og om innholdet kan etterprøves fra journalen alene.

