[[gruppe.vedtak]]
id = "VS-U26"
dato = 2026-10-16
hvem = "oppdragsgiver"
kilde = ["#664", "#655"]
sporsmal = '''
FK-2: Hvilken dato oppgir TE i grunnlagskravet, og i hvilke underkategorier? VS-U25 sier «TE oppgir datoen», men ikke hvilken dato det er. Spørsmålet viste til § 32.2, der varslingsplikten løper fra TE mottar pålegget («Mottar totalentreprenøren pålegg som angitt i 32.1, skal han uten ugrunnet opphold varsle byggherren»). Ved svikt og andre forhold løper fristen etter § 34.1.2 fra TE «blir eller burde ha blitt klar over forholdene». Ved endringsordre (§ 31.3) har TE ingen varslingsplikt for grunnlaget, og endringsordrens dato eller nummer er allerede påkrevd (GR-U16). I alle tre alternativene er datoen påkrevd i krav fra appen, grunnlagskravet blir ikke et varsel etter § 33.4 eller § 34.1.2, appen vurderer ikke rettidigheten, og den nye setningen gjelder bare nye brev (MM-U9). Prøvd mot 3.1: ingen alternativ strider mot et vedtak. Valget styrer feltet, hvilke underkategorier det gjelder, brevteksten og skjemaet.

Forholdet, slik det sto i alternativene: A presiserer VS-U25, utvider LV-U4 punkt 1. B presiserer VS-U25 slik ordet «oppdaget» lyder, utvider LV-U4 punkt 1. C presiserer VS-U25 hvis det gjelder § 32.2; ellers snevrer det inn VS-U25 (og er for svikt og andre forhold lik det forkastede B i VS-U25).'''
valgt = "A: datoen fristen løper fra"
svar = '''
«A: datoen fristen løper fra»'''
forhold = [{ art = "presiserer", vedtak = "vs-u25" }, { art = "utvider", vedtak = "lv-u4" }]
folge = '''
Delvis bygget 18.10 i PR #784 (#770): en vakttest holder at datofeltet er «pålegg mottatt» der § 32.2 gjelder, for alle kategoripar med gjeldende regelsett.'''

[[gruppe.vedtak.alternativ]]
navn = "A: datoen fristen løper fra"
tekst = '''
I grunnlagskravet oppgir TE datoen varslingsplikten løper fra. Der § 32.2 gjelder, er det datoen TE mottok pålegget, og brevet sier etter setningen om § 32.2: «TE opplyser at pålegget ble mottatt <dato>.» I svikt og andre forhold (§ 33.1 b–c) er det datoen TE ble klar over forholdet, og brevet sier etter kategorisetningen: «TE opplyser at TE ble klar over forholdet <dato>.» I underkategorien endringsordre (§ 31.3) oppgir TE ingen slik dato. Datoen er påkrevd i krav fra appen. Grunnlagskravet blir ikke et varsel etter § 33.4 eller § 34.1.2, og appen vurderer ikke rettidigheten. Den nye setningen gjelder bare nye brev (MM-U9).'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "B: når TE ble klar over det"
tekst = '''
I grunnlagskravet oppgir TE datoen TE ble klar over forholdet, i alle underkategorier unntatt endringsordre (§ 31.3). Brevet sier etter kategorisetningen, og der § 32.2 gjelder etter setningen om § 32.2: «TE opplyser at TE ble klar over forholdet <dato>.» Datoen er påkrevd i krav fra appen. Grunnlagskravet blir ikke et varsel etter § 33.4 eller § 34.1.2, og appen vurderer ikke rettidigheten. Den nye setningen gjelder bare nye brev (MM-U9).'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "C: bare der § 32.2 gjelder"
tekst = '''
Bare der § 32.2 gjelder, oppgir TE datoen TE mottok pålegget, og brevet sier etter setningen om § 32.2: «TE opplyser at pålegget ble mottatt <dato>.» I svikt og andre forhold og i endringsordre spør appen ikke etter datoen; TE kan beskrive den i utdypningen. Datoen er påkrevd i krav fra appen. Grunnlagskravet blir ikke et varsel etter § 33.4 eller § 34.1.2, og appen vurderer ikke rettidigheten. Den nye setningen gjelder bare nye brev (MM-U9).'''
forkastet = true

