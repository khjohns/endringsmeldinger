[[gruppe.vedtak]]
id = "EO-U11"
dato = 2026-10-28
hvem = "oppdragsgiver"
kilde = ["#1336", "#1338"]
sporsmal = '''
Åpent spørsmål 1 av forslaget til samlet tilslutning, runde 7 av #1338, 28.10, ordrett ([versjon 4](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6467391758)):

**1. Hvordan føres et krav videre når en endringsordre lukker en KOE-sak der kravet om vederlag eller frist ikke er sendt eller ikke er besvart?** Svaret sier at endringsordren omfatter hele saken, og at TE sender en ny KOE ved uenighet. Det sier ikke hvordan TEs varsler i den lukkede saken (etter § 33.4 og § 34.1.2) følger med.
- A. TE sender kravet i en ny KOE som viser til den lukkede saken. Den nye saken viser TEs varsler i den lukkede saken med dato, som TEs opplysning. Løsningen avgjør ikke om varslene dekker det nye kravet.
- B. TE sender kravet i en ny KOE og viser til varslene i fritekst. Løsningen viser ikke varslene i den nye saken.
- *Anbefalt: A.* Varslene er strukturerte og avgjør fristene. Med B må byggherren finne dem selv.'''
valgt = "B"
svar = '''
Oppdragsgiver 28.10, ordrett: «1. B: Ingen automatisk videreføring eller visning av tidligere varsler i en ny KOE. En EO kan omfatte flere KOE-saker, og løsningen skal ikke velge hvilke tidligere varsler som er relevante for det nye kravet. TE kan vise til dem i fritekst. Partene har selv ansvar for å undersøke historikken.»

Svaret gjaldt spørsmål 1–3 i [versjon 4](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6467391758) samlet ([svaret](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6468031356)). Det sluttet ordrett: «Skill fortsatt mellom registrert enighet og en rettslig konklusjon. Tidligere brev bevares uendret, og løsningen avgjør ikke om senere erklæringer endrer det som tidligere er avtalt.»'''
forhold = [{ art = "presiserer", vedtak = "eo-u3" }, { art = "presiserer", vedtak = "mm-u34" }]

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
TE sender kravet i en ny KOE som viser til den lukkede saken. Den nye saken viser TEs varsler i den lukkede saken med dato, som TEs opplysning. Løsningen avgjør ikke om varslene dekker det nye kravet.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
TE sender kravet i en ny KOE og viser til varslene i fritekst. Løsningen viser ikke varslene i den nye saken. En EO kan omfatte flere KOE-saker, og løsningen skal ikke velge hvilke tidligere varsler som er relevante for det nye kravet. Partene har selv ansvar for å undersøke historikken.'''

[[gruppe.vedtak]]
id = "EO-U12"
dato = 2026-10-28
hvem = "oppdragsgiver"
kilde = ["#1336", "#1338"]
sporsmal = '''
Åpent spørsmål 3 av forslaget til samlet tilslutning, runde 7 av #1338, 28.10, ordrett ([versjon 4](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6467391758)):

**3. Lukker en godkjenning av grunnlaget som etter § 32.3 a er en endringsordre, KOE-saken?** Etter § 32.3 første ledd a og GR-U10 er byggherrens godkjenning av grunnlaget i underkategoriene der § 32.2 gjelder, en endringsordre. GR-U14 gir brevteksten. KA-U12 og OV-U6 bygger på det, og OV-U6 sier om en slik registrert endringsordre at «byggherren kan ikke revidere svaret». Svaret 2B gjelder endringsordren byggherren sender som endringsordre. Svaret sier ikke om godkjenningen etter § 32.3 a også lukker saken.
- A. Nei. Bare en endringsordre byggherren sender i en EO-sak, lukker saken. Brevet sier fortsatt at godkjenningen er en endringsordre (GR-U14). Fram til endringsordren i EO-saken kan byggherren sende et nytt svar på grunnlaget, og løsningen avgjør ikke om det er virksomt (MM-U12). I OV-U6 strykes «og byggherren kan ikke revidere svaret». Sperren mot trekk av grunnlaget i KA-U13 står som en begrensning i løsningen etter KA-U14, fordi løsningen ellers ville lest endringsordren som bortfalt.
- B. Ja. Godkjenningen lukker saken som en endringsordre. Vederlag og frist som ikke er avgjort, går i en ny KOE etter spørsmål 1. OV-U6 og KA-U13 står.
- *Anbefalt: A.* Vederlag og frist kommer ofte etter grunnlaget. Med B må TE da sende en ny KOE for hvert krav. A holder ett lukkepunkt. Kostnaden er at løsningen ikke hindrer byggherren i å sende et nytt svar på en godkjenning som kontrakten kaller en endringsordre. Brevet står likevel.'''
valgt = "A"
svar = '''
Oppdragsgiver 28.10, ordrett: «3. A: Godkjenning av grunnlaget alene lukker ikke KOE-saken, selv om godkjenningen er en endringsordre etter kontrakten. Vederlag og frist kan behandles videre i samme sak. Når BH sender EO gjennom EO-saken, lukkes KOE-sakene den omfatter.»

Svaret gjaldt spørsmål 1–3 i [versjon 4](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6467391758) samlet ([svaret](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6468031356)). Det sluttet ordrett: «Skill fortsatt mellom registrert enighet og en rettslig konklusjon. Tidligere brev bevares uendret, og løsningen avgjør ikke om senere erklæringer endrer det som tidligere er avtalt.»'''
forhold = [{ art = "endrer", vedtak = "ov-u6" }, { art = "presiserer", vedtak = "gr-u10" }, { art = "presiserer", vedtak = "ka-u13" }, { art = "presiserer", vedtak = "eo-u3" }, { art = "presiserer", vedtak = "mm-u34" }]

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
Godkjenning av grunnlaget alene lukker ikke KOE-saken, selv om godkjenningen er en endringsordre etter kontrakten. Vederlag og frist kan behandles videre i samme sak. Når BH sender EO gjennom EO-saken, lukkes KOE-sakene den omfatter. Brevet sier fortsatt at godkjenningen er en endringsordre (GR-U14). Fram til endringsordren i EO-saken kan byggherren sende et nytt svar på grunnlaget, og løsningen avgjør ikke om det er virksomt (MM-U12). I OV-U6 strykes «og byggherren kan ikke revidere svaret». Sperren mot trekk av grunnlaget i KA-U13 står som en begrensning i løsningen etter KA-U14, fordi løsningen ellers ville lest endringsordren som bortfalt.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
Godkjenningen lukker saken som en endringsordre. Vederlag og frist som ikke er avgjort, går i en ny KOE etter spørsmål 1. OV-U6 og KA-U13 står.'''

