folge = '''
Endringen av KA-U14 gjelder leddet om registrert korrespondanse. Ikke bygget. GR-U12
avgjør ikke om en registrering etter OV-U6 er en endringsordre; det gjør byggherrens
opplysning (GR-U13). Når endringsordre som egen sak bygges, gjelder EO-U6 og EO-U9 for en
endringsordre utstedt i appen, og det må avgjøres om registreringen etter OV-U6 står ved
siden av. Bygget 16.10 i PR #588 (#540): et registrert brev sperrer ikke TEs trekk av grunnlaget, heller ikke med byggherrens opplysning om § 31.3, uten den eller med en merking (OV-U4, OV-U7). En godkjenning sendt fra appen som er en endringsordre, sperrer fortsatt. PROJEKSJONSVERSJON 21.'''

[[gruppe.vedtak.alternativ]]
navn = "Ja"
tekst = '''
unntak fra OV-U4: i en underkategori der § 32.2 gjelder (GR-U11), kan byggherren registrere sin egen endringsordre, sendt utenfor appen, som sitt svar på gjeldende kravversjon av grunnlaget. Byggherren velger «godkjent», påberoper ikke preklusjon og oppgir at brevet er en endringsordre etter § 31.3. Skjemaet gjør det tydelig at godkjenningen er byggherrens valgte standpunkt, atskilt fra dokumentets øvrige innhold. Registreringen er byggherrens godkjenning av grunnlaget og går gjennom fullmakten som en godkjenning av grunnlaget etter GFK-06. Partene er enige ved sammenfall (GR-U10), og byggherren kan ikke revidere svaret. Registreringen godtas der et svar fra appen ville vært godtatt, også som revisjon av et svar som ikke er godtatt (GR-U7). Appens vurdering ved registreringen fryses som etter MM-U17. Appen viser at byggherren opplyser at brevet er en endringsordre. Opplysningen gir ingen egen virkning i appen: endringsordren sperrer ikke trekket av grunnlaget etter KA-U13 eller KA-U22, fordi et trekk ikke opphever den. Brev og visning sier ikke at den er bortfalt (KA-U14). For andre registrerte brev oppgis det ikke om brevet er en endringsordre. Pris og tid i endringsordren vurderes ikke og gir ingen sperre; vederlag og frist kreves og besvares i KOE-saken, og siste del av OV-U2, om KA-U16, gjelder ikke.'''

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
At registreringen får samme virkning som en godkjenning fra appen som er en endringsordre, med sperren i KA-U13.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "C"
tekst = '''
At endringsordren bare er dokumentasjon.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "D"
tekst = '''
At registreringen går utenom fullmakten fordi endringsordren alt er utstedt etter byggherrens egne rutiner.'''
forkastet = true

[[gruppe.vedtak]]
id = "OV-U7"
dato = 2026-10-13
hvem = "oppdragsgiver"
kilde = ["#478", "#481"]
sporsmal = '''
Den rettede ordlyden til de fem vedtakene ligger nå i PR #481: `forslag-vedtak.md` (`01356ae`). Ingenting er ført i vedtaksregisteret ennå. Svar «ja» på hele forslaget, eller rett enkeltpunkter. Punkt 1–5 er vedtakene, og punkt 6–12 er der forslaget går ut over det du har svart uttrykkelig. Anbefalingen min står ved hvert punkt.

5. **OV-U7, vedtakene som utsettes:** «ingen krav»; merking og avklaring av registrerte brev; senere begrunnelse og datokontrollene for den; bestridelse; TEs påberopelse av passivitet; protest mot en innsigelse. Innsigelse etter § 5 tredje ledd bygges for begge parter. Det gjelder også delen av KA-U29 om innsigelse etter at TE har godtatt avslaget på grunnlaget (Astras punkt 2). Delen av KA-U27 om fradrag står.
12. **Det KA-U8, KA-U13 og KA-U14 sier om «ingen krav», gjelder ikke i første versjon.** *Anbefalt: ja.*'''
valgt = "Ja"
svar = '''
Ja'''
forhold = [{ art = "endrer", vedtak = "ov-u1" }]
folge = '''
Bygget 16.10 i PR #654 (#587, merkedelen): merking og avklaring av registrerte brev avvises før brevet skrives, med IKKE_I_FOERSTE_VERSJON (`kjerne/kommandoer/forutsetninger.ts`). Meldingen sier at brevet kan registreres som dokumentasjon. Formatet og leseren tar ikke imot merkingen og avklaringen, så en sak med en slik rad er ikke forstått (HF-U1, B-10). Feltene `merket` og `forbehold`, BREV_MED_FORBEHOLD, sperren i `kanInngaaIEo` og merkingen i `visning.ts` er fjernet fra utledningen, kommandoene og visningen. Teksten for merking i `kjerne/frosset/brevtekst.ts` står igjen (T6 i PR #654). Ikke bygget i PR #654: resten av #587. Bygget 20.10 i [PR #994](https://github.com/khjohns/endringsmeldinger/pull/994) ([#587](https://github.com/khjohns/endringsmeldinger/issues/587)): protest mot en innsigelse (VS-U1, VS-U9), påberopt passivitet (VS-U12) og senere begrunnelse fra appen (KA-U34) avvises i første versjon med `IKKE_I_FOERSTE_VERSJON` (`kjerne/kommandoer/forutsetninger.ts`). Den registrerte begrunnelsen (KA-U35) er utsatt etter arbeidsvalget 16.10 i #587, punkt 2. Avvisningen etter OV-U7 av «ingen krav» (#587, #493) er ikke bygget, og kommandoen godtas fortsatt (`forutsetninger.ts`). Senere begrunnelse fra appen og datokontrollene for registrert begrunnelse (KA-U34, KA-U36–KA-U39) er ikke endret, og datokontrollen etter KA-U36 håndheves fortsatt (`nyttelast.ts`). Endringsordre som egen sak og forsering utsettes av OV-U1, ikke av OV-U7. Delvis bygget 18.10 i PR #796 (#770): kommandoen for bestridelse, også av datoen og av § 31.3, avvises med IKKE_I_FOERSTE_VERSJON, og den tilbys ikke lenger. Raden KA-21 i bevis-sakene er merket utsatt (OV-U7).'''

[[gruppe.vedtak.alternativ]]
navn = "Ja"
tekst = '''
i første versjon bygges ikke disse vedtakene og delene av dem: «ingen krav» (KA-U12, KA-U15, KA-U17, KA-U25 og teksten for «ingen krav» i KA-U22); merking og avklaring av registrerte brev og sperrene de gir (KA-U26, KA-U28, KA-U30, merkingen i KA-U20 og delen om merket brev i KA-U27); senere begrunnelse fra appen og datokontrollene for registrert begrunnelse (KA-U34, KA-U36–KA-U39); bestridelse (MM-U7, MM-U14); TEs påberopelse av passivitet (VS-U12, og VS-U3 for § 32.3 annet ledd); protest mot en innsigelse (protesten i VS-U1 og protestregelen i VS-U9); delene av KA-U29 om bestridelse, protest, påberopt passivitet og merking; og brevtekstene for dem i LV-U4, punkt 8–12. Innsigelse etter § 5 tredje ledd bygges for begge parter som utsagn uten utledning, også byggherrens egen innsigelse etter svaret og en innsigelse etter at TE har godtatt avslaget på grunnlaget (VS-U1, VS-U9, VS-U14, KA-U29). Delen av KA-U27 om fradrag står. Kommandoene som bare finnes for de utsatte vedtakene, avvises med en egen avvisning, og sperrene og kontrollene i dem bygges ikke. Et brev med slikt innhold kan sendes utenfor appen og registreres etter OV-U4. Vedtakene står og bygges senere; avgrensningen gjelder rekkefølgen, som i OV-U1. Det KA-U8, KA-U13 og KA-U14 sier om «ingen krav», gjelder ikke i første versjon; et spor som ikke er sendt, følger OV-U3. OV-U1 endres slik at «ingen krav» tas ut av listen, og registreringen av brev sendt utenfor appen følger OV-U4–OV-U6. En utledning som bygges, sier ikke at et utsatt utsagn ikke finnes: visningen viser registrerte brev ved sporet (OV-U4), og parten er bundet av det hen sender fra appen.'''

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
Å oppheve vedtakene.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "C"
tekst = '''
Å utsette TEs innsigelse og byggherrens egen innsigelse etter svaret.'''
forkastet = true


[[gruppe.vedtak]]
id = "OV-U8"
dato = 2026-10-13
hvem = "oppdragsgiver"
kilde = ["#309", "#485"]
sporsmal = '''
Etter § 34.1.3 skal TE varsle særskilt «uten ugrunnet opphold etter at han blir eller burde ha blitt klar over at utgifter ville påløpe». Det kan skje etter at kravet for selve endringsarbeidet er sendt. Du svarte ja til at et varsel etter § 34.1.2 og § 34.1.3 avvises fra appen når vederlagskravet er sendt, «som VS-U16 gjør for § 33.4». VS-U16 begrunnes med at et senere varsel bare kan få senere dato enn kravet. For § 34.1.3 kan det senere varselet være det første og rettidige. Hva skal gjelde?

Alternativene: A (anbefalt), B og C. «Ja» er det anbefalte alternativet (A i spørsmålet).'''
valgt = "Ja"
svar = '''
Ja til alle anbefalingene, merge #481 og #476'''
forhold = [{ art = "snevrer inn", vedtak = "ov-u5" }]
folge = '''
Presiserer SK-12. Ikke bygget. Belegg: [KK-01](../vedlegg/review-kontraktskontroll-ov-vs-2026-10-13.md#kk-01-sperren-hviler-på-en-analogi-som-ikke-holder-for--3413).'''

[[gruppe.vedtak.alternativ]]
navn = "Ja"
tekst = '''
Når TE har sendt vederlagskravet, avvises et nytt varsel etter § 34.1.2 fra appen. Et særskilt varsel etter § 34.1.3 kan sendes fra appen også etter vederlagskravet, for rigg og drift og for produktivitetstap hver for seg, så lenge det ikke er sendt eller oppgitt et varsel om det samme fra før. Datoen for hvert av de to varslene settes én gang. Appen avgjør ikke når TE ble eller burde ha blitt klar over at utgiftene ville påløpe.'''

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
Når TE har sendt vederlagskravet, avvises et nytt varsel etter § 34.1.2 eller § 34.1.3 fra appen. Skjemaet sier at et særskilt varsel etter § 34.1.3 kan være påkrevd også etter kravet, at det da sendes utenfor appen, og at datoen kan oppgis i appen. Datoen settes én gang for rigg og drift og én gang for produktivitetstap.'''

[[gruppe.vedtak.alternativ]]
navn = "C"
tekst = '''
OV-U5 står uendret.'''

