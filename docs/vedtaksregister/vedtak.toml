[[gruppe.vedtak]]
id = "MM-U26"
dato = 2026-10-17
hvem = "oppdragsgiver"
kilde = ["#276"]
sporsmal = '''
Spørsmålet «Retting», ordrett slik det ble vist i spørsmålsverktøyet:

En retting av et sendt brev er et nytt utsagn fra avsenderen. En retting i motpartens favør gjelder som en revisjon, og en retting til avsenderens fordel er et tilbud som gjelder når motparten godtar det (MM-U21). Hvem som kan rette, hvilken godkjenning rettingen trenger, og hva motparten ser, står åpent under B-16. Byggherrens svar går gjennom godkjenningen etter fullmakten. Hvordan skal det være? Anbefalt: A, fordi også et tilbud binder byggherren når TE godtar det.

Alternativene slik de ble vist:

Samme godkjenning alltid (Recommended): Vedtakstekst: «En retting sendes av avsenderens side som et nytt brev fra appen. En retting fra byggherren går gjennom godkjenningen etter fullmakten som et svar med det innholdet rettingen gir, også når rettingen er et tilbud til byggherrens fordel. Motparten ser rettingen som et nytt brev med henvisning til brevet den retter. En retting til avsenderens fordel vises som et tilbud til motparten har godtatt den. Det første brevet og dokumentet i Catenda står. Forkastet: at bare en retting i motpartens favør går gjennom godkjenningen, og at rettingen sendes utenfor appen.» Presiserer MM-U21.

Godkjenning bare i TEs favør: Vedtakstekst: «En retting sendes av avsenderens side som et nytt brev fra appen. En retting fra byggherren i TEs favør går gjennom godkjenningen etter fullmakten som en revisjon. En retting til byggherrens fordel er et tilbud og går ikke gjennom godkjenningen. Motparten ser rettingen som et nytt brev med henvisning til brevet den retter. Det første brevet og dokumentet i Catenda står. Forkastet: at også et tilbud om retting går gjennom godkjenningen.» Presiserer MM-U21.

Administrator retter etter avtale: Vedtakstekst: «Retting skjer ved at en administrator i appen registrerer rettingen etter skriftlig avtale mellom partene. Forkastet: at partene retter selv i appen.» Endrer MM-U21, som sier at rettingen er et nytt utsagn fra avsenderen.'''
valgt = "Samme godkjenning alltid"
svar = '''
«Samme godkjenning alltid (Recommended)»'''
forhold = [{ art = "presiserer", vedtak = "mm-u21" }]
folge = '''
Ikke bygget (#276).'''

[[gruppe.vedtak.alternativ]]
navn = "Samme godkjenning alltid"
tekst = '''
En retting sendes av avsenderens side som et nytt brev fra appen. En retting fra byggherren går gjennom godkjenningen etter fullmakten som et svar med det innholdet rettingen gir, også når rettingen er et tilbud til byggherrens fordel. Motparten ser rettingen som et nytt brev med henvisning til brevet den retter. En retting til avsenderens fordel vises som et tilbud til motparten har godtatt den. Det første brevet og dokumentet i Catenda står. Forkastet: at bare en retting i motpartens favør går gjennom godkjenningen, og at rettingen sendes utenfor appen.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Godkjenning bare i TEs favør"
tekst = '''
En retting sendes av avsenderens side som et nytt brev fra appen. En retting fra byggherren i TEs favør går gjennom godkjenningen etter fullmakten som en revisjon. En retting til byggherrens fordel er et tilbud og går ikke gjennom godkjenningen. Motparten ser rettingen som et nytt brev med henvisning til brevet den retter. Det første brevet og dokumentet i Catenda står. Forkastet: at også et tilbud om retting går gjennom godkjenningen.'''
forkastet = true

