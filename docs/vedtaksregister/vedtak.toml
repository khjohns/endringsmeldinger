B: Som A, og i tillegg: Appen viser § 33.5 som veiledning i fristkravet og fristsvaret, uten å trekke noen konklusjon.
Forhold: gjør for § 33.5 det KA-U23 gjør for § 33.3 femte ledd. Strider ikke mot et vedtak.

Spørsmålet står i spørsmålspakken for byggedel 2 på #309 (J6).'''
