[[gruppe.vedtak]]
anker = "vs-u13"
vedtak = '''
VS-U13: i en sak med hovedkategorien force majeure (§ 33.3) er byggherrens standpunkt om
at forholdet ikke var utenfor partens kontroll, at parten eller dens
kontraktsmedhjelpere burde ha tatt hindringen i betraktning ved inngåelsen av sine
kontrakter, eller at parten med rimelighet kunne ventes å unngå eller overvinne følgene
av den (første og tredje ledd), et avslag av grunnlaget. Svarene på vederlag og frist er
da subsidiære etter vedtaket om svar når ansvarsgrunnlaget er avslått (B-13, 05.10).
Standpunktet om at fremdriften ikke ble hindret, er «hindring» som etter § 33.1 (B-13 om
frist uten fremdriftshindring, 05.10). At parten kunne overvinne en del av følgene, er
et standpunkt om dagene. Appen utleder virkningen på byggherrens premisser (VS-U3) og
avgjør ikke om vilkårene er oppfylt. At første og tredje ledd fordeles slik mellom
grunnlaget og dagene, er oppdragsgivers lesning, ikke en uttrykkelig regel i NS 8407.
Forkastet: et eget standpunkt for hvert vilkår i første og tredje ledd, og bare å
registrere og vise standpunktet'''
vedtatt = "11.10, oppdragsgiver etter sparring (#309)"
folge = '''
