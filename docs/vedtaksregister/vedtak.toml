[[gruppe.vedtak]]
id = "OV-U28"
dato = 2026-10-23
hvem = "oppdragsgiver"
kilde = ["#1047"]
sporsmal = '''
Spørsmål B3, «Brevtekst»: LV-U4 punkt 5 gir brevteksten for beløpet: «Byggherren godkjenner <beløp/dager>.» / «Byggherren godkjenner <x> av de krevde <y>.» / «Byggherren avslår kravet.» Teksten forutsetter ett beløp i svaret. Ingen vedtak gir teksten når kravet har det særskilte kravet etter § 34.1.3 annet ledd, eller for byggherrens begrensning etter VS-U5 (prinsipalt beløpet byggherren godtar etter begrensningen, subsidiært beløpet om innsigelsen ikke fører fram). Brevet ordner standpunktene med «Prinsipalt:», «Subsidiært:» og «Videre subsidiært:» (LV-U4 punkt 4), med liten forbokstav etter kolon. Henvisningen til varselet «i brev <n> av <dato>» følger LV-U21, som i dag bare gjelder § 33.4 og § 34.1.2. Hvordan sier brevet beløpene? Anbefalt: «Hver post for seg», fordi hvert beløp da står i laget der det gjelder, og brevet bruker ordlyden i § 34.1.3 tredje ledd.'''
valgt = "Hver post for seg"
svar = '''
«Hver post for seg (Recommended)»'''
forhold = [{ art = "utvider", vedtak = "lv-u4" }, { art = "utvider", vedtak = "lv-u21" }]
folge = '''
Svaret er gitt med spørsmålsverktøyet 23.10. Spørsmålet og alternativene står ordrett på #1047 (kommentaren 6358659625). Spørsmålet forutsatte B1 = «For hver post» og B2 = «Hele kravet», som er OV-U26 og OV-U27. Ikke bygget (#1047).'''

[[gruppe.vedtak.alternativ]]
navn = "Hver post for seg"
tekst = '''
Har kravet det særskilte kravet etter § 34.1.3 annet ledd, sier brevet beløpet for hver post for seg: «Byggherren godkjenner <x> av de krevde <y> for justeringen ellers.» og «Byggherren godkjenner <x> av de krevde <y> for særskilt justering etter NS 8407 § 34.1.3 annet ledd.», med «godkjenner <y>» og «avslår kravet om …» som i LV-U4 punkt 5. Begrensningen: «byggherren gjør gjeldende at varselet om særskilt justering for nedsatt produktivitet eller forstyrrelser etter NS 8407 § 34.1.3 tredje ledd i brev <n> av <dato> kom for sent, og at TE har tapt retten til å påberope seg påløpte utgifter som grunnlag for kravet. Byggherren godkjenner <p> kr eks. mva. for dette kravet.» Brevet er varselet eller, uten registrert varsel, den første kravversjonen som krever posten (OV-U24). Etikettene følger innsigelsene, ikke postene: hvert lag får én etikett, og et beløp står i det første laget der ingen påberopelse rammer det. Bare § 34.1.3 påberopt: beløpet for justeringen ellers uten etikett, «Prinsipalt:» begrensningen, «Subsidiært:» beløpet for det særskilte kravet. Begge påberopt: «Prinsipalt:» varselet etter § 34.1.2, «Subsidiært:» beløpet for justeringen ellers og begrensningen, «Videre subsidiært:» beløpet for det særskilte kravet. Byggherrens begrunnelse står som ellers (KA-U24). Endret tekst gjelder bare nye brev (MM-U9). Utvider LV-U4 punkt 5. Utvider LV-U21 til § 34.1.3.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Hver post, med summen"
tekst = '''
Som «Hver post for seg», og brevet sier i tillegg summen i hvert lag når kravet har begge postene: «Til sammen godkjenner byggherren <x> av de krevde <y>.» Endret tekst gjelder bare nye brev (MM-U9). Utvider LV-U4 punkt 5. Utvider LV-U21 til § 34.1.3.'''
forkastet = true

