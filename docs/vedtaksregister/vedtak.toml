som blir uavklart, ikke nødvendigvis hele kravet. Byggherrens svar står.
Etterregistreringen gjør preklusjonen uavklart bare når varselet gjelder det
preklusjonen gjaldt. En enighet står (MM-U8). Er kravene avgjort, gjelder sperren i
KA-U11. Retting følger B-16'''
vedtatt = "10.10, oppdragsgiver etter sparring (#309)"
