forhold = [{ art = "presiserer", vedtak = "ka-u9" }, { art = "presiserer", vedtak = "ka-u21" }, { art = "presiserer", vedtak = "ka-u24" }, { art = "presiserer", vedtak = "gr-u7" }]
folge = '''
Presiserer også raden i B-13 om «godkjent» bare når hele kravet er godkjent og raden i B-13 om preklusjon. Et forbehold appen ikke kan uttrykke, følger KA-U16 og KA-U26, der et svar med forbehold kan gi sammenfall. «Et avslag» i GR-U7 leses som avslag i forening med et betinget tilbud. Følger av HF-U5 (første setning etter «fristforlengelse»). Spørsmål 5 i vurderingen ble besvart med A. Grunnlaget er vurderingen av vedtakene mot NS 8407 og avtaleloven (#504). Byggestatus er ikke vurdert.'''

[[gruppe.vedtak.alternativ]]
navn = "Ja"
tekst = '''
Et svar er godkjenning av et standpunkt bare når det stemmer med kravet, i kravets
egen enhet: krone eller dag (avtaleloven § 2). Et svar som avviker, også med et
vilkår eller en påberopelse av preklusjon med subsidiært standpunkt, er avslag i forening med nytt tilbud (avtaleloven § 6 første ledd). Et subsidiært
standpunkt er et betinget tilbud. Sammenligningen gjøres standpunkt for standpunkt,
slik standpunktene står i brevet (MM-U11). Om et avvik er så lite at det likevel
blir avtale (avtaleloven § 6 annet ledd), avgjør ikke appen (MM-U12).'''

