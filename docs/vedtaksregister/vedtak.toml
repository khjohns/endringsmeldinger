[[gruppe.vedtak]]
anker = "ka-u23"
vedtak = '''
KA-U23: TE kan kreve vederlag i en sak med hovedkategorien force majeure (§ 33.3), og
byggherren svarer som på andre vederlagskrav. Appen viser § 33.3 femte ledd («Partene
har ikke krav på justering av vederlaget som følge av fristforlengelse etter denne
bestemmelsen») som veiledning og trekker ingen konklusjon. Om et krav er en følge av
fristforlengelsen, er partenes spørsmål, og kategorien er TEs utsagn. Appen lukker ikke
vederlagssporet på grunn av kategorien: et vederlagsspor som ikke er sendt, hindrer at
kravene er avgjort (KA-U11), til TE sier «ingen krav» (KA-U12). Et sendt krav avgjøres
som andre krav. Femte ledd utelukker ikke i seg selv vederlaget for en forsering etter §
33.8, som kreves i forseringssaken (FO-U2), men avgjør ikke om vilkårene for forsering
er oppfylt; det er oppdragsgivers lesning. Forkastet: å avvise vederlagskrav så lenge
grunnlaget har kategorien force majeure, og å godta kravet uten veiledning'''
vedtatt = "11.10, oppdragsgiver etter sparring (#309)"
folge = '''
Bygger på [VS-U13](#vs-u13). Avviser ikke noe som godtas i dag. At «ingen krav» ikke er
avkall på vederlaget for en forsering, står i [KA-U25](#ka-u25). Veiledningen hører til
#313. Ikke bygget (#309)'''

