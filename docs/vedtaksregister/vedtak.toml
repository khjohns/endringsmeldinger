forkastet = true

[[gruppe.vedtak]]
id = "VS-U28"
dato = 2026-10-19
hvem = "oppdragsgiver"
kilde = ["#909"]
sporsmal = '''
Spørsmålet ordrett slik det ble vist i spørsmålsverktøyet i runde 12:

Når kontraktens enhetspriser ikke kan brukes og byggherren ikke har akseptert et tilbud, skal vederlaget justeres etter reglene om regningsarbeid (§ 34.4 og § 30), og byggherren skal varsles før regningsarbeidet settes i gang. Etter vår lesning sier verken § 34.4 eller § 30 hva som skjer om det varselet ikke gis. § 30 har i tillegg kostnadsoverslag med varsel om overskridelse (§ 30.2) og ukentlige oppgaver med byggherrens kontroll (§ 30.3), med egne virkninger. Det er vedtatt at dette avgjøres når § 30 er lest (VS-U3). Skal totalentreprenøren i første versjon kunne kreve vederlag etter regning fra appen, og hva gjør appen med varselet før regningsarbeidet settes i gang? Anbefalt: kravet og varselet fra appen, registrert og vist uten utledet virkning; resten av § 30 utenfor appen.

Alternativene slik de ble vist:

Krav og varsel (Recommended): I første versjon kan totalentreprenøren kreve vederlag etter regning (§ 34.4) fra appen, med et anslått beløp som kravversjon. Kravet kan oppdateres med en ny kravversjon når kostnadene er kjent. Varselet til byggherren før regningsarbeidet settes i gang (§ 34.4 første ledd) kan sendes fra appen som et eget utsagn med serverens dato, eller totalentreprenøren kan oppgi datoen for et varsel sendt utenfor appen, som etter OV-U5. Byggherren kan gjøre gjeldende i svaret at varselet ikke ble gitt eller kom for sent. Appen registrerer og viser varselet og standpunktet med bestemmelsen, uten utledet virkning, og avgjør ikke hvilken virkning et manglende eller sent varsel har. Kostnadsoverslaget, totalentreprenørens varsel om at det vil bli overskredet, og tilbakeholdelsen etter § 30.2, og oppgavene og kontrollen etter § 30.3, sendes utenfor appen og registreres etter OV-U4. Appen avgjør ikke virkningene i § 30.3.1 tredje ledd og § 30.3.2 tredje ledd. Forhold: presiserer VS-U3 for § 34.4; utvider OV-U5 til varselet etter § 34.4.

Krav fra appen, varsel utenfor: I første versjon kan totalentreprenøren kreve vederlag etter regning (§ 34.4) fra appen, med et anslått beløp som kravversjon. Varselet før regningsarbeidet settes i gang har ingen egen handling i appen: det sendes utenfor appen og registreres som dokumentasjon etter OV-U4, og appen utleder ingenting av det. Kostnadsoverslaget, totalentreprenørens varsel om at det vil bli overskredet, tilbakeholdelsen og oppgavene etter § 30.2 og § 30.3 sendes utenfor appen og registreres etter OV-U4. Forhold: presiserer VS-U3 for § 34.4.

Regningsarbeid avvises nå: I første versjon avvises krav om vederlag etter regning (§ 34.4 og § 30), som justering av enhetspriser etter OV-U1. Totalentreprenøren kan kreve vederlag fra appen etter et tilbud (§ 34.2.1) eller etter kontraktens enhetspriser (§ 34.3.1). Et krav etter regning, varselet før regningsarbeidet, kostnadsoverslaget og varselet om at det vil bli overskredet (§ 30.2), og oppgavene (§ 30.3) sendes utenfor appen og registreres etter OV-U4. Byggherren kan fortsatt mene at vederlaget skal justeres etter regning når hen ikke aksepterer tilbudet. Vedtaket står og bygges senere; avgrensningen gjelder rekkefølgen, som i OV-U1. Forhold: utvider OV-U1 (legger § 34.4 og § 30 til det som avvises); presiserer VS-U3.'''
valgt = "Krav og varsel"
svar = '''
«Krav og varsel (Recommended)»'''
forhold = [{ art = "presiserer", vedtak = "vs-u3" }, { art = "utvider", vedtak = "ov-u5" }]
folge = '''
Svaret er gitt med spørsmålsverktøyet og står på #909 (kommentaren 6275298641). Ikke bygget (#909).'''

