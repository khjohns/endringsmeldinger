endrer ikke den registrerte enigheten, og ingenting sperres. Et brev som viser til en ny
avtale, hevder at enigheten er ugyldig eller inneholder vilkår, er ikke samme tilfelle.
Kan appen ikke uttrykke innholdet, gjelder KA-U16. Forkastet: at en slik hendelse leses
som gyldig, som i dag, fordi den da kan oppheve en enighet (KA-U7, GR-U10, MM-U3); og at
et registrert brev gjør saken ikke forstått'''
