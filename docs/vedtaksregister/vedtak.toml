Spørsmålet ordrett slik det står i kommentaren på #1043 (header «Trekk spor»):

TE trekker kravet om endring (grunnlaget). Etter vedtaket trekkes da alle krav TE har sendt. I vederlag eller frist har TE bare varslet, eller sagt uttrykkelig at det ikke kreves noe. Hvilken betegnelse skal det kravet ha?

Alternativene slik de står i kommentaren:

«Trukket der noe er sendt (Recommended)»: Trekker TE grunnlaget, har hvert vederlags- og fristspor der TE har sendt et krav, et varsel eller «ingen krav», betegnelsen «Trukket». Et spor uten noe sendt har ingen betegnelse. Utvider GR-U5 til varsel og «ingen krav» (KA-U12).

«Trukket bare for krav»: Bare et spor med et sendt krav får «Trukket». Et varsel står som «Varslet» og «ingen krav» som «Ingen krav». Trekket vises for saken. Følger GR-U5 og KA-U2 etter ordlyden.

«Ingen krav står»: Som det anbefalte alternativet, men et spor med «ingen krav» beholder «Ingen krav». Utvider GR-U5 til varsel.'''
