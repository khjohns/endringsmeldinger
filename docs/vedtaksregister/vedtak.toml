[[gruppe.vedtak]]
anker = "vs-u1"
vedtak = '''
VS-U1: en innsigelse etter § 5 tredje ledd registreres som ett utsagn med sendetid. Den
kan gjelde ethvert varsel, krav eller svar fra motparten, også et svar etter § 33.6.2
annet ledd bokstav b. En protest mot innsigelsen registreres og vises ved siden av.
Appen avgjør ikke om innsigelsen kom i tide. Forkastet: å avvise en § 5-innsigelse som
