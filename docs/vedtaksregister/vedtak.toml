[[gruppe.vedtak]]
id = "LV-U13"
dato = 2026-10-18
hvem = "oppdragsgiver"
kilde = ["#790"]
sporsmal = '''
Spørsmålet «Catenda-tilgang», runde 6, ordrett slik det ble vist i spørsmålsverktøyet:

Vedlegg i TS-stien (#790), spørsmål 2. Vedtaket «Vedlegg er kontraktskorrespondanse» (18.09) har følgen «Deltakere uten TE- eller BH-tilknytning leser ikke vedlegg»; i appen håndheves det med kravet om kontraktsside. I Catenda styrer prosjektets egen tilgang hvem som leser et dokument, og appen kan ikke se eller sette tilgangen på mappen. Leveringen tar bibliotek og mappe fra prosjektets konfigurasjon. Svaret gjelder også brevene. Skal appen sørge for at bare kontraktspartene kan lese brev og vedlegg i Catenda, eller gjelder vedtaket lesing i appen?

Alternativene slik de ble vist:

Gjelder i appen (Recommended): Vedtaket gjelder lesing i appen. Appen legger brev og vedlegg i biblioteket og mappen prosjektets konfigurasjon skal angi. Hvem som leser dem i Catenda, styres av tilgangen prosjektet har satt på mappen. (Presiserer vedtaket.)

Bare mappe for partene: Prosjektets konfigurasjon angir en mappe som bare kontraktspartene har tilgang til i Catenda, og appen leverer brev og vedlegg bare dit. Uten en slik mappe leveres ingenting. (Utvider vedtaket til Catenda; beror på konfigurasjonen, som appen ikke kan kontrollere.)'''
valgt = "Gjelder i appen"
svar = '''
«Gjelder i appen (Recommended)»'''
folge = '''
Presiserer «Vedlegg er kontraktskorrespondanse». Svaret er gitt med spørsmålsverktøyet og står på #764 (kommentaren 6251668902). Ikke bygget (#790).'''

