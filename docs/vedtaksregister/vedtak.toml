[[gruppe.vedtak.alternativ]]
navn = "D"
tekst = '''
D1, svaret med vilkår: Godkjenner byggherrens svar på vederlag eller frist noe, prinsipalt eller subsidiært, opplyser byggherren for sporet om godkjenningen er avhengig av vilkår eller forbehold som ikke kan uttrykkes med valgene i skjemaet. Skjemaet spør: ‹Er godkjenningen avhengig av andre vilkår eller forbehold enn dem som uttrykkes gjennom valgene du har gjort og den faste brevteksten?› Veiledningen sier: ‹Forbeholdet for ubesvart grunnlag og forbeholdene som uttrykkes i lagene i svaret, omfattes ikke av spørsmålet.› Spørsmålet stilles når svaret utarbeides, det har ingen forhåndsvalg, og sendingen avvises når opplysningen mangler. Opplysningen er byggherrens og lagres med svarversjonen. Løsningen kontrollerer den ikke mot utdypningen og tolker ikke teksten.
Svarer byggherren nei, gjelder de øvrige reglene. Står det likevel et vilkår i utdypningen, er brevet det autoritative uttrykket for byggherrens standpunkt (B-03), og sammenfallet er løsningens utledning av valgene og avgjør ikke om partene rettslig er enige (MM-U12).
Svarer byggherren ja, fører byggherren opp hvert vilkår som et eget punkt i et obligatorisk felt. Punktene nummereres i det første svaret i sporet og beholder nummeret i senere utsagn. Et svar med vilkår stemmer ikke med kravet, så byggherren kan sette en akseptfrist (HF-U15). Brevet sier for sporet: ‹Godkjenningen er gitt på disse vilkårene:›, og punktene følger. Feltet gjør vilkårene synlige for TE før aksepten, men løsningen kontrollerer ikke at de er reelle. Byggherren kan oppgi hvilke andre spor vilkårene berører. Henvisningen vises ved disse sporene til vilkårene er avklart, men endrer ikke utledningen eller sperrer handlinger der. Opplysningen er byggherrens, og løsningen kontrollerer ikke koblingen mot teksten. Svaret gir ikke sammenfall med kravet, og TE tar stilling ved å godta eller ikke godta svaret (HF-U7). Reglene og sperrene for TEs aksept gjelder (HF-U18, FO-U5).
Før TE har godtatt svaret, avvises en revisjon som endrer opplysningen fra nei til ja, fordi den svekker det byggherren har gitt (HF-U5, HF-U6). En revisjon av et svar med ja gjengir de vilkårene som gjelder, med samme nummer. Nye eller endrede vilkår avvises, og et frafalt vilkår kan ikke tas inn igjen. Byggherren frafaller vilkår ikke i en revisjon, men i et eget utsagn med henvisning til brevet med vilkårene, så resten av svaret står uendret. Byggherren velger hvilke punkter frafallet gjelder. Et frafall gjelder betingelsene for byggherrens godkjenning i punktet; byggherrens ytelser og andre innrømmelser i punktet og i svaret står. Løsningen slutter ikke at det er i TEs favør å fjerne et helt punkt. Brevet sier: ‹Byggherren frafaller vilkår <nummer> i svaret i brev <n> av <dato>. Svaret står ellers uendret, og frafallet reduserer ikke byggherrens ytelser eller andre innrømmelser i det.› Frafaller byggherren alle vilkårene, gjelder svaret som et svar uten særskilte vilkår, og gir det sammenfall med kravet, er partene enige (GR-U7). Utsagnet går gjennom godkjenningen etter fullmakten, som et svar gjør. Opplysningene er byggherrens, og løsningen tolker ikke utdypningen.
Godtar TE, sier brevet: ‹TE godtar byggherrens svar i brev <n> av <dato>, med vilkår <numre>.›, og er noen vilkår frafalt: ‹Vilkår <numre> er frafalt i brev <n> av <dato>.› Løsningen registrerer da enighet med særskilte vilkår i sporet. Den tolker ikke vilkårene og avgjør ikke om de er oppfylt. Løsningen endrer ikke utledningen i andre spor automatisk som følge av aksepten, og den avgjør ikke hvilken rettslig betydning vilkårene har for disse sporene. Enigheten binder etter KA-U7: en ny kravversjon og byggherrens revisjon i sporet avvises, og TE kan trekke kravet (KA-U6). Om enigheten er betinget av grunnlaget eller uten virkning, følger GR-U7 som for annen enighet. Vilkår som ikke er avklart, er et eget forhold i tillegg: til de er avklart etter avklaringsreglene nedenfor, regnes kravet ikke som avgjort etter OV-U3, og beløpet inngår ikke i summen av virksom enighet, også når grunnlaget er avklart. Sporets betegnelse er ‹Enige›, og linja under viser begge forholdene, med henvisning til brevet med vilkårene. Nøkkeltallene viser enigheten særskilt og sier hva den bygger på.
Svar på grunnlaget og registrering av en endringsordre etter OV-U6 omfattes ikke. Der avvises sendingen, eller registreringen som svar på grunnlaget, når byggherren opplyser om slike vilkår. Det er en avgrensning av støtten for særskilte vilkår i første versjon, ikke en regel om at slike svar er utelukket.
Endrer GR-U7 og GR-U8 når byggherren svarer ja, og snevrer inn GR-U26 og HF-U5. Endrer KA-U16, som forkastet foreløpig at et svar med forbehold ikke gir sammenfall, for svar der byggherren selv opplyser om vilkår. Endrer KA-U19 for svar på vederlag og frist sendt fra løsningen. Endrer svaret 25.10 på spørsmål 8 om nøkkeltallene: også vilkår som ikke er avklart, holder et beløp utenfor virksom enighet. Utvider MM-U28 og LV-U4, og presiserer OV-U3, MM-U30 og HF-U15. I tråd med HF-U7, KA-U7, LV-U32 og MM-U12.
D2, avklaringen av vilkårene: Har partene enighet med særskilte vilkår i et spor, kan en part sende et forslag om å avklare vilkårene, med henvisning til brevet med vilkårene. Parten velger hvilke vilkår forslaget gjelder, etter nummeret, og hva det gjelder: at vilkårene er oppfylt, at de frafalles, eller at avtalen endres. Brevet sier, etter valget: ‹<Part> foreslår at vilkår <numre> i svaret i brev <n> av <dato> legges til grunn som oppfylt.›, ‹<Part> foreslår at vilkår <numre> i svaret i brev <n> av <dato> frafalles. Byggherrens ytelser og andre innrømmelser i punktene står.› eller ‹<Part> foreslår at avtalen endres slik for vilkår <numre> i svaret i brev <n> av <dato>:›, og partens beskrivelse følger. Brevet sier også: ‹Avklaringen endrer ikke beløpet eller dagene i enigheten. Forslaget gjelder til <dato> og faller bort uten aksept.› Om alle de særskilte vilkårene i sporet er avklart, utleder løsningen av numrene.
TE kan i samme forslag tilby å trekke kravet om vederlag eller frist. Forslaget er da ett samlet forslag: brevet og aksepten viser til kravversjonen som trekkes og til vilkårene som avklares, og ingen av følgene inntrer før hele forslaget er godtatt. Mens forslaget står åpent, avvises TEs handlinger som ville gjøre trekket utillatt eller fjerne enigheten med vilkårene: en ny kravversjon og et eget trekk av kravet som skal trekkes, en aksept som ville gi et avtalt fradrag i det kravet (KA-U22), og et trekk av kravet i sporet med vilkårene. Andre handlinger berøres ikke. Visningen viser det åpne forslaget og at sperren opphører ved aksept, avslag eller når fristen er ute. Lukkes saken mens forslaget står åpent, fordi TE godtar et avslag på grunnlaget eller trekker grunnlaget, faller forslaget bort. Ellers godtas en aksept så lenge forslaget binder; hendelser i andre spor endrer ikke forslaget. Et trekk av grunnlaget kan ikke inngå i forslaget.
Forslaget har en akseptfrist parten setter. Før sending er det et utkast og kan endres. Det sendte forslaget binder avsenderen som et tilbud etter reglene for byggherrens svar (HF-U5, HF-U6, LV-U7): det kan ikke trekkes eller svekkes i løsningen, og bindingen varer til motparten godtar eller avslår det, eller fristen er ute. Det finnes høyst ett åpent forslag om vilkårene i et brev; et nytt forslag fra en av partene avvises til det åpne er godtatt, avslått eller har falt bort. Skjemaet sier før sending at forslaget ikke kan trekkes, og hvor lenge det binder. Forslaget og aksepten går gjennom godkjenningen etter fullmakten, som et svar gjør. Motparten kan godta eller avslå, og aksepten viser til akkurat dette forslaget. Taushet har ingen virkning i løsningen (MM-U12).
Godtar motparten, registrerer løsningen partenes tilslutning til avklaringen, uten å fastslå at en beskrivelse av faktum er sann. Innholdet i enigheten er svaret og kravet med avklaringene partene har sluttet seg til. Er alle de særskilte vilkårene i sporet avklart, faller virkningen etter D1 av vilkår som ikke er avklart, bort, og enigheten følger GR-U7 og MM-U28. Henvisningene i andre spor viser da avklaringen. Avslås et forslag eller faller det bort, sier visningen at avklaringen ikke er godtatt i løsningen, ikke at vilkåret ikke er oppfylt. En avklaring kan ikke endre beløpet eller dagene i første versjon. At løsningen krever motpartens tilslutning, er et produktvalg; det sier ikke at et ensidig frafall er uten rettslig virkning. Utvider LV-U4. Snevrer inn KA-U6 mens et forslag om trekk står åpent. Presiserer HF-U9, KA-U10, KA-U22, OV-U3 og MM-U28. Anvender HF-U5, HF-U6 og LV-U7 på forslaget. I tråd med MM-U12.
D3, endringsordre: En sak der et spor har enighet med særskilte vilkår som ikke er avklart, kan ikke inngå i en endringsordre (EO-U5). Sperren gjelder hele saken, fordi en sak inngår i høyst én endringsordre og gjengis der samlet (EO-U3, EO-U8). Den gjelder ikke saker uten slike vilkår. Snevrer inn EO-U5, slik KA-U26 gjør for et registrert brev merket med et forbehold.'''

