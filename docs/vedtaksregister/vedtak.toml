forkastet = true

[[gruppe.vedtak]]
id = "VS-U29"
dato = 2026-10-20
hvem = "oppdragsgiver"
kilde = ["#1095"]
sporsmal = '''
Spørsmålet ordrett slik det står i kommentaren på #1095 (Q1, påberopelse mot begrunnelsen etter § 33.6.2 b):

§ 33.6.2: Når TE svarer på BHs forespørsel med en begrunnelse for at grunnlaget for å beregne fristkravet ikke foreligger (annet ledd b), er det ikke et krav, så det finnes ikke noe svar på krav å ta standpunkt i. Hvor gjør BH gjeldende at begrunnelsen kom for sent, eller at den ikke er et svar etter annet ledd? § 5 tredje ledd krever at det skjer uten ugrunnet opphold etter at svaret er mottatt.

Alternativene slik de står i kommentaren:

Egen innsigelse (Recommended): Byggherren gjør gjeldende at TEs begrunnelse etter § 33.6.2 annet ledd bokstav b kom for sent, eller at den ikke er et svar etter annet ledd, i en egen innsigelse etter § 5 tredje ledd mot begrunnelsen, sendt fra appen. Fordi begrunnelsen bare kan komme for sent etter § 33.6.2, er innsigelsen en påberopelse etter den bestemmelsen. Påberoper byggherren at begrunnelsen kom for sent, utledes virkningen som etter § 33.6.2 tredje ledd (VS-U17). Standpunktet om at begrunnelsen ikke er et svar etter annet ledd, registreres og vises uten utledet virkning (VS-U17). Byggherrens svar på et senere fristkrav gjentar påberopelsen eller gir den opp (VS-U9, VS-U11), og HF-U4 gjelder for den. Appen avgjør ikke om innsigelsen kom uten ugrunnet opphold. Forhold: utvider VS-U24, presiserer VS-U17.

Bare i svaret på kravet: Byggherren gjør gjeldende at begrunnelsen etter § 33.6.2 annet ledd bokstav b kom for sent, eller at den ikke er et svar etter annet ledd, i svaret på TEs første krav med dager etter begrunnelsen, med ett standpunkt etter § 33.6.2. En egen innsigelse etter § 5 tredje ledd mot begrunnelsen registreres og vises, men leses ikke som en påberopelse etter § 33.6.2. Appen avgjør ikke om påberopelsen kom uten ugrunnet opphold. Forhold: presiserer VS-U17 og VS-U24.'''
valgt = "Egen innsigelse"
svar = '''
«Egen innsigelse (Recommended)»'''
forhold = [{ art = "utvider", vedtak = "vs-u24" }, { art = "presiserer", vedtak = "vs-u17" }]
folge = '''
Svaret er gitt med spørsmålsverktøyet og står på #1095 (kommentaren 6299502700). Ikke bygget (#1095).'''

[[gruppe.vedtak.alternativ]]
navn = "Egen innsigelse"
tekst = '''
Byggherren gjør gjeldende at TEs begrunnelse etter § 33.6.2 annet ledd bokstav b kom for sent, eller at den ikke er et svar etter annet ledd, i en egen innsigelse etter § 5 tredje ledd mot begrunnelsen, sendt fra appen. Fordi begrunnelsen bare kan komme for sent etter § 33.6.2, er innsigelsen en påberopelse etter den bestemmelsen. Påberoper byggherren at begrunnelsen kom for sent, utledes virkningen som etter § 33.6.2 tredje ledd (VS-U17). Standpunktet om at begrunnelsen ikke er et svar etter annet ledd, registreres og vises uten utledet virkning (VS-U17). Byggherrens svar på et senere fristkrav gjentar påberopelsen eller gir den opp (VS-U9, VS-U11), og HF-U4 gjelder for den. Appen avgjør ikke om innsigelsen kom uten ugrunnet opphold.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Bare i svaret på kravet"
tekst = '''
Byggherren gjør gjeldende at begrunnelsen etter § 33.6.2 annet ledd bokstav b kom for sent, eller at den ikke er et svar etter annet ledd, i svaret på TEs første krav med dager etter begrunnelsen, med ett standpunkt etter § 33.6.2. En egen innsigelse etter § 5 tredje ledd mot begrunnelsen registreres og vises, men leses ikke som en påberopelse etter § 33.6.2. Appen avgjør ikke om påberopelsen kom uten ugrunnet opphold.'''
forkastet = true

[[gruppe.vedtak]]
id = "VS-U30"
dato = 2026-10-21
hvem = "oppdragsgiver"
kilde = ["#1095", "#1120"]
sporsmal = '''
Spørsmålet ordrett slik det står i kommentaren på #1095 (S2, ny forespørsel etter TEs begrunnelse når innsigelsen mot begrunnelsen står åpen):

Byggherren sender en forespørsel etter § 33.6.2. TE svarer med en begrunnelse etter annet ledd b, og byggherren gjør innsigelse mot den. Etter VS-U19 kan byggherren så sende en ny forespørsel, fordi TE ennå ikke har krevd dager. Når TE svarer med et fristkrav, skal byggherrens svar etter VS-U29 gjenta innsigelsen mot begrunnelsen eller gi den opp. Etter VS-U24 har svaret bare ett standpunkt per bestemmelse, så det kan ikke samtidig ta stilling til om kravet kom i tide etter den nye forespørselen. Hva skal gjelde?

Alternativene slik de står i kommentaren:

Ingen ny forespørsel etter begrunnelse (Recommended): Etter TEs begrunnelse etter § 33.6.2 annet ledd b kan byggherren ikke sende en ny forespørsel etter § 33.6.2 fra appen, men kan registrere en som er sendt utenfor appen. Snevrer inn VS-U19. Bevarer innsigelsen etter VS-U29.

Ett standpunkt per forespørsel: Byggherrens svar har ett standpunkt etter § 33.6.2 for hver forespørsel det gjelder. Endrer VS-U24 og krever ny brevtekst etter LV-U18 og LV-U4.

Svaret gjelder bare siste forespørsel: Byggherrens svar på fristkravet tar bare stilling etter den nye forespørselen. Innsigelsen mot begrunnelsen står åpen uten å bli gjentatt eller gitt opp. Snevrer inn VS-U29.'''
valgt = "Ingen ny forespørsel etter begrunnelse"
svar = '''
«Ingen ny forespørsel etter begrunnelse»'''
forhold = [{ art = "snevrer inn", vedtak = "vs-u19" }]
folge = '''
Spørsmålet og alternativene står på #1095 (kommentaren 6319228702). Svaret er gitt med spørsmålsverktøyet og videresendt fra orkestratoren 21.10.'''

[[gruppe.vedtak.alternativ]]
navn = "Ingen ny forespørsel etter begrunnelse"
tekst = '''
Etter TEs begrunnelse etter § 33.6.2 annet ledd b kan byggherren ikke sende en ny forespørsel etter § 33.6.2 fra appen, men kan registrere en som er sendt utenfor appen.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Ett standpunkt per forespørsel"
tekst = '''
Byggherrens svar har ett standpunkt etter § 33.6.2 for hver forespørsel det gjelder. Endrer VS-U24 og krever ny brevtekst etter LV-U18 og LV-U4.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Svaret gjelder bare siste forespørsel"
tekst = '''
Byggherrens svar på fristkravet tar bare stilling etter den nye forespørselen. Innsigelsen mot begrunnelsen står åpen uten å bli gjentatt eller gitt opp. Snevrer inn VS-U29.'''
forkastet = true

[[gruppe.vedtak]]
id = "VS-U31"
dato = 2026-10-22
hvem = "oppdragsgiver"
kilde = ["#1121"]
sporsmal = '''
Spørsmålet ordrett slik det står i kommentaren på #1121 (Q4, antall forespørsler etter § 33.6.2 fra appen):

Premisset: VS-U19 lar byggherren sende en forespørsel etter § 33.6.2 fra appen så lenge TE ikke har fremmet et krav om antall dager, og VS-U30 sperrer en ny etter TEs begrunnelse. Ingen av dem hindrer en ny forespørsel mens den første står ubesvart, så i dag kan BH sende to før TE svarer. Skal det være slik?

Alternativene slik de står i kommentaren:

«Én forespørsel fra appen (Recommended)»: Byggherren kan sende høyst én forespørsel etter § 33.6.2 fra appen i saken. En senere forespørsel sendes utenfor appen og registreres som dokumentasjon (VS-U23). Snevrer inn VS-U19, i samme retning som VS-U30. Forløpet i forrige spørsmål kan da ikke oppstå i appen, og spørsmålet om VS-U29 faller bort.

«Flere er lov»: Byggherren kan sende en ny forespørsel fra appen mens den forrige står ubesvart, som i dag. Da må forrige spørsmål (om innsigelsen mot begrunnelsen står åpen) besvares.

«Avklares med jurist»: #1121 venter. Byggeøkta leverer #801 alene.'''
valgt = "Én forespørsel fra appen"
svar = '''
«Kun 1 forespørsel (anbefalt valg). Og hvis svaret fra TE er 33.6.2 (b) - begrunnelse - er det da en naturlig overgang for BH å vurdere begrunnelsen i relasjon til 33.6.1, jf 33.6.2 siste ledd?»

Oppfølging 22.10: «Én forespørsel fra appen»'''
forhold = [{ art = "snevrer inn", vedtak = "vs-u19" }]
folge = '''
Spørsmålet og alternativene står på #1121 (kommentaren 6339560335). Svaret er gitt med spørsmålsverktøyet 22.10. Bekreftelsen av valget står på #1121 (kommentaren 6339847080).'''

[[gruppe.vedtak.alternativ]]
navn = "Én forespørsel fra appen"
tekst = '''
Byggherren kan sende høyst én forespørsel etter § 33.6.2 fra appen i saken. En senere forespørsel sendes utenfor appen og registreres som dokumentasjon (VS-U23). Snevrer inn VS-U19, i samme retning som VS-U30.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Flere er lov"
tekst = '''
Byggherren kan sende en ny forespørsel fra appen mens den forrige står ubesvart, som i dag. Da må forrige spørsmål (om innsigelsen mot begrunnelsen står åpen) besvares.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Avklares med jurist"
tekst = '''
#1121 venter. Byggeøkta leverer #801 alene.'''
forkastet = true

[[gruppe.vedtak]]
id = "VS-U32"
dato = 2026-10-22
hvem = "oppdragsgiver"
kilde = ["#1121"]
sporsmal = '''
Spørsmålet ordrett slik det står i kommentaren på #1121 (Q5, oppfølging av tilleggsspørsmålet i Q4, § 33.6.2 siste ledd):

Ja, etter TEs begrunnelse etter § 33.6.2 annet ledd b gjelder § 33.6.1 for kravet som kommer senere (VS-U17), og BH påberoper sen spesifisering i svaret på det kravet (VS-U3, VS-U4, VS-U24). Slik virker appen i dag. Én ting er ikke sagt uttrykkelig: hvor gjør BH gjeldende at TE allerede hadde grunnlag for å beregne kravet da TE begrunnet?

Alternativene slik de står i kommentaren:

«I svaret på kravet (Recommended)»: I svaret på det senere fristkravet, som en påberopelse av sen spesifisering etter § 33.6.1 (VS-U4, VS-U24). BHs begrunnelse kan vise til tidspunktet for TEs begrunnelse. Innsigelsen mot begrunnelsen står etter § 33.6.2 som i VS-U29. Presiserer VS-U17.

«Også i innsigelsen»: Som over. I tillegg kan BH i innsigelsen mot begrunnelsen oppgi at grunnlaget foreligger etter § 33.6.1. Det registreres og vises uten virkning, og svaret på kravet gjentar det ikke. Utvider VS-U29.

«Innsigelsen er påberopelse»: Innsigelsen kan også være en påberopelse etter § 33.6.1, som svaret på kravet gjentar eller gir opp. Endrer VS-U24 og VS-U29, og kommer før virkningen etter § 33.6.1 rammer kravet.'''
valgt = "I svaret på kravet"
svar = '''
«I svaret på kravet (Recommended)»'''
forhold = [{ art = "presiserer", vedtak = "vs-u17" }]
folge = '''
Spørsmålet og alternativene står på #1121 (kommentaren 6339560335). Svaret er gitt med spørsmålsverktøyet 22.10.'''

[[gruppe.vedtak.alternativ]]
navn = "I svaret på kravet"
tekst = '''
I svaret på det senere fristkravet, som en påberopelse av sen spesifisering etter § 33.6.1 (VS-U4, VS-U24). BHs begrunnelse kan vise til tidspunktet for TEs begrunnelse. Innsigelsen mot begrunnelsen står etter § 33.6.2 som i VS-U29. Presiserer VS-U17.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Også i innsigelsen"
tekst = '''
Som over. I tillegg kan BH i innsigelsen mot begrunnelsen oppgi at grunnlaget foreligger etter § 33.6.1. Det registreres og vises uten virkning, og svaret på kravet gjentar det ikke. Utvider VS-U29.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Innsigelsen er påberopelse"
tekst = '''
Innsigelsen kan også være en påberopelse etter § 33.6.1, som svaret på kravet gjentar eller gir opp. Endrer VS-U24 og VS-U29, og kommer før virkningen etter § 33.6.1 rammer kravet.'''
forkastet = true

[[gruppe.vedtak]]
id = "VS-U33"
dato = 2026-10-22
hvem = "oppdragsgiver"
kilde = ["#1045"]
sporsmal = '''
Spørsmålet ordrett slik det står i kommentaren på #1045 (header «VS-U19», fra samspillsreviewet av PR #1148):

VS-U19 sier at BH kan sende en forespørsel etter § 33.6.2 fra appen «så lenge TE ikke har fremmet et krav om antall dager i saken». OV-U4 sier at appen ikke utleder noe av et brev sendt utenfor appen og registrert i den, og at det ikke gir noen sperre. Hvis TE registrerer et brev der det står at TE krever 10 dager: skal BH fortsatt kunne sende forespørselen fra appen?

Alternativene slik de står i kommentaren:

«Ja, bare krav appen kjenner, stopper (Recommended)»: Bare et krav om dager som er fremmet i appen, stopper forespørselen. Et registrert brev gjør det aldri, hva beskrivelsen enn sier. VS-U19 presiseres slik med en merknad i vedtaksregisteret. Virkningen av forespørselen utledes uansett bare når BH påberoper den (VS-U3), og TE kan svare med dager fra appen (VS-U27).

«Nei, et registrert krav stopper også»: TE må kunne merke at et registrert brev inneholder et krav om dager, og da stopper forespørselen. Det krever et nytt felt og endrer OV-U4.'''
valgt = "Ja, bare krav appen kjenner, stopper"
svar = '''
«Ja, bare krav appen kjenner, stopper (Recommended)»'''
forhold = [{ art = "presiserer", vedtak = "vs-u19" }]
folge = '''
Spørsmålet, alternativene og svaret står på #1045 (kommentaren 6345421494).'''

[[gruppe.vedtak.alternativ]]
navn = "Ja, bare krav appen kjenner, stopper"
tekst = '''
Bare et krav om dager som er fremmet i appen, stopper forespørselen. Et registrert brev gjør det aldri, hva beskrivelsen enn sier. VS-U19 presiseres slik med en merknad i vedtaksregisteret. Virkningen av forespørselen utledes uansett bare når BH påberoper den (VS-U3), og TE kan svare med dager fra appen (VS-U27).'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Nei, et registrert krav stopper også"
tekst = '''
TE må kunne merke at et registrert brev inneholder et krav om dager, og da stopper forespørselen. Det krever et nytt felt og endrer OV-U4.'''
forkastet = true

[[gruppe]]
tittel = "Endringsordre og forsering"

[[gruppe.vedtak]]
anker = "eo-u1"
vedtak = '''
EO-U1: en endringsordre utstedes bare som EO-sak, gjennom kommandoen (B-02 punkt 3).
`eo_utstedt` i en KOE-sak avvises. En omforent KOE-sak formaliseres ved å inngå i en
EO-sak, der TE godtar eller bestrider endringsordren (TFR-02). `kan_utstede_eo` betyr at
KOE-saken kan inngå i en EO-sak'''
vedtatt = "08.10, oppdragsgiver"
forhold = [{ art = "presiserer", vedtak = "gr-u3" }]
folge = '''
Presiserer GR-U3. Avgrenset 10.10 av [GR-U13](#gr-u13) og [KA-U14](#ka-u14): er
byggherrens godkjenning av grunnlaget i KOE-saken en endringsordre etter § 32.3 første
ledd a, er den svaret i grunnlagssporet i KOE-saken. Utstedes endringsordren i en EO-sak
(EO-U6), skrives svaret i KOE-saken med henvisning til den. Hendelsestypen `eo_utstedt`
gjelder fortsatt bare EO-saker. Ikke bygget. I dag godtas `eo_utstedt` i en KOE-sak når
`kan_utstede_eo` er `true`, og `_close_spor_for_reactive_eo` skriver sporene om (DT-05).
Frontenden og godkjenningskommandoen bruker ikke den veien. Radene står i
[domenetabellen](../domenetabell/README.md)'''

[[gruppe.vedtak]]
anker = "eo-u2"
vedtak = '''
EO-U2: en KOE-sak kan inngå i en endringsordre når saken er `OMFORENT`, grunnlaget er
godkjent eller låst, og minst ett av vederlag og frist er godkjent eller låst. Et
godtatt avslag eller et trukket spor teller som oppgjort; et spor TE fortsatt kan sende,
hindrer, som i rollupen. Frafalt grunnlag gir ikke endringsordre fra KOE-saken (GR-U3).
Samme sett gjelder for `kan_utstede_eo`, kandidatene til en EO-sak og rollupen'''
vedtatt = "08.10, oppdragsgiver"
folge = '''
Presisert 09.10 av [EO-U5](#eo-u5): «godkjent eller låst» betyr enighet, og et trukket
spor gir ikke alene grunnlag for endringsordre. Ikke bygget. `kan_utstede_eo` ser bort
fra spor som ikke er sendt; kandidatregelen `_is_agreed_koe` krever i tillegg et
godkjent vederlag eller en godkjent frist (DT-06)'''

[[gruppe.vedtak]]
anker = "eo-u3"
vedtak = '''
EO-U3: en KOE-sak inngår i høyst én endringsordre, også når den er bestridt. En revisjon
er samme endringsordre, og TEs uenighet føres i en ny KOE (TFR-02). Mens KOE-saken
inngår i en EO-sak, er `kan_utstede_eo` `false` i KOE-saken, og den er ikke kandidat til
en annen'''
vedtatt = "08.10, oppdragsgiver"
folge = '''
Avgjør B-08. Kandidatregelen i `EndringsordreService` holder det for
`/api/endringsordre`; KOE-saken viser det ikke (DT-07), og `/api/events` kontrollerer
det ikke (DT-08)'''

[[gruppe.vedtak]]
anker = "eo-u4"
vedtak = '''
EO-U4: EO-sakens livsløp er strengt. Endringsordren utstedes én gang, og en ny utgave er
`eo_revidert`. Byggherren reviderer bare en bestridt endringsordre. TE svarer én gang på
hver utgave, med aksept eller bestridelse. En akseptert endringsordre er endelig.
KOE-tilknytningen endres bare før utstedelse'''
vedtatt = "08.10, oppdragsgiver"
folge = '''
Presisert 10.10 av [EO-U8](#eo-u8): TEs ene svar på hver utgave kan ta stilling til
hvert utsagn for seg (MM-U10). Endret 10.10 av [EO-U9](#eo-u9) for en endringsordre som
er svar på grunnlaget i en KOE-sak: byggherren kan ikke revidere den. Ikke bygget.
`EO_IS_ISSUED` krever bare at endringsordren er utstedt, bestridt eller revidert, og
`eo_utstedt` i en EO-sak har ingen regel (DT-09). `legg_til_koe` og `fjern_koe` krever
`UTKAST`; `/api/events` gjør det ikke'''

[[gruppe.vedtak]]
anker = "eo-u5"
vedtak = '''
EO-U5: en KOE-sak kan inngå i en endringsordre når grunnlaget er godkjent (GR-U10) og
minst ett av vederlag og frist har enighet: byggherren har godkjent kravet helt eller
delvis, eller TE har godtatt et avslag (KA-U7). Et trukket spor teller som oppgjort, men
gir ikke alene grunnlag for endringsordre. Et spor TE fortsatt kan sende, hindrer. En
endringsordre på 0 kr og 0 dager er dermed mulig, for eksempel når en ytelse faller
bort, en annen kommer til, og partene er enige om å gå i null. Et krav på 0 finnes ikke
(KA-U8), så null uttrykkes ved et godtatt avslag. Forkastet: at et godtatt avslag bare
teller som oppgjort, og at et godkjent grunnlag er nok når begge spor er trukket'''
vedtatt = "09.10, oppdragsgiver (#308)"
forhold = [{ art = "presiserer", vedtak = "eo-u2" }]
folge = '''
Presiserer EO-U2: «godkjent eller låst» betyr enighet (merknaden 09.10 i 3.1). Presisert
09.10 av [KA-U12](#ka-u12): «ingen krav» teller som oppgjort. Presisert 11.10 av
[KA-U26](#ka-u26): en merking sperrer at saken inngår i en endringsordre.
Kandidatregelen i Python (`_is_agreed_koe`, DT-06) krever et godkjent vederlag eller en
godkjent frist og rettes ikke (merknaden i 4.2). Ikke bygget'''

[[gruppe.vedtak]]
anker = "eo-u6"
vedtak = '''
EO-U6: utsteder byggherren en endringsordre i en EO-sak som svar på grunnlaget i en
KOE-sak (KA-U12), lagres samtidig et grunnlagssvar i KOE-saken, med grunnlaget godkjent
og § 31.3 oppfylt, og sakene viser til hverandre. Grunnlagssvaret viser til den bestemte
utgaven av endringsordren og til samme brev, og er ikke en egen erklæring. Svaret er
full godkjenning bare når endringsordren dekker grunnlaget i kravet. Da er partene enige
om grunnlaget (GR-U10). Der § 32.2 gjelder (GR-U11), er trekket av grunnlaget sperret;
ellers står trekket (KA-U13). Vederlag og frist går videre i KOE-saken. Endringsordren
går gjennom fullmakten som en godkjenning av grunnlaget etter GFK-06: et spor som
besvares i samme brev, har verdien i svaret (EO-U8); ellers gjelder TEs krevde beløp og
dager; er kravene ikke sendt, kreves hele kjeden. Forkastet: at KOE-saken leser
endringsordren fra EO-saken ved hver lesing'''
vedtatt = "10.10, oppdragsgiver etter sparring (#309)"
folge = '''
Endrer vedtaket 23.09 «Ubegrenset fullmakt kan sende alene når beløpet ikke kan
verdsettes» for dette tilfellet. Avgjør det [KA-U12](#ka-u12) lot stå til #309: hvordan
EO-saken viser til KOE-saken når den er byggherrens svar på grunnlaget. Grunnlagssvaret
og endringsordren skrives i samme transaksjon. Ikke bygget. Kjernen hører til #309,
skrivestien og fullmakten til #310'''

[[gruppe.vedtak]]
anker = "eo-u7"
vedtak = '''
EO-U7: en KOE-sak der endringsordren er svar på grunnlaget (EO-U6), kan senere inngå i
en ny endringsordre når partene blir enige om vederlag eller frist. Å vise til en sak er
ikke å inngå i den (EO-U3). Forkastet: at tilknytningen sperrer etter EO-U3, som ville
utvidet EO-U3'''
vedtatt = "10.10, oppdragsgiver (#309)"
folge = '''
EO-U3 er uendret. Ikke bygget (#309)'''

[[gruppe.vedtak]]
anker = "eo-u8"
vedtak = '''
EO-U8: en endringsordre kan inneholde pålegget og egne utsagn om pris og tid. Hvert
utsagn sier hva det er: byggherrens standpunkt, et tilbud eller en gjengivelse av noe
som er avtalt. Finnes et krav i en KOE-sak, svarer utsagnet på den bestemte
kravversjonen, og TE godtar eller bestrider hvert utsagn for seg (KA-U1). KOE-saker som
inngår (EO-U2–EO-U5), gjengis med henvisning, og endringsordren kan ikke ensidig endre
det som er avtalt. Uten KOE-sak står tallene i endringsordren alene. Ved flere KOE-saker
summeres ikke dagene uten videre (§ 33.5). TEs aksept av endringsordren omfatter ikke
hvert selvstendige utsagn i den. Forkastet: at endringsordren bare fastsetter
grunnlaget, og at TEs aksept av endringsordren også er aksept av svarene, som ville
endret KA-U1, KT-U1 og MM-U10'''
vedtatt = "10.10, oppdragsgiver etter sparring (#309)"
forhold = [{ art = "presiserer", vedtak = "eo-u4" }]
folge = '''
Presiserer [EO-U4](#eo-u4): TEs ene svar på hver utgave kan ta stilling til hvert utsagn
for seg (MM-U10). Ikke bygget (#309)'''

[[gruppe.vedtak]]
anker = "eo-u9"
vedtak = '''
EO-U9: byggherren kan ikke revidere en endringsordre som er svar på grunnlaget i en
KOE-sak (EO-U6). TEs uenighet føres i en ny KOE-sak, og en annen endring krever en ny
endringsordre. Retting av skrivefeil følger B-16. Forkastet: revisjon av hva endringen
går ut på, som ville endret EO-U4 og GR-U10, og revisjon av hele endringsordren, som
ville endret GR-U10, GR-U7 og KA-U7'''
vedtatt = "10.10, oppdragsgiver etter sparring (#309)"
forhold = [{ art = "endrer", vedtak = "eo-u4" }]
folge = '''
Endrer [EO-U4](#eo-u4) for dette tilfellet; GR-U7, GR-U10 og KA-U7 står. Ikke bygget
(#309)'''

[[gruppe.vedtak]]
vedtak = '''
En endringsordresak kan følge av en KOE-sak, men ikke erstatte den, verken i historikken
eller som en egen hendelse i KOE-saken'''
vedtatt = "29.09, oppdragsgiver"
folge = '''
Bygget 05.10 (#97); se DM-07 i 4.3. På vedtaksdatoen ble `eo_opprettet` godtatt i en
KOE-sak'''

[[gruppe.vedtak]]
vedtak = '''
TFR-02: forsering får aldri en lukket samlet status. En endringsordre er en ordre og
forhandles ikke; er TE uenig, føres det videre i en KOE'''
vedtatt = "23.09, oppdragsgiver"
folge = '''
Rettet i spor D. Utstedt og revidert EO er `VENTER_PAA_SVAR`, akseptert og bestridt
`LUKKET`'''

[[gruppe.vedtak]]
anker = "fo-u1"
vedtak = '''
FO-U1: TE kan velge å anse byggherrens avslag som et pålegg om forsering (§ 33.8) når
byggherren prinsipalt har avslått fristkravet helt eller delvis, også gjennom grunnlaget
eller ved preklusjon, og TE ikke har godtatt avslaget. Valgretten gjelder de avslåtte
dagene. TE varsler med antatt kostnad før forseringen iverksettes (§ 33.8 annet ledd).
Appen avgjør ikke om kravet var berettiget eller om 30 %-grensen er overskredet, men
viser grensen. Forkastet: valgrett bare ved avslag i fristsvaret selv, og valgrett også
etter godtatt avslag (kommentaren i TFR-01-testen)'''
vedtatt = "09.10, oppdragsgiver etter lesning av NS 8407 § 5 og §§ 31–35"
folge = '''
Avgjør #230 og #258. Presisert 10.10 av [FO-U5](#fo-u5): TE kan ikke godta avslaget så
lenge en forseringssak viser til det, også etter stopp. Valget, svarene og fullmakten i
forseringssaken står i [FO-U2](#fo-u2)–[FO-U6](#fo-u6) (10.10). Ikke bygget:
forseringskandidatene regnes av fristens eget resultat (SK-06)'''

[[gruppe.vedtak]]
anker = "fo-u2"
vedtak = '''
FO-U2: TE melder valget etter § 33.8, å «anse avslaget som et pålegg om forsering», for
de avslåtte dagene, og varsler med antatt kostnad (§ 33.8 annet ledd). TE kan senere
oppdatere kostnaden og melde at forseringen stoppes. Vederlaget for forseringen kreves i
forseringssaken etter § 34. Forkastet: vederlaget i en ny KOE-sak'''
vedtatt = "10.10, oppdragsgiver (#309)"
folge = '''
Bygger på [FO-U1](#fo-u1). «Ingen krav» i vederlagssporet i KOE-saken omfatter ikke
forseringsvederlaget ([KA-U25](#ka-u25), 11.10). Ikke bygget (#309)'''

[[gruppe.vedtak]]
anker = "fo-u3"
vedtak = '''
FO-U3: byggherren har ingen svarplikt etter § 33.8. Byggherren kan stå fast på avslaget:
fristsvaret står, og det er påstanden om at avslaget var berettiget, som appen ikke
avgjør (FO-U1). Byggherren kan revidere fristsvaret og godkjenne dagene (FO-U4).
Byggherren kan svare på forseringsvarselet at hen mener avslaget var berettiget, eller
at 30 %-grensen er overskredet; svaret registreres og vises, uten virkning i appen.
Byggherren kan svare på vederlagskravet for forseringen etter § 34, også ved å bestride
kostnaden. Vil byggherren selv ha forsering, pålegger hen den med endringsordre etter §
31.2, i en egen EO-sak. Er dagmulktssatsen kjent, viser appen 30 %-grensen som en
betinget utregning med forutsetningene: dagmulktssatsen ganget med de avslåtte dagene,
tillagt 30 %. Den vises ikke som en avgjort grense eller et tak'''
vedtatt = "10.10, oppdragsgiver etter sparring (#309)"
folge = '''
Bygger på [FO-U1](#fo-u1): appen avgjør ikke om avslaget var berettiget eller om 30
%-grensen er overskredet. Rettet etter oppdragsgivers innvending 10.10: standpunktet
«godta forseringen» i den første formen utgår. Ikke bygget. Kjernen hører til #309,
visningen av grensen til #313'''

[[gruppe.vedtak]]
anker = "fo-u4"
vedtak = '''
FO-U4: reviderer byggherren fristsvaret og godkjenner dagene etter at TE har valgt
forsering, står forseringssaken, og appen viser at fristsvaret er endret. Et nytt valg
er ikke mulig for godkjente dager. Byggherren kan bestride kostnaden i svaret på
vederlagskravet for forseringen (grunnlag, årsak, omfang, beregning, dokumentasjon). En
senere godkjenning av fristen godkjenner ikke kostnadene. Appen fordeler ikke kostnader
på forserte og godkjente dager; påløpte kostnader og avvikling kan også telle (§ 34, §
30). Forkastet: at valget faller bort for de godkjente dagene'''
vedtatt = "10.10, oppdragsgiver etter sparring (#309)"
folge = '''
Ikke bygget (#309)'''

[[gruppe.vedtak]]
anker = "fo-u5"
vedtak = '''
FO-U5: TEs aksept av byggherrens avslag av fristkravet avvises så lenge en forseringssak
viser til avslaget, også etter at forseringen er stoppet. Et avgrenset oppgjør, der TE
godtar dagene, men holder fast på forseringskravet, bygges senere; det kjernen ennå ikke
kan, avvises. Forkastet: å tillate aksepten etter stopp, og å tillate den mens
forseringen står'''
vedtatt = "10.10, oppdragsgiver etter sparring (#309)"
forhold = [
  { art = "snevrer inn", vedtak = "ka-u1" },
  { art = "presiserer", vedtak = "fo-u1" },
]
folge = '''
Snevrer inn [KA-U1](#ka-u1) med en ny grunn til å avvise en aksept, og presiserer
[FO-U1](#fo-u1). Presisert 10.10 av [OV-U2](#ov-u2) for første versjon: sperren virker
bare når en forseringssak i appen viser til avslaget. Ikke bygget (#309)'''

[[gruppe.vedtak]]
anker = "fo-u6"
vedtak = '''
FO-U6: byggherrens svar på vederlagskravet for forseringen går gjennom fullmakten som
andre vederlagssvar. Et revidert fristsvar går gjennom fullmakten som andre fristsvar.
Svaret på forseringsvarselet (FO-U3) sendes uten intern godkjenning, fordi det ikke
påtar byggherren noe ansvar. Forkastet: som i dag, at prosjekter med policy ikke kan
svare på forsering i appen'''
vedtatt = "10.10, oppdragsgiver etter sparring (#309)"
folge = '''
Endrer vedtaket 18.09 om forsering (raden under) for vederlagssvaret. Ikke bygget.
Fullmakten i TS-stien hører til #310'''

[[gruppe.vedtak]]
vedtak = '''
Forsering er utenfor godkjenningsflyten'''
vedtatt = "18.09"
folge = '''
Endret 10.10 av [FO-U6](#fo-u6) for vederlagssvaret for forseringen: det går gjennom
fullmakten som andre vederlagssvar. Etter FO-U6 sendes svaret på forseringsvarselet uten
intern godkjenning, også i prosjekter med policy. Byggestatus: i dag kan prosjekter med
