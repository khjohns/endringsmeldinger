[[gruppe.vedtak]]
id = "OV-U11"
dato = 2026-10-17
hvem = "oppdragsgiver"
kilde = ["#276"]
sporsmal = '''
Spørsmålet «Varseldato», ordrett slik det ble vist i spørsmålsverktøyet:

TE kan i et brev fra appen oppgi at et varsel ble sendt utenfor appen på en bestemt dato, og datoen settes én gang (SK-12, OV-U5, HF-U13). Retting av skrivefeil i et sendt brev følger MM-U21. Eksempel: TE oppgir 28. september, men varselet ble sendt 18. september (til TEs fordel) eller 8. oktober (i byggherrens favør). Hvordan rettes en feil dato? Anbefalt: A, fordi TE da ikke kan flytte varselet til sin egen fordel uten byggherrens samtykke.

Alternativene slik de ble vist:

Etter rettingsregelen (Recommended): Vedtakstekst: «En feil dato TE har oppgitt for et varsel sendt utenfor appen (OV-U5), rettes etter MM-U21. TE sender en retting med henvisning til brevet med opplysningen, og opplysningen i det brevet står uendret. En senere dato er en retting i byggherrens favør og gjelder straks som premiss for nye svar. En tidligere dato er til TEs fordel og gjelder først når byggherren godtar rettingen; til da gjelder datoen TE først oppga. Et svar byggherren alt har gitt, står med virkningen det hadde (OV-U5), og byggherren kan ta stilling på nytt. At datoen settes én gang (SK-12, OV-U5, HF-U13), betyr at TE ikke kan endre den alene til sin egen fordel. Appen avgjør ikke hvilken dato som er riktig (MM-U12). Forkastet: at datoen ikke kan rettes i appen.» Snevrer inn SK-12, OV-U5 og HF-U13.

Rettes ikke i appen: Vedtakstekst: «Datoen TE har oppgitt for et varsel sendt utenfor appen, settes én gang og rettes ikke i appen, heller ikke etter MM-U21. Har TE oppgitt feil dato, forklarer TE det i et nytt brev, og byggherren tar det i betraktning i begrunnelsen for svaret. Appen regner videre med datoen TE først oppga. Forkastet: å rette datoen etter MM-U21.» Snevrer inn MM-U21.

Fritt til byggherren svarer: Vedtakstekst: «TE kan rette datoen alene så lenge byggherren ikke har svart med datoen som premiss. Deretter rettes den ikke i appen. Dette endrer SK-12 og OV-U5. Forkastet: at datoen settes én gang også før byggherren har svart.» Endrer SK-12 og OV-U5.'''
valgt = "Etter rettingsregelen"
svar = '''
«Etter rettingsregelen (Recommended)»'''
forhold = [
  { art = "snevrer inn", vedtak = "ov-u5" },
  { art = "snevrer inn", vedtak = "hf-u13" },
]
folge = '''
Snevrer inn også SK-12. Ikke bygget (#276).'''

[[gruppe.vedtak.alternativ]]
navn = "Etter rettingsregelen"
tekst = '''
En feil dato TE har oppgitt for et varsel sendt utenfor appen (OV-U5), rettes etter MM-U21. TE sender en retting med henvisning til brevet med opplysningen, og opplysningen i det brevet står uendret. En senere dato er en retting i byggherrens favør og gjelder straks som premiss for nye svar. En tidligere dato er til TEs fordel og gjelder først når byggherren godtar rettingen; til da gjelder datoen TE først oppga. Et svar byggherren alt har gitt, står med virkningen det hadde (OV-U5), og byggherren kan ta stilling på nytt. At datoen settes én gang (SK-12, OV-U5, HF-U13), betyr at TE ikke kan endre den alene til sin egen fordel. Appen avgjør ikke hvilken dato som er riktig (MM-U12). Forkastet: at datoen ikke kan rettes i appen.'''
