[[gruppe.vedtak]]
id = "OV-U16"
dato = 2026-10-22
hvem = "oppdragsgiver"
kilde = ["#1045"]
sporsmal = '''
Spørsmålet «Hva oppgis», ordrett slik det ble vist i spørsmålsverktøyet:

#1045, spørsmål 1 av 3: hva oppgis når et brev sendt utenfor appen registreres? Et slikt brev registreres i første versjon som dokumentasjon (OV-U4). OV-U4 sier: «Det vises ved sporene eller saken den som registrerer, velger, med datoen avsenderen oppgir, brevet som vedlegg og merknaden «Appen vurderer ikke innholdet».» og «Appen utleder ingenting av det: ingen standpunkt, enighet, sperre eller uavklart utfall, og den fryser ingen vurdering av det.» VS-U27 sier om en forespørsel etter § 33.6.2 sendt utenfor appen: «Appen viser at forespørselen er registrert, og avgjør ikke om svaret kom i tide.» Da må appen kunne vise hva slags brev det er. I dag kan appen bare registrere et varsel etter § 33.4 eller § 34.1.2 med dato. Svaret avgjør hva motparten og tidslinjen ser, og om VS-U27 kan oppfylles. Det endrer ikke virkningen: appen utleder ingenting av brevet i noen av alternativene. Anbefaling: «Kort beskrivelse», fordi VS-U27 da oppfylles med avsenderens egne ord, uten en struktur som reglene kan lese.

Alternativene slik de ble vist:

Kort beskrivelse (Recommended): Den som registrerer et brev sendt utenfor appen, oppgir sporene eller saken brevet hører til, datoen det ble sendt, og en kort beskrivelse av brevet med egne ord, for eksempel «Forespørsel etter § 33.6.2», og legger brevet ved. Appen viser beskrivelsen med brevet og tolker den ikke. Appen utleder ingenting av brevet (OV-U4). Forhold: utvider OV-U4 med beskrivelsen, og presiserer VS-U27: at forespørselen er registrert, vises med beskrivelsen den som registrerte, har gitt.

Bare spor, dato, vedlegg: Den som registrerer et brev sendt utenfor appen, oppgir sporene eller saken brevet hører til og datoen det ble sendt, og legger brevet ved. Appen spør ikke hva slags brev det er, og viser det som et brev sendt utenfor appen, med datoen og vedlegget. Forhold: presiserer OV-U4. Snevrer inn VS-U27: appen viser at et brev er registrert i fristsporet, ikke at det er en forespørsel.

Art fra fast liste: Den som registrerer et brev sendt utenfor appen, oppgir sporene eller saken brevet hører til og datoen det ble sendt, velger hva brevet er fra en fast liste (varsel, krav, svar, forespørsel, begrunnelse, innsigelse, bestridelse, forsering, endringsordre eller annet) med bestemmelsen, og legger brevet ved. Appen viser valget med brevet og utleder ingenting av det (OV-U4). Forhold: utvider OV-U4, og presiserer VS-U27. Nærmer seg det OV-U4 forkastet, å strukturere innholdet i registrerte brev, fordi valget blir en opplysning appen kjenner.'''
valgt = "Kort beskrivelse"
svar = '''
«Kort beskrivelse (Recommended)»'''
forhold = [{ art = "utvider", vedtak = "ov-u4" }, { art = "presiserer", vedtak = "vs-u27" }]
folge = '''
Svaret er gitt med spørsmålsverktøyet og står på #1045 (kommentaren 6343380408). Ikke bygget (#1045).'''

