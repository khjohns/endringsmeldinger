[[gruppe.vedtak]]
id = "VS-U18"
dato = 2026-10-12
hvem = "oppdragsgiver"
kilde = ["#309"]
sporsmal = '''
§ 33.5 sier at fristforlengelsen skal svare til virkningen på fremdriften, med hensyn til blant annet årstid og den samlede virkningen av tidligere varslede forhold, og at partene plikter å begrense skadevirkningene. MM-U12: «Appen avgjør ikke det kontrakten overlater til partene, en oppmann eller domstolene.» Hvordan behandler appen § 33.5?

A: Appen avgjør ikke hvor mange dager fristforlengelsen skal svare til etter § 33.5. TEs krav om antall dager og byggherrens standpunkt om dagene registreres, og om dagene sammenlikner appen bare TEs og byggherrens tall (VS-U3).
