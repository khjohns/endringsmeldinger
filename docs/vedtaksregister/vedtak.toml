[[gruppe.vedtak]]
id = "OV-U44"
dato = 2026-10-25
hvem = "oppdragsgiver"
kilde = ["#1282"]
sporsmal = '''
Spørsmål 1. Brev sendt utenfor appen

**Forholdet til andre vedtak.** Bekrefter OV-U4–OV-U6. Presiserer OV-U4 og HF-U13.'''
valgt = "A, med en presisering"
svar = '''
A, med en presisering etter sparring i økta. Spørsmål 2–9 står derfor som de er. Oppdragsgiver ordrett:
«**Jeg anbefaler A, men med en presisering av hva som gir opplysningene virkning i appen.** […] Det viktige skillet er mellom **å oppbevare et brev** og **å la en part avgi en strukturert opplysning som appen bruker**. Et vedlegg alene bør ikke endre sakens status. Men parten må kunne gjøre et eksternt varsel eller en ekstern endringsordre relevant for behandlingen i appen.»
«**Antallet funn sier lite om funksjonens kompleksitet.** […] Begrunnelsen for å beholde dem bør være nytten og en korrekt gjengivelse av partenes handlinger.»
«E er et mulig avgrensningsvalg, men jeg synes dokumentet undervurderer forskjellen mellom å registrere en tidligere handling og å foreta en ny.»
Til ordlyden under: «Ja, jeg er enig i ordlyden og at dette føres som en **presisering**, med grunnlag i vedtakene du har kontrollert.»
Om OV-U6: «Jeg mente ikke at byggherren skal kunne velge en annen kravversjon. Registreringen skal fortsatt gjelde gjeldende grunnlagskrav sendt fra appen, etter OV-U6 og OV-U12. Poenget mitt var å bevare skillet mellom registreringen av en tidligere endringsordre og en ny godkjenning, ikke å utvide hvilke krav registreringen kan besvare.»'''
forhold = [{ art = "presiserer", vedtak = "ov-u4" }, { art = "presiserer", vedtak = "hf-u13" }]
folge = '''
Bygges i #1045 og #807.'''

[[gruppe.vedtak.alternativ]]
navn = "A, med en presisering"
tekst = '''
Et brev sendt utenfor appen og registrert i den er dokumentasjon. Appen utleder ingen standpunkt, enighet, sperre eller uavklart utfall av innholdet (OV-U4). OV-U5 og OV-U6 står, med vedtakene som presiserer dem. Virkningen bygger på partens uttrykkelige, strukturerte opplysninger etter de vedtakene, ikke på appens lesing av vedlegget. Appen skiller mellom dokumentasjon, partens opplysninger og det appen utleder, og viser hva vurderingen bygger på. Verken appens utledning eller den registrerte korrespondansen framstilles som en fullstendig oversikt over partenes rettsstilling. Bekrefter OV-U4–OV-U6. Presiserer OV-U4 og HF-U13.'''

[[gruppe.vedtak.alternativ]]
navn = "A som lagt fram"
tekst = '''
Et brev sendt utenfor appen og registrert i den er dokumentasjon, som i OV-U4. Appen leser det ikke. Unntakene i OV-U5 og OV-U6 står. Alt appen sier om korrespondansen i saken, gjelder det som er sendt i appen. Bekrefter OV-U4–OV-U6 og vedtakene som presiserer dem.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
Et brev sendt utenfor appen og registrert i den er alltid dokumentasjon. TE kan ikke oppgi datoen for et varsel eller krav sendt utenfor appen som premiss for byggherrens svar, og byggherren kan ikke registrere en endringsordre som svar på grunnlaget. Opphever unntakene i OV-U5 og OV-U6.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "C"
tekst = '''
Den som registrerer et brev sendt utenfor appen, fyller ut de samme opplysningene som i skjemaet i appen: krav, svar, aksept, varsel og trekk. Registreringen får samme virkning som et utsagn sendt fra appen, merket som registratorens lesing av brevet. Brevet er fortsatt det autoritative uttrykket for partens standpunkt. Hver side registrerer bare sine egne brev. Opphever det OV-U4 forkastet, og endrer OV-U4.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "D"
tekst = '''
Appen tar ikke imot brev sendt utenfor appen. En part kan sette en merknad på saken eller sporet om at det finnes korrespondanse utenfor appen, og appen viser merknaden uten å lese noe av den. Opphever OV-U4, OV-U6 og vedtakene som presiserer dem.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "E"
tekst = '''
Som A, men byggherren kan ikke registrere en endringsordre sendt utenfor appen som svar på grunnlaget. Byggherren godkjenner grunnlaget fra appen, og i underkategoriene der § 32.2 gjelder, er godkjenningen da en endringsordre (GR-U12, GR-U13). Endringsordren kan registreres som dokumentasjon. Opphever OV-U6, OV-U12 og OV-U13.'''
forkastet = true

[[gruppe.vedtak]]
id = "OV-U45"
dato = 2026-10-25
hvem = "oppdragsgiver"
kilde = ["#1282"]
sporsmal = '''
Spørsmål 2. Forbeholdet når grunnlaget ikke er besvart i appen (VG-E-01, VG-H-01)

**Forholdet til andre vedtak.** Endrer ordlyden i GR-U26 og utvider det. I tråd med OV-U4, OV-U10, HF-U13 og vedtaket om brev sendt utenfor appen 25.10 (spørsmål 1).'''
valgt = "D"
svar = '''
D, med rettelsene fra sparringen, sammen med 2b-A. Oppdragsgiver ordrett:
«Ja, jeg anbefaler D i spørsmål 2, med rettelsene vi har gjennomgått, sammen med 2b-A.»
«D: BH viser til et tidligere svar. Henvisningen gir ikke i seg selv et strukturert grunnlagssvar i løsningen. Brevet presiserer at henvisningen og forbeholdet ikke endrer BHs tidligere meddelte standpunkt.»
«2b-A: BH bekrefter uttrykkelig det tidligere standpunktet gjennom den vanlige svarflyten. Bekreftelsen er et nytt utsagn som løsningen bygger utledningen på.»
«BH kan la henvisningen stå uten å bekrefte. Bekreftelse skal heller ikke kreve en tidligere henvisning etter D; dokumentet kan oppgis i selve bekreftelsen.»'''
forhold = [{ art = "endrer", vedtak = "gr-u26" }, { art = "utvider", vedtak = "gr-u26" }]
folge = '''
I tråd med OV-U4, OV-U10, HF-U13 og vedtaket om brev sendt utenfor appen 25.10 (spørsmål 1). Bygges i #1306.'''

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
Når byggherren svarer på vederlag eller frist mens gjeldende versjon av grunnlaget ikke er besvart i appen, sier brevet: ‹Byggherren har ikke svart i appen på grunnlaget i TEs krav i brev <n> av <dato>. Standpunktene nedenfor gjelder under forutsetning av at grunnlaget for kravet foreligger.› Appen avgjør ikke om et brev sendt utenfor appen er et svar på grunnlaget. Endrer ordlyden i GR-U26. I tråd med OV-U4 og OV-U10.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
Har byggherren registrert et brev sendt utenfor appen i grunnlagssporet etter TEs gjeldende krav om grunnlaget, viser forbeholdet til brevet: ‹Byggherren har sendt brev om grunnlaget utenfor appen <dato>. Standpunktene nedenfor gjelder under forutsetning av at grunnlaget for kravet foreligger.› Appen vurderer ikke innholdet. Endrer GR-U26 og OV-U4.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "C"
tekst = '''
Teksten i GR-U26 står.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "D"
tekst = '''
Når byggherren svarer på vederlag eller frist mens gjeldende versjon av grunnlaget ikke er besvart i appen og grunnlaget ikke er avklart ved frafall (GR-U23), spør skjemaet: ‹Har du allerede svart utenfor appen på grunnlaget i TEs krav i brev <n> av <dato>?› Brevnummeret og datoen er kravets. Svaret er obligatorisk. Svarer byggherren nei, sier brevet som i dag: ‹Byggherren har ennå ikke svart på grunnlaget i TEs krav i brev <n> av <dato>. Standpunktene nedenfor gjelder under forutsetning av at grunnlaget for kravet foreligger.› Setningen er byggherrens egen opplysning; appen kontrollerer den ikke. Svarer byggherren ja, oppgir byggherren et registrert dokument, eller dokumenttypen (brev, e-post eller annet dokument), datoen og en kort identifikasjon. Valget av dokumenttype sier ikke noe om formkravet i § 5. Brevet sier da: ‹For byggherrens standpunkt til grunnlaget i TEs krav i brev <n> av <dato> vises det til byggherrens <dokumenttype> av <dato>. Standpunktene nedenfor gjelder under forutsetning av at grunnlaget for kravet foreligger. Henvisningen og forbeholdet endrer ikke byggherrens tidligere meddelte standpunkt til grunnlaget.› Henvisningen gjelder gjeldende versjon av grunnlaget og følger ikke med en ny versjon. Den gir ikke i seg selv et grunnlagssvar, en godkjenning eller et avslag i appens utledning, og vederlag og frist er fortsatt betinget av grunnlaget etter GR-U7 og GR-U26. Endrer ordlyden i GR-U26 og utvider det. I tråd med OV-U4, OV-U10, HF-U13 og vedtaket om brev sendt utenfor appen 25.10 (spørsmål 1).'''
anbefalt = true

[[gruppe.vedtak.sitat]]
kilde = "hovedplanen"
tekst = "Byggherren har ennå ikke svart på grunnlaget i TEs krav i brev <n> av <dato>. Standpunktene nedenfor gjelder under forutsetning av at grunnlaget for kravet foreligger."

[[gruppe.vedtak]]
id = "OV-U46"
dato = 2026-10-25
hvem = "oppdragsgiver"
kilde = ["#1282"]
sporsmal = '''
Spørsmål 2b. Når byggherren senere bekrefter et svar gitt utenfor appen

**Forholdet til andre vedtak.** Utvider GR-U26 og vedtaket om brev sendt utenfor appen 25.10 (spørsmål 1). Presiserer GR-U12, GR-U13, OV-U12, OV-U13, KA-U19 og HF-U13, og anvender LV-U7. I tråd med OV-U4 og MM-U12.'''
valgt = "A"
svar = '''
«Ja til 2b-A slik teksten nå er gjengitt. Fristspørsmålet kan stå åpent for senere fristberegning, uten å hindre at bekreftelsesordningen vedtas. Jeg vil dermed justere min tidligere reservasjon om at hele 2b-A måtte vente.»
«Kontraktens ordlyd: § 32.3 knytter svarplikten til mottatt varsel og begrunnelsesplikten til avslaget. Den oppstiller ingen egen regel om at en senere bekreftelse starter disse fristene på nytt.»
«Praksis: LH-2016-96291 illustrerer at også innsigelsen om at byggherren svarte for sent, må fremsettes rettidig etter § 5 tredje ledd. Avgjørelsen løser ikke spørsmålet om senere bekreftelser, men viser hvorfor de opprinnelige meddelelsene må beholdes som relevante hendelser.»
«Bekreftelsesordningen trenger ikke avgjøre fristspørsmålene. Det holder at den ikke nullstiller frister, fremstiller bekreftelsesdatoen som den opprinnelige svardatoen eller avgjør om det tidligere svaret var rettidig.»
«LV-U7 beholdes som den uttrykkelig avgrensede modellen dere beskriver, ikke som en generell rettsregel om binding.»'''
forhold = [{ art = "utvider", vedtak = "gr-u26" }, { art = "utvider", vedtak = "ov-u44" }, { art = "presiserer", vedtak = "gr-u12" }, { art = "presiserer", vedtak = "gr-u13" }, { art = "presiserer", vedtak = "ov-u12" }, { art = "presiserer", vedtak = "ov-u13" }, { art = "presiserer", vedtak = "ka-u19" }, { art = "presiserer", vedtak = "hf-u13" }]
folge = '''
I tråd med OV-U4 og MM-U12. Bygges i #1306.'''

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
Byggherren kan svare på gjeldende versjon av grunnlaget ved å bekrefte et svar gitt utenfor appen på den versjonen. Byggherren oppgir dokumentet som ved henvisningen etter GR-U26: et registrert dokument, eller dokumenttypen, datoen og en kort identifikasjon. Bekreftelsen krever ingen tidligere henvisning, og en henvisning kan stå uten en bekreftelse. Byggherren velger standpunktet som i et svar fra appen. At standpunktet samsvarer med det tidligere svaret, er byggherrens opplysning. Brevet sier: ‹Byggherren bekrefter sitt svar på grunnlaget i TEs krav i brev <n> av <dato>, gitt i <dokumenttype> av <dato>: …›, og ved påberopt preklusjon: ‹Byggherren bekrefter at hen i <dokumenttype> av <dato> gjorde gjeldende at …›. Bekreftelsen er et nytt utsagn i et brev fra appen. Den går gjennom fullmakten og brevkontrollen, og appens utledning bygger på standpunktet byggherren bekrefter. Skjemaet spør om det tidligere svaret hadde et forbehold eller vilkår som standpunktene ikke kan uttrykke. Svarer byggherren ja, kan svaret ikke bekreftes. Byggherren kan i stedet velge å gi et nytt svar etter reglene nedenfor. Henvisningen til det tidligere svaret kan stå uten en bekreftelse. Kontrollene ved sending gjelder bekreftelsen. De avgjør ikke om det tidligere svaret oppfylte kravene til endringsordre eller fullmakt, eller hva det bandt partene til. Etter LV-U7 regner appen akseptfristen fra sendingen av bekreftelsen, og bindingen ved bekreftelsen likeså. Det er appens beregning; den avgjør ikke når byggherren rettslig ble bundet, verken av bekreftelsen eller av det tidligere svaret. Har byggherren allerede gjort en påberopelse gjeldende utenfor appen, må rettidigheten vurderes ut fra den tidligere meddelelsen; bekreftelsen dokumenterer byggherrens opplysning om dette, men fastslår ikke at påberopelsen ble fremsatt eller var rettidig. Appen registrerer datoen for bekreftelsen og byggherrens opplysning om datoen for det eksterne svaret hver for seg, og bekreftelsen innebærer ikke at andre frister starter på nytt. Godkjenner byggherren grunnlaget uten påberopt preklusjon i en underkategori der § 32.2 gjelder, oppgir byggherren om det tidligere svaret var en endringsordre etter § 31.3. Opplysningen er byggherrens, ikke en klassifisering appen har fastslått. Var det en endringsordre, avvises bekreftelsen med beskjed om å registrere endringsordren etter OV-U6. Var det ikke det, utsteder byggherren nå en endringsordre: skjemaet og brevet sier det uttrykkelig, brevet har teksten GR-U13 krever, og det kalles ikke en bekreftelse (GR-U12, GR-U13). Viser det tidligere svaret til et krav som bare er registrert som dokumentasjon, avvises bekreftelsen som etter OV-U12. Har byggherren vist til et svar utenfor appen og gir i stedet et nytt svar, velger byggherren det uttrykkelig, skjemaet sier at byggherren kan være bundet av det tidligere svaret, og brevet sier at byggherren tidligere viste til <dokumenttype> av <dato>. Visningen viser henvisningen sammen med det nye svaret, sier at utledningen bygger på svaret i appen og at det tidligere dokumentet ikke er tolket, og framstiller ikke det nye svaret som rettslig overordnet det tidligere. Bekreftelsen er en ny vei for å gi et svar utenfor appen virkning i utledningen, og den følger ikke av OV-U5 og OV-U6. Utvider GR-U26 og vedtaket om brev sendt utenfor appen 25.10 (spørsmål 1). Presiserer GR-U12, GR-U13, OV-U12, OV-U13, KA-U19 og HF-U13, og anvender LV-U7. I tråd med OV-U4 og MM-U12.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
Et svar gitt utenfor appen gir et svar på grunnlaget i appen bare når det er en endringsordre registrert etter OV-U6, med vilkårene i OV-U12. Ellers svarer byggherren på grunnlaget fra appen som et nytt svar, og byggherren kan i begrunnelsen vise til det tidligere svaret. Bekrefter OV-U4 og OV-U6.'''
forkastet = true

