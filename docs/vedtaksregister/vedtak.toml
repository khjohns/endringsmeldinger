Hva viser appen om hvor saken og hvert krav står? Vedtakene sier at det bindende er hvem som har sagt hva om hvilket krav, og at brevet er autoritativt. I dag viser appen likevel én samlet status for saken, blant annet «Under forhandling», som ikke svarer til noe partene har sagt, og «Avsluttet: oppgjort», som strider mot OV-U3 og OV-U10. Vedtakene knytter bare fire tilstander til hele saken.

Alternativene er A (anbefalt), B og C.

Belegg, ordrett fra vedtakene:
- MM-U13: Ingen regel leser en samlebetegnelse i stedet for spørsmålet, heller ikke en som er utledet og ikke lagret.
- MM-U15: Oversikten viser siste kjente status for saken, merket «Oppdateres».
- OV-U3: Den sier ikke at saken er oppgjort eller at TE ikke har flere krav, og taushet er ikke et avkall.
- OV-U10: Visningen sier «Alle krav sendt i appen er avgjort».
- MM-U2: Visningen sier at et varsel med frist må sendes utenfor appen og registreres senere, og drift varsles.'''
