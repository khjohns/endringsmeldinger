navn = "Bygges nå, Entra senere"
tekst = '''
Godkjenningen bygges nå for den som har registrert fullmakt, uavhengig av team. Til Entra ID finnes, kan bare en godkjenner med Catenda-innlogging godkjenne.'''
forkastet = true

