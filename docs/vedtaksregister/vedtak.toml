[[gruppe.vedtak]]
id = "OV-U30"
dato = 2026-10-23
hvem = "oppdragsgiver"
kilde = ["#1047"]
sporsmal = '''
Spørsmål B4-1, «Laget»: B4-1. Når brevet sendes, fryser appen sin vurdering av hvilket lag hvert av byggherrens standpunkter står i (MM-U9, MM-U11). I dag finnes bare prinsipalt og subsidiært. Med både § 34.1.2 og § 34.1.3 trengs et tredje lag (OV-U28), og etter OV-U28 skal justeringen ellers stå uten etikett når bare § 34.1.3 påberopes, fordi ingen påberopelse rammer den. Brevteksten fryses alt, så en senere regelendring kan ikke endre et sendt brev. Spørsmålet gjelder det reglene leser. Astra foretrekker at også «ingen påberopelse rammer» fryses, snevert definert. Prøvingen støtter det. Den fryste verdien blir en kontrakt (B-17).'''
valgt = "Tre lag og upåvirket"
svar = '''
«Tre lag og upåvirket (Recommended)»'''
forhold = [{ art = "presiserer", vedtak = "ov-u28" }, { art = "presiserer", vedtak = "mm-u11" }]
folge = '''
Svaret er gitt med spørsmålsverktøyet 23.10. Spørsmålet og alternativene står ordrett på #1047 ([kommentaren 6359589947](https://github.com/khjohns/endringsmeldinger/issues/1047#issuecomment-6359589947)), og svaret i [kommentaren 6359610636](https://github.com/khjohns/endringsmeldinger/issues/1047#issuecomment-6359610636). Presiserer også B-13, som ikke har anker. Spørsmålet var stilt i tidligere former ([6359336816](https://github.com/khjohns/endringsmeldinger/issues/1047#issuecomment-6359336816), [6359476742](https://github.com/khjohns/endringsmeldinger/issues/1047#issuecomment-6359476742)), og svarene sendte det til sparring ([6359369109](https://github.com/khjohns/endringsmeldinger/issues/1047#issuecomment-6359369109), [6359502726](https://github.com/khjohns/endringsmeldinger/issues/1047#issuecomment-6359502726)). Svarene fra sparringen står i [6359421120](https://github.com/khjohns/endringsmeldinger/issues/1047#issuecomment-6359421120) og [6359558961](https://github.com/khjohns/endringsmeldinger/issues/1047#issuecomment-6359558961). Ikke bygget (#1047).'''

[[gruppe.vedtak.alternativ]]
navn = "Tre lag og upåvirket"
tekst = '''
Når brevet sendes, fryser appen for hvert standpunkt i vederlag og frist om det står prinsipalt, subsidiært eller videre subsidiært, eller om ingen av de aktuelle påberopelsene rammer det. Brevet setter etiketten etter den fryste verdien, én etikett per lag, og et upåvirket standpunkt står uten etikett. Presiserer OV-U28, MM-U11 og B-13 og følger MM-U9.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Tre lag fryses"
tekst = '''
Som over, men om et standpunkt ikke rammes av noen påberopelse, fryses ikke. Brevet avgjør det når det skrives, og reglene som setter sammen utfallet, utleder det med gjeldende regler. Presiserer OV-U28 og B-13, men er i spenning med MM-U9 og MM-U11.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Laget utledes ved lesing"
tekst = '''
Bare prinsipalt og subsidiært fryses som i dag, og det tredje laget regnes ut med gjeldende regler når brevet eller visningen leses. Strider mot MM-U9.'''
forkastet = true

[[gruppe.vedtak]]
id = "OV-U31"
dato = 2026-10-23
hvem = "oppdragsgiver"
kilde = ["#1047"]
sporsmal = '''
Spørsmål B4-2, «Totalene»: B4-2. Hvilke totaler skal byggherrens vederlagssvar lagre når både § 34.1.2 og § 34.1.3 påberopes? Astra anbefaler nå C (to totaler) i stedet for A. Prøvingen støtter det: mellomtotalen kan regnes entydig av postene, også ved like beløp og 0. Ingen leser og ingen kontroll trenger den, verken fullmakten (GFK-06) eller begrunnelseskontrollen (KA-U24), og OV-U28 forkastet at brevet skal si summen i hvert lag. Felles: beløpet for hver post og beløpet etter begrensningen lagres. Med C kontrolleres ordningen per post (valg 2), og valg b i B4-3 faller bort. Lagrede navn er en kontrakt (B-17).'''
valgt = "To totaler"
svar = '''
«To totaler (Recommended)»'''
folge = '''
Svaret er gitt med spørsmålsverktøyet 23.10. Spørsmålet og alternativene står ordrett på #1047 ([kommentaren 6359476742](https://github.com/khjohns/endringsmeldinger/issues/1047#issuecomment-6359476742)), og svaret i [kommentaren 6359502726](https://github.com/khjohns/endringsmeldinger/issues/1047#issuecomment-6359502726). Spørsmålet var stilt i en tidligere form ([6359336816](https://github.com/khjohns/endringsmeldinger/issues/1047#issuecomment-6359336816)), og svaret sendte det til sparring ([6359369109](https://github.com/khjohns/endringsmeldinger/issues/1047#issuecomment-6359369109)). Svaret fra sparringen står i [6359421120](https://github.com/khjohns/endringsmeldinger/issues/1047#issuecomment-6359421120). Ikke bygget (#1047).'''

[[gruppe.vedtak.alternativ]]
navn = "To totaler"
tekst = '''
Godkjent beløp (prinsipalt) og subsidiært godkjent beløp (om ingen påberopelse fører fram) lagres, sammen med beløpet for hver post og beløpet etter begrensningen. Mellomlaget er summen av postene i laget og lagres ikke. Følger OV-U28, GFK-06 og KA-U24 uendret.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Navn etter forutsetningen"
tekst = '''
Som «To totaler», og i tillegg lagres begrenset godkjent beløp når begge påberopes: totalen for hele kravet når § 34.1.2 ikke fører fram, men § 34.1.3 gjør det. Forenlig med vedtakene, men ingen leser bruker totalen.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Navn etter rekkefølgen"
tekst = '''
Subsidiært godkjent beløp betyr mellomlaget når begge påberopes, og videre subsidiært godkjent beløp betyr beløpet om ingen påberopelse fører fram. Fullmakten og begrunnelseskontrollen må bytte felt, og betydningen skiller seg fra frist. Frarådes.'''
forkastet = true

[[gruppe.vedtak]]
id = "OV-U32"
dato = 2026-10-23
hvem = "oppdragsgiver"
kilde = ["#1047"]
sporsmal = '''
**Spørsmål B4-4, «Lag i svaret»:** Byggherren kan i et svar på krav om fristforlengelse gjøre gjeldende flere innsigelser etter hverandre: varselet etter § 33.4 kom for sent; fremdriften hindres ikke (§ 33.1); kravet ble spesifisert for sent (§ 33.6.1, der byggherren etter VS-U4 sier prinsipalt hva han måtte forstå og subsidiært hva han godtar om spesifiseringen kom i tide); til sist dagene. Er grunnlaget avslått eller prekludert i samme brev (§ 32.2), kommer det først. Det gir fire eller fem lag, og begge kan nås i appen i dag (prøvd med tester). OV-U30 fryser bare tre: prinsipalt, subsidiært, videre subsidiært, eller upåvirket. I dag skriver brevet «Videre subsidiært:» to–tre ganger etter plassen. Hvordan skal lagene fryses og etiketteres?

- **Lagnummer, gjentatt etikett (Recommended).** Vedtakstekst: «Når brevet sendes, fryser appen for hvert standpunkt i vederlag og frist hvilket lag det står i (første, andre, tredje og så videre), eller at ingen av de aktuelle påberopelsene rammer det. Brevet skriver «Prinsipalt:» for det første laget, «Subsidiært:» for det andre og «Videre subsidiært:» for hvert lag etter det. Standpunktene i samme lag står under én etikett, og et upåvirket standpunkt står uten etikett. Endret tekst gjelder bare nye brev.» Endrer OV-U30 (tre verdier blir lagnummer); presiserer OV-U28, MM-U11 og B-13; følger MM-U9, VS-U4 og B-13 av 05.10. Ingen øvre grense for antall lag.
- **Fjerde etikett.** Vedtakstekst: «Brevet ordner byggherrens standpunkter i lagene «Prinsipalt:», «Subsidiært:», «Videre subsidiært:» og «Atter subsidiært:». Appen fryser hvilket av de fire lagene hvert standpunkt står i, eller at det er upåvirket. Det fjerde laget og hvert lag etter det får «Atter subsidiært:».» Utvider OV-U30 og LV-U4 punkt 4; presiserer OV-U28 og MM-U11; endrer B-13 av 05.10 (dagene blir «atter subsidiært» når § 33.6.1 også er påberopt). Fra femte lag gjentas etiketten likevel.
- **§ 33.6.1 i dagenes lag.** Vedtakstekst: «Påberoper byggherren at kravet om fristforlengelse ble spesifisert for sent etter § 33.6.1, står påberopelsen med det byggherren måtte forstå, i samme lag som dagene byggherren godtar hvis spesifiseringen kom i tide. Teksten i laget sier rekkefølgen etter VS-U4. Er grunnlaget avslått eller prekludert i samme brev, står det som før.» Presiserer OV-U30 og VS-U4 for brevet; følger MM-U9. Løser ikke tilfellet med grunnlaget i samme brev (fortsatt fire lag), og står i spenning med VS-U4s prinsipalt/subsidiært.

**Oppfølging, «OV-U32»:** Astra anbefalte «Lagnummer, gjentatt etikett» med en presisering. Prøvingen mot vedtakene fant ingen strid. Ordlyden er justert, og det er lagt til én setning om grunnlaget etter B-13. Slutter du deg til denne vedtaksteksten for OV-U32?

- **Ja, samlet tekst (Recommended).** «Når brevet sendes, fryser appen for hvert standpunkt i vederlag og frist hvilket lag det står i (første, andre, tredje og så videre), eller at ingen av byggherrens innsigelser rammer det (upåvirket). Laget angir rekkefølgen mellom standpunktene: et standpunkt i et senere lag gjelder bare hvis innsigelsene i de foregående lagene ikke fører fram, i den utstrekning de rammer standpunktet. Brevet skriver «Prinsipalt:» for det første laget, «Subsidiært:» for det andre og «Videre subsidiært:» for hvert lag etter det. Standpunktene i samme lag står under én etikett, og et upåvirket standpunkt står uten etikett. Lik etikett betyr ikke samme lag. Antallet lag har ingen øvre grense. Lagene i sporet regnes uten grunnlaget. Er grunnlaget avslått eller prekludert (§ 32.2), står det først i brevet, og etikettene i sporet flyttes ett lag ned (B-13). Endret tekst gjelder bare nye brev (MM-U9).» Forholdet: endrer OV-U30; presiserer OV-U28, MM-U11, LV-U4 punkt 4 og B-13 (24.09 og § 32.2 05.10); følger MM-U9, VS-U4, HF-U2 og B-13 (§ 33.1 05.10).
- **Uten setningen om grunnlaget.** Som 1, men uten de to setningene «Lagene i sporet regnes uten grunnlaget. Er grunnlaget avslått eller prekludert (§ 32.2), står det først i brevet, og etikettene i sporet flyttes ett lag ned (B-13).» Hvordan grunnlaget inngår, blir da et arbeidsvalg i #1047 etter B-13.
- **Astras ordlyd uendret.** Alternativ 1 fra første spørsmål, med Astras presisering ordrett: «Lagnummeret angir rekkefølgen mellom de betingede standpunktene. Hvert nytt lag forutsetter at de foregående innsigelsene ikke fører frem i den utstrekning de rammer standpunktet. Lik etikett innebærer ikke at standpunktene tilhører samme lag.»

**Andre oppfølging, B4-4b, «OV-U32 lesing»:** OV-U32 sier: «Er grunnlaget avslått eller prekludert (§ 32.2), står det først i brevet, og etikettene i sporet flyttes ett lag ned.» Er grunnlaget både prekludert etter § 32.2 og subsidiært avslått, har svaret på grunnlaget selv to lag. I dag skriver brevet: «Prinsipalt: … § 32.2 kom for sent. Subsidiært: byggherren avslår grunnlaget. Videre subsidiært: byggherren godkjenner 100 000 kr …». Hvordan skal «ett lag ned» leses i dette tilfellet?

- **Så mange lag grunnlaget har (Recommended).** Leddene fra grunnlaget beholder lagene de har i svaret på grunnlaget, og lagene i sporet flyttes ned med så mange lag grunnlaget har: ett lag i det vanlige tilfellet, to når grunnlaget er både prekludert og avslått. Brevet blir som i dag: «Prinsipalt: § 32.2 … Subsidiært: avslår grunnlaget … Videre subsidiært: beløpet». Følger setningene i OV-U32 om at standpunktene i samme lag står under én etikett og at lik etikett ikke betyr samme lag.
- **Bokstavelig: ett lag.** Grunnlaget er alltid ett lag. Avslaget står uten egen etikett under «Prinsipalt:» sammen med preklusjonen, og beløpet blir «Subsidiært:». Avslaget mister da sin plass som subsidiært til preklusjonen.'''
valgt = "Ja, samlet tekst"
svar = '''
Viser til Astra sitt svar - ber deg vurdere det:

Oppfølging: «Ja, samlet tekst (Recommended)»

Andre oppfølging, B4-4b: **Velg «Så mange lag grunnlaget har».** Når preklusjonen er prinsipalt påberopt og avslaget subsidiært, opptar grunnlagssvaret to lag. Sporet må da begynne i lag 3.

**Ordlyden i vedtaket:** Isolert betyr «ett lag ned» ett lag. Alternativet deres er derfor ikke en bokstavelig lesning av akkurat denne formuleringen. Formuleringen er for snever for tilfellet dere har avdekket.

**Sammenhengen i vedtakene og min vurdering:** Når grunnlagets standpunkter allerede har en innbyrdes subsidiær rekkefølge, bør denne bevares i det samlede brevet:

| Lag | Standpunkt | Etikett |
|---|---|---|
| 1 | Preklusjon etter § 32.2 | Prinsipalt: |
| 2 | Avslag på grunnlaget dersom preklusjonen ikke fører frem | Subsidiært: |
| 3 | Beløpsstandpunkt dersom heller ikke grunnlagsavslaget fører frem | Videre subsidiært: |

Regelen om én etikett per lag bestemmer ikke alene hvor mange lag grunnlaget opptar. Det avgjørende er at **preklusjonen og avslaget er fremsatt i to forskjellige lag**. Å samle dem under «Prinsipalt:» ville endre denne strukturen, ikke bare presentasjonen.

**Kontrakt, teori og praksis:** Dette spørsmålet gjelder først og fremst tolkningen av deres interne vedtak. Kontraktens ordlyd bestemmer ikke nummereringen i brevet. Jeg kjenner ingen rettskilde som avgjør akkurat denne modelleringen; anbefalingen bygger på at brevet skal bevare de betingede standpunktene dere har fastsatt.

Jeg ville føre dette som en presisering i #1047, men **også rette selve formuleringen** slik at den ikke fortsatt sier noe annet:

> «Er grunnlaget avslått eller preklusjon etter § 32.2 påberopt, står disse standpunktene først i brevet med sin innbyrdes lagdeling. Lagene i sporet flyttes ned med antallet lag disse standpunktene opptar.»

Tell **lag, ikke standpunkter**: Flere standpunkter i samme lag gir bare én forskyvning. Forskyvningen gjelder sporets lag; den gjør ikke i seg selv et upåvirket standpunkt betinget.

**Sikkerhet:** Høy på lagdelingen og på at eksisterende brevstruktur bør beholdes. Moderat på betegnelsen «presisering uten nytt vedtak»: Det er rimelig siden dere bevarer eksisterende praksis og lagstruktur, men det må dokumenteres at den bokstavelige formuleringen «ett lag» blir korrigert.'''
