Presisert 08.10 av [GR-U3](#gr-u3): etter frafall blir saken `OMFORENT` når vederlag og
frist er oppgjort, og endringsordren for utført arbeid utstedes i en egen EO-sak.
Rollupen regner frafall som avklart grunnlag fra 09.10 (SK-04); på vedtaksdatoen ble
