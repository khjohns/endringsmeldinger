2. En enighet omfatter det gjeldende kravet og det gjeldende svaret, med de standpunktene som står mot det gjeldende kravet (HF-U4, VS-U20), og varselet og opplysningene et standpunkt om varslingen bygger på (OV-U66 punkt 3). Eldre kravversjoner og svar er avslått (HF-U8) og omfattes ikke. Et varsel ingen av disse standpunktene gjelder, følger de vanlige reglene.
