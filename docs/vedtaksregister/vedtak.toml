[[gruppe.vedtak]]
id = "OV-U29"
dato = 2026-10-23
hvem = "oppdragsgiver"
kilde = ["#1047"]
sporsmal = '''
Spørsmål S1, «Varsel 34.1.2», etter sparringen: S1, revidert etter sparringen. Varslingsplikten etter § 34.1.2 gjelder. TE sender først et vederlagskrav med bare det særskilte kravet etter § 34.1.3 annet ledd, og deretter en kravversjon med bare et beløp for justeringen ellers. Er den første versjonen TEs første kjente varsel etter § 34.1.2? Sparringen anbefaler A: § 34.1.2 krever bare at TE «vil kreve vederlagsjustering», og et uttrykkelig krav om særskilt justering oppfyller det. Den mente at «hver kravversjon er et varsel» var for kategorisk, og alternativet er derfor omformulert: bare den første versjonen er varselet, og en senere versjon flytter det ikke. Prøvingen fant at koden i #1185 gjør nettopp dette, så PR-en kan merges uendret med A. Sparringen mente også at asymmetrien med OV-U24 er riktig. Anbefalt: «Første krav er varselet».

Første gang ble S1 stilt slik: Forholdet: varslingsplikten etter § 34.1.2 gjelder kategorien. TE sender et vederlagskrav som bare har det særskilte kravet etter § 34.1.3 annet ledd. Senere sender TE en ny kravversjon som bare har et beløp for justeringen ellers. Byggherren påberoper at varselet etter § 34.1.2 kom for sent.

Vilkåret i § 34.1.2 er at TE «vil kreve vederlagsjustering». Kravet etter § 34.1.3 annet ledd er også en «særskilt justering av vederlaget» for forholdet. OV-U5 sier at vederlagskravet er det første varselet appen kjenner, og LV-U21 sier det samme for påberopelsen. Vår tolkning er at kravet etter annet ledd kan gjelde andre utgifter enn justeringen for selve forholdet. Det er en tolkning, ikke kontraktens ordlyd. Er den første kravversjonen, som bare har det særskilte kravet, TEs første kjente varsel etter § 34.1.2? Anbefalt: A. Ordlyden i § 34.1.2 krever bare at TE vil kreve vederlagsjustering, og A følger OV-U5 og LV-U21. LV-U30 trekker samme vei, fordi hele kravet er ett tilbud.'''
valgt = "Første krav er varselet"
svar = '''
Første gang: «Inkluder dette i prompt». Etter sparringen: «Første krav er varselet (Recommended)».'''
forhold = [{ art = "presiserer", vedtak = "ov-u5" }, { art = "presiserer", vedtak = "lv-u21" }]
folge = '''
Svarene er gitt med spørsmålsverktøyet 23.10. Spørsmålet og alternativene slik de ble stilt første gang, står ordrett på #1047 (kommentaren 6358659924), og slik de ble stilt etter sparringen i kommentaren 6359036599. Drøftelsen står i [ADR-002](../adr/002-saerskilt-krav-og-varsel-etter-34-1-2.md). Ikke bygget (#1047).'''

[[gruppe.vedtak.alternativ]]
navn = "Første krav er varselet"
tekst = '''
Når varslingsplikten etter § 34.1.2 gjelder, og TE ikke har sendt eller oppgitt et eget varsel, er den første kravversjonen i vederlaget TEs første kjente varsel etter § 34.1.2, også når den bare har kravet om særskilt justering etter § 34.1.3 annet ledd. En senere kravversjon flytter ikke varselet, heller ikke en som tar bort det særskilte kravet. For § 34.1.3 gjelder OV-U24: en versjon uten det særskilte kravet er ikke varsel om det. Presiserer OV-U5 og LV-U21 («TEs første krav i sporet»). Strider ikke mot et vedtak.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Bare krav med justeringen"
tekst = '''
Når varslingsplikten etter § 34.1.2 gjelder, er bare en kravversjon med et beløp for justeringen ellers et varsel etter § 34.1.2. Det første kjente varselet blir da senere, til ugunst for TE. Har ingen kravversjon et slikt beløp, og er det heller ikke registrert noe varsel, kjenner appen ikke noe varsel etter § 34.1.2, og byggherren kan ikke påberope at det kom for sent, selv om § 34.1.2 annet ledd lar kravet tapes også når det ikke varsles i det hele tatt. Snevrer inn OV-U5 og LV-U21 for § 34.1.2, og presiserer OV-U23. #1185 må da rettes før merge.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Hvert vederlagskrav er et varsel"
tekst = '''
Når varslingsplikten etter § 34.1.2 gjelder, er hver kravversjon i vederlaget et varsel etter § 34.1.2, også en versjon som bare har det særskilte kravet etter § 34.1.3 annet ledd. Den første kravversjonen er da TEs første kjente varsel etter § 34.1.2. Presiserer OV-U5.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Bare krav med justeringen ellers"
tekst = '''
Når varslingsplikten etter § 34.1.2 gjelder, er bare en kravversjon med et beløp for justeringen ellers et varsel etter § 34.1.2. Det første kjente varselet blir da senere, til ugunst for TE. Har ingen kravversjon et slikt beløp, og er det heller ikke registrert noe varsel, kjenner appen ikke noe varsel etter § 34.1.2, og byggherren kan ikke påberope at det kom for sent. Snevrer inn OV-U5 og LV-U21 for § 34.1.2, og presiserer OV-U23.'''
forkastet = true

