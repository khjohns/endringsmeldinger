[[gruppe.vedtak]]
id = "GFK-U2"
dato = 2026-10-18
hvem = "oppdragsgiver"
kilde = ["runde 7 (#764)", "#818"]
sporsmal = '''
Kan byggherren svare fra appen i et prosjekt uten registrerte fullmakter?

Etter vedtakene går byggherrens svar på grunnlag, vederlag og frist gjennom fullmakten, mens svaret på et forseringsvarsel sendes uten intern godkjenning (FO-U6). I dag sender appen alle svar direkte når prosjektet ikke har fullmakter.

A. Ingen svar uten fullmakter (anbefalt): «Har byggherren ikke registrert fullmakter i prosjektet, kan svar som går gjennom fullmakten, ikke sendes fra appen. Svaret på et forseringsvarsel kan sendes (FO-U6).»
B. Bare endringsordrer sperres: «Har byggherren ikke registrert fullmakter i prosjektet, sendes svar direkte av den som skriver dem. Et svar som er en endringsordre etter § 31.3, og en endringsordre i en EO-sak kan ikke sendes fra appen.»
C. Alle svar sendes direkte: «Har byggherren ikke registrert fullmakter i prosjektet, sendes alle svar direkte av den som skriver dem, også endringsordrer. Dette endrer GR-U13 og EO-U6 for slike prosjekter.»

Anbefaling: A.

Belegg, ordrett fra vedtakene:
- GR-U13: «For brev sendt fra appen sørger appen for det: brevet sier at endringen kreves og viser til pålegget i varselet, og fullmakten kontrolleres i godkjenningsflyten (GFK-06).»
- FO-U6: «Svaret på forseringsvarselet (FO-U3) sendes uten intern godkjenning, fordi det ikke påtar byggherren noe ansvar.»'''
valgt = "Ingen svar uten fullmakter"
svar = '''
«Ingen svar uten fullmakter (Recommended)»'''
forhold = [{ art = "presiserer", vedtak = "gr-u13" }, { art = "presiserer", vedtak = "eo-u6" }, { art = "presiserer", vedtak = "fo-u6" }]
folge = '''
Ikke bygget. Presiserer B-02 punkt 3 (vedtaket 23.09).'''

