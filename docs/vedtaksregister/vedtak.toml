forkastet = true


[[gruppe.vedtak]]
id = "MM-U31"
dato = 2026-10-22
hvem = "oppdragsgiver"
kilde = ["#1043", "#1137"]
sporsmal = '''
Spørsmålet ordrett slik det står i kommentaren på #1043 (header «Forespørsel»):

Byggherren har bedt TE angi og begrunne fristkravet etter § 33.6.2, og TE har ikke svart. Så godtar TE byggherrens avslag av kravet om endring, og saken er lukket. Et fristkrav som svar på forespørselen avvises da. Skal fristen fortsatt ha betegnelsen «Byggherren har bedt om spesifisert krav»?

Alternativene slik de står i kommentaren:

«Bare mens den kan besvares (Recommended)»: Betegnelsen gjelder til forespørselen er besvart, og bare så lenge saken ikke er lukket. Etter et godtatt avslag viser fristen det som ellers foreligger, for eksempel «Varslet». Snevrer inn MM-U30, i samme retning som MM-U24, MM-U29 og SK-01.

«Til den er besvart»: Betegnelsen står til forespørselen er besvart, også i en lukket sak. Som MM-U30 etter ordlyden.'''
valgt = "Bare mens den kan besvares"
svar = '''
«Bare mens den kan besvares (Recommended)»'''
forhold = [{ art = "snevrer inn", vedtak = "mm-u30" }]
folge = '''
Spørsmålet og alternativene står på #1043 (kommentaren 6340640340). Svaret er gitt med spørsmålsverktøyet 22.10 (runde 14).'''

[[gruppe.vedtak.alternativ]]
navn = "Bare mens den kan besvares"
tekst = '''
Betegnelsen gjelder til forespørselen er besvart, og bare så lenge saken ikke er lukket. Etter et godtatt avslag viser fristen det som ellers foreligger, for eksempel «Varslet». Snevrer inn MM-U30, i samme retning som MM-U24, MM-U29 og SK-01.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Til den er besvart"
tekst = '''
Betegnelsen står til forespørselen er besvart, også i en lukket sak. Som MM-U30 etter ordlyden.'''
forkastet = true

[[gruppe.vedtak]]
id = "MM-U32"
dato = 2026-10-23
hvem = "oppdragsgiver"
kilde = ["#1187"]
sporsmal = '''
#1187, spørsmål 4, presiserer MM-U25: Skal en handling som vises, kunne være inaktiv fordi skjemaet ikke er ferdig utfylt? MM-U25 sier: «Appen viser bare handlingene parten kan gjøre nå.» Det forkastede alternativet gjaldt handlinger kontrakten ikke tillater nå, ikke et skjema som mangler noe. I dag har komponentene 24 disabled=, blant annet ActionBar:200 (disabled={!canSend}). Feilmeldingene er ikke knyttet til feltene med aria.'''
valgt = "Alltid aktiv, sjekk ved sending"
svar = '''
«Alltid aktiv, sjekk ved sending (Recommended)»'''
forhold = [{ art = "presiserer", vedtak = "mm-u25" }]
folge = '''
Svaret er gitt med spørsmålsverktøyet 23.10. Spørsmålene og svarene står på #1187 ([kommentaren 6364164230](https://github.com/khjohns/endringsmeldinger/issues/1187#issuecomment-6364164230)). Ikke bygget (#1187, #1184).'''

[[gruppe.vedtak.alternativ]]
navn = "Alltid aktiv, sjekk ved sending"
tekst = '''
En handling parten kan gjøre nå, er alltid aktiv. Mangler noe i skjemaet, kontrollerer appen det når parten sender, og sier ved feltet og øverst i skjemaet hva som mangler. En knapp er inaktiv bare mens en sending pågår.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Inaktiv til utfylt"
tekst = '''
Send er inaktiv til skjemaet er fullstendig, med en linje som sier hva som mangler.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Ingen regel nå"
tekst = '''
Skjemaene følger Punkt når sidene er lest, og spørsmålet stilles på nytt hvis Punkt avviker fra MM-U25.'''
forkastet = true

[[gruppe.vedtak.sitat]]
kilde = "hovedplanen"
tekst = "Appen viser bare handlingene parten kan gjøre nå."


[[gruppe.vedtak]]
id = "LV-U22"
dato = 2026-10-22
hvem = "oppdragsgiver"
kilde = ["#1166"]
sporsmal = '''
Spørsmål K1, «Kanalen»: Del II pkt. B.2.4 krever byggherrens formularer for varsler og krav. Formularet kan sendes som PDF på e-post til avtalt adresse, men e-post alene erstatter det ikke. Byggherrens prosjekthotell skal brukes der prosjektet har det, og varsler som kan påvirke pris, kvalitet eller framdrift skal sendes per post eller elektronisk der det er avtalt likestilt med post. Pkt. D.1.2.1 sier at korrespondanse sendes på e-post til prosjektleder og byggeleder, og at dokumenter som hovedregel distribueres fra prosjekthotellet. I dag lagres brevet i appen og legges i mappen prosjektet angir i prosjekthotellet, med en referanse på sakens topic. Fristene regnes fra lagringen (LV-U7). Appen sender ingen e-post og ingen beskjed; om prosjekthotellet selv varsler, er ikke kontrollert. Hva er kanalen? Anbefalt: A.'''
valgt = "Prosjekthotellet"
svar = '''
«Prosjekthotellet (Recommended)»'''
forhold = [
  { art = "presiserer", vedtak = "lv-u7" },
  { art = "presiserer", vedtak = "lv-u9" },
  { art = "presiserer", vedtak = "lv-u13" },
]
folge = '''
Svaret er gitt med spørsmålsverktøyet 22.10. Spørsmålet og alternativene står ordrett på #1166 (kommentaren 6349346125). Spørsmålet kaller vedtaket K1. Hvordan motparten får beskjed fra prosjekthotellet, avklares i et eget issue (#1175).'''

[[gruppe.vedtak.alternativ]]
navn = "Prosjekthotellet"
tekst = '''
Et brev appen lagrer og legger i byggherrens prosjekthotell, er sendt på avtalt kanal etter § 5 og Del II pkt. B.2.4. At prosjekthotellet er likestilt med post, og at e-post til prosjektleder og byggeleder etter pkt. D.1.2.1 ikke trengs, avtales i kontrakten for hvert prosjekt, ikke i appen. Appen sender ingen e-post. Hvordan motparten får beskjed fra prosjekthotellet, avklares i et eget issue. Presiserer LV-U7, LV-U9 og LV-U13.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Prosjekthotellet og e-post"
tekst = '''
Som A, og leveringen sender i tillegg samme PDF på e-post til adressene prosjektet angir for motparten, hos byggherren prosjektleder og byggeleder, slik pkt. D.1.2.1 sier. Hver sending, feil og kvittering for e-posten dokumenteres som leveringen til prosjekthotellet. Fristene regnes fortsatt fra lagringen (LV-U7). Utvider LV-U1 og LV-U13.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Utenfor appen"
tekst = '''
Partene sender brevet selv på avtalt kanal, og appen registrerer det som et brev sendt utenfor appen. Endrer LV-U7 og LV-U9 (fristene regnes fra sendingen i appen), KT-U6 (varselet sendes fra appen), LV-U2 og LV-U3 (teksten avsenderen godkjenner, er brevet) og B-03 om dokumentet.'''
forkastet = true

[[gruppe.vedtak]]
id = "LV-U23"
dato = 2026-10-22
hvem = "oppdragsgiver"
kilde = ["#1166"]
sporsmal = '''
Spørsmål K2, «Brevets form»: Del II pkt. B.2.4 krever byggherrens formularer og blanketter for varsler og krav, men kontraktsgrunnlaget har dem ikke og sier ikke hvilke det er. Pkt. D.1.2.1 krever at korrespondansen merkes med prosjektnavn og hva saken gjelder, og at det står hvor kopi er sendt. I dag har brevhodet sakens interne nummer, sakens versjon, avsenderens part (TE eller BH) og dato; sakens tittel står i teksten. Prosjektnavn, organisasjon, navn, mottaker, kopi og signatur mangler. Signaturene er vedtatt i LV-U15, men ikke bygget. Hva skal brevet være? Anbefalt: A.'''
valgt = "Appens brev er formularet"
svar = '''
«Appens brev er formularet (Recommended)»'''
forhold = [{ art = "presiserer", vedtak = "lv-u2" }, { art = "presiserer", vedtak = "lv-u15" }]
folge = '''
Svaret er gitt med spørsmålsverktøyet 22.10. Spørsmålet og alternativene står ordrett på #1166 (kommentaren 6349346125). Spørsmålet kaller vedtaket K2. Ikke bygget (#1173).'''

[[gruppe.vedtak.alternativ]]
navn = "Appens brev er formularet"
tekst = '''
I prosjekter som bruker appen, er brevet appen lager byggherrens formular for varsler, krav og svar etter Del II pkt. B.2.4. Hodet følger pkt. D.1.2: prosjektnavn og kontrakt, dokumentkoden, emne med sakens tittel, avsender med part, organisasjon og navn, motpartens representant som mottaker, hvor kopi er sendt, og signaturene etter LV-U15. Hodet fryses med brevteksten når brevet sendes (LV-U1, LV-U2). Presiserer LV-U2 og LV-U15.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Byggherrens blanketter"
tekst = '''
Appen fyller ut byggherrens eksisterende blanketter for varsler og krav, og blanketten gjengir den frosne brevteksten tro (LV-U2, LV-U3). Blankettene må innhentes og gjøres om til maler i et eget issue før første ekte sak.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Som i dag"
tekst = '''
Brevet beholder dagens hode med part og dato, og signaturene etter LV-U15 gjelder. Formkravene i Del II håndteres i kontrakten for hvert prosjekt, ikke i appen.'''
forkastet = true

[[gruppe.vedtak]]
id = "LV-U24"
dato = 2026-10-22
hvem = "oppdragsgiver"
kilde = ["#1166"]
sporsmal = '''
Spørsmål K3, «Dokumentkoden»: Del II pkt. D.1.2.5 krever at all korrespondanse merkes med kontraktsforkortelse, dokumentkode og løpenummer (XXX-ZZ-nn), med løpenummer fra 01 for hver kode. Kodene er blant annet BR for brev, KOE for varsel og krav fra totalentreprenøren og EO for endringsordre, og byggherren oppretter andre koder etter behov. I dag heter dokumentet i prosjekthotellet etter sakens interne nummer, sakens versjon og en teknisk nøkkel, uten kode. B-03 overlot navnestandarden til utviklerne; svaret presiserer B-03. Hvordan merkes brevene? Anbefalt: A.'''
valgt = "Koden følger brevet"
svar = '''
«Koden følger brevet (Recommended)»'''
forhold = [{ art = "presiserer", vedtak = "b-03-dokument" }]
folge = '''
Svaret er gitt med spørsmålsverktøyet 22.10. Spørsmålet og alternativene står ordrett på #1166 (kommentaren 6349346125). Spørsmålet kaller vedtaket K3. Ikke bygget (#1174).'''

[[gruppe.vedtak.alternativ]]
navn = "Koden følger brevet"
tekst = '''
Hvert brev merkes etter pkt. D.1.2.5 med eget løpenummer for sin kode i kontrakten: totalentreprenørens varsler og krav KOE, byggherrens endringsordre EO, og byggherrens svar og andre brev BR. Brevet viser til saken med koden fra sakens første brev. Merkingen står i brevhodet og i dokumentnavnet i prosjekthotellet og fryses når brevet sendes. Kontraktsforkortelsen står i prosjektinnstillingene. Presiserer B-03.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Koden følger saken"
tekst = '''
Saken får koden fra sitt første brev, KOE-nn eller EO-nn, og hvert senere brev i saken, også byggherrens svar, merkes med sakens kode og brevets nummer i saken. Avviker fra formen i pkt. D.1.2.5 og fra tabellen for byggherrens svar. Presiserer B-03.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Ikke før første ekte sak"
tekst = '''
Dokumentnavnet beholdes som i dag, og kodene legges på i et eget issue senere.'''
forkastet = true

[[gruppe.vedtak]]
id = "LV-U25"
dato = 2026-10-22
hvem = "oppdragsgiver"
