[[gruppe.vedtak]]
anker = "ka-u22"
vedtak = '''
KA-U22: brevet for et trekk av grunnlaget sier: «TE trekker sitt krav i sak <saksnummer>
(«<tittel>»). Trekket er avkall på alle krav i saken, også vederlag og fristforlengelse
byggherren har godkjent. Trekket opphever ikke et pålegg, en endringsordre, en
utførelsesplikt eller byggherrens rettigheter etter en avtale.» Brevet for et trekk av
vederlag eller frist sier: «TE trekker kravet om justering av vederlaget [om
fristforlengelse] i sak <saksnummer> («<tittel>»), <kravversjonen, entydig
identifisert>. Trekket er avkall på dette kravet, også det byggherren har godkjent.» At
kravet ikke kan tas opp igjen i saken, står i veiledningen i skjemaet, ikke i brevet.
Brevet for «ingen krav» sier: «TE krever ikke justering av vederlaget [fristforlengelse]
som følge av forholdet i sak <saksnummer> («<tittel>»), og gir avkall på slikt krav,
også for følger som ikke er kjent i dag.» Trekk og «ingen krav» har ingen fritekst i
første versjon, slik at avkallet er entydig. Et avgrenset eller betinget avkall som
skjemaet ikke uttrykker, sendes utenfor appen. Et trekk, også av grunnlaget, avvises når
appen ikke kan bevare byggherrens avtalte rettigheter, for eksempel et avtalt fradrag
(KA-U9), til detaljmodellen er avklart i byggedel 3. Forkastet for første versjon: en
utdypning under trekk og «ingen krav»'''
