[[gruppe.vedtak]]
id = "GR-U24"
dato = 2026-10-16
hvem = "oppdragsgiver"
kilde = ["#557", "#510", "#578"]
sporsmal = '''
Frafall og ny grunnlagsversjon (PR #557, GR-U23). Byggherren har frafalt pålegget etter § 32.3 c. TE sender så en ny grunnlagsversjon med samme hjemmel, og den venter på svar. Mens den venter, blir det siste kravet avgjort, for eksempel ved at fristforlengelsen godkjennes fullt. Da er alle krav avgjort, og etter OV-U3 avvises det som kan endre utfallet. Skal byggherren likevel kunne svare på den ventende versjonen? Et svar med endringsordre ville gjøre om frafallet, og det er det samme som en revisjon av frafallet, som OV-U3 uttrykkelig avviser («også av et frafall»). GR-U23 sier derimot at byggherren kan svare med frafall eller endringsordre.

- **A: OV-U3 går foran (Anbefalt).** «Når kravene er avgjort, går OV-U3 foran GR-U20 og GR-U23: et svar på en grunnlagsversjon som venter, avvises, og frafallet står.» Snevrer inn GR-U20 og GR-U23, presiserer OV-U3. Visningen slutter å si at versjonen venter på svar når kravene er avgjort. Det rettes i #557.
- **B: kan svare likevel.** «Byggherren kan svare på en grunnlagsversjon som venter, med frafall eller endringsordre, også når kravene er avgjort.» Snevrer inn OV-U3. Byggherren kan da gjøre om frafallet til endringsordre gjennom versjon 2, men ikke gjennom en revisjon.
- **C: ikke avgjort mens den venter.** «Kravene er ikke avgjort så lenge en grunnlagsversjon venter på svar.» Snevrer inn OV-U3 og endrer GR-U23. TE kan da holde saken åpen med en ny versjon. Det går imot retningen i GR-U22.'''
valgt = "A: OV-U3 går foran"
svar = '''
A: OV-U3 går foran (Anbefalt)'''
forhold = [{ art = "snevrer inn", vedtak = "gr-u20" }, { art = "snevrer inn", vedtak = "gr-u23" }, { art = "presiserer", vedtak = "ov-u3" }, { art = "presiserer", vedtak = "gr-u17" }]
folge = '''
Forholdet til GR-U17 fant kontrollen av føringen 16.10: når kravene er avgjort, går OV-U3 foran også for svaret på en ny versjon, slik KA-U11 går foran etter GR-U17. Spørsmålet kom fra samspillsreviewet av PR #557 og står i #578. Bygget 16.10 i PR #557 (#510): når kravene er avgjort, avvises svaret på en grunnlagsversjon som venter, med KRAVENE_AVGJORT, og visningen viser ikke at noe venter på svar. PROJEKSJONSVERSJON 20.'''

