[[gruppe.vedtak]]
anker = "vs-u15"
vedtak = '''
VS-U15: TE kan sende et eget varsel etter § 33.4 fra appen uten å angi dager, også før
dager kan angis, fordi § 33.4 krever varsel «selv om han ennå ikke kan fremsette et
spesifisert krav». Varselet er et eget utsagn med egen dato, og grunnlagskravet endres
ikke og er ikke et varsel etter § 33.4 eller § 34.1.2. Brevteksten: «TE varsler etter NS
8407 § 33.4 at TE vil kreve fristforlengelse som følge av forholdet i sak <saksnummer>
(«<sakstittel>»).» Varselet etter § 34.1.2 sendes utenfor appen og registreres når §
34.1 er bygget, og avgjøres med § 34.1 i byggedel 3. Forkastet: at et varsel etter §
33.4 fra appen bare kan stå i et fristkrav med dager, og ellers sendes utenfor appen og
registreres (A); og «B: grunnlagskravet er også et varsel etter § 33.4, og etter §
34.1.2 i svikt og andre forhold, og registreres som det»'''
vedtatt = "11.10, oppdragsgiver (#369, #410)"
folge = '''
Spørsmålet står i versjon 4 av spørsmålene på #410, svaret på #369 (V6 C). Varselet
sendes fra appen og får serverens dato ([VS-U8](#vs-u8)); det er en ny kommando ved
siden av registreringen av et varsel sendt utenfor appen. Til nå sto et varsel etter §
33.4 fra appen bare i et fristkrav, som må ha minst én dag ([KA-U8](#ka-u8)). § 33.4 er
blant bestemmelsene appen utleder virkningen av ([VS-U3](#vs-u3)). Varselet hører til
første versjon av TS-stien ([OV-U1](#ov-u1)), der matrisen fører § 33.4 og § 34.1.2;
raden for § 34.1.2 i [paragrafmatrisen](../paragrafmatrise-koe-eo-forsering.md) skal
vise til VS-U15. Bygges i #411. Ikke bygget'''

[[gruppe.vedtak]]
id = "VS-U16"
dato = 2026-10-12
hvem = "oppdragsgiver"
kilde = ["#411"]
sporsmal = '''
§ 33.4 og VS-U15: TE kan nå sende et eget varsel om fristforlengelse fra appen, «også før dager kan angis». Kan TE også sende et slikt varsel fra appen etter å ha sendt fristkravet? Eksempel: TE krever 20 dagers fristforlengelse 1. mars, og appen regner kravet som varselet når ikke noe annet varsel er registrert. Byggherren svarer 10. mars at varselet kom for sent. 15. mars vil TE sende et eget varsel etter § 33.4 fra appen.

A: nei, avvises – Når et fristkrav er sendt, avvises et nytt varsel fra appen. Det kan bare få en senere dato enn kravet, og VS-U15 begrunner varselet med at TE skal kunne varsle før dagene kan angis. Et varsel som faktisk ble sendt tidligere utenfor appen, kan fortsatt registreres med sin egen dato (MM-U8).

B: ja, som en registrering – Varselet 15. mars godtas, som når et varsel registreres etter kravet (MM-U8). Byggherrens påberopelse av for sent varsel blir uavklart, og TE kan ikke godta svaret før byggherren har svart på nytt. Rettidigheten vurderes da mot 15. mars.'''
valgt = "A"
svar = '''
A: nei, avvises'''
forhold = [{ art = "snevrer inn", vedtak = "vs-u15" }]
folge = '''
Ikke bygget. Bygges i #411'''

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
Når et fristkrav er sendt, avvises et nytt varsel etter § 33.4 fra appen. Det kan bare få en senere dato enn kravet, og VS-U15 begrunner varselet med at TE skal kunne varsle før dagene kan angis. Et varsel som faktisk ble sendt tidligere utenfor appen, kan fortsatt registreres med sin egen dato (MM-U8).'''

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
Varselet godtas, som når et varsel registreres etter kravet (MM-U8). Byggherrens påberopelse av for sent varsel blir uavklart, og TE kan ikke godta svaret før byggherren har svart på nytt. Rettidigheten vurderes da mot datoen for det nye varselet.'''
forkastet = true

