[[gruppe.vedtak]]
id = "LV-U31"
dato = 2026-10-24
hvem = "oppdragsgiver"
kilde = ["#1240"]
sporsmal = '''
Hva sier brevet når byggherren godtar tilbudet som grunnlag for justeringen, men ikke hele beløpet?

Innledningen i svar-kommentaren på #1239 (kommentaren 6383634165), ordrett utenom lenken til versjon 4: Grunnlaget er versjon 4 (kommentaren 6383604340) og sparring 3. Oppdragsgiver svarte først, ordrett: «Jeg støtter følgende fra Astra.» Det var S″ og 2′ fra versjon 3, med Astras presiseringer. Prøvingen hadde funnet at S″ manglet HF-U7 og at 2′ brøt LV-U4 punkt 5 og KA-U16. Svaret ble derfor slått sammen med rettelsene og lagt fram slik, ordrett:

**Spørsmål 2, 2‴** (2′ + Astras presisering, med «godkjenner» og lagene)'''
valgt = "2‴"
svar = '''
Jeg støtter følgende fra Astra.

Lagt fram slått sammen med rettelsene, med S⁗ i spørsmål 1 og 2‴ i spørsmål 2: Ja til begge'''
forhold = [{ art = "presiserer", vedtak = "lv-u4" }, { art = "presiserer", vedtak = "hf-u7" }, { art = "presiserer", vedtak = "hf-u14" }, { art = "presiserer", vedtak = "ov-u32" }, { art = "presiserer", vedtak = "ov-u33" }]
folge = '''
Bygges i #1240. «Fast sum» er appens begrep, ikke standardens, og føres i domenetabellen.'''

[[gruppe.vedtak.alternativ]]
navn = "2‴"
tekst = '''
Når byggherren godkjenner oppgjør som fast sum, men ikke hele tilbudet, sier brevet: «Byggherren godkjenner oppgjør som fast sum med beløpet og forbeholdene som fremgår av svaret.» Når beløpet eller øvrige vilkår avviker fra TEs tilbud, betegner brevet ikke tilbudet som akseptert (§ 34.2.2). Standpunktet innebærer ikke i seg selv avkall på kontraktens beregningsregler (§§ 34.3 og 34.4) dersom partene ikke blir enige om et avtalt oppgjør for den aktuelle vederlagsjusteringen. Standpunktet står i det laget innsigelsene i svaret gir det (OV-U32, OV-U33).'''

[[gruppe.vedtak.alternativ]]
navn = "1: setningen står som i dag"
tekst = '''
Når byggherren godtar beregningsmåten i TEs tilbud, sier brevet: «Byggherren aksepterer beregningsmåten i TEs tilbud (NS 8407 § 34.2.2).» Setningen kan stå sammen med et lavere beløp og står uten etikett for lag. Appen regner den ikke som aksept av tilbudet, og svaret gir enighet uten TEs aksept bare når hele beløpet er godkjent.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "3: byggherren kan bare godta hele tilbudet"
tekst = '''
Som et valg i appen, ikke en regel kontrakten krever, kan byggherren godta TEs tilbud bare i sin helhet (NS 8407 § 34.2.2 første ledd), og da godkjennes hele beløpet. Godkjenner byggherren et lavere beløp, skriver brevet ikke noe eget standpunkt til beregningsmåten. Et lavere beløp betyr ikke at vederlaget skal justeres etter § 34.3 eller § 34.4.'''
forkastet = true

[[gruppe.vedtak]]
id = "LV-U32"
dato = 2026-10-24
hvem = "oppdragsgiver"
kilde = ["#1240"]
sporsmal = '''
Hva brevet sier når byggherren godkjenner hele beløpet og oppgjør som fast sum

TE har krevd vederlagsjustering med et spesifisert tilbud (§ 34.2.1). Byggherren godkjenner hele det krevde beløpet og godkjenner oppgjør som fast sum. LV-U31 avgjør bare tilfellet der byggherren godkjenner oppgjør som fast sum, men ikke hele tilbudet. I dag sier brevet «Byggherren aksepterer beregningsmåten i TEs tilbud (NS 8407 § 34.2.2).» når byggherren godtar beregningsmåten, uavhengig av beløpet. Den ordlyden er et arbeidsvalg (#479) og ikke et vedtak, og LV-U31 forkastet å gjøre den til vedtak for alle beløp. Appen ser beløpet. Den ser ikke om byggherren i utdypningen tar forbehold om tilbudets øvrige vilkår. Svaret kan også stå i et subsidiært lag eller under forbeholdet for ubesvart grunnlag.

Spørsmål 1 i #1240 (kommentaren 6383793730), svaret i kommentaren 6383985251.'''
valgt = "C"
svar = '''
Ja til C.

Den faste teksten beskriver hva BH godkjenner, uten å erklære aksept av hele tilbudet på grunnlag av beløpet alene. Den fungerer også med subsidiære standpunkter og forbeholdet etter GR-U26.

At brevet ikke bruker ordet «akseptert», hindrer ikke at svaret rettslig kan utgjøre en aksept. Det avgjøres av svarets samlede innhold. Appens registrering av enighet følger fortsatt GR-U7 og HF-U7.

Høy sikkerhet på C som tekstvalg innenfor de oppgitte vedtakene.'''
forhold = [{ art = "utvider", vedtak = "lv-u31" }, { art = "presiserer", vedtak = "lv-u4" }]
folge = '''
Bygges i #1240.'''

[[gruppe.vedtak.alternativ]]
navn = "C"
tekst = '''
Når byggherren godkjenner oppgjør som fast sum, sier brevet: «Byggherren godkjenner oppgjør som fast sum med beløpet og forbeholdene som fremgår av svaret.» Det gjelder også når hele det krevde beløpet er godkjent. Brevet betegner ikke tilbudet som akseptert. Om partene er enige, følger av at svaret godkjenner hele kravet (GR-U7, HF-U7), ikke av setningen. Standpunktet står i det laget innsigelsene i svaret gir det (OV-U32, OV-U33).'''

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
Når byggherren godkjenner hele det krevde beløpet og godkjenner oppgjør som fast sum, sier brevet: «Byggherren aksepterer beregningsmåten i TEs tilbud (NS 8407 § 34.2.2).» Setningen står i det laget innsigelsene i svaret gir det (OV-U32, OV-U33). Appen regner den ikke som aksept av tilbudet. Om partene er enige, følger av at svaret godkjenner hele kravet (GR-U7, HF-U7), ikke av setningen.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
Når byggherren godkjenner hele det krevde beløpet og godkjenner oppgjør som fast sum, sier brevet: «Byggherren aksepterer TEs tilbud (NS 8407 § 34.2.2 første ledd).» Det gjelder bare når beløpet står i første lag eller er upåvirket (OV-U32, OV-U33), og svaret ikke er gitt under forbeholdet for ubesvart grunnlag (GR-U26). Ellers sier brevet setningen i LV-U31. Appen tolker ikke forbehold i utdypningen (KA-U16), så setningen står også når byggherren der tar forbehold om tilbudets øvrige vilkår.'''
forkastet = true

[[gruppe.vedtak]]
id = "MM-U33"
dato = 2026-10-28
hvem = "oppdragsgiver"
kilde = ["#1336", "#1338"]
sporsmal = '''
**Forslag til samlet tilslutning, versjon 4, runde 7 av #1338, 28.10: prinsippvedtaket** ([versjon 4](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6467391758)).

Grunnlaget i #1336, ordrett i kommentarene: [spørsmålene om U-5](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6465833511), [svaret på dem og den nye arbeidsflyten](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6466100876), [presiseringen](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6466386460), forslagene [versjon 1](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6466438405), [versjon 2](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6466861564), [versjon 3](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6467303875) og [versjon 4](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6467391758), og svarene på [versjon 1](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6466791055) og [versjon 2](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6467239558).

Prinsippvedtaket i versjon 4, ordrett:

Løsningen skiller mellom hva den lar en part gjøre, hva parten erklærer, og hvilken rettsvirkning erklæringen får. Løsningen hjelper partene å sende krav og svar med de opplysningene kontrakten krever, og den støtter kontraktens meldingskrav og frister. Løsningen legger ingen erklæring i munnen på en part, og den avgjør ikke om en ny erklæring er rettslig virksom mot en tidligere (MM-U12). Tidligere brev og en registrert enighet bevares uendret. Partene har selv ansvar for hva de mener allerede er avtalt. Når løsningen ikke lar en part gjøre noe, beskrives det som en begrensning i løsningen, ikke som at en rett eller et tilbud har falt bort.

Arbeidsflyten:
1. TE sender et strukturert krav. Løsningen sørger for at opplysningene og elementene kontrakten krever, kommer med.
2. Byggherren svarer strukturert. Særskilte forbehold og den faktiske og rettslige begrunnelsen står i fritekst. Forbehold i fritekst vises med svaret og tolkes ikke.
3. Begge parter kan sende innlegg i fritekst i saken, med henvisning til et brev og med dokumentasjon. Innlegget kan uttrykke innsigelser, protester, presiseringer, endrede standpunkter, forbehold, særskilte og subsidiære aksepter og forslag til enighet. Løsningen tolker ikke teksten og oppdaterer ikke strukturerte standpunkter på grunnlag av den. Løsningen har ingen egne prosesser for ulike typer innsigelser og protester, og ingen egen modell for subsidiær aksept. Innsigelsen etter § 5 tredje ledd, at motparten har varslet eller svart for sent, er et meldingskrav i kontrakten og sendes fortsatt som innsigelse (VS-U9).
4. Fram til endringsordren kan begge parter sende nye strukturerte standpunkter: TE en ny kravversjon og byggherren et nytt svar, også med lavere beløp eller andre endringer. Uenighet lukker ikke saken.
5. Underveis kan TE sende et revidert krav som gjengir enigheten, med de avtalte vilkårene og forbeholdene, og byggherren kan godkjenne det. Løsningen registrerer enighet ut fra de strukturerte valgene: når TE godtar byggherrens svar, og når byggherrens svar stemmer med kravet. Skjemaet sier det før sending.
6. En endringsordre omfatter én eller flere hele KOE-saker, med grunnlaget og eventuelle krav om vederlagsjustering og fristforlengelse. Byggherren kan la en endringsordre omfatte én eller flere hele KOE-saker, også når løsningen ikke har registrert enighet. Skjemaet opplyser byggherren om hvilke spor i hvilke saker som ikke har registrert enighet. Bare en endringsordre byggherren sender uttrykkelig som endringsordre i en EO-sak, lukker saken (se spørsmål 3). Når byggherren har sendt endringsordren, er KOE-sakene den omfatter, lukket i arbeidsflyten, også når uenigheten består. Visningen sier «Avsluttet med EO». Det betyr ikke at noe er rettslig avgjort, eller at TE har akseptert endringsordren. Er TE uenig, sender TE en ny KOE. Etter lukkingen kan begge parter sende innlegg og dokumentasjon i saken. Det gjenåpner ikke saken.

Det betyr ikke at enighet rettslig bare kan oppstå på denne måten. Etiketten «Avsluttet med EO» utledes av at endringsordren er sendt og omfatter saken. Ingen regel leser etiketten.

Følgeendringene er ført som MM-U34, og de åpne spørsmålene 1–3 som EO-U11, GR-U27 og EO-U12.'''
valgt = "Ja"
svar = '''
Oppdragsgiver 28.10, ordrett ([tilslutningen](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6468129098)): «Ja, jeg godtar prinsippvedtaket og følgeendringene 1–26 i versjon 4 samlet, tilpasset mine svar 1B, 2A og 3A.

Dette omfatter også oppheving av sperrene i HF-U4, OV-U51, GR-U17, GR-U20 og GR-U23, og endringen i OV-U4 og OV-U7. Partene kan sende nye standpunkter. Tidligere erklæringer bevares, og løsningen avgjør ikke om endringene er rettslig virksomme.

Punkt 12 rettes: Visningen «Alle fremsatte krav er avgjort» erstattes med «Registrert enighet om alle fremsatte krav» der statusen bygger på sammenfall eller aksept. Løsningen skal ikke fremstille registrert enighet som en rettslig avgjørelse. Ved lukking vises den konkrete avslutningsårsaken.

Ingen øvrige følgeendringer strykes. Før vedtakene i én samlet vedtaks-PR og legg den frem før merge som foreslått.»

Svarene 1B, 2A og 3A står i [kommentaren før](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6468031356) og er ført som EO-U11, GR-U27 og EO-U12.

Det samlede svaret på spørsmålene sluttet ordrett: «Skill fortsatt mellom registrert enighet og en rettslig konklusjon. Tidligere brev bevares uendret, og løsningen avgjør ikke om senere erklæringer endrer det som tidligere er avtalt.»'''
forhold = [{ art = "presiserer", vedtak = "mm-u12" }, { art = "presiserer", vedtak = "vs-u9" }]

