[[gruppe.vedtak]]
id = "HF-U19"
dato = 2026-10-16
hvem = "oppdragsgiver"
kilde = ["#502"]
sporsmal = '''
**Første spørsmål:** Akseptfristen, spørsmål 4: hva skjer når byggherren har avslått TEs tilbud (en aksept etter fristen), eller når byggherren reviderer svaret mens tilbudet venter? At en ny kravversjon fra TE gjør at tilbudet faller bort, er avgjort av HF-U6 og HF-U8.

- **A: revisjon er avslag (Anbefalt).** «Har byggherren avslått TEs tilbud, kan TE ikke godta det samme svaret på nytt, men TE kan sende en ny kravversjon. Reviderer byggherren svaret mens TEs tilbud venter, er revisjonen et avslag av tilbudet og et nytt svar, som kan ha sin egen akseptfrist.» Presiserer HF-U5. Følger av HF-U7 og avtaleloven § 6.
- **B: svar på tilbudet først.** «TE kan godta svaret på nytt etter et avslag, og hver aksept er et nytt tilbud. Byggherren må godta eller avslå tilbudet før hen kan revidere svaret.» Presiserer HF-U5, men sperrer en revisjon byggherren kan trenge, og krever to brev.

**Oppfølging:** Svaret ditt kan leses på to måter. Begge beholder A: en revisjon er et avslag av tilbudet og et nytt svar, og etter et avslag sender TE en ny kravversjon. Valget styrer om appen får et eget utsagn for «å godta tilbudet», og om enigheten krever at BH sier det uttrykkelig.

- **1: godta i skjemaet (Anbefalt).** «Byggherren svarer på TEs tilbud i det vanlige skjemaet for svar, der tilbudet vises, og velger om hen godtar det. Godtar byggherren, er partene enige om svaret slik brevet uttrykker det (KA-U10). Godtar hen ikke, tar hen stilling til delene av kravet på vanlig måte, og svaret er et avslag av tilbudet og et nytt svar, som kan ha sin egen akseptfrist.» Presiserer HF-U5. Enigheten bygger på BHs uttrykkelige aksept, ikke på en sammenlikning appen gjør.
- **2: bare vanlig svar.** «Byggherren svarer på TEs tilbud i det vanlige skjemaet for svar, der tilbudet vises. Tar byggherren stilling til hver del av kravet slik tilbudet lyder, er partene enige om svaret slik brevet uttrykker det (KA-U10). Ellers er svaret et avslag av tilbudet og et nytt svar. Det finnes ikke noe eget valg for å godta tilbudet.» Presiserer HF-U5. Appen utleder enigheten av at standpunktene er like, og BH må fylle ut det samme svaret på nytt.

**Andre oppfølging:** Én ting er ikke avklart: skal svaret da avvises, eller skal byggherren bare advares og likevel kunne sende? Eksempel: BH godkjenner 300 av 500 000 kr med akseptfrist 24. mars. TE godtar 2. april. BH krysser av for «Godta», men skriver 250 000 kr.

- **Avvis ved avvik (Anbefalt).** «Har byggherren avslått TEs tilbud, kan TE ikke godta det samme svaret på nytt, men kan sende en ny kravversjon. Byggherren svarer på TEs tilbud i det vanlige skjemaet for svar, der tilbudet vises, og tar stilling til delene av kravet på vanlig måte. Skjemaet har også et valg for å godta tilbudet. Velger byggherren det, og svaret stemmer med tilbudet i hver del, er partene enige om svaret slik brevet uttrykker det (KA-U10). Stemmer svaret ikke med tilbudet, avviser appen det og viser hvilke deler som avviker. Et svar som ikke godtar tilbudet, er et avslag av tilbudet og et nytt svar, som kan ha sin egen akseptfrist. Det samme gjelder en revisjon byggherren sender mens tilbudet venter.» Presiserer HF-U5. Følger av HF-U7. Brevet kan ikke si «godtar» og samtidig noe annet.
- **Advar, og send som avslag.** Samme tekst, men med «Stemmer svaret ikke med tilbudet, viser appen hvilke deler som avviker. Sender byggherren likevel, er svaret et avslag av tilbudet og et nytt svar.» Brevet kan da inneholde både «godtar» og et annet beløp, og appen avgjør hva brevet betyr.'''
valgt = "Avvis ved avvik"
svar = '''
Jeg tenker A - men dette følger av skjema i frontend: TE sender nytt tilbud. Byggherre for oppgitt tilbudet, og svarer ut i sitt skjema i frontend. Der tar han på vanlig måte stilling til aktuelle deler av kravet (frister, beløp, dager)

Oppfølging: Vi kan ha godta i skjema, som en sikkerhetsventil: Dvs. en kombinasjon av 1 og 2. Hvis f.eks. byggherre velger "Godta" men svarene i skjema ikke er fullt ut godkjennelse, kommer en melding om dette.

Andre oppfølging: Avvis ved avvik (Anbefalt)'''
forhold = [{ art = "presiserer", vedtak = "hf-u5" }]
folge = '''
Følger av HF-U7. Det første svaret valgte A med et forbehold, og det første oppfølgingssvaret kombinerte 1 og 2. Derfor ble det stilt to oppfølgingsspørsmål. Teksten i det forkastede alternativet «Advar, og send som avslag» er satt sammen av «samme tekst, men med …» slik det ble stilt: setningen om avvik er byttet ut, og resten står. Ikke bygget (#502).'''

[[gruppe.vedtak.alternativ]]
navn = "Avvis ved avvik"
tekst = '''
Har byggherren avslått TEs tilbud, kan TE ikke godta det samme svaret på nytt, men kan sende en ny kravversjon. Byggherren svarer på TEs tilbud i det vanlige skjemaet for svar, der tilbudet vises, og tar stilling til delene av kravet på vanlig måte. Skjemaet har også et valg for å godta tilbudet. Velger byggherren det, og svaret stemmer med tilbudet i hver del, er partene enige om svaret slik brevet uttrykker det (KA-U10). Stemmer svaret ikke med tilbudet, avviser appen det og viser hvilke deler som avviker. Et svar som ikke godtar tilbudet, er et avslag av tilbudet og et nytt svar, som kan ha sin egen akseptfrist. Det samme gjelder en revisjon byggherren sender mens tilbudet venter.'''

[[gruppe.vedtak.alternativ]]
navn = "Advar, og send som avslag"
tekst = '''
Har byggherren avslått TEs tilbud, kan TE ikke godta det samme svaret på nytt, men kan sende en ny kravversjon. Byggherren svarer på TEs tilbud i det vanlige skjemaet for svar, der tilbudet vises, og tar stilling til delene av kravet på vanlig måte. Skjemaet har også et valg for å godta tilbudet. Velger byggherren det, og svaret stemmer med tilbudet i hver del, er partene enige om svaret slik brevet uttrykker det (KA-U10). Stemmer svaret ikke med tilbudet, viser appen hvilke deler som avviker. Sender byggherren likevel, er svaret et avslag av tilbudet og et nytt svar. Et svar som ikke godtar tilbudet, er et avslag av tilbudet og et nytt svar, som kan ha sin egen akseptfrist. Det samme gjelder en revisjon byggherren sender mens tilbudet venter.'''
