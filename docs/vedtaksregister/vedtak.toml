[[gruppe.vedtak]]
id = "OV-U5"
dato = 2026-10-13
hvem = "oppdragsgiver"
kilde = ["#478", "#481"]
sporsmal = '''
Den rettede ordlyden til de fem vedtakene ligger nå i PR #481: `forslag-vedtak.md` (`01356ae`). Ingenting er ført i vedtaksregisteret ennå. Svar «ja» på hele forslaget, eller rett enkeltpunkter. Punkt 1–5 er vedtakene, og punkt 6–12 er der forslaget går ut over det du har svart uttrykkelig. Anbefalingen min står ved hvert punkt.

3. **OV-U5, varsel etter § 34.1.2 og § 34.1.3 kan sendes fra appen,** som i dagens skjema (Astras punkt 1). TE kan også oppgi datoen for sitt eget varsel sendt utenfor appen. Visningen sier «TE oppgir at varselet ble sendt …», og BH tar stilling til rettidigheten med datoen som premiss. Et svar BH alt har gitt, står med virkningen det hadde. MM-U8 og VS-U7 endres.
8. **Et krav TE har sendt utenfor appen, er bare dokumentasjon.** TE må sende det på nytt fra appen, og BH vurderer da rettidigheten etter § 33.6.1 mot den senere datoen. Dette er det eneste punktet der forslaget kan gi BH et feil premiss. *Anbefalt: rett.* Utvid OV-U5 slik at TE, når kravet sendes fra appen, kan oppgi at samme krav ble sendt utenfor appen på en tidligere dato, som premiss for BH på samme måte som for varselet.
9. **Om et varsel etter § 34.1 godtas etter at vederlagskravet er sendt,** er ikke avgjort. *Anbefalt: avvises, som VS-U16 gjør for § 33.4.*
10. **BH bestrider en oppgitt varseldato i begrunnelsen for svaret,** siden bestridelse er utsatt. *Anbefalt: ja.*'''
valgt = "Ja"
svar = '''
Ja'''
