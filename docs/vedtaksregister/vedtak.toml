dato = 2026-10-18
hvem = "oppdragsgiver"
kilde = ["runde 8 (#764)", "#818"]
sporsmal = '''
S2 (header «Hierarkiet»): GFK-U1 sier at driften setter opp fullmaktene. Ingen vedtak sier ennå noe om organisasjonshierarkiet. Når kjeden senere hentes derfra, hva skal hierarkiet bestemme?
«GFK-U1 står (Recommended)»: Driften registrerer hvem som har fullmakt, beløpsgrensen og rekkefølgen. Hierarkiet brukes bare til å finne personen. Presiserer GFK-U1.
«Rekkefølgen fra hierarkiet»: Rekkefølgen i kjeden følger hierarkiet; driften registrerer beløpsgrensene. Endrer GFK-U1 for rekkefølgen: driften registrerer ikke lenger rekkefølgen.
«Fullmakten følger stillingen»: Fullmakt og grense følger stillingen i hierarkiet. Endrer GFK-U1.

O2 (header «Grense»): Fullmakten følger rollen (prosjektleder, avdelingsleder osv.), og rollen og hierarkiet hentes fra HR-dataene. Hvem fastsetter beløpsgrensen for hver rolle?
«Driften per rolle (Recommended)»: Driften registrerer beløpsgrensen for hver rolle. Hvem som har rollen, og hierarkiet hentes fra HR-dataene. Endrer GFK-U1.
«Fra HR-dataene»: Også beløpsgrensen hentes fra HR-dataene. Endrer GFK-U1.
«Avgjøres senere»: Grensen avgjøres når innhentingen fra HR-dataene kartlegges.'''
