[[gruppe.vedtak]]
id = "VS-U17"
dato = 2026-10-12
hvem = "oppdragsgiver"
kilde = ["#309", "#407"]
sporsmal = '''
§ 33.6.2 annet ledd: når byggherren ber om det, skal TE «uten ugrunnet opphold enten a) angi og begrunne det antall dager han krever som fristforlengelse, eller b) begrunne hvorfor grunnlaget for å beregne kravet ikke foreligger.» Femte ledd: svarer TE etter bokstav b, «gjelder bestemmelsen i 33.6.1». VS-U3 sier at en uttrykkelig påberopelse av at TE svarte for sent på forespørselen får virkning, og at manglende svar bare vises. Hva gjelder når TE svarer med en begrunnelse etter bokstav b?

A: TEs begrunnelse etter § 33.6.2 annet ledd bokstav b registreres som TEs svar på forespørselen, og § 33.6.1 gjelder for kravet som senere fremmes (femte ledd). Påberoper byggherren uttrykkelig at begrunnelsen kom for sent, utledes virkningen som etter § 33.6.2 tredje ledd. Mener byggherren at begrunnelsen ikke er et svar etter annet ledd, registreres og vises det standpunktet uten utledet virkning, som når TE ikke svarer.
Forhold: presiserer VS-U3.

B: Som A, men: Mener byggherren at begrunnelsen ikke er et svar etter annet ledd, utledes virkningen som etter § 33.6.2 tredje ledd: kravet er prinsipalt avslått, med subsidiært standpunkt.
Forhold: strider mot VS-U3 og VS-U2, og er et forslag om å endre VS-U3.

Spørsmålet står i spørsmålspakken for byggedel 2 på #309 (J5).'''
valgt = "A"
svar = '''
A: vises bare (Anbefalt)'''
forhold = [{ art = "presiserer", vedtak = "vs-u3" }]
folge = '''
Ikke bygget'''

