[[gruppe.vedtak]]
id = "OV-U39"
dato = 2026-10-24
hvem = "oppdragsgiver"
kilde = ["#1171"]
sporsmal = '''
Versjon 3 av spørsmålene i runde 46, punkt 3: Hva TE oppgir om rigg og drift, og den forholdsmessige delen (#1171)

**Forholdet til andre vedtak.** Utvider OV-U26 til første ledd og følger VS-U5. Presiserer svaret 22.10 på R2-2 i #1047: TE oppgir fortsatt beløpet, og regnestykket er aritmetikk på partenes verdier, ikke en avgjørelse av beregningen. Følger KA-U24: byggherrens verdier er utsagn ved siden av begrunnelsen, og et svar med lavere beløp må fortsatt ha begrunnelse. Følger HF-U7 og HF-U9: et svar stemmer med kravet når beløpet stemmer, i kravets enhet, og innholdet i enigheten er det svaret og kravet hadde, med verdiene og begrunnelsen. Følger KA-U16: byggherren har ingen egen type for forbehold i svaret og bruker standpunktene som finnes, og appen tolker ikke utdypningen. Følger MM-U12: appen avgjør ikke hva enigheten omfatter. Følger MM-U23 når alle verdiene står i brevet. «Verdier byggherren ikke oppgir, er ikke tatt stilling til» står ikke i et vedtak, men er regelen i lagringsformatet (designnotatet for hendelsesformatet, B-10: «Et felt som mangler, betyr at parten ikke har sagt det»). B-17: navnene og betydningen av feltene er en kontrakt fra den første lagrede hendelsen. Strider ikke mot et vedtak.'''
valgt = "versjon 3"
svar = '''
«Ja til versjon 3»'''
forhold = [{ art = "utvider", vedtak = "ov-u26" }]
folge = '''
Spørsmålene er versjon 3 av runde 46, laget etter oppdragsgivers svar på versjon 2 («Øvrige spørsmål- se vurdering fra astra og vurder selv:») og den juridiske sparringen. Oppdragsgivers svar 24.10 gjelder hele versjon 3. Alternativet «versjon 3» er alternativ C i punkt 3, med presiseringene i versjon 3. Det presiserer svaret 22.10 på R2-2 i #1047, som ikke er ført som vedtak. Underspørsmål 3b er ført som [OV-U40](#ov-u40). Bygges i #1171.'''

[[gruppe.vedtak.alternativ]]
navn = "versjon 3"
tekst = '''
I posten for rigg og drift i forlenget byggetid oppgir TE: beløpet TE krever, i kroner ekskl. mva.; forlengelsen posten bygger på, i hele hverdager som i kontraktsgrunnlaget, og perioden forlengelsen gjelder, med første og siste dag, som begge regnes med i perioden; opprinnelig byggetid, i hele hverdager; avtalt pris på det opprinnelige rigg- og driftskapitlet ekskl. mva., før forholdsmessig reduksjon; andelen av rigg- og driftskapitlet som brukes i beregningen, i prosent, der 100 % betyr at fristforlengelsen gjelder alle arbeidene; og lønns- og prisreguleringen TE legger til, i kroner. Forlengelsen og andelen kan være null, og andelen er høyst 100 %. Opprinnelig byggetid er større enn null. Reguleringen kan være negativ. TE begrunner verdiene, særlig forlengelsen, andelen og avgrensningen mot krav i andre saker. Brevet og visningen viser regnestykket 0,7 × rigg- og driftskapitlet × andelen × forlengelsen / opprinnelig byggetid, pluss reguleringen, merket «Beregnet ut fra TEs opplysninger». I regnestykket brukes andelen som brøk, slik at 40 % er 0,40. Regnestykket regnes uten avrunding underveis, og resultatet avrundes til nærmeste hele krone. Appen teller ikke hverdagene i perioden, og viser ikke forlengelsen som kontrollert mot perioden. Beløpet TE krever, er det TE krever, også når regnestykket gir noe annet. Byggherren tar stilling til beløpet for posten med godkjent, delvis godkjent eller avslått, som for de andre postene. Byggherren kan i svaret oppgi sine egne verdier for forlengelsen, perioden, opprinnelig byggetid, rigg- og driftskapitlet, andelen og reguleringen, innenfor de samme grensene. Verdiene står ved siden av TEs og endrer dem ikke, og verdier byggherren ikke oppgir, er ikke tatt stilling til. Byggherren kan oppgi samme verdi som TE. Appen viser regnestykket ut fra byggherrens verdier, merket «Beregnet ut fra byggherrens opplysninger», bare når byggherren har oppgitt alle verdiene regnestykket bruker, og fyller ikke inn TEs verdier for dem byggherren ikke har oppgitt. Byggherrens verdier erstatter ikke begrunnelsen (KA-U24). Appen avgjør ikke hvilke verdier som er riktige, og bruker verdiene bare i regnestykket. Avvikende beregningsverdier hindrer ikke i seg selv at appen registrerer enighet om beløpet, og utløser ikke alene kravet til begrunnelse. Vil byggherren avgrense hva det godkjente beløpet omfatter, gjør hen det med standpunktene som finnes og i begrunnelsen (KA-U16, KA-U24). Appen tolker ikke verdiene eller begrunnelsen som en slik avgrensning, og avgjør ikke hva enigheten omfatter. Presiserer svaret 22.10 på #1047 om at TE oppgir beløpet, som ikke er ført som vedtak. Utvider OV-U26 til kravet etter § 34.1.3 første ledd.'''

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
I posten for rigg og drift oppgir TE beløpet og begrunner beregningen etter regelen for forlenget byggetid i kontraktsgrunnlaget. Begrunnelsen sier hvilken forlengelse eller periode beløpet bygger på, hvilke beregningsverdier TE har brukt, og hvilken andel av riggkapitlet TE legger til grunn når fristforlengelsen bare gjelder deler av arbeidene. Byggherren tar stilling til beløpet for posten med godkjent, delvis godkjent eller avslått, som for de andre postene. Mener byggherren at en annen forlengelse eller andel gjelder, sier hen det i begrunnelsen (KA-U24). Appen regner ikke ut beløpet og avgjør ikke den forholdsmessige delen. Utvider OV-U26 til kravet etter § 34.1.3 første ledd.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
I posten for rigg og drift oppgir TE beløpet, dagene beløpet bygger på og den forholdsmessige delen av riggkapitlet i prosent. Byggherren tar stilling til beløpet og kan oppgi en annen forholdsmessig del. Appen viser regnestykket, men regner ikke ut beløpet og avgjør ikke delen. Utvider OV-U26 til kravet etter § 34.1.3 første ledd.'''
forkastet = true

