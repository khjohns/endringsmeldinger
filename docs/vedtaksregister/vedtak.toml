[[gruppe.vedtak]]
anker = "lv-u1"
vedtak = '''
LV-U1: det som skal leveres for et brev, fryses i leveringsoppdraget i samme transaksjon
som hendelsen. Et nytt leveringsforsøk sender samme brev og vedlegg og skaper ingen ny
erklæring. Hvert leveringsforsøk, hver feil og hver kvittering dokumenteres for seg, og
et lagret oppdrag beviser ikke at brevet er sendt eller mottatt. Python tolker ikke
KOE-journalen for å finne hva som skal leveres (B-17). Hvordan Python henter oppdraget,
velger utviklerne'''
vedtatt = "10.10, oppdragsgiver (#311)"
folge = '''
