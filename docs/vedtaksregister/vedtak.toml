[[gruppe.vedtak]]
id = "OV-U21"
dato = 2026-10-22
hvem = "oppdragsgiver"
kilde = ["#1163"]
sporsmal = '''
#1163, OV-U19 når en sak ikke er forstått (MM-U2): Et varsel (OV-U5) eller en endringsordre (OV-U6) ble registrert før saken stoppet. Skal saken da vise merknaden «Saken har brev sendt utenfor appen. Appen vurderer ikke innholdet.»? Belegg: OV-U4 sier at registreringer etter stoppen godtas som dokumentasjon, uten unntakene i OV-U5 og OV-U6. Ingen vedtak sier noe om brev registrert før stoppen.'''
valgt = "Ja, alle teller"
svar = '''
«Ja, alle teller (Recommended)»'''
forhold = [{ art = "presiserer", vedtak = "ov-u19" }]
