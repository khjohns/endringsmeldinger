[[gruppe.vedtak]]
id = "OV-U48"
dato = 2026-10-25
hvem = "oppdragsgiver"
kilde = ["#1282"]
sporsmal = '''
Spørsmål 3b. Vilkår i et svar som godkjenner hele kravet

**Forholdet til andre vedtak.** Utvider KA-U19 og OV-U6. I tråd med KA-U16, HF-U7 og OV-U4.'''
valgt = "A"
svar = '''
«Ja», til anbefalingen «Spørsmål 3b: A, med utvidelsen til OV-U6 og avgrensningen over.»'''
forhold = [{ art = "utvider", vedtak = "ka-u19" }, { art = "utvider", vedtak = "ov-u6" }]
folge = '''
I tråd med KA-U16, HF-U7 og OV-U4.'''

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
Gir byggherrens svar etter løsningens regler ellers sammenfall med kravet i et spor (GR-U7, GR-U10), opplyser byggherren før sending om godkjenningen er avhengig av vilkår eller forbehold som ikke kan uttrykkes med valgene i skjemaet. Opplysningen gis for hvert spor der svaret ellers gir sammenfall, også når et forbehold gjelder flere spor. Skjemaet spør: ‹Er godkjenningen avhengig av andre vilkår eller forbehold enn dem som uttrykkes gjennom valgene du har gjort og den faste brevteksten?› Veiledningen sier: ‹Forbeholdet for ubesvart grunnlag og forbeholdene som uttrykkes i lagene i svaret, omfattes ikke av spørsmålet.› Spørsmålet har ingen forhåndsvalg. Sendingen avvises når opplysningen mangler, og når byggherren svarer ja. Byggherren kan endre svaret dersom standpunktet da kan uttrykkes korrekt med valgene i skjemaet, eller sende svaret utenfor løsningen og registrere det (KA-U19). Registrering som dokumentasjon etter OV-U4 gir ikke i seg selv et nytt utledet standpunkt; hva løsningen utleder for sporet, følger de øvrige reglene. Registrerer byggherren en endringsordre som svar på grunnlaget etter OV-U6, spør skjemaet: ‹Inneholder endringsordren vilkår eller forbehold som begrenser godkjenningen av grunnlaget, og som ikke uttrykkes gjennom valgene du har gjort i registreringen?› Ved ja kan dokumentet ikke registreres som svar på grunnlaget etter OV-U6. Det kan fortsatt registreres som dokumentasjon etter OV-U4. At endringsordren lar vederlag eller frist stå uavklart, omfattes ikke av spørsmålet. Et vilkår om vederlag eller frist omfattes likevel dersom det gjør godkjenningen av grunnlaget betinget. Sperren avgjør ikke dokumentets rettslige virkning. Opplysningen er byggherrens og lagres med sendingen eller registreringen, atskilt fra den utledede virkningen. Den gjelder den svarversjonen som sendes eller registreres. Den er ikke en del av brevet og framstilles ikke som en erklæring meddelt TE. Løsningen kontrollerer ikke opplysningen mot utdypningen eller dokumentet og tolker ikke teksten. Står det likevel et vilkår i utdypningen, er brevet det autoritative uttrykket for byggherrens standpunkt (B-03). Sammenfallet er da løsningens utledning av valgene og avgjør ikke om partene rettslig er enige (MM-U12). Utvider KA-U19 og OV-U6. I tråd med KA-U16, HF-U7 og OV-U4.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
Som i dag: skjemaet sier fast at løsningen beregner virkningen ut fra valgene (KA-U19), uten et eget spørsmål.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "C"
tekst = '''
Svarer byggherren ja, kan svaret sendes, men det gir ikke sammenfall. Det regnes som avslag i forening med nytt tilbud, som TE må godta (HF-U7). Endrer KA-U16, KA-U26, GR-U7, GR-U8 og GR-U10.'''
forkastet = true

[[gruppe.vedtak]]
id = "OV-U49"
dato = 2026-10-25
hvem = "oppdragsgiver"
kilde = ["#1282"]
sporsmal = '''
Spørsmål 3b. Vilkår i et svar som godkjenner hele kravet

**Forholdet til andre vedtak.** Velges D, erstatter det svaret 25.10 (3b-A) for svar på vederlag og frist sendt fra løsningen. 3b-A står for svar på grunnlaget og for registrering av en endringsordre etter OV-U6. Endrer GR-U7 og GR-U8 når byggherren svarer ja, og snevrer inn GR-U26 og HF-U5. Endrer KA-U16, som forkastet foreløpig at et svar med forbehold ikke gir sammenfall, for svar der byggherren selv opplyser om vilkår. Endrer KA-U19 for svar på vederlag og frist sendt fra løsningen. Endrer svaret 25.10 på spørsmål 8 om nøkkeltallene: også vilkår som ikke er avklart, holder et beløp utenfor virksom enighet. Utvider MM-U28 og LV-U4, og presiserer OV-U3, MM-U30 og HF-U15. I tråd med HF-U7, KA-U7, LV-U32 og MM-U12. Utvider LV-U4. Snevrer inn KA-U6 mens et forslag om trekk står åpent. Presiserer HF-U9, KA-U10, KA-U22, OV-U3 og MM-U28. Anvender HF-U5, HF-U6 og LV-U7 på forslaget. I tråd med MM-U12. Snevrer inn EO-U5, slik KA-U26 gjør for et registrert brev merket med et forbehold.'''
valgt = "D"
svar = '''
«Enig med dere»

2. Spørsmål 3b, alternativ D (D1–D3): ja. Det erstatter 3b-A for svar på vederlag og frist sendt fra løsningen; 3b-A står for svar på grunnlaget og for registrering etter OV-U6. Sperrene mens et forslag om trekk står åpent: ja. Hvordan saken håndteres når partene ikke blir enige om en avklaring av vilkårene (2a), avgjøres før D bygges.'''
