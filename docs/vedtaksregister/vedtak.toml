forkastet = true

[[gruppe.vedtak.sitat]]
kilde = "hovedplanen"
tekst = "Byggherren tar stilling til de særskilte kravene som ellers."

[[gruppe.vedtak]]
id = "OV-U27"
dato = 2026-10-23
hvem = "oppdragsgiver"
kilde = ["#1047"]
sporsmal = '''
Spørsmål B2, «§ 34.1.2», etter sparringen: B2, revidert etter sparringen. Byggherren gjør gjeldende at TEs varsel etter § 34.1.2 kom for sent, og vederlagskravet har også et særskilt krav etter § 34.1.3 annet ledd (produktivitet). Rammer påberopelsen også det særskilte kravet? Sparringen anbefaler A: varslingskravene er kumulative, fordi tapet i § 34.1.2 annet ledd gjelder «krav på vederlagsjustering» generelt, og § 34.1.3 annet ledd viser til forhold etter § 34.1.1 og § 34.1.2. Den mildere virkningen i § 34.1.3 har fortsatt betydning: TE kan ha varslet i tide etter § 34.1.2 og for sent etter § 34.1.3, og ved endring gjelder ikke § 34.1.2. Prøvingen fant ingen strid med vedtakene. Kildene sparringen viste til, er ukontrollerte. I appen er én sak ett forhold. Velges A, må regelen i kjernen endres i økt B, fordi den i dag lar tapet ramme bare justeringen ellers. Anbefalt: «Hele kravet».

Første gang ble B2 stilt slik: Ved svikt og andre forhold byggherren har risikoen for, taper totalentreprenøren kravet på vederlagsjustering om varselet etter NS 8407 § 34.1.2 kommer for sent (annet ledd). Kravet om særskilt justering etter § 34.1.3 annet ledd gjelder utgifter som er en følge av forhold etter § 34.1.1 og § 34.1.2, og har sitt eget varsel med en mildere virkning: totalentreprenøren taper retten til å påberope seg påløpte utgifter som grunnlag for kravet (§ 34.1.3 tredje ledd, VS-U5). Etter vår lesning unntar ingen bestemmelse det særskilte kravet fra tapet etter § 34.1.2, og ingen sier uttrykkelig at det omfattes. VS-U3 sier at appen utleder virkningen etter § 34.1.2 og § 34.1.3, men ingen vedtak sier om påberopelsen etter § 34.1.2 også rammer det særskilte kravet. Rammer den det? Gjelder ikke ved endring, der § 34.1.2 ikke krever varsel (OV-U15). Anbefalt: «Hele kravet», fordi det særskilte kravet etter vår lesning er et krav på vederlagsjustering som følge av forholdet varselet etter § 34.1.2 gjelder.'''
valgt = "Hele kravet"
svar = '''
Første gang: «Vil diskutere dette med en annen LLM. Gi meg en prompt». Etter sparringen: «Hele kravet (Recommended)».'''
forhold = [{ art = "presiserer", vedtak = "vs-u3" }, { art = "presiserer", vedtak = "vs-u5" }]
folge = '''
Svarene er gitt med spørsmålsverktøyet 23.10. Spørsmålet og alternativene slik de ble stilt første gang, står ordrett på #1047 (kommentaren 6358659625), og slik de ble stilt etter sparringen i kommentaren 6359036599. Drøftelsen står i [ADR-002](../adr/002-saerskilt-krav-og-varsel-etter-34-1-2.md). Ikke bygget (#1047).'''

[[gruppe.vedtak.alternativ]]
navn = "Hele kravet"
tekst = '''
Gjør byggherren gjeldende at varselet etter § 34.1.2 kom for sent, gjelder påberopelsen hele vederlagskravet, også kravet om særskilt justering etter § 34.1.3 annet ledd. Påberopelsen er ett standpunkt for bestemmelsen (VS-U24). Har byggherren påberopt begge, er rekkefølgen: prinsipalt varselet etter § 34.1.2; subsidiært beløpet for justeringen ellers og beløpet byggherren godtar etter begrensningen etter § 34.1.3; videre subsidiært beløpet for det særskilte kravet om ingen av innsigelsene fører fram. Det VS-U5 kaller prinsipalt, står da subsidiært. For justeringen ellers gjelder bare påberopelsen etter § 34.1.2. Påberopelsen etter § 34.1.2 og den etter § 34.1.3 viser hver til sitt varsel, som kan stå i samme brev. Gjelder ikke ved endring, der § 34.1.2 ikke krever varsel (OV-U15). Appen avgjør ikke om varslene kom i tide (VS-U3). Presiserer VS-U3 og VS-U5. Strider ikke mot et vedtak.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Hele kravet, BH kan begrense"
tekst = '''
Som «Hele kravet», men byggherren kan i svaret si at påberopelsen etter § 34.1.2 bare gjelder justeringen ellers. Sier byggherren ikke det, gjelder den hele kravet. Gjelder den bare justeringen ellers, rammes det særskilte kravet bare av en påberopelse etter § 34.1.3 (VS-U5). Presiserer VS-U3 og VS-U5. Utvider VS-U24 og OV-U22: standpunktet etter § 34.1.2 får et valg av hvilke krav det gjelder, som er et nytt lagret felt (B-17).'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Bare justeringen ellers"
tekst = '''
Påberopelsen etter § 34.1.2 gjelder bare justeringen ellers. Kravet om særskilt justering etter § 34.1.3 annet ledd rammes bare av en påberopelse etter § 34.1.3, med virkningen i VS-U5. Presiserer VS-U3. Strider ikke mot et vedtak. B3 stilles da på nytt.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Hele kravet (første gang)"
tekst = '''
Gjør byggherren gjeldende at varselet etter § 34.1.2 kom for sent, gjelder påberopelsen hele vederlagskravet, også kravet om særskilt justering etter § 34.1.3 annet ledd. Byggherrens standpunkt til beløpet for det særskilte kravet, med en eventuell begrensning etter VS-U5, står da subsidiært. Har byggherren påberopt begge, er rekkefølgen: varselet etter § 34.1.2, deretter begrensningen etter § 34.1.3, deretter beløpet om ingen av innsigelsene fører fram. Appen avgjør ikke om varslene kom i tide (VS-U3). Presiserer VS-U3 og VS-U5. Strider ikke mot et vedtak.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Bare justeringen ellers (første gang)"
tekst = '''
Påberopelsen etter § 34.1.2 gjelder bare justeringen ellers. Kravet om særskilt justering etter § 34.1.3 annet ledd rammes bare av en påberopelse etter § 34.1.3, med virkningen i VS-U5. Presiserer VS-U3. Strider ikke mot et vedtak.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Byggherren angir det"
tekst = '''
Byggherren sier i svaret om påberopelsen etter § 34.1.2 også gjelder det særskilte kravet, og appen utleder virkningen etter det byggherren angir. Presiserer VS-U3. Utvider VS-U24 og OV-U22, som gir ett standpunkt per bestemmelse og per særskilt krav: standpunktet etter § 34.1.2 får i tillegg et valg av hvilke krav det gjelder.'''
forkastet = true

