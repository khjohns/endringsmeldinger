[[gruppe.vedtak]]
id = "VS-U27"
dato = 2026-10-19
hvem = "oppdragsgiver"
kilde = ["#909"]
sporsmal = '''
Spørsmålet ordrett slik det ble vist i spørsmålsverktøyet i runde 12:

Så lenge totalentreprenøren ikke har fremmet et krav med antall dager, kan byggherren be om et spesifisert krav om fristforlengelse (§ 33.6.2). Totalentreprenøren skal da enten angi og begrunne dagene, eller begrunne hvorfor grunnlaget for å beregne kravet ikke foreligger (bokstav b). Det er vedtatt at begrunnelsen er totalentreprenørens svar på forespørselen (VS-U17), at byggherren kan sende forespørselen fra appen (VS-U19), og at en forespørsel sendt utenfor appen i første versjon bare er dokumentasjon (VS-U23). Åpent er hva som gjelder når forespørselen er sendt utenfor appen og registrert: kan totalentreprenøren da sende begrunnelsen fra appen som svar? Anbefalt: nei, som for byggherrens endringsordre som viser til et registrert krav (OV-U12).

Alternativene slik de ble vist:

Bare forespørsel fra appen (Recommended): Totalentreprenøren kan sende begrunnelsen etter § 33.6.2 annet ledd bokstav b fra appen bare som svar på en forespørsel byggherren har sendt fra appen. Er forespørselen sendt utenfor appen og registrert som dokumentasjon (VS-U23, OV-U4), svarer totalentreprenøren utenfor appen og registrerer svaret som dokumentasjon, eller sender et krav med dager fra appen. Appen viser at forespørselen er registrert, og avgjør ikke om svaret kom i tide. Forhold: presiserer VS-U17 og VS-U23, i tråd med OV-U12.

Også til registrert forespørsel: Totalentreprenøren kan sende begrunnelsen etter § 33.6.2 annet ledd bokstav b fra appen også som svar på en forespørsel som er registrert som dokumentasjon. Begrunnelsen får serverens dato og vises ved forespørselen. Fordi forespørselen er dokumentasjon, utleder appen ingen virkning av begrunnelsen, heller ikke om byggherren senere gjør gjeldende at den kom for sent; den påberopelsen sendes utenfor appen og registreres (VS-U23). Forhold: presiserer VS-U17 og VS-U23; gjør unntak fra OV-U4 for et utsagn fra appen som viser til et registrert brev.

Utsett § 33.6.2: Byggherrens forespørsel etter § 33.6.2 og totalentreprenørens svar etter bokstav b bygges ikke i første versjon. Begge sendes utenfor appen og registreres etter OV-U4. Totalentreprenøren kan sende et krav med dager fra appen som før. Forhold: endrer OV-U1 ved å ta forespørselen etter § 33.6.2 ut av første versjon, og utsetter VS-U17 og VS-U19 i rekkefølgen, som OV-U7.'''
valgt = "Bare forespørsel fra appen"
svar = '''
«Bare forespørsel fra appen (Recommended)»'''
forhold = [{ art = "presiserer", vedtak = "vs-u17" }, { art = "presiserer", vedtak = "vs-u23" }]
folge = '''
Svaret er gitt med spørsmålsverktøyet og står på #909 (kommentaren 6275298641). Ikke bygget (#909).'''

