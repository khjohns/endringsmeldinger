[[gruppe.vedtak]]
id = "VS-U20"
dato = 2026-10-12
hvem = "oppdragsgiver"
kilde = ["#309", "#407"]
sporsmal = '''
Varselet etter § 33.4 og det spesifiserte kravet etter § 33.6.1 er to meldinger. Sender TE kravet med dager uten varsel først, er kravet også varselet. Byggherren kan påberope for sent varsel etter § 33.4, og da tapes kravet. Byggherren kan også påberope for sen spesifisering etter § 33.6.1, og da har TE bare krav på det byggherren måtte forstå. Begge kan påberopes samtidig. § 5 tredje ledd krever bare at det skjer skriftlig uten ugrunnet opphold. VS-U11: «et registrert svar som ikke sier noe om rettidigheten, leses med innsigelsen.» Byggherren har i tide påberopt at varselet kom for sent. TE sender senere en ny kravversjon, og byggherrens svar på den sier ikke noe om varselet. Står påberopelsen?

A: Har byggherren påberopt at TE varslet for sent etter § 33.4, gjelder påberopelsen varselet og står mot hver senere kravversjon i samme sak, også når varselet var selve kravet. Et senere svar som ikke sier noe om varselet, leses med påberopelsen. Appen leser den som oppgitt bare når byggherren uttrykkelig har sagt at varselet kom i tide. Om et senere brev etter en konkret tolkning innebærer at den er oppgitt, avgjør ikke appen (VS-U11).
Forhold: presiserer VS-U9 og VS-U11. Anbefalt.

B: Påberopelsen gjelder bare kravversjonen den ble gjort mot. Mot en senere kravversjon må byggherren gjenta den, og et senere svar som ikke sier noe om varselet, leses uten påberopelsen.
Forhold: strider mot VS-U11 og HF-U1, og er et forslag om å endre VS-U11.

Spørsmålet står i versjon 2 av spørsmålspakken for byggedel 2 på #309 (K3), og erstatter J1 i versjon 1.

Oppfølging, samme dag: Du svarte: «BH vil kunne naturligvis kunne velge å frafalle innsigelsen etter 33.4, ellers er A ok». Etter ordlyden dekker A ikke et uttrykkelig frafall som ikke sier «i tide». VS-U11 lar byggherren «gi opp sin egen innsigelse … uttrykkelig». Skal setningen endres slik?

Ja, ta med frafall: Setningen blir: «Appen leser den som oppgitt bare når byggherren uttrykkelig har frafalt påberopelsen eller sagt at varselet kom i tide (VS-U11).» Resten av A står. Presiserer VS-U9 og VS-U11.
Nei, A som den står: Et frafall er dekket av «uttrykkelig sagt at varselet kom i tide», slik VS-U11 og brevteksten i LV-U4 alt gjør.'''
valgt = "Ja, ta med frafall"
svar = '''
BH vil kunne naturligvis kunne velge å frafalle innsigelsen etter 33.4, ellers er A ok

Oppfølging: Ja, ta med frafall (Anbefalt)'''
forhold = [{ art = "presiserer", vedtak = "vs-u9" }, { art = "presiserer", vedtak = "vs-u11" }]
folge = '''
Ikke bygget'''

