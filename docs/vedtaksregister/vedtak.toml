Presisert 08.10 av [KA-U2](#ka-u2) (hvilke hendelser som er kravversjoner), og avgrenset
08.10 av [KA-U3](#ka-u3) (gjelder til saken er `OMFORENT`). Endret 09.10 av
[KA-U7](#ka-u7): i et spor med enighet avvises oppdateringen. Versjonstellingen var
bygget på vedtaksdatoen; virkningen på status og aksept er bygget 09.10 (SK-02). Vedtaket er snevret inn 25.10 av [OV-U54](#ov-u54).'''

