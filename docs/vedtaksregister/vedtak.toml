[[gruppe.vedtak]]
id = "GR-U19"
dato = 2026-10-16
hvem = "oppdragsgiver"
kilde = ["#538"]
sporsmal = '''
Skal TE kunne endre kategori på en ny grunnlagsversjon?

Dette er funnet:
- Det er drøftet én gang, i B-13 05.10 (#215). Der ble det vedtatt at en endret underkategori tillates, og svaret faller bort. Alternativet å avvise endringen ble forkastet fordi det «splitter historikken over to saker».
- Skifte av hovedkategori, for eksempel fra endring til svikt, er aldri drøftet.
- Dagens skjema for TE låser kategorien: «Kontraktsforhold, hjemmel og dato kan ikke endres». Bare kjernen og prøvesiden tillater fritt skifte.
- Rotet oppstår når en versjon går ut av eller inn i § 32.2. Da er det uklart hvilket varsel en innsigelse eller et «i tide» gjelder. Det samme gjelder et bytte fra irregulær endring til EO, som er under samme hovedkategori.
- NS 8407 verken hjemler eller forbyr at TE omklassifiserer. Om varselet holder under den nye kategorien, avgjør ikke appen (MM-U12).'''
valgt = "Lås hovedkategori"
svar = '''
Lås hovedkategori (Anbefalt)'''
forhold = [{ art = "snevrer inn", vedtak = "gr-u1" }]
folge = '''
Snevrer også inn raden i B-13 om endret underkategori (05.10, #215). Spørsmålet kom fra kontrollen av PR #535 før merge. Før spørsmålet ble stilt, spurte oppdragsgiver: «Vet du hva - er det noen god grunn til å la TE endre kategori? Er det drøftet i kode eller tidligere PR? Det skaper mye rot» (#538). Kontrollen 16.10 av om trekket er sperret ved enighet om grunnlaget (KA-U13) og når kravene er avgjort (KA-U11), står i en kommentar på #538. Bygget 16.10 i PR #549 (#538 og #520): en ny grunnlagsversjon med en annen hovedkategori avvises med regelkoden ANNEN_HOVEDKATEGORI, og en annen underkategori avvises med ANNEN_VARSLINGSPLIKT når § 32.2 ikke gjelder likt for den og for forrige versjon. En journal som alt har et skifte, leses som før (MM-U18). PROJEKSJONSVERSJON 18. Endret 16.10 av GR-U22, bygget i PR #588: regelkodene ANNEN_HOVEDKATEGORI og ANNEN_VARSLINGSPLIKT er erstattet av ANNEN_HJEMMEL.'''

[[gruppe.vedtak.alternativ]]
navn = "Lås hovedkategori"
tekst = '''
En ny grunnlagsversjon beholder hovedkategorien, og underkategorien kan bare endres når § 32.2 gjelder likt før og etter. Det stemmer med skjemaet og med B-13. Vil TE omklassifisere ut over det, trekker TE kravet og sender en ny sak. Det tidligere varselet og svaret står i den gamle saken. Snevrer inn B-13 og GR-U1. Skiftet ut og inn av § 32.2 kan da ikke skje, og #535 står uendret.'''

[[gruppe.vedtak.alternativ]]
navn = "Behold fritt skifte"
tekst = '''
Som B-13 og kjernen i dag. Det trengs et nytt vedtak om skiftet ut og inn av § 32.2: et standpunkt etter § 32.2 gjelder bare versjoner der § 32.2 gjelder, og ved skifte inn er den første versjonen i kategorien varselet. Det bygges sammen med #520. #535 står uendret.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Lås all kategori"
tekst = '''
Hverken hovedkategori eller underkategori kan endres, som i skjemaet. Opphever B-13 for endret underkategori. TE trekker og sender ny sak ved enhver omklassifisering.'''
forkastet = true

[[gruppe.vedtak]]
id = "GR-U20"
dato = 2026-10-16
hvem = "oppdragsgiver"
kilde = ["#510"]
sporsmal = '''
