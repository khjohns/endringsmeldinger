navn = "Bare forespørsel fra appen"
tekst = '''
Totalentreprenøren kan sende begrunnelsen etter § 33.6.2 annet ledd bokstav b fra appen bare som svar på en forespørsel byggherren har sendt fra appen. Er forespørselen sendt utenfor appen og registrert som dokumentasjon (VS-U23, OV-U4), svarer totalentreprenøren utenfor appen og registrerer svaret som dokumentasjon, eller sender et krav med dager fra appen. Appen viser at forespørselen er registrert, og avgjør ikke om svaret kom i tide. Forhold: presiserer VS-U17 og VS-U23, i tråd med OV-U12.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
