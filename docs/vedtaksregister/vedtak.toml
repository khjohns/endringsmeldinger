folge = '''
Presiserer også SK-02 og SK-03 og vedtaket 05.10 om at hver oppdatering er en ny kravversjon. Snevrer også inn raden i B-13 om endret underkategori, fordi et «i tide» ikke faller bort med svaret. KA-U7 og OV-U3 står som grensene. Følger av HF-U5 (bindingens varighet). Grunnlaget er vurderingen av vedtakene mot NS 8407 og avtaleloven (#504). Byggestatus er ikke vurdert. Bygget 15.10 i PR #518 (#498, del 1): et uttrykkelig «i tide» sendt fra appen sperrer «for sent» etter samme bestemmelse i hver senere grunnlagsversjon, også med endret underkategori (§ 32.2; regelkoden SAGT_I_TIDE og PROJEKSJONSVERSJON 16). Del 2 bygget 16.10 i PR #535 (#498): etter et slikt «i tide» avvises en innsigelse mot grunnlagskravet etter § 32.2 i hver grunnlagsversjon der § 32.2 gjelder kategorien (REGELVERSJON 16, PROJEKSJONSVERSJON 17).'''

[[gruppe.vedtak.alternativ]]
navn = "Ja"
tekst = '''
Byggherrens svar faller bort som tilbud når TE sender en ny kravversjon i sporet,
også med uendrede verdier. Den nye kravversjonen er TEs avslag på svaret og et nytt
tilbud (avtaleloven § 5 og § 6). I et spor uten enighet, og når kravene i saken
ikke er avgjort, venter sporet da på nytt svar (KA-U7, OV-U3). Et svar på en
tidligere kravversjon kan ikke godtas. Har byggherren satt en akseptfrist i svaret,
faller svaret bort når fristen er ute (avtaleloven § 2). En aksept etter fristen er
et nytt tilbud fra TE (avtaleloven § 4). Om rimelig tid etter avtaleloven § 3 er ute,
avgjør ikke appen (MM-U12). Et uttrykkelig standpunkt om at et varsel kom i tide,
eller et avkall, faller ikke bort med svaret (HF-U4, VS-U20, HF-U10).'''

