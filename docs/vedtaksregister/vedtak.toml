[[gruppe.vedtak]]
id = "MM-U34"
dato = 2026-10-28
hvem = "oppdragsgiver"
kilde = ["#1336", "#1338"]
sporsmal = '''
**Forslag til samlet tilslutning, versjon 4, runde 7 av #1338, 28.10: følgeendringene 1–26** ([versjon 4](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6467391758)). Følgeendringene til prinsippvedtaket MM-U33, «godtas samlet».

Grunnlaget i #1336, ordrett i kommentarene: [spørsmålene om U-5](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6465833511), [svaret på dem og den nye arbeidsflyten](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6466100876), [presiseringen](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6466386460), forslagene [versjon 1](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6466438405), [versjon 2](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6466861564), [versjon 3](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6467303875) og [versjon 4](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6467391758), og svarene på [versjon 1](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6466791055) og [versjon 2](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6467239558).

Følgeendringene i versjon 4, ordrett:

**Ny kravversjon og eldre svar**
1. **OV-U54 og LV-U4 «Ny versjon».** Gammel kjerne: en ny kravversjon er TEs avslag på byggherrens tilbud, og brevet sier det. Ny ordlyd i OV-U54: «Sender TE en ny kravversjon, sier brevet: ‹Dette kravet erstatter TEs tidligere kravversjon i brev <n> av <dato>.› Har byggherren svart på den tidligere versjonen, legger brevet til: ‹TEs standpunkt til BHs tidligere svar fremgår av begrunnelsen.› Skjemaet minner da TE på før sending: ‹Dersom BH tidligere har fremsatt et tilbud, bør du presisere om du aksepterer, avslår eller tar forbehold knyttet til dette.› Skjemaet sier også at svaret ikke kan godtas i løsningen når den nye versjonen er sendt. Det er en begrensning i løsningen. Løsningen avgjør ikke om svaret fortsatt binder byggherren (MM-U12). Tidligere brev bevares uendret. Teksten gjelder bare brev som sendes etter vedtaket (MM-U9).» Sperren mot en ny versjon som bare retter en opplysning, oppheves. Skjemaet anbefaler rettingen etter MM-U21.
2. **HF-U8.** Ny ordlyd: «Sender TE en ny kravversjon i sporet, også med uendrede verdier, venter sporet på nytt svar. Byggherrens svar på den tidligere versjonen kan da ikke godtas i løsningen (KA-U1). Det er en begrensning i løsningen. Løsningen sier ikke at svaret er avslått eller har falt bort, og avgjør ikke om byggherren fortsatt er bundet av svaret (MM-U12).»
3. **OV-U55, OV-U67, HF-U21.** I OV-U55 strykes «, og den avslår byggherrens tilbud i grunnlagssporet etter avslagsregelen». I OV-U67 punkt 2 blir «Eldre kravversjoner og svar er avslått (HF-U8) og omfattes ikke.» til «Eldre kravversjoner og svarene på dem omfattes ikke.» I HF-U21 strykes «Den er ikke et avslag på dem (avtaleloven § 5). Bindingen varer som etter HF-U5 og HF-U8.»

**Nye strukturerte standpunkter fram til endringsordren (svaret 1A)**
4. **HF-U5.** Vernet mot revisjon oppheves. Ny kjerne: «Byggherren kan sende et nytt strukturert svar, også med lavere beløp eller andre endringer. Tidligere brev bevares uendret. Løsningen avgjør ikke om endringen er rettslig virksom (MM-U12).» «Et svar som ikke stemmer med kravet, er avslag i forening med nytt tilbud (avtaleloven § 6)» blir «Et svar som ikke stemmer med kravet, er i løsningen ikke en godkjenning av kravet.»
5. **HF-U6.** «En senere hendelse fra samme part kan ikke ta tilbake eller svekke det parten har gitt motparten.» og setningene om unntak og vern strykes. Ny setning: «Løsningen avgjør ikke om parten er bundet av et tidligere utsagn (MM-U12).»
6. **HF-U4.** Sperren mot at byggherren senere påberoper at et varsel kom for sent etter å ha sagt at varselet kom i tide, oppheves. Løsningen viser det tidligere standpunktet sammen med påberopelsen, uten å trekke konklusjonen.
7. **GR-U17, GR-U20, GR-U23.** Sperrene mot at byggherren svarer med avslag etter et frafall etter § 32.3 c, oppheves. Løsningen viser frafallet sammen med det nye svaret, uten å trekke konklusjonen.
8. **HF-U22.** Gjelder ethvert nytt svar: «Senker byggherren i et nytt svar dager eller beløp byggherren har godkjent, viser løsningen det tidligere svaret og, for frist og enhetspriser, § 33.7 annet ledd eller § 34.3.3 annet ledd med frist og bestemmelse, uten å trekke konklusjonen (VS-U2).»
9. **KA-U7 oppheves.** Ny ordlyd: «En registrert enighet bevares og vises. Fram til endringsordren kan TE sende en ny kravversjon og byggherren et nytt svar også i et spor med registrert enighet. Visningen viser at det nye avviker fra den registrerte enigheten, og løsningen avgjør ikke om enigheten står (MM-U12).»
10. **HF-U9.** «Partene er enige om et standpunkt når …» blir «Løsningen registrerer enighet om et standpunkt når …». «Ingen part kan gå fra enigheten alene» og «En ny kravversjon eller en revisjon i et spor med enighet avvises, og et nytt krav om samme forhold går i en ny sak.» strykes. Tillegg: «Løsningen avgjør ikke om partene rettslig er enige (MM-U12).»
11. **GR-U7 og GR-U10.** Sperrene mot å revidere et godtatt svar og et svar som stemmer med kravet, oppheves: i GR-U7 «En enighet står: byggherren kan ikke revidere et godtatt svar (SK-03) …» og «Et slikt svar er låst for revisjon …», og i GR-U10 «og byggherren er bundet. Byggherren kan ikke revidere godkjenningen.» GR-U2 («et grunnlag byggherren har godkjent og som er låst, kan ikke endres») oppheves; at hovedkategori og underkategori står, følger av OV-U55. At en godkjenning av grunnlaget etter § 32.3 a er en endringsordre, står som kontraktens ordlyd. Saken lukkes bare av en endringsordre byggherren sender i en EO-sak. Om en godkjenning etter § 32.3 a også lukker saken, er spørsmål 3. KA-U3 er allerede opphevet (av HF-U9) og trenger ingen endring.
12. **KA-U11, OV-U3 og vedtakene som bygger på sperren (KA-U28, GR-U24, VS-U7, MM-U19).** Avhenger av spørsmål 2 for saker der TE har godtatt avslaget på grunnlaget eller trukket grunnlaget. For de andre sakene gjelder dette: «Kravene er avgjort» er et predikat som leses av utsagnene og relasjonene, og visningen viser det som opplysning («Alle fremsatte krav er avgjort»). Ingen regel leser det som etikett. Sperren mot trekk, ny kravversjon og revisjon når kravene er avgjort, oppheves, og sperren gjelder fra endringsordren er sendt (punkt 19). I KA-U28 strykes «En revisjon som endrer et standpunkt, avvises fortsatt (KA-U11)». GR-U24 oppheves. I VS-U7 blir «Er kravene avgjort, gjelder sperren i KA-U11.» til «Er saken lukket med endringsordre, gjelder sperren i EO-U3.» I MM-U19 gjelder regelen bare et brev som strider mot at saken er lukket med endringsordre. «Det som strider mot enigheten …, får ingen virkning på utfallet, enigheten står» blir «Løsningen avgjør ikke om brevet er virksomt (MM-U12).» «Saken er avsluttet» i KA-U6 og MM-U7 leses som «lukket med endringsordre».
13. **OV-U65, OV-U66 og OV-U68.** Sperren mot protest, innsigelse, bestridelse, påberopt passivitet og merking mot det en enighet omfatter, oppheves. I OV-U68 blir «inngår i enigheten og faller ikke bort (HF-U8)» til «bevares og vises med enigheten», og «En protest eller bestridelse mot standpunktet avvises.» strykes.
14. **HF-U10.** «Det avvises også der et vedtak sperrer det: når kravene er avgjort (OV-U3) …» blir «… når saken er lukket med endringsordre …». Resten står.
15. **Andre sperrer etter enighet og vern (følger av punkt 4 og 9).**
    - OV-U51: «Har byggherren i et utsagn sendt fra løsningen uttrykkelig sagt at varselet kom i tide, eller gitt opp innsigelsen, avvises en senere påberopelse …» strykes, som HF-U4 (punkt 6). «… i en revisjon som ellers er tillatt etter HF-U5, GR-U7 og OV-U3» blir «… i et nytt svar».
    - OV-U38: setningen om at TE etter en enighet om vederlagskravet «ikke kan sende et nytt beløp for posten i saken», strykes. Enigheten om posten bevares og vises.
    - KA-U27: «når en enighet trekket rammer» strykes. Sperren ved fradrag og ved et merket brev som ikke er avklart, står som en begrensning i løsningen, fordi løsningen da ikke vet hva byggherren har avtalt. KA-U30 står.
    - HF-U14: oppheves («En revisjon fra ‹aksepterer› til ‹aksepterer ikke› avvises …»).
    - FO-U7: blir «TEs valg om å forsere for de avslåtte dagene endrer ikke byggherrens svar i løsningen. Løsningen avgjør ikke om byggherren er bundet av de godkjente dagene (MM-U12).»
    - OV-U4 og OV-U7: «parten er bundet av det parten sender fra appen» blir «det parten sender fra appen, står som partens utsagn».

**Aksept og akseptfrist (svaret punkt 2)**
16. **Den strukturerte aksepten gjelder hele svaret (KA-U1, HF-U7, LV-U4 punkt 6, BF-03 D-1).** KA-U1 står: aksepten gjelder hele svaret byggherren har gitt på gjeldende kravversjon i sporet, og «Delvis enighet er ikke aksept» blir «Delvis enighet registreres ikke som aksept i løsningen». Tillegg i KA-U1: «En aksept av en del av svaret, for eksempel bare det subsidiære beløpet, sendes som innlegg. Avvisningen av en aksept av et eldre svar er en begrensning i løsningen. Den sier ikke at svaret er avslått eller har falt bort.» I HF-U7 strykes «Et subsidiært standpunkt er et betinget tilbud.», og «… er avslag i forening med nytt tilbud (avtaleloven § 6 første ledd)» blir «… er i løsningen ikke en godkjenning av kravet.» Aksepten erklærer ikke frafall av andre krav eller av innsigelser. Brevteksten «TE er enig i beløpet [antallet dager], men ikke i byggherrens standpunkt til grunnlaget.» blir «Aksepten gjelder ikke byggherrens standpunkt til grunnlaget.» D-1 i BF-03 blir: «Godtar TE svaret, gjelder aksepten hele svaret, også påberopelsen av at varselet kom for sent. Skjemaet sier uttrykkelig før sending at påberopelsen inngår i aksepten, og at beløpet etter svaret da er 0 kr. Løsningen registrerer enighet om svaret slik det står.» Løsningen legger ikke inn frafall av krav eller innsigelser ut over det TE uttrykkelig godkjenner.
17. **Akseptfristen: fristen står som opplysning, virkningene oppheves.** Byggherren kan fortsatt registrere en akseptfrist i svaret, og den vises (HF-U15 og HF-U16 står, unntatt setningen nedenfor). Oppheves: i HF-U16 «En aksept som appen registrerer senest den dagen, regner appen som i tide.»; HF-U17 (sperrene for å endre fristen og «Etter fristen binder svaret ikke byggherren i appen»); HF-U19 (byggherrens svar på TEs aksept etter fristen). HF-U18 blir: «Godtar TE svaret etter akseptfristen, sier brevet at aksepten er sendt etter akseptfristen <dato> i byggherrens svar. Løsningen avgjør ikke virkningen (MM-U12).» Setningene om akseptfristen i HF-U5 og HF-U8 går ut med punkt 2 og 4. I LV-U7 blir «Når bindingen inntrer og når en akseptfrist løper ut, regner appen fra sendingen av brevet» til «Akseptfristen vises med datoen, og appen viser leveringskvitteringen ved siden av». I MM-U24 strykes «eller en aksept etter fristen som venter på byggherren».
18. **Særskilte forslag oppheves:** OV-U49 D2 (forslag om vilkår) og forslaget om å rette betegnelsen i OV-U55. Slike forslag sendes som innlegg.

**Endringsordren (svaret 2B)**
19. **EO-U3.** Tillegg: «Når byggherren har sendt endringsordren, er hver KOE-sak den omfatter, lukket i arbeidsflyten, også når uenigheten består. Løsningen avviser da krav, svar, aksept og trekk i KOE-saken. Innlegg, dokumentasjon og innsigelser etter § 5 tredje ledd godtas. Visningen sier «Avsluttet med EO». Det betyr ikke at noe er rettslig avgjort, eller at TE har akseptert endringsordren. Er TE uenig, sender TE en ny KOE.» Sperren leser at endringsordren er sendt og omfatter saken, ikke etiketten.
20. **EO-U2, EO-U5, EO-U10, vilkåret i KA-U26 og «som oppgjort i EO-U5» i KA-U12 oppheves som vilkår for endringsordre.** Ny ordlyd: «Byggherren kan la en endringsordre omfatte én eller flere hele KOE-saker, også når løsningen ikke har registrert enighet. Skjemaet opplyser byggherren om hvilke spor i hvilke saker som ikke har registrert enighet. Bare en endringsordre byggherren sender uttrykkelig som endringsordre i en EO-sak, lukker saken (se spørsmål 3).»
21. **EO-U1.** «En omforent KOE-sak formaliseres ved å inngå i en EO-sak …» blir «En KOE-sak formaliseres ved å inngå i en EO-sak …». Tillegg: «TEs aksept eller bestridelse endrer ikke at KOE-saken er lukket.»
22. **EO-U6, EO-U7 og EO-U9 oppheves.** Endringsordren omfatter alltid hele KOE-saker. Sender byggherren en endringsordre i en EO-sak som svar på et grunnlagskrav, omfatter endringsordren hele KOE-saken og lukker den. Bare en slik uttrykkelig endringsordre lukker saken. I KA-U12 blir «kan byggherren svare ved å utstede en endringsordre i en EO-sak som viser til KOE-saken» til «… som omfatter KOE-saken». Om en godkjenning av grunnlaget etter § 32.3 a i KOE-saken lukker saken, er spørsmål 3. Grunnlagssvaret som lagres i KOE-saken (EO-U6), den senere endringsordren for vederlag og frist (EO-U7) og regelen for revisjon av en slik endringsordre (EO-U9) har ikke noe å gjelde. Revisjon følger EO-U4.
23. **EO-U8.** «… og endringsordren kan ikke ensidig endre det som er avtalt» blir «… og løsningen avgjør ikke om endringsordren endrer det som er avtalt (MM-U12).»

**Fritekst og forbehold**
24. **Innlegget i stedet for protest, utdyping og senere begrunnelse (OV-U64, VS-U9, MP-U6, LV-U4 punkt 8, OV-U55, KA-U34, MM-U7).** Brevet sier: ‹<Part> viser til brev <n> av <dato>:›, og teksten følger. OV-U64, regelen om hva en protest gjelder, og protestformene oppheves. TEs utdyping, byggherrens senere begrunnelse og bestridelsen av en opplysning blir innlegg.
25. **OV-U48.** Svarer byggherren ja på spørsmålet om godkjenningen er avhengig av andre vilkår eller forbehold, avvises sendingen ikke. Byggherren fører opp forbeholdene som egne punkter, og løsningen registrerer ikke at svaret stemmer med kravet, som i OV-U49 D1. For grunnlaget er et slikt svar da ikke en endringsordre i løsningen. Svarer byggherren nei, registrerer løsningen sammenfall ut fra valgene, og begrunnelsen vises med svaret og tolkes ikke.
26. **«Byggherren er bundet …» i tekstene.** I svarskjemaet strykes «Byggherren er bundet av svaret som sendes herfra.» og «… og svaret kan ikke revideres». Svaret på S-11 i BF-01 og D-4 i BF-03 faller bort med vernet.'''
valgt = "Ja"
svar = '''
Oppdragsgiver 28.10, ordrett ([tilslutningen](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6468129098)): «Ja, jeg godtar prinsippvedtaket og følgeendringene 1–26 i versjon 4 samlet, tilpasset mine svar 1B, 2A og 3A.

Dette omfatter også oppheving av sperrene i HF-U4, OV-U51, GR-U17, GR-U20 og GR-U23, og endringen i OV-U4 og OV-U7. Partene kan sende nye standpunkter. Tidligere erklæringer bevares, og løsningen avgjør ikke om endringene er rettslig virksomme.

Punkt 12 rettes: Visningen «Alle fremsatte krav er avgjort» erstattes med «Registrert enighet om alle fremsatte krav» der statusen bygger på sammenfall eller aksept. Løsningen skal ikke fremstille registrert enighet som en rettslig avgjørelse. Ved lukking vises den konkrete avslutningsårsaken.

Ingen øvrige følgeendringer strykes. Før vedtakene i én samlet vedtaks-PR og legg den frem før merge som foreslått.»

Svarene 1B, 2A og 3A står i [kommentaren før](https://github.com/khjohns/endringsmeldinger/issues/1336#issuecomment-6468031356) og er ført som EO-U11, GR-U27 og EO-U12.'''
