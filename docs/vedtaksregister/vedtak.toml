[[gruppe.vedtak]]
id = "MM-U27"
dato = 2026-10-17
hvem = "oppdragsgiver"
kilde = ["#568"]
sporsmal = '''
Spørsmålet «Feil rader», ordrett slik det ble vist i spørsmålsverktøyet:

Alle skrivinger går gjennom kommandoene. De avviser en påberopelse av «for sent» når samme part har sagt «i tide» fra appen (HF-U4), og en revisjon som senker noe byggherren har innrømmet (HF-U5). En rad som likevel finnes, kan bare komme fra en feil. I dag stopper saken bare for rader som strider mot vedtakene om enighet og lukking (MM-U18). Skal saken også stoppe for slike rader? Anbefalt: A, fordi en feilaktig rad da stopper saken i stedet for å gi virkning.

Alternativene slik de ble vist:

HF-U4 og HF-U5 (Recommended): Vedtakstekst: «En hendelse som ikke er et registrert brev, og som påberoper at et varsel, krav eller svar kom for sent etter en bestemmelse der samme part i et utsagn sendt fra appen uttrykkelig har sagt at det kom i tide eller gitt opp sin innsigelse mot det (HF-U4), gjør saken ikke forstått, som etter MM-U18. Det samme gjelder en revisjon som senker noe byggherren har innrømmet i et svar TE ikke har godtatt (HF-U5). Det er en kontroll av at dataene henger sammen, ikke en rettslig avgjørelse om gyldighet. Forkastet: at hendelsen leses med virkning.» Utvider MM-U18.

Bare HF-U4: Vedtakstekst: «En hendelse som ikke er et registrert brev, og som påberoper at et varsel, krav eller svar kom for sent etter en bestemmelse der samme part i et utsagn sendt fra appen uttrykkelig har sagt at det kom i tide eller gitt opp sin innsigelse mot det (HF-U4), gjør saken ikke forstått, som etter MM-U18. Forkastet: å utvide kontrollen til HF-U5.» Utvider MM-U18.

Bare i kommandoene: Vedtakstekst: «Kontrollen av HF-U4 og HF-U5 står bare i kommandoene. En hendelse utenfor kommandoene leses som før. Forkastet: å utvide MM-U18.» Strider ikke mot et vedtak.'''
valgt = "HF-U4 og HF-U5"
svar = '''
«HF-U4 og HF-U5 (Recommended)»'''
forhold = [{ art = "utvider", vedtak = "mm-u18" }]
folge = '''
Ikke bygget (#568). Bygget 18.10 i PR #775.'''

[[gruppe.vedtak.alternativ]]
navn = "HF-U4 og HF-U5"
tekst = '''
En hendelse som ikke er et registrert brev, og som påberoper at et varsel, krav eller svar kom for sent etter en bestemmelse der samme part i et utsagn sendt fra appen uttrykkelig har sagt at det kom i tide eller gitt opp sin innsigelse mot det (HF-U4), gjør saken ikke forstått, som etter MM-U18. Det samme gjelder en revisjon som senker noe byggherren har innrømmet i et svar TE ikke har godtatt (HF-U5). Det er en kontroll av at dataene henger sammen, ikke en rettslig avgjørelse om gyldighet. Forkastet: at hendelsen leses med virkning.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Bare HF-U4"
tekst = '''
En hendelse som ikke er et registrert brev, og som påberoper at et varsel, krav eller svar kom for sent etter en bestemmelse der samme part i et utsagn sendt fra appen uttrykkelig har sagt at det kom i tide eller gitt opp sin innsigelse mot det (HF-U4), gjør saken ikke forstått, som etter MM-U18. Forkastet: å utvide kontrollen til HF-U5.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Bare i kommandoene"
tekst = '''
Kontrollen av HF-U4 og HF-U5 står bare i kommandoene. En hendelse utenfor kommandoene leses som før. Forkastet: å utvide MM-U18.'''
forkastet = true

[[gruppe.vedtak]]
id = "MM-U28"
dato = 2026-10-20
hvem = "oppdragsgiver"
kilde = ["#1022"]
sporsmal = '''
Tallene. I dag viser lista «krevd» og «godkjent». «Godkjent» blander byggherrens svar med partenes enighet, og tallet fra byggherren kan være subsidiært. En enighet kan være betinget av ansvaret, virksom eller uten virkning. Eksempel: TE krever 1 000 000. BH avslår ansvaret, men godtar 600 000 subsidiært, og TE godtar beløpet. Hva skal lista vise for vederlag og frist?'''
valgt = "Krav, svar og enighet"
svar = '''
«Krav, svar og enighet»'''
forhold = [{ art = "presiserer", vedtak = "mm-u23" }]
folge = '''
Ikke bygget (#1029).'''

[[gruppe.vedtak.alternativ]]
navn = "Krav, svar og enighet"
tekst = '''
Lista viser TEs krav (beløp eller dager og kravets art, for eksempel tilbud), byggherrens svar (resultat og tall, merket når det er subsidiært) og enigheten (tallet, og om den er betinget, virksom eller uten virkning, merket som appens lesing). Eksempelet: «TE: 1 000 000 · BH: 600 000 subsidiært · Enige om beløpet. Etter appens lesing betinget av ansvaret». Nøkkeltallene summerer krav og virksom enighet hver for seg. Ukjent er ikke 0.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Krav og enighet"
tekst = '''
Lista viser TEs krav og det partene er enige om, med virkningen merket som appens lesing. Et svar fra byggherren som TE ikke har godtatt, står bare i saken. Presiserer MM-U23.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Krevd og godkjent som i dag"
tekst = '''
Lista viser TEs krav og byggherrens tall som «godkjent», også når tallet er subsidiært eller ikke godtatt. Strider mot MM-U23, fordi et subsidiært standpunkt er et avslag.'''
forkastet = true

[[gruppe.vedtak]]
id = "MM-U29"
dato = 2026-10-20
hvem = "oppdragsgiver"
kilde = ["#1022"]
sporsmal = '''
Arbeidslista. «Dette trenger din oppfølging» lager i dag oppgaver per side ut fra Pythons status, som «Vurder fristkravet» og «Ta stilling til BHs svar». MM-U24 (17.10): ved kravet står det som foreligger, altså et krav som venter på byggherrens svar, et svar TE ikke har godtatt (med akseptfristen) eller en aksept etter fristen som venter på byggherren. Appen sier ikke at en part har plikt, og å vise hvem som har neste trekk er forkastet. Kjernen kan i dag si at et krav venter på svar. Akseptfristen er ikke bygget. Hva skjer med arbeidslista ved overgangen til TS?'''
valgt = "Det som foreligger"
svar = '''
«Det som foreligger»'''
forhold = [{ art = "presiserer", vedtak = "mm-u24" }]
folge = '''
Ikke bygget (#1029).'''

[[gruppe.vedtak.alternativ]]
navn = "Det som foreligger"
tekst = '''
Arbeidslista viser kravene der noe foreligger etter MM-U24: for byggherren krav som venter på byggherrens svar, og for TE svar som TE ikke har godtatt. Teksten sier hva som foreligger, for eksempel «Kravet venter på byggherrens svar». Den sier ikke at parten har plikt eller neste trekk, og utvalget er en gruppe i visningen. Akseptfristen kommer når den bygges, og med den en aksept etter fristen.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Oppgaver som i dag"
tekst = '''
Arbeidslista gir oppgaver per side som i dag, for eksempel «Vurder fristkravet» og «Ta stilling til byggherrens svar». Endrer MM-U24, der det å vise hvem som har neste trekk ble forkastet.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Ute av omfanget nå"
tekst = '''
Arbeidslista vises ikke etter overgangen til TS før den leveres i et eget issue, og overgangen sier uttrykkelig at den er tatt ut. Følger OV-U1 («avvises og forenkles ikke»).'''
forkastet = true

[[gruppe.vedtak]]
id = "LV-U15"
dato = 2026-10-18
hvem = "oppdragsgiver"
kilde = ["runde 7 (#764)", "#818"]
sporsmal = '''
Hvem er byggherrens avsender av et svar som er godkjent internt?

Etter LV-U2 godkjenner avsenderen brevteksten, og journalen fører den som sendte. Når et svar går gjennom flere godkjennere, må det avgjøres hvem brevet og journalen viser som avsender.

A. Saksbehandleren: «Avsenderen er den som utarbeidet svaret. Den interne godkjenningen er ikke en del av brevet. Er svaret en endringsordre etter § 31.3, må avsenderen selv ha fullmakt til den.»
B. Den siste godkjenneren (anbefalt): «Avsenderen er den siste godkjenneren, som har fullmakt til svaret. Avsenderen godkjenner brevteksten (LV-U2). Den som utarbeidet svaret, og de andre godkjenningene står i godkjenningen, ikke i brevet.»
C. Saksbehandleren, med merknad: «Avsenderen er den som utarbeidet svaret, og brevet sier at svaret er godkjent av en person med fullmakt, uten å nevne hvem.»

Anbefaling: B.

Svaret var fritt: «To signaturer: saksbehandler og fullmaktshaver». Det passet ikke på et alternativ, og oppfølgingen er dette spørsmålet:

Du svarte «To signaturer: saksbehandler og fullmaktshaver» om avsenderen av et svar som er godkjent internt. Hvordan skal det leses for brevet og journalen?

«Fullmaktshaver er avsender (Recommended)»: «Brevet har to signaturer: den som utarbeidet svaret, og den som godkjente det med fullmakt til svaret. Avsenderen i journalen er den som har fullmakten; den som utarbeidet svaret, står i brevet som saksbehandler.»
«Saksbehandler er avsender»: «Brevet har to signaturer: den som utarbeidet svaret, og den som godkjente det med fullmakt til svaret. Avsenderen i journalen er den som utarbeidet svaret; den som har fullmakten, står i brevet som godkjenner.»
«Begge er avsendere»: «Brevet har to signaturer, og journalen fører begge som avsendere av brevet: den som utarbeidet svaret, og den som godkjente det med fullmakt til svaret.»

Belegg, ordrett fra vedtakene:
- LV-U2: «LV-U2: i et brev appen sender, godkjenner avsenderen brevteksten appen lager av brevets utsagn, og det er den teksten som fryses som brevet.»
- GR-U13: «GR-U13: byggherrens godkjenning av grunnlaget er en endringsordre etter § 32.3 første ledd a bare når også § 31.3 er oppfylt: endringsordren «skal være skriftlig og gi beskjed om at det kreves en endring, samt hva endringen går ut på», og den «må være gitt av byggherrens representant, jf. punkt 9, eller av en person med skriftlig fullmakt til å utstede slike».»'''
valgt = "Fullmaktshaver er avsender"
svar = '''
Q3: «To signaturer: saksbehandler og fullmaktshaver». Q3b: «Fullmaktshaver er avsender (Recommended)».'''
forhold = [{ art = "presiserer", vedtak = "lv-u2" }, { art = "presiserer", vedtak = "gr-u13" }]
folge = '''
Ikke bygget.'''

[[gruppe.vedtak.alternativ]]
navn = "Saksbehandleren"
tekst = '''
Avsenderen er den som utarbeidet svaret. Den interne godkjenningen er ikke en del av brevet. Er svaret en endringsordre etter § 31.3, må avsenderen selv ha fullmakt til den.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Den siste godkjenneren"
tekst = '''
Avsenderen er den siste godkjenneren, som har fullmakt til svaret. Avsenderen godkjenner brevteksten (LV-U2). Den som utarbeidet svaret, og de andre godkjenningene står i godkjenningen, ikke i brevet.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Saksbehandleren, med merknad"
tekst = '''
Avsenderen er den som utarbeidet svaret, og brevet sier at svaret er godkjent av en person med fullmakt, uten å nevne hvem.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Fullmaktshaver er avsender"
tekst = '''
Brevet har to signaturer: den som utarbeidet svaret, og den som godkjente det med fullmakt til svaret. Avsenderen i journalen er den som har fullmakten; den som utarbeidet svaret, står i brevet som saksbehandler.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Saksbehandler er avsender"
tekst = '''
Brevet har to signaturer: den som utarbeidet svaret, og den som godkjente det med fullmakt til svaret. Avsenderen i journalen er den som utarbeidet svaret; den som har fullmakten, står i brevet som godkjenner.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Begge er avsendere"
tekst = '''
Brevet har to signaturer, og journalen fører begge som avsendere av brevet: den som utarbeidet svaret, og den som godkjente det med fullmakt til svaret.'''
forkastet = true

[[gruppe.vedtak.sitat]]
kilde = "hovedplanen"
tekst = "LV-U2: i et brev appen sender, godkjenner avsenderen brevteksten appen lager av brevets utsagn, og det er den teksten som fryses som brevet."

[[gruppe.vedtak.sitat]]
kilde = "hovedplanen"
tekst = "GR-U13: byggherrens godkjenning av grunnlaget er en endringsordre etter § 32.3 første ledd a bare når også § 31.3 er oppfylt: endringsordren «skal være skriftlig og gi beskjed om at det kreves en endring, samt hva endringen går ut på», og den «må være gitt av byggherrens representant, jf. punkt 9, eller av en person med skriftlig fullmakt til å utstede slike»."

[[gruppe.vedtak]]
id = "LV-U16"
dato = 2026-10-20
hvem = "oppdragsgiver"
kilde = ["#1030"]
sporsmal = '''
Et brev er sendt når det er lagret, og appen regner bindingen og akseptfristen fra sendingen, uten å avgjøre når brevet er kommet fram (LV-U7). Leveringen til Catenda kan stanse fordi utfallet er usikkert eller Catenda avviser den. Usikkert utfall skal parkeres og varsles (invariant 7), men varslingen er ikke bygget, og den som leser saken, ser i dag «ikke levert ennå», som for en levering som er underveis. Leveringene i en sak venter ikke på hverandre utover ventingen på topicen (LV-U9), så et senere brev kan ligge i Catenda før et tidligere. Om å holde igjen handlinger har oppdragsgiver tidligere lagt vekt på at en tapt frist ikke kan repareres (merknaden til B-04, punkt 4). Hva skal gjelde når en levering stanser? Anbefaling: A.'''
valgt = "Vises, med veiledning"
svar = '''
«A. Vises, med veiledning (anbefalt)»'''
forhold = [{ art = "presiserer", vedtak = "lv-u7" }]
folge = '''
Ikke bygget.'''

[[gruppe.vedtak.alternativ]]
navn = "Vises, med veiledning"
tekst = '''
Når leveringen av et brev til Catenda er stanset fordi utfallet er usikkert eller Catenda har avvist den, ser den som leser saken, at leveringen er stanset, og drift varsles. Er brevet et varsel med frist, sier visningen at varselet bør sendes utenfor appen og registreres, uten at noe sperres. Appen avgjør ikke hva stansen betyr for når brevet er kommet fram (LV-U7). Leveringene i en sak venter ikke på hverandre utover ventingen på topicen (LV-U9), så et brev kan ligge i Catenda før et brev som ble sendt tidligere, og hvert brev viser når det ble sendt. Presiserer LV-U7 og invariant 7.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Vises, uten veiledning"
tekst = '''
Som A, men uten veiledningen om å sende varselet utenfor appen. Presiserer LV-U7 og invariant 7.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "I rekkefølge"
tekst = '''
Som B, men et brev leveres ikke til Catenda før de tidligere brevene i saken er levert. Et stanset brev holder igjen de senere til drift har løst det, også et varsel med frist. Bindingen og fristene regnes fortsatt fra sendingen (LV-U7). Utvider LV-U9.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Ingen nye brev"
tekst = '''
Som B, men så lenge en levering i saken er stanset, godtar appen ingen nye brev fra avsenderen i saken. Registrering etter OV-U4 godtas fortsatt. En ny sperre; utvider MM-U2 til en feil i leveringen.'''
forkastet = true

[[gruppe.vedtak]]
id = "LV-U17"
dato = 2026-10-20
hvem = "oppdragsgiver"
kilde = ["#1030"]
sporsmal = '''
Brevene, teksten og PDF-ene bevares i appens egen base, men vedleggene bare i Catenda: når Catenda har kvittert, sletter appen filen og beholder hash og frosset grunnlag, og brevet viser ID, filnavn og hash (P4, LV-U12, LV-U14). LV-U12 forkastet 18.10 å beholde filen til bevaringstiden er avgjort i B-05. Etter invariant 10 og AF-04 er hash alene ikke bevis, og etter akseptkriteriet i F4 skal en sak kunne legges fram uten at appen kjører. Hva Catenda garanterer av bevaring, er ikke kontrollert. Sparringen mener en sak må kunne leses uten appen og Catenda, med vedleggene. Hva skal eksporten av en sak omfatte? Anbefaling: A.'''
valgt = "Vedleggene med"
svar = '''
«A. Vedleggene med (anbefalt)»'''
folge = '''
Ikke bygget.'''

[[gruppe.vedtak.alternativ]]
navn = "Vedleggene med"
tekst = '''
Eksporten av en sak (F4) omfatter vedleggene, ikke bare hashen. B-05 avgjør hvor de bevares fram til eksporten, og til da gjelder LV-U12. Presiserer AF-04 og invariant 10.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
navn = "Egen kopi nå"
tekst = '''
Appen beholder en uforanderlig kopi av hvert vedlegg i egen lagring også etter at Catenda har kvittert, til bevaringstiden er avgjort i B-05. Endrer LV-U12 ved å godta det LV-U12 forkastet, og presiserer P4.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "Henvisning i eksporten"
tekst = '''
Eksporten viser til vedleggene i Catenda med ID, filnavn og hash, uten filene. P4 og LV-U12 står.'''
forkastet = true

[[gruppe.vedtak]]
id = "LV-U18"
dato = 2026-10-20
hvem = "oppdragsgiver"
kilde = ["#1095"]
sporsmal = '''
Overskriften slik den står i kommentaren på #1095 (Q2, brevtekstene etter § 33.6.2). Kommentaren har overskriften og alternativene, ingen spørsmålstekst. Det valgte alternativet står i kommentaren som «Ordlyd som § 33.4 (Recommended)», og etiketten i verktøyet var «Alle fire setningene (Recommended)».

Alternativene slik de står i kommentaren:

Ordlyd som § 33.4 (Recommended): Brevtekstene etter § 33.6.2 har denne ordlyden. Endret tekst gjelder bare nye brev (MM-U9). (1) Forespørselen: «Byggherren ber etter NS 8407 § 33.6.2 TE angi og begrunne det antall dager TE krever som fristforlengelse som følge av forholdet i sak <saksnummer> («<sakstittel>»). Svarer ikke TE, tapes kravet på fristforlengelse. Har TE ikke grunnlag for å beregne kravet, skal TE i stedet begrunne hvorfor grunnlaget ikke foreligger.» (2) Begrunnelsen: «TE svarer på byggherrens forespørsel etter NS 8407 § 33.6.2 i brev <n> av <dato> at grunnlaget for å beregne kravet ikke foreligger (§ 33.6.2 annet ledd b).», fulgt av TEs begrunnelse. (3) Et fristkrav som svarer på forespørselen: «Kravet er svar på byggherrens forespørsel etter NS 8407 § 33.6.2 i brev <n> av <dato>.» (4) Påberopelsen: «TEs svar på forespørselen etter NS 8407 § 33.6.2 i brev <n> av <dato> kom for sent», i formen i LV-U4 punkt 5 og 7. Forhold: utvider LV-U4, presiserer VS-U19.

Uten setning (3): Som over, men uten setning (3); kravet nevner ikke forespørselen, og appen kobler dem. Strider mot LV-U3 («Det som ikke står i teksten, regnes ikke som meddelt») og ville endre LV-U3.'''
valgt = "Alle fire setningene"
svar = '''
«Alle fire setningene (Recommended)»'''
forhold = [{ art = "utvider", vedtak = "lv-u4" }, { art = "presiserer", vedtak = "vs-u19" }]
folge = '''
Svaret er gitt med spørsmålsverktøyet og står på #1095 (kommentaren 6299502700). Ikke bygget (#1095).'''

