[[gruppe.vedtak]]
anker = "ka-u18"
vedtak = '''
KA-U18: et avslag av grunnlaget (§ 32.3 tredje ledd) som byggherren sender fra appen, må
ha en begrunnelse, mens et registrert brev kan stå uten. En begrunnelse som kommer
senere, er et eget utsagn. Appen vurderer ikke om begrunnelsen er tilstrekkelig eller
kom i tide. At teksten lagres, er vedtatt (B-13 om begrunnelsestekst, MM-U12).
Forkastet: at begrunnelsen alltid er valgfri'''
vedtatt = "10.10, oppdragsgiver (#309)"
folge = '''
At begrunnelsen står i samme brev som avslaget, er appens arbeidsflyt. Kontrakten krever
begrunnelse uten ugrunnet opphold etter avslaget (§ 32.3 tredje ledd), og en senere
begrunnelse registreres som eget utsagn. Presisert 10.10 av [KA-U21](#ka-u21): også
påberopt preklusjon etter § 32.2 med subsidiær godkjenning må begrunnes. Utvidet 11.10
av [KA-U24](#ka-u24) til alle spor og kategorier. Ikke bygget. Kravet til brevet og det
egne utsagnet hører til #309'''

[[gruppe.vedtak]]
anker = "ka-u21"
vedtak = '''
KA-U21: påberoper byggherren i et svar fra appen at TEs varsel etter § 32.2 kom for
sent, behandler appen det som et avslag etter § 32.3 tredje ledd, også når grunnlaget
godkjennes subsidiært, og svaret må ha en begrunnelse etter KA-U18. Det er
oppdragsgivers lesning av «avslått kravet», ikke en uttrykkelig regel i NS 8407.
Resultatverdien i skjemaet avgrenser ikke begrunnelsesplikten. Appen vurderer ikke om
begrunnelsen er tilstrekkelig eller kom i tide. En senere begrunnelse har ingen
automatisk virkning på utfallet i appen, uten at det betyr at den er uten rettslig
betydning. Forkastet: at bare standpunktet «avslått» krever begrunnelse'''
vedtatt = "10.10, oppdragsgiver etter sparring (#309)"
forhold = [{ art = "presiserer", vedtak = "ka-u18" }]
folge = '''
Presiserer [KA-U18](#ka-u18). Utvidet 11.10 av [KA-U24](#ka-u24) til alle spor og
kategorier. Ikke bygget (#309)'''

[[gruppe.vedtak]]
anker = "ka-u24"
vedtak = '''
KA-U24: et svar byggherren sender fra appen, må ha en begrunnelse når det har en
selvstendig innsigelse eller avgrensning som gjør svaret mindre gunstig for TE enn
kravet, i alle spor og alle kategorier. Det gjelder for eksempel avslag og delvis
godkjenning, «ingen hindring», påberopt preklusjon etter § 33.4 og § 34.1.2, påberopt
sen spesifisering etter § 33.6.1 (VS-U4) og begrensning etter § 34.1.3 (VS-U5), også når
kravet godkjennes subsidiært. En felles begrunnelse kan dekke flere standpunkter. Et
standpunkt som bare er subsidiært fordi grunnlaget er avslått, trenger ingen egen
begrunnelse. Et registrert brev kan stå uten. En begrunnelse som kommer senere, er et
eget utsagn. Appen kontrollerer at begrunnelsen finnes, ikke hva den dekker, om den er
tilstrekkelig eller om den kom i tide (KA-U19, MM-U12). Kravet er appens atferd: for
byggherrens svar i § 31–§ 35 krever NS 8407 begrunnelse bare i § 32.3 tredje ledd, og at
innsigelser tapes når de ikke fremsettes i tide (§ 33.7 annet ledd), gir ikke samme
plikt. Forkastet: begrunnelse bare der kontrakten krever det, og begrunnelse for frist
og vederlag, men ikke for grunnlaget utenfor § 32'''
vedtatt = "11.10, oppdragsgiver etter sparring (#309)"
