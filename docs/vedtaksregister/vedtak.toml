navn = "Gjelder i appen"
tekst = '''
Vedtaket gjelder lesing i appen. Appen legger brev og vedlegg i biblioteket og mappen prosjektets konfigurasjon skal angi. Hvem som leser dem i Catenda, styres av tilgangen prosjektet har satt på mappen.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
