sporsmal = '''
Spørsmål M1, «Malen og TE»: Brevmalen er byggherrens (Oslo kommunes), med logo og bunntekst for virksomheten. Appen lager brev fra begge parter, og etter K2 er appens brev byggherrens formular for varsler, krav og svar. Hvilket oppsett får totalentreprenørens brev? Anbefalt: A.'''
