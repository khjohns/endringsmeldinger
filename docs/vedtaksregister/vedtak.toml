[[gruppe.vedtak]]
anker = "vs-u3"
vedtak = '''
VS-U3: appen behandler bestemmelsene om varsler, svar og frister på tre måter. Appen
utleder virkningen av partens standpunkt etter § 32.2 og § 32.3 første ledd a–c, § 33.1,
§ 33.4 og § 33.6.1, valgretten i § 33.8, og § 34.1.2, § 34.1.3, § 34.2.2 og § 34.3.3
første ledd. Å utlede betyr å registrere standpunktet og vise virkningen på partens
premisser, ikke å fastslå at kravet er prekludert. Appen åpner for TEs valg etter §
33.8, men bekrefter ikke at valgretten finnes. Appen registrerer og viser utsagnet med
frist og bestemmelse for § 32.3 annet og tredje ledd, § 33.6.2 tredje ledd og § 33.7
annet ledd, 30 %-grensen i § 33.8, § 34.2.1 og § 34.3.3 annet ledd, og § 5 tredje ledd
og § 35.2. Det betyr uten automatisk utledning, ikke uten rettsvirkning. For § 35.2
viser appen både oppmann før overtakelsen og søksmålsfristen, uten dato. Appen vurderer
selv bare der det er vedtatt: om § 32.2 gjelder for kategorien, sammenlikningen av beløp
og dager, og § 33.6.2 fjerde ledd (KA-U4). Etter § 33.6.2 tredje ledd gjelder: påberoper
byggherren uttrykkelig at TE svarte for sent på forespørselen, utledes virkningen som
etter § 33.4, og svarer ikke TE, vises det bare (VS-U2). Hvordan appen behandler § 34.4,
avgjøres når § 30 er lest. Forkastet: å bare registrere og vise også § 33.6.1, § 34.1.2,
§ 34.1.3 og § 34.3.3 første ledd, som for § 34.1.2 og § 34.1.3 strider mot B-13 om
preklusjon'''
vedtatt = "10.10, oppdragsgiver etter sparring (#309)"
forhold = [{ art = "presiserer", vedtak = "vs-u2" }]
folge = '''
Presiserer [VS-U2](#vs-u2) for § 33.6.2 tredje ledd: påberoper byggherren uttrykkelig at
TE svarte for sent, utledes virkningen. I tråd med B-13 om preklusjon. Hvordan 30
%-grensen vises, står i [FO-U3](#fo-u3). § 34.4 og force majeure (§ 33.3) får egne rader
i paragrafmatrisen (#309). Gjennomført for § 32.3 annet ledd 10.10 av [VS-U12](#vs-u12),
og for § 33.3 første, tredje og femte ledd 11.10 av [VS-U13](#vs-u13) og
[KA-U23](#ka-u23). Annet og fjerde ledd står (#381). Ikke bygget. Kjernen hører til
#309, visningen til #313. Det vedtaket sier om § 32.3 annet ledd, bygges ikke i første versjon (OV-U7).'''

[[gruppe.vedtak]]
anker = "vs-u4"
vedtak = '''
VS-U4: påberoper parten som mottar kravet eller varselet, at kravet ble spesifisert for
sent etter § 33.6.1, eller at justering av enhetsprisene ble varslet for sent etter §
34.3.3 første ledd, oppgir hen prinsipalt det hen måtte forstå, og subsidiært det hen
godtar hvis spesifiseringen eller varselet kom i tide. Etter begge bestemmelsene har den
som er for sent, bare krav på det «den andre parten måtte forstå». Den andre parten er
byggherren når TE krever, og TE når byggherren krever justering etter § 34.3.3. Appen
regner ikke ut hva noen måtte forstå. Forkastet: å behandle det som preklusjon med
prinsipalt avslag, og ett tall der påberopelsen bare er en grunn'''
vedtatt = "10.10, oppdragsgiver etter sparring (#309)"
folge = '''
Utledes etter [VS-U3](#vs-u3). DRF-03 gjelder datoen for varselet etter § 34.3.3. Ikke
bygget (#309)'''

[[gruppe.vedtak]]
anker = "vs-u5"
vedtak = '''
VS-U5: påberoper byggherren at TEs særskilte varsel etter § 34.1.3 kom for sent, oppgir
byggherren prinsipalt det beløpet hen godtar etter begrensningen hen påberoper, som kan
være null, og subsidiært det beløpet hen godtar hvis innsigelsen ikke fører fram.
Byggherren begrunner avgrensningen. Appen avgjør ikke hvilke utgifter som er påløpt
eller rammet (§ 34.1.3 tredje ledd). Forkastet: at kravet er prinsipalt avslått med
subsidiært beløp'''
vedtatt = "10.10, oppdragsgiver etter sparring (#309)"
