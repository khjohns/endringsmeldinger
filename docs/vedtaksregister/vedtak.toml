[[gruppe.vedtak]]
id = "LV-U12"
dato = 2026-10-18
hvem = "oppdragsgiver"
kilde = ["#790"]
sporsmal = '''
Spørsmålet «Fil til levert», runde 6, ordrett slik det ble vist i spørsmålsverktøyet:

Vedlegg i TS-stien (#790), spørsmål 1. P4 lyder «vedlegg lagres bare i Catenda». Men LV-U1 fryser brev og vedlegg i leveringsoppdraget, LV-U9 lar leveringen vente til saken har topicen, og invariant 1, 5 og 8 krever at et vedlegg kontrolleres og holdes privat hos oss før det bindes til et brev. Filen må altså finnes hos oss før brevet registreres eller sendes. Python-stien mellomlagrer i dag og sletter når Catenda har kvittert; bevaringstiden er åpen (B-05). Gjelder «bare i Catenda» i P4 lagringen etter levering, slik at appen kan ha filen fram til Catenda har kvittert for den? Valget styrer om appen sletter innholdet etter levering, og om nedlasting etter levering går via Catenda.

Alternativene slik de ble vist:

Hos oss til levert (Recommended): Et vedlegg ligger hos appen fra det lastes opp til Catenda har kvittert for det. Det legges i Catenda bare av leveringen, etter at brevet det hører til, er registrert eller sendt, og saken har fått topicen. Når Catenda har kvittert, sletter appen filen og beholder hash og frosset grunnlag. Et vedlegg som aldri blir del av et brev, slettes av appen og når aldri Catenda. Bevaringstiden avgjøres i B-05. (Presiserer P4.)

Hos oss til bevaring avgjort: Som over, men appen beholder filen også etter at Catenda har kvittert, til bevaringstiden er avgjort i B-05. (Endrer P4 inntil B-05 er avgjort.)'''
valgt = "Hos oss til levert"
svar = '''
«Hos oss til levert (Recommended)»'''
folge = '''
Presiserer P4. Svaret er gitt med spørsmålsverktøyet og står på #764 (kommentaren 6251668902). Ikke bygget (#790).'''

[[gruppe.vedtak.alternativ]]
navn = "Hos oss til levert"
tekst = '''
Et vedlegg ligger hos appen fra det lastes opp til Catenda har kvittert for det. Det legges i Catenda bare av leveringen, etter at brevet det hører til, er registrert eller sendt, og saken har fått topicen. Når Catenda har kvittert, sletter appen filen og beholder hash og frosset grunnlag. Et vedlegg som aldri blir del av et brev, slettes av appen og når aldri Catenda. Bevaringstiden avgjøres i B-05.'''
anbefalt = true

[[gruppe.vedtak.alternativ]]
