[[gruppe.vedtak.alternativ]]
navn = "C"
tekst = '''
Setningen står som LV-U32 sier. Har byggherren skrevet en begrunnelse til en full godkjenning, regnes svaret ikke som sammenfall, og TE må godta det. Endrer GR-U7, GR-U10 og HF-U7 for svar fra løsningen, og strider mot KA-U16, KA-U19, KA-U26, GR-U8 og GR-U26, som da også må endres.'''
