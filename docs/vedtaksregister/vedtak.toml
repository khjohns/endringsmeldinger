sporsmal = '''
Spørsmål B1, «Beløp/post»: Totalentreprenøren kan kreve særskilt justering av vederlaget etter NS 8407 § 34.1.3 annet ledd for økte utgifter på grunn av nedsatt produktivitet eller forstyrrelser på annet arbeid, i samme vederlagskrav som justeringen ellers eller alene (OV-U23: «Byggherren tar stilling til de særskilte kravene som ellers.»). VS-U5 og OV-U22 sier at byggherren oppgir beløpene for det særskilte kravet når hen gjør gjeldende at varselet kom for sent, men ingen vedtak sier hvordan byggherren oppgir beløpet når hen ikke gjør det. Tar byggherren stilling til beløpet for hver post, eller til ett samlet beløp? Anbefalt: «For hver post», fordi postene har hvert sitt beløp i kravet og i TEs brev (LV-U30), og fordi påberopelsen etter OV-U22 uansett krever beløp for posten. Ingen av alternativene strider mot et vedtak.'''
valgt = "For hver post"
svar = '''
«For hver post (Recommended)»'''
forhold = [{ art = "presiserer", vedtak = "ov-u23" }, { art = "presiserer", vedtak = "vs-u5" }, { art = "presiserer", vedtak = "ov-u22" }]
