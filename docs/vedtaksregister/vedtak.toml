Endret 09.10 av [KA-U7](#ka-u7) for spor med enighet: der avvises en ny kravversjon, og
enigheten står. Presisert 08.10 av [KA-U1](#ka-u1): aksepten gjelder svaret på gjeldende
kravversjon. Hva som er en ny kravversjon, og et trukket krav: se de to radene under.
Bygget 09.10 for godkjent og godtatt svar (SK-02, SK-03 i 4.2); ikke bygget på
vedtaksdatoen'''

