[[gruppe.vedtak]]
id = "OV-U35"
dato = 2026-10-24
hvem = "oppdragsgiver"
kilde = ["#1267"]
sporsmal = '''
E. § 34.1.3, konsekvens
- Nå: «Ved for sen varsling kan retten til de særskilte kostnadspostene gå tapt. Rigg og drift samt produktivitetstap vurderes hver for seg.»
- Forslag: «Varsles kravet etter annet ledd for sent, taper totalentreprenøren retten til å påberope seg påløpte utgifter som grunnlag for kravet. Byggherren må påberope sen varsling skriftlig uten ugrunnet opphold (§ 5). Kravet etter første ledd har ingen særskilt varslingsplikt etter § 34.1.3.»
- Belegg: Tredje ledd annen setning, som B.2.16 lar stå. § 5 tredje ledd. OV-U25.
- Valg: Halvsetningen i OV-U25 om at byggherren ikke kan påberope sen varsling for rigg og drift er ikke tatt med. Uten avgrensning kan den leses som at varselet etter § 34.1.2 heller ikke gjelder rigg og drift, og det sier ikke vedtaket. B.2.16 har også egne formler for rigg og drift. De er ikke tatt med, fordi de er ny informasjon og ikke en retting.'''
valgt = "utelate den uavgrensede halvsetningen i OV-U25"
svar = '''
Ja til å utelate den uavgrensede halvsetningen i OV-U25. Formuleringen «Kravet etter første ledd har ingen særskilt varslingsplikt etter § 34.1.3» ivaretar poenget uten å antyde fritak fra § 34.1.2. Før dette som en språklig presisering av vedtaket.'''
forhold = [{ art = "presiserer", vedtak = "ov-u25" }]
folge = '''
Spørsmålet er punkt E i [forslaget på #1267](https://github.com/khjohns/endringsmeldinger/issues/1267#issuecomment-6388147840). Svaret står på #1267 ([kommentaren 6388243586](https://github.com/khjohns/endringsmeldinger/issues/1267#issuecomment-6388243586)). Vedtaket er bare avsnittet om OV-U25 i svaret. Presiseringene B–E for panelteksten er arbeidsvalg og står på #1267. Alternativet er ført med vedtaksteksten fra svaret.'''

[[gruppe.vedtak.alternativ]]
navn = "utelate den uavgrensede halvsetningen i OV-U25"
tekst = '''
I OV-U25 utgår halvsetningen «og byggherren kan ikke påberope at det er varslet for sent». Kravet etter første ledd har ingen særskilt varslingsplikt etter § 34.1.3. OV-U25 sier ikke noe om varslingsplikten etter § 34.1.2.'''

[[gruppe.vedtak]]
id = "OV-U36"
dato = 2026-10-24
hvem = "oppdragsgiver"
kilde = ["#1171"]
sporsmal = '''
Versjon 3 av spørsmålene i runde 46, punkt 1: Rigg og drift i uendret byggetid (#1171)

**Forholdet til andre vedtak.** Utvider KT-U8: KT-U8 nevner sluttoppgjøret, overtakelsen og tvisteløsningen, og A legger kompensasjonen for kontrakten samlet til det som føres utenfor appen. Snevrer inn OV-U23: der kan TE kreve begge de særskilte kravene etter § 34.1.3 i saken, med A bare rigg og drift i forlenget byggetid. Strider ikke mot et vedtak.'''
valgt = "versjon 3"
svar = '''
«Ja til versjon 3»'''
forhold = [{ art = "utvider", vedtak = "kt-u8" }, { art = "snevrer inn", vedtak = "ov-u23" }]
folge = '''
Spørsmålene er versjon 3 av runde 46, laget etter oppdragsgivers svar på versjon 2 («Øvrige spørsmål- se vurdering fra astra og vurder selv:») og den juridiske sparringen. Oppdragsgivers svar 24.10 gjelder hele versjon 3. Alternativet «versjon 3» er alternativ A i punkt 1. Begrunnelsen i versjon 3: Kompensasjonen avhenger av netto vederlagsjusteringer i hele kontrakten og av kontraktsverdien ved en dato som ligger etter de fleste sakene. Appen håndterer ikke den samlede kontraktsberegningen, og et krav for kontrakten samlet er utenfor endringssakene og ikke en del av første versjon. Bygges i #1171.'''

[[gruppe.vedtak.alternativ]]
navn = "versjon 3"
tekst = '''
Kompensasjonen for kapitalytelser, rigging, drift og nedrigging i uendret byggetid etter kontraktsgrunnlaget (Del II pkt. B.2.16) gjelder kontrakten samlet. Den regnes av netto vederlagsjusteringer i hele kontrakten og av kontraktsverdien ved den opprinnelige sluttfristen. Den kreves og besvares ikke gjennom appens endringssaker, men utenfor appen. At den føres utenfor appen, er en avgrensning av appen, ikke en regel om når eller hvordan TE kan fremme kravet. Ved kravet om rigg og drift i en sak viser appen at kompensasjonen i uendret byggetid gjelder kontrakten samlet og kreves utenfor appen. Appen sier ikke at TE må vente til sluttoppgjøret, og sier ikke at andre varslingsregler faller bort. Utvider KT-U8. Snevrer inn OV-U23 for kravet etter § 34.1.3 første ledd: i en sak kan TE bare kreve rigg og drift i forlenget byggetid.'''

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
TE kan kreve kompensasjon for rigg og drift i uendret byggetid i en endringssak, med beløpet TE oppgir. Appen avgjør ikke om terskelen er nådd, og regner ikke ut beløpet. Byggherren tar stilling til beløpet i svaret. Presiserer OV-U23.'''
forkastet = true
[[gruppe.vedtak]]
id = "OV-U37"
dato = 2026-10-24
hvem = "oppdragsgiver"
kilde = ["#1171"]
sporsmal = '''
Versjon 3 av spørsmålene i runde 46, punkt 2: Rigg og drift i forlenget byggetid: forholdet til fristkravet (#1171)

**Forholdet til andre vedtak.** A presiserer OV-U23 og utvider OV-U26 til første ledd (OV-U26 gjelder bare annet ledd). A følger VS-U3, KA-U7, HF-U9 og KA-U24. 2b-A presiserer KA-U7 og følger HF-U9: at full godkjenning gir enighet uten en handling fra TE, står alt i HF-U9 («eller når byggherrens svar stemmer med kravet») og HF-U7 (sammenligningen i kravets enhet, krone). Kjernen utleder enigheten per spor ved aksept eller sammenfall, og avviser en ny kravversjon i et spor med enighet. At «et nytt krav om samme forhold går i en ny sak», står i HF-U9. Opplysningen i skjemaet er et tillegg, ikke i strid med et vedtak: ingen vedtak sier hva skjemaet for kravet eller aksepten skal opplyse om bindingen, og MM-U23 («Appens egen vurdering vises bare der et vedtak krever det») er oppfylt fordi 2b-A er det vedtaket. Strider ikke mot et vedtak.'''
valgt = "versjon 3"
svar = '''
«Ja til versjon 3»'''
forhold = [{ art = "presiserer", vedtak = "ov-u23" }, { art = "utvider", vedtak = "ov-u26" }]
folge = '''
Spørsmålene er versjon 3 av runde 46, laget etter oppdragsgivers svar på versjon 2 («Øvrige spørsmål- se vurdering fra astra og vurder selv:») og den juridiske sparringen. Oppdragsgivers svar 24.10 gjelder hele versjon 3. Alternativet «versjon 3» er alternativ A i punkt 2. Underspørsmål 2b er ført som [OV-U38](#ov-u38). Bygges i #1171.'''

[[gruppe.vedtak.alternativ]]
navn = "versjon 3"
tekst = '''
Kravet om rigg og drift i forlenget byggetid etter kontraktsgrunnlaget er en post i vederlagskravet i saken. TE kan sende posten før forlengelsen er avtalt eller avgjort, med beløpet TE mener følger av den avtalte regelen ut fra forlengelsen TE legger til grunn. Appen viser forlengelsen og den nye overtakelsesdatoen som TEs premiss, ikke som avtalt. TE begrunner hvilken forlengelse posten gjelder, og hvordan den er avgrenset mot krav om rigg og drift i andre saker. Appen kontrollerer ikke overlapp mellom saker. TE kan sende en ny versjon av vederlagskravet når forlengelsen er avklart, så lenge partene ikke er enige om vederlagskravet (KA-U7, HF-U9). Byggherren tar stilling til beløpet for posten som for de andre postene. Mener byggherren at TE ikke har krav på fristforlengelse, ikke på så lang forlengelse, eller at forlengelsen alt er kompensert i en annen sak, sier hen det i begrunnelsen for svaret (KA-U24). Appen avgjør ikke om TE har krav på fristforlengelse, og krever ikke enighet om fristen før posten kan sendes eller besvares. Presiserer OV-U23. Utvider OV-U26 til kravet etter § 34.1.3 første ledd.'''

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
TE kan sende kravet om rigg og drift i forlenget byggetid i saken først når partene er enige om at TE har krav på fristforlengelse i saken. Det er de når TE har godtatt et svar der byggherren godkjenner fristkravet helt eller delvis. Et godtatt avslag gir ikke en slik enighet. Før det avvises posten, og TE kan sende kravet utenfor appen. Snevrer inn OV-U23. Utvider OV-U26 til kravet etter § 34.1.3 første ledd.'''
forkastet = true

