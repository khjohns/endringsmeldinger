[[gruppe.vedtak]]
id = "OV-U38"
dato = 2026-10-24
hvem = "oppdragsgiver"
kilde = ["#1171"]
sporsmal = '''
Versjon 3 av spørsmålene i runde 46, punkt 2, underspørsmål 2b: Rigg og drift i forlenget byggetid: forholdet til fristkravet (#1171)

**Forholdet til andre vedtak.** A presiserer OV-U23 og utvider OV-U26 til første ledd (OV-U26 gjelder bare annet ledd). A følger VS-U3, KA-U7, HF-U9 og KA-U24. 2b-A presiserer KA-U7 og følger HF-U9: at full godkjenning gir enighet uten en handling fra TE, står alt i HF-U9 («eller når byggherrens svar stemmer med kravet») og HF-U7 (sammenligningen i kravets enhet, krone). Kjernen utleder enigheten per spor ved aksept eller sammenfall, og avviser en ny kravversjon i et spor med enighet. At «et nytt krav om samme forhold går i en ny sak», står i HF-U9. Opplysningen i skjemaet er et tillegg, ikke i strid med et vedtak: ingen vedtak sier hva skjemaet for kravet eller aksepten skal opplyse om bindingen, og MM-U23 («Appens egen vurdering vises bare der et vedtak krever det») er oppfylt fordi 2b-A er det vedtaket. Strider ikke mot et vedtak.'''
valgt = "versjon 3"
svar = '''
«Ja til versjon 3»'''
forhold = [{ art = "presiserer", vedtak = "ka-u7" }]
folge = '''
Spørsmålene er versjon 3 av runde 46, laget etter oppdragsgivers svar på versjon 2 («Øvrige spørsmål- se vurdering fra astra og vurder selv:») og den juridiske sparringen. Oppdragsgivers svar 24.10 gjelder hele versjon 3. Alternativet «versjon 3» er 2b-A i punkt 2, med rettelsene i versjon 3. Underspørsmålet hører til [OV-U37](#ov-u37). Bygges i #1171.'''

[[gruppe.vedtak.alternativ]]
navn = "versjon 3"
tekst = '''
En enighet om vederlagskravet binder også posten for rigg og drift (KA-U7). Partene er enige om vederlagskravet også når byggherren godkjenner hele kravet, uten at TE godtar svaret (HF-U9). Har vederlagskravet en post for rigg og drift i forlenget byggetid, sier skjemaet for kravet før TE sender det, og skjemaet for aksepten før TE godtar et svar, at TE etter en enighet om vederlagskravet ikke kan sende et nytt beløp for posten i saken. Mener TE at en ytterligere forlengelse gir et krav som ikke omfattes av enigheten, kan TE fremme dette i en ny sak. Appen avgjør ikke om kravet er omfattet av den tidligere enigheten eller ellers er i behold. Byggherren tar stilling til det i svaret i den nye saken. Presiserer KA-U7.'''

[[gruppe.vedtak.alternativ]]
navn = "2b-B"
tekst = '''
Posten for rigg og drift kan revideres etter at partene er enige om vederlagskravet, når fristen i saken avklares senere. De andre postene står. Endrer KA-U7 og HF-U9 for posten.'''
forkastet = true

[[gruppe.vedtak.alternativ]]
navn = "2b-A slik det sto i versjon 2"
tekst = '''
En enighet om vederlagskravet binder også posten for rigg og drift (KA-U7). Før TE godtar et svar på vederlagskravet mens fristen i saken ikke er avklart, sier skjemaet for aksepten at TE da ikke kan sende et nytt beløp for posten i saken. Kravet faller ikke bort av det: rigg og drift for en forlengelse som ikke var lagt til grunn i posten, kan TE kreve i en ny sak, som et krav på nytt grunnlag (KA-U7, HF-U9). Appen avgjør ikke om enigheten i den første saken omfatter den forlengelsen; byggherren tar stilling til det i svaret i den nye saken. Presiserer KA-U7.'''
forkastet = true

