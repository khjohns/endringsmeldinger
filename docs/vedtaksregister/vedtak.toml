[[gruppe.vedtak]]
id = "OV-U66"
dato = 2026-10-27
hvem = "oppdragsgiver"
kilde = ["#1338"]
sporsmal = '''
**Samlet tilslutning 27.10: presiseringene av sperren etter enighet**

Grunnlag: kartleggingen av vedtakene sperren berører (subagent 27.10). Forslaget føres som egen post som presiserer posten med oppdragsgivers tekst, hvis oppdragsgiver slutter seg til det. Hvert punkt kan rettes for seg.

1. Påberopt passivitet og merking. Teksten nevner protest, innsigelse og bestridelse. Påberopt passivitet etter § 32.3 annet ledd (VS-U12) og merking av et registrert brev (KA-U20) er andre utsagn, som KA-U29 lar godtas etter et godtatt avslag av grunnlaget.
   Forslag: Sperren gjelder også påberopt passivitet og merking mot det enigheten omfatter. Snevrer inn KA-U29 og KA-U28.
   Forkastet hvis nei: Påberopt passivitet og merking følger KA-U29 også etter enighet.
2. Når sperren gjelder. En enighet om vederlag eller frist kan være betinget til grunnlaget er avklart (GR-U7), og den får ingen virkning hvis TE godtar avslaget av grunnlaget eller trekker kravet (KA-U6).
   Forslag: Sperren gjelder fra enigheten er inngått, også mens den er betinget. Får enigheten ingen virkning, gjelder de vanlige reglene for det den omfattet. En enighet ved sammenfall etter GR-U10 og HF-U9 er inngått.
3. Bestridelse av en opplysning (MM-U7). En opplysning, for eksempel at varselet ble mottatt en bestemt dag, er ikke et standpunkt i svaret.
   Forslag: Inngår et standpunkt om varslingen i enigheten, omfatter enigheten også opplysningene standpunktet bygger på, og en bestridelse av dem avvises. Andre opplysninger følger MM-U7.
4. Protest mot flere innsigelser i ett brev (MP-U6). En protest kan gjelde innsigelsene i et brev, der noen inngår i en enighet og andre ikke.
   Forslag: Protesten avvises i sin helhet, og meldingen sier hvilken innsigelse som inngår i enigheten. Parten kan sende en ny protest mot de andre.

Anbefalt: ja til alle fire. De følger prinsippet «du ikke kan protestere på noe som er avtalt» og KA-U1, KA-U7 og MM-U3. Punkt 4 velger en hel avvisning fordi løsningen ikke skal dele et sendt brev (MM-U12).'''
valgt = "Ja"
svar = '''
Oppdragsgiver 27.10, ordrett: «Ja til alle fire»'''
