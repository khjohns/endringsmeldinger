[[gruppe.vedtak.alternativ]]
navn = "Ja"
tekst = '''
Når fristkravet er det første varselet appen kjenner og TE har oppgitt at kravet ble sendt utenfor appen tidligere, tar byggherren også stilling til rettidigheten etter § 33.4 med den datoen som premiss. Skjemaet viser datoen TE oppgir, ved siden av datoen for brevet i appen. Opplysningen er ikke en registrering av et varsel etter § 33.4, og TE kan fortsatt oppgi datoen for et tidligere varsel.'''

