vedtak = '''
B-14: målformene for M2, M1, M4 og M5 legges til grunn med presiseringene 07.10; M3
følger grensene som endres. Modulær monolitt og serverautoritet beholdes. Domenetabell
og bevis-saker → smal kommando-/API-kontrakt → tidsbegrenset språkprøve → M2/M1 → M4 og
videre kontraktsarbeid'''
vedtatt = "07.10, oppdragsgiver etter review av PR #266 og #270"
