# Utkast til postene for samlevedtaket for vilkår og forbehold i byggherrens svar (#1534, steg 4,
# trinn 2). Fila er et utkast og slettes når postene er skrevet i vedtak.toml. Den leses ikke av
# noe verktøy.
#
# Oppskrift for økta som skriver postene, når svarene foreligger og vedtak.toml er ledig:
# 1. «etter» fylles med avsnittene «Forslaget» og «Endret innhold» fra vurderingsfila
#    (vurdering-samlevedtak-vilkaar-forbehold-2026-11-04.md), ordrett slik de ble lagt fram på
#    commiten der spørsmålene ble sendt, med punkt 3 og 7 etter svarene på spørsmål 1 og 2 og
#    rettelsene oppdragsgiver gir per punkt. Teksten legges til i «etter» i gruppen «Svar og
#    standpunkt», før den første [[gruppe.vedtak]] i gruppen.
# 2. De tre postene legges sist i den gruppen. ID-ene KA-U49, KA-U50 og KA-U51 er foreløpige: sjekk
#    den høyeste KA-ID-en på main når vedtak.toml er ledig, og bytt ID-ene og ankrene her og i
#    vurderingsfila.
# 3. Forholdene i KA-U49 følger tabellen «Postene i kjeden» i vurderingsfila. «Endrer» til KA-U20
#    og KA-U29 gjelder bare setningene E6 navngir. MM-U34 får «opphever» bare for delene orkestratoren
#    fordeler hit (avsnittet «Fordelingen» i vurderingsfila). OV-U80 og KA-U45 får ingen ny
#    tekst: E2 fjerner forholdene «Utvider OV-U48/OV-U49» og «Bygger på OV-U48/OV-U49» i
#    registeret. Er det en endring i en importert post, kontrolleres den mot svaret ordrett før
#    merge (vedtaksskillen).
# 4. KA-U50 er svaret på spørsmål 1, og KA-U51 svaret på spørsmål 2. Velger oppdragsgiver B,
#    byttes «valgt» og «forkastet», og forholdene byttes til dem i alternativ B.
# 5. Kjør docs/verktoy/vedtaksregister.py og vakttestene. Sitatene er fra vedtaksfila
#    (kilde = "hovedplanen", som i de andre postene).
# 6. Klassene er kontrollert uavhengig 04.11 (svar 8). Resultatet står i vurderingsfila under
#    «Prøvingen» og føres i #1534.

etter = '''
##### <a id="samlevedtak-vilkaar-forbehold"></a>Samlevedtaket for vilkår og forbehold i byggherrens svar (KA-U49)

Teksten under er samlevedtaket [KA-U49](#ka-u49), vedtatt <dato> av oppdragsgiver (#1534), ordrett
slik det ble lagt fram i [vurderingen](../vedtaksregister/vurdering-samlevedtak-vilkaar-forbehold-2026-11-04.md),
med «Endret innhold» E1–E7. Svarene på spørsmål 1 og 2 i vurderingen er [KA-U50](#ka-u50) og
[KA-U51](#ka-u51).

<Forslaget og Endret innhold, ordrett etter punkt 1 i oppskriften.>'''

[[gruppe.vedtak]]
klasse = "vedtak"
designdel = "avsnittet «Designdel» i samlevedtaket"
