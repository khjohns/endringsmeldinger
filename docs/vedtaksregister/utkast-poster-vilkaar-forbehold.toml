[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
Vilkår og forbehold byggherren knytter til svaret, skrives i svaret: i begrunnelsen for punktet de gjelder, eller under «Forbehold» når de gjelder hele svaret. Et innlegg kan uttrykke forbehold (MM-U33 steg 3), men endrer ikke svaret i løsningen, og løsningen avgjør ikke om et forbehold i et innlegg binder (MM-U12).'''

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
Vilkår og forbehold skrives i begrunnelsen for punktet, under «Forbehold» eller i et innlegg. Løsningen tolker ingen av dem.'''
forkastet = true

