sporsmal = '''
Spørsmål 3 ordrett slik det ble stilt i vurderingsfila, «Spørsmålene til oppdragsgiver».'''
valgt = "A"
svar = '''
<Oppdragsgivers svar, ordrett.>'''
forhold = [
  { art = "samler", vedtak = "ov-u69" },
  { art = "samler", vedtak = "ov-u72" },
  { art = "opphever", vedtak = "ka-u16" },
  { art = "samler", vedtak = "ka-u19" },
  { art = "samler", vedtak = "ka-u45" },
  { art = "endrer", vedtak = "ka-u20" },
  { art = "samler", vedtak = "ka-u27" },
  { art = "endrer", vedtak = "ka-u29" },
  { art = "samler", vedtak = "lv-u32" },
  { art = "opphever", vedtak = "mm-u34" },
  { art = "samler", vedtak = "ov-u46" },
]
folge = '''
Samler setningene om vilkår og forbehold i byggherrens svar. Tabellen «Postene i kjeden» i
vurderingen sier hvilke setninger hver post bidrar med. Forholdet til MM-U34 gjelder bare
delene i E5.'''

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
Forslaget i punkt 1–13 med designdelen og beslutningsdelen, og E1–E7, gjelder slik det står, med svarene på spørsmål 1 og 2 og rettelsene oppdragsgiver gir per punkt. De gamle ID-ene står som «Samlet i …» eller «Opphevet av …» etter tabellen «Postene i kjeden».'''

[[gruppe.vedtak.alternativ]]
