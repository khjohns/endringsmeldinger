forhold = [
  { art = "presiserer", vedtak = "ov-u61" },
  { art = "presiserer", vedtak = "ov-u69" },
]

[[gruppe.vedtak.alternativ]]
navn = "A"
tekst = '''
Et vilkår eller forbehold i begrunnelsen eller under «Forbehold» gjør ikke enigheten betinget i løsningen. Enigheten er betinget bare under forbeholdet for ubesvart grunnlag, og byggherrens svar på grunnlaget avgjør om den er betinget eller virksom.'''

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
Byggherren kan i svaret angi at godkjenningen er betinget av vilkårene i teksten. Enigheten vises og telles da som betinget, uten at løsningen tolker vilkårene.'''
forkastet = true

[[gruppe.vedtak.sitat]]
kilde = "hovedplanen"
tekst = "Betinget enighet vises særskilt."
