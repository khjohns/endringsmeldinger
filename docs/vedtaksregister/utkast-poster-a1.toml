Oppdragsgiver 04.11, ordrett ([svarene](https://github.com/khjohns/endringsmeldinger/issues/1497#issuecomment-6628951077)): «A-1 A, A-2 B, A-3 A»'''
forhold = [
  { art = "endrer", vedtak = "mm-u34" },
  { art = "presiserer", vedtak = "lv-u50" },
]
folge = '''
Endringen i MM-U34 gjelder punkt 1. Bygges i #1379.'''

