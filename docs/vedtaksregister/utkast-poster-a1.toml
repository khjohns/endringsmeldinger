# Posten for svaret S-1 C (#1497, runde 12 i #1065). Legges rett etter posten for A-1, i samme
# gruppe. <ID-C> byttes ut ved skrivingen (forslag: LV-U53). <ID> er posten for A-1 over, som
# bruker formen ‹brev <n> i sak KOE-17 av <dato>›, og som C derfor også endrer.
# Alternativene er ordrett, uten kursivmarkeringen rundt «Forhold: …». B var anbefalt, men er
# forkastet, og et anbefalt alternativ kan ikke være forkastet (README), så B har ikke
# `anbefalt`. Anbefalingen står i spørsmålet.

[[gruppe.vedtak]]
id = "<ID-C>"
dato = 2026-11-04
hvem = "oppdragsgiver"
kilde = ["#1497", "#1065"]
klasse = "vedtak"
sporsmal = '''
Spørsmål S-1, ordrett slik det ble stilt 04.11 i orkestreringsrunde 12 (#1065, PR #1570) og lagret i #1497 ([kommentaren 6629603578](https://github.com/khjohns/endringsmeldinger/issues/1497#issuecomment-6629603578)), med tillegget med alternativ C ([kommentaren 6629700535](https://github.com/khjohns/endringsmeldinger/issues/1497#issuecomment-6629700535)). Hvorfor spørsmålet ikke var avgjort, og prøvingen mot vedtaksfila, står i den første kommentaren. Alternativene står i posten.

**Skal et brev som viser til et tidligere brev i samme sak, nevne sakens kode?**

*Bakgrunn.* Etter LV-U44 får hver sak en kode, for eksempel KOE-17, og brevene i saken nummereres fortløpende. Hvert brev merkes i brevhodet og i dokumentnavnet med sakens kode og brevets nummer, for eksempel K201-KOE-17-03. Brevene viser ofte til et tidligere brev i samme sak, for eksempel kravet svaret gjelder, svaret en revisjon erstatter eller kravversjonen et trekk gjelder. Senere skal brev også vise til brev i andre saker, for eksempel når en endringsordre gjengir KOE-sakene den omfatter, eller når en ny KOE viser til endringsordren. Brevnummeret er bare entydig innenfor saken. Spørsmålet er om henvisningen innenfor samme sak skal nevne saken, slik at teksten blir ‹TEs krav i brev 2 i sak KOE-17 av 3. november 2026›, eller ikke, slik at den blir ‹TEs krav i brev 2 av 3. november 2026›.

*Anbefaling: B.*

*Hva valget styrer:*

- Formen på hver henvisning til et tidligere brev i brevene fra løsningen: kravet svaret gjelder, svaret en revisjon erstatter, kravversjonen i et trekk, varselet byggherren tar stilling til, opplysningen som rettes, og korrespondanse med avsenderens egen merking.
- Om løsningen må vite hvilken sak brevet det vises til, hører til (B), eller alltid skriver koden (A).
- Forventningene i testene for brevteksten i PR #1570.
- Forholdet som føres i registeret. Med A endrer det de eldre vedtakene. Med B snevrer det inn LV-U44 og LV-U45.

Tillegget: Oppdragsgiver spurte 04.11, ordrett: «Kan vi ikke gjennomgående i alle brev skrive noe ala "Byggherren viser til brev K201-KOE-17-03 av 5. oktober 2026."» Det passer ikke på A eller B, så det er lagt fram som et tredje alternativ, C.

Merknader:
- Merkingen har tre sifre i løpenummeret etter LV-U48: K201-KOE-017-03, ikke K201-KOE-17-03.
- Åpningssetningen «Byggherren viser til …» er et eget spørsmål om oppbyggingen av brevet (LV-U4, #1433) og hører ikke til S-1. S-1 gjelder bare formen på henvisningen.
- Prøvingen mot vedtaksfila er gjort av orkestratoren ut fra prøvingen av A og B over: C har samme motstrid med de eldre vedtakene som A, og forholdet «endrer» står derfor i alternativet. C har ingen dobbel saksangivelse, og samme prinsipp som LV-U45 («med merkingen som står på den»).'''
valgt = "C"
svar = '''
Oppdragsgiver 04.11, ordrett ([svaret](https://github.com/khjohns/endringsmeldinger/issues/1497#issuecomment-6629741684)): «C.»'''
forhold = [
  # FORHOLD-C
]
folge = '''
Bygges i #1570.'''

