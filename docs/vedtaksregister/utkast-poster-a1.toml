**A-1 (juridisk). Skal et brev med en ny kravversjon nevne brevet med byggherrens svar i setningen om TEs standpunkt?**

Bakgrunn: Når TE sender en ny kravversjon, sier brevet etter MM-U34 punkt 1 at TEs standpunkt til byggherrens tidligere svar fremgår av begrunnelsen, men setningen nevner ikke hvilket brev svaret sto i. Deres ref. i brevhodet viser koden for det samme svaret (LV-U50, LV-U51). Formen ‹brev <n> i sak KOE-17 av <dato>› for setningen om hvilken kravversjon som erstattes, følger alt av LV-U44 og er ikke en del av valget.

Anbefaling: A, fordi brevteksten og hodet da viser til de samme brevene. Styrer: den frosne teksten i en ny kravversjon, som bygges i #1379, ikke i A2. Teksten som sendes, får samme versjonssjekk før sending som Deres ref.'''
