sporsmal = '''
Spørsmålet ordrett slik det ble stilt 04.11 i [vurderingsfila](https://github.com/khjohns/endringsmeldinger/blob/fc44e37/docs/vedtaksregister/vurdering-samlevedtak-ikke-forstaatt-2026-11-04.md#spørsmålene-til-oppdragsgiver), spørsmål 2. Alternativene står under.

