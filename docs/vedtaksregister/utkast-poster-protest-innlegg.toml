# Utkast til postene for samlevedtaket for protest, bestridelse og innlegg, og sperren etter
# enighet (#1534, steg 4, trinn 2). Fila er et utkast og slettes når postene er skrevet i
# vedtak.toml. Den leses ikke av noe verktøy.
#
# Oppskrift for økta som skriver postene, når svarene foreligger og vedtak.toml er ledig:
# 1. «etter» fylles med avsnittene «Forslaget» og «Endret innhold» fra vurderingsfila
#    (vurdering-samlevedtak-protest-innlegg-2026-11-04.md), ordrett slik de ble lagt fram på
#    commiten der spørsmålene ble sendt, med punkt 1, 8 og 12 etter svarene på spørsmål 1 og 2
#    og rettelsene oppdragsgiver gir per punkt. Teksten legges til i «etter» i gruppen «Sendte
#    brev, regelendring og saker kjernen ikke forstår», etter teksten som står der.
# 2. De tre postene legges sist i den gruppen. ID-ene MM-U47, MM-U48 og MM-U49 er foreløpige.
#    MM-U43 og MM-U44 er tatt av #1572. Sjekk den høyeste MM-ID-en på main når vedtak.toml er
#    ledig, og bytt ID-ene og ankrene her og i vurderingsfila.
# 3. Forholdene i MM-U47 følger tabellen «Postene i kjeden» i vurderingsfila. «Endrer» til
#    KA-U29, MM-U34, OV-U7 og VS-U9 gjelder bare setningene E-punktene og fordelingen navngir.
#    Forholdene til OV-U67 og OV-U68 følger svaret på spørsmål 2: ved A «opphever», ved B
#    «samler» med endringen i E4.
# 4. MM-U48 er svaret på spørsmål 1, og MM-U49 svaret på spørsmål 2. Velger oppdragsgiver B,
#    byttes «valgt» og «forkastet», og forholdene byttes til dem i alternativ B.
# 5. Kjør docs/verktoy/vedtaksregister.py og vakttestene. Sitatene er fra vedtaksfila
#    (kilde = "hovedplanen", som i de andre postene).
# 6. Klassene er kontrollert uavhengig 04.11 (svar 8). Resultatet står i vurderingsfila under
#    «Prøvingen» og føres i #1534.
# 7. Berørt kode: ved E2 fjernes protestregelen i kjernen (`kanFaaProtest` i
#    kjerne/utledning/utled.ts). Ved spørsmål 1 A sier oppdraget til byggeøkta at kommandoene
#    for protest og bestridelse fjernes, ikke står utsatt (leveranseskillen).

