tekst = '''
En registrert enighet sperrer ikke innsigelse, protest, bestridelse eller påberopt passivitet, og løsningen avgjør ikke om de er rettslig virksomme mot enigheten (MM-U12). Innholdet i enigheten følger HF-U9 og KA-U10, og det TE godtar ved aksept, KA-U1.'''

[[gruppe.vedtak.alternativ]]
navn = "B"
tekst = '''
En registrert enighet sperrer ikke innsigelse, protest, bestridelse eller påberopt passivitet, og løsningen avgjør ikke om de er rettslig virksomme mot enigheten (MM-U12). En enighet omfatter det gjeldende kravet og det gjeldende svaret, med de standpunktene som står mot det gjeldende kravet, og varselet og opplysningene et standpunkt om varslingen bygger på. Eldre kravversjoner og svarene på dem omfattes ikke. Et varsel ingen av disse standpunktene gjelder, er ikke omfattet. Byggherrens uttrykkelige standpunkt i et tidligere svar om at varselet kom i tide, bevares og vises med enigheten. Kravversjonen standpunktet gjaldt, inngår ikke når den er en eldre kravversjon og TE etter svaret har registrert et eget varsel etter samme bestemmelse.'''
forkastet = true

