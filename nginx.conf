# Ruteren foran TS-serveren og Flask, bak én vert (#376, B18-01): sesjonskapselen
# `__Host-koe_session` er bundet til verten. Fila er en mal for nginx-bildet, som
# setter inn KOE_TS_SERVEREN og KOE_FLASK (vert:port) ved oppstart.
#
# Stiene til TS-serveren følger `tilTsServeren` i `server/ruting.ts`;
# `server/tester/ruter.test.ts` prøver at de to er like.

upstream ts_serveren {
    server ${KOE_TS_SERVEREN};
}

upstream flask {
    server ${KOE_FLASK};
}

# GET av prosjektene ligger i TS-serveren, resten av /api/projects i Flask.
map $request_method $prosjekter_hos {
    GET     ts_serveren;
    default flask;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Like store som grensen i Flask (MAX_CONTENT_LENGTH) og over vedleggsgrensen i TS.
    client_max_body_size 16m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overskrives, så klienten ikke kan velge adressen revisjonsloggen i Flask leser.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ^~ holder /api utenfor cachen for statiske filer under.
    location ^~ /api/ {
        location ~ ^/api/(kjerne|auth)(/|$) {
            proxy_pass http://ts_serveren;
        }
        location = /api/csrf-token {
            proxy_pass http://ts_serveren;
        }
        location ~ ^/api/projects(/[^/]+)?/?$ {
            proxy_pass http://$prosjekter_hos;
        }
        location ~ ^/api/projects/[^/]+/members(/|$) {
            proxy_pass http://ts_serveren;
        }
        location ~ ^/api/projects/[^/]+/saker$ {
            proxy_pass http://ts_serveren;
        }
        proxy_pass http://flask;
    }

    # Hemmeligheten står i stien, så forespørselen logges ikke (INT-01). Feilloggen
    # skriver forespørselslinjen ved 413 og feil mot TS-serveren, så den tar bare crit.
    location = /webhook/catenda {
        access_log off;
        error_log stderr crit;
        proxy_pass http://ts_serveren;
    }
    location ^~ /webhook/catenda/ {
        access_log off;
        error_log stderr crit;
        proxy_pass http://ts_serveren;
    }

    # SPA fallback — alle ruter til index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache statiske assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Helsejekk
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
