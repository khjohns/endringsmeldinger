# Ruteren foran TS-serveren, bak én vert (#376, B18-01): sesjonskapselen
# `__Host-koe_session` er bundet til verten. Fila er en mal for nginx-bildet, som
# setter inn KOE_TS_SERVEREN (vert:port) og NGINX_LOCAL_RESOLVERS ved oppstart.
#
# Hele /api og webhooken går til TS-serveren (#1026), som `tilTsServeren` i
# `server/ruting.ts`; `server/tester/ruter.test.ts` prøver at de to er like.

# Navnet slås opp igjen mens nginx kjører, så en ny adresse for TS-serveren når fram,
# og et navn som ikke løses ved start, stopper ikke nginx (#1082).
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

upstream ts_serveren {
    zone ts_serveren 64k;
    server ${KOE_TS_SERVEREN} resolve;
}

# Uten spørrestrengen, som har koden fra OAuth i tilbakekallene (#1082).
log_format uten_sporring '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log uten_sporring;

    # Over vedleggsgrensen i TS (STOERSTE_VEDLEGG).
    client_max_body_size 16m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overskrives, så klienten ikke kan velge adressen.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ^~ holder /api utenfor cachen for statiske filer under. En ukjent sti får 404
    # fra TS-serveren.
    location ^~ /api/ {
        proxy_pass http://ts_serveren;

        # Feilloggen skriver forespørselslinjen med koden ved feil mot TS-serveren.
        location ~ ^/api/auth/[^/]+/callback$ {
            error_log stderr crit;
            proxy_pass http://ts_serveren;
        }
    }

    # Hemmeligheten står i stien, så forespørselen logges ikke (INT-01). Feilloggen
    # skriver forespørselslinjen ved 413 og feil mot TS-serveren, så den tar bare crit.
    location = /webhook/catenda {
        access_log off;
        error_log stderr crit;
        proxy_pass http://ts_serveren;
    }
    location ^~ /webhook/catenda/ {
        access_log off;
        error_log stderr crit;
        proxy_pass http://ts_serveren;
    }

    # SPA fallback — alle ruter til index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache statiske assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Helsejekk
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
