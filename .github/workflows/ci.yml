# Driftskriptene i scripts/ er bevisst utelatt: seks av ni feiler i dag.
# Se masterplanen, «verifiserbar leveranseprosess».
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Installer avhengigheter
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      # Live-testene mot Supabase er opt-in med RUN_LIVE_SUPABASE=1 (RV-16).
      - name: Kjør testene
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider

      - name: Lint
        run: ruff check backend/

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    env:
      # husky hører til utviklermaskinen, ikke til CI.
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Kjør testene
        run: npm test

  statisk:
    name: Lint og typesjekk
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # --threshold error: de 9 advarslene gater ikke.
      - name: Typesjekk
        run: npm run check:error

      - name: Lint
        run: npm run lint
