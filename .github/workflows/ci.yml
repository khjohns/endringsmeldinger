# Driftskriptene i scripts/ er bevisst utelatt: seks av ni feiler i dag.
# Se AR-08 i hovedplanen.
name: CI

# #390: ikke ved push til main, der en PR alt er oppdatert mot main og grønn
# før merge, og ikke på utkast. Øktene arbeider i utkast med de lokale
# sjekkene og markerer PR-en klar når de er grønne.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Utkast og klare kjøringer har hver sin gruppe. En synchronize-hendelse som
# behandles etter ready_for_review og ser PR-en som utkast, hopper over jobbene
# og avbryter da ikke den reelle kjøringen (#785).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.pull_request.draft && 'utkast' || 'klar' }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      # Vedtaksregisteret (#413) sammenlikner 3.1 med main, som er forelderen
      # til flettecommiten.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Installer avhengigheter
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      # Live-testene mot Supabase er opt-in med RUN_LIVE_SUPABASE=1 (RV-16).
      - name: Kjør testene
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider

      - name: Lint
        run: ruff check backend/

  database:
    name: Database (PostgreSQL 17 + migrasjoner)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      KOE_TESTBASE_URL: postgresql://postgres:postgres@localhost:5432/koe_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer Node-avhengigheter
        run: npm ci
        env:
          HUSKY: 0

      # Ikke `services:`: den henter bildet fra én kilde før noe steg kjører,
      # og gir opp etter tre forsøk (#327).
      - name: Start testbasen
        run: scripts/ci/start_postgres.sh

      - name: Kontroller serverversjonen
        run: |
          versjon="$(psql "$KOE_TESTBASE_URL" --no-psqlrc -tAc 'SHOW server_version_num')"
          echo "server_version_num=$versjon"
          test "${versjon:0:2}" = "17"

      - name: Bygg basen fra tom
        run: scripts/testbase/bygg_testbase.sh

      # Kjernens lagringstester i sprakprove/kjernelagring/ leser journalen fra
      # PostgreSQL til de prøves gjennom server/ mot SQL Server (#932). Hele
      # sprakprove/, så en ny databasetest kommer med. Uten KOE_TESTBASE_URL
      # hoppes de over i frontend-jobben.
      - name: Kjør kjernen og språkprøven mot basen
        run: npx vitest run kjerne/ sprakprove/

  # Testbasen for datalaget i F0b (#488): SQL Server 2025 Developer Edition i
  # Docker, med basene i innstillingene fra Azure SQL Database. Hele server/, så
  # nye tester mot SQL Server kommer med, og skrivestien i sprakprove/skrivesti/
  # (#666), som går mot server/. Ingen av dem bruker PostgreSQL.
  sqlserver:
    name: SQL Server (testbasen for datalaget)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Start SQL Server
        run: |
          scripts/testbase/docker_sqlserver.sh start > /dev/null
          tilkobling="$(scripts/testbase/docker_sqlserver.sh tilkobling)"
          passord="${tilkobling#*Password=}"
          echo "::add-mask::${passord%%;*}"
          echo "KOE_SQLSERVER_TILKOBLING=$tilkobling" >> "$GITHUB_ENV"

      - name: Kjør TS-serverens tester mot SQL Server
        run: npx vitest run server/ sprakprove/

  frontend:
    name: Frontend (vitest)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      # husky hører til utviklermaskinen, ikke til CI.
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Kjør testene
        run: npm test

  statisk:
    name: Lint og typesjekk
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # --threshold error: de 9 advarslene gater ikke.
      - name: Typesjekk
        run: npm run check:error

      # svelte-check ser ikke kjerne/, server/ eller sprakprove/, som har egne tsconfig.
      - name: Typesjekk av kjernen
        run: npx tsc -p kjerne/tsconfig.json

      # #430: en endret linje stopper ellers feilinnføringene først om natta eller på etiketten.
      - name: Ankrene i feilinnføringene
        run: node kjerne/tester/feilinnfoering.ts --ankre

      - name: Typesjekk av TS-serveren
        run: npx tsc -p server/tsconfig.json

      - name: Typesjekk av språkprøven
        run: npx tsc -p sprakprove/tsconfig.json

      - name: Typesjekk av skrivestien i språkprøven
        run: npx tsc -p sprakprove/skrivesti/tsconfig.json

      # #602, #752: lenkekontrollen er stdlib-Python uten avhengigheter.
      # Omfanget står i docstringen i docs/verktoy/lenkekontroll.py.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lenker i Markdown
        run: python3 docs/verktoy/lenkekontroll.py

      - name: Lint
        run: npm run lint

  # #269 punkt 3, avgjort 17.10: høy eller kritisk sårbarhet med rettet versjon
  # i kjøretidsavhengighetene i TS blokkerer, med unntak i
  # scripts/ci/avhengighetsunntak.toml. Utviklingsavhengighetene og Python
  # rapporteres bare (DL-U2). Skanningen leser bare låsefilene, så npm ci trengs ikke.
  avhengigheter:
    name: Avhengighetsskanning
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kjøretidsavhengighetene i TS
        run: |
          set +e
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit.json"
          set -e
          python3 scripts/ci/skann_avhengigheter.py < "$RUNNER_TEMP/npm-audit.json"

      - name: Utviklingsavhengighetene i TS (bare rapport)
        continue-on-error: true
        run: npm audit --include=dev --audit-level=high

      - name: Python (bare rapport)
        continue-on-error: true
        run: |
          python -m pip install --quiet pip-audit==2.9.0
          pip-audit --requirement backend/requirements.txt --requirement backend/requirements-dev.txt --progress-spinner off
