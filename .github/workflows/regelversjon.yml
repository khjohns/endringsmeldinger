# B-13 (hovedplanen 3.1, 24.09) og #191: endres reglene i src/lib/domain/ eller
# backend/regler/, må REGELVERSJON økes i begge speilene. Kontrollen står i
# .github/scripts/regelversjon.sh, som også kan kjøres lokalt med BASE=<sha>.
name: Regelversjon

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: regelversjon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regelversjon:
    name: Regelversjon økt ved endring i src/lib/domain eller backend/regler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kontroller regelversjonen
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/regelversjon.sh
