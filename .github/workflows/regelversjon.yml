# B-13 (hovedplanen 3.1, 24.09) og #191: endres reglene i src/lib/domain/ eller
# backend/regler/, må REGELVERSJON økes i begge speilene. B-14 og #308: endres
# kjerne/, må regelversjonen eller projeksjonsversjonen i kjernen økes, og
# begge for kjerne/frosset/ (#330, #309).
# Kontrollen står i .github/scripts/regelversjon.sh, som også kan kjøres
# lokalt med BASE=<sha>.
#
# På en PR er BASE tuppen av basegrenen når jobben kjører, ikke basen fra
# hendelsen (#870): to PR-er som øker samme versjon, blir hver for seg grønne
# mot basen de ble laget fra, men den som kjøres etter at den første er merget,
# blir rød. PR-en flettes derfor inn i den tuppen før kontrollen, så også en
# ny kjøring av en gammel hendelse ser basen slik den er. GitHub kjører ikke
# PR-en på nytt når basen flytter seg, så vakten kjøres også ved hver push til
# main, mot tuppen før pushen.
name: Regelversjon

# Ikke på utkast (#390), som ci.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # På main har hver push sin egen gruppe: en kjøring som venter, ville ellers
  # blitt avbrutt av den neste, og den mergen ble ikke kontrollert.
  group: regelversjon-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regelversjon:
    name: Regelversjon økt ved endring i src/lib/domain, backend/regler eller kjerne
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kontroller regelversjonen
        env:
          BASEGREN: ${{ github.base_ref }}
          FOER_PUSH: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            BASE=$FOER_PUSH
          else
            BASE=$(git rev-parse "origin/$BASEGREN")
            PR=$(git rev-parse HEAD^2)
            git checkout -q --detach "$BASE"
            git -c user.name=regelversjon -c user.email=regelversjon@localhost \
              merge -q --no-edit "$PR" || { echo "::error::PR-en kan ikke flettes inn i $BASEGREN. Oppdater den mot $BASEGREN; feilen gjelder ikke versjonene."; exit 1; }
          fi
          echo "BASE=$BASE"
          BASE=$BASE .github/scripts/regelversjon.sh
