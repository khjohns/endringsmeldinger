# #348: feilinnføringene for kjernen (kjerne/tester/feilinnfoering.ts). Jobben
# er rød når en mutasjon ikke oppdages, når kontrollkjøringen uten mutasjon ikke
# er grønn, eller når arbeidskopien ikke er ren etterpå. Én vitest-kjøring per
# mutasjon, fordelt på tre jobber og i hver jobb på like mange arbeidskopier med
# hver sin testbase som runneren har prosessorer (#378). Den tar fortsatt lang
# tid, så den holdes utenfor ci.yml.
#
# Kjøres (arbeidsvalget 10.10 i #348, minuttbudsjettet på GitHub Free):
# - nattlig, men bare når noe under STIER er endret siden forrige vellykkede
#   kjøring på samme gren; ellers avsluttes den grønt uten å bygge basen;
# - ved manuell start, alltid, eller som den nattlige med `som_planlagt`;
# - på en PR bare når den har etiketten `feilinnfoering`.
name: Feilinnføring

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      som_planlagt:
        description: Kjør som den nattlige (avslutt når ingenting er endret)
        type: boolean
        default: false
  pull_request:
    # Ikke `opened`: en PR som opprettes med etiketten, får også `labeled`.
    types: [synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  endret:
    name: Endret siden forrige vellykkede kjøring
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.state == 'open' &&
       ((github.event.action == 'labeled' && github.event.label.name == 'feilinnfoering') ||
        (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'feilinnfoering'))))
    runs-on: ubuntu-latest
    # Egen gruppe, så en nyere push på PR-en avbryter også denne, og en eldre
    # kjøring ikke kan stille seg bak den nyere i gruppen til feilinnfoering.
    concurrency:
      group: feilinnfoering-endret-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: read
    outputs:
      kjoer: ${{ steps.sammenlikn.outputs.kjoer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Det kjernetestene, lagringstestene og testbasen leser, og verktøykjeden.
      - name: Sammenlikn med forrige vellykkede kjøring
        id: sammenlikn
        env:
          GH_TOKEN: ${{ github.token }}
          PLANLAGT: ${{ github.event_name == 'schedule' || inputs.som_planlagt == true }}
          STIER: >-
            kjerne
            sprakprove/kjernelagring
            sprakprove/server
            server
            sprakprove/kjerne
            sprakprove/tester/testbase.ts
            docs/domenetabell
            docs/datamodell/kjernehendelser.toml
            supabase/migrations
            scripts/testbase
            .github/workflows/feilinnfoering.yml
            package.json
            package-lock.json
            vite.config.ts
            src/test-setup.ts
            svelte.config.js
            tsconfig.json
        run: |
          if [ "$PLANLAGT" != true ]; then
            echo "kjoer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          forrige="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/feilinnfoering.yml/runs?branch=$GITHUB_REF_NAME&status=success&per_page=50" \
            --jq '[.workflow_runs[] | select(.event != "pull_request")][0].head_sha // ""')" ||
            { echo "::warning::Fant ikke forrige vellykkede kjøring; kjører fullt."; forrige=""; }
          echo "Forrige vellykkede kjøring på $GITHUB_REF_NAME: ${forrige:-ingen}"
          if [ -z "$forrige" ] || ! git cat-file -e "$forrige^{commit}" 2>/dev/null; then
            echo "kjoer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # shellcheck disable=SC2086
          endringer="$(git diff --name-only "$forrige" HEAD -- $STIER)"
          echo "${endringer:-Ingen endringer under stiene.}"
          if [ -n "$endringer" ]; then
            echo "kjoer=true" >> "$GITHUB_OUTPUT"
          else
            echo "kjoer=false" >> "$GITHUB_OUTPUT"
          fi

  feilinnfoering:
    name: Feilinnføringene for kjernen (del ${{ matrix.del }} av 3)
    needs: endret
    if: needs.endret.outputs.kjoer == 'true'
    # Skriptet fordeler mutasjonene på delene etter rekkefølgen, så en ny
    # mutasjon trenger ingen endring her.
    strategy:
      fail-fast: false
      matrix:
        del: [1, 2, 3]
    # På jobben, ikke workflowen: en PR-hendelse som hoppes over (en annen
    # etikett), skal ikke avbryte en kjøring som går. Én gruppe per del, ellers
    # venter delene på hverandre.
    concurrency:
      group: feilinnfoering-${{ github.event_name }}-${{ github.ref }}-${{ matrix.del }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        # Som databasejobben i ci.yml.
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KOE_TESTBASE_URL: postgresql://postgres:postgres@localhost:5432/koe_test
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Kontroller serverversjonen
        run: |
          versjon="$(psql "$KOE_TESTBASE_URL" --no-psqlrc -tAc 'SHOW server_version_num')"
          echo "server_version_num=$versjon"
          test "${versjon:0:2}" = "17"

      - name: Bygg basen fra tom
        run: scripts/testbase/bygg_testbase.sh

      - name: Kjør feilinnføringene
        id: feilinnfoering
        env:
          FEILINNFOERING_DEL: ${{ matrix.del }}/3
        run: |
          echo "Prosessorer: $(nproc)"
          node kjerne/tester/feilinnfoering.ts

      # Skriptet muterer bare kopier utenfor treet (#378). Kontrollen fanger et
      # skript som likevel skriver i treet.
      - name: Kontroller at arbeidskopien er ren
        if: always() && steps.feilinnfoering.outcome != 'skipped'
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
