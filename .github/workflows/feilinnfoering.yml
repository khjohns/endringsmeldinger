# #348: feilinnføringene for kjernen (kjerne/tester/feilinnfoering.ts). Jobben
# er rød når en mutasjon ikke oppdages, når kontrollkjøringen uten mutasjon ikke
# er grønn, eller når arbeidskopien ikke er ren etterpå. Én vitest-kjøring per
# mutasjon, fordelt på seks jobber og i hver jobb på like mange arbeidskopier som
# runneren har prosessorer (#378). Kopiene deler SQL Server-serveren, og
# lagringstestene lager hver sin base fra malen (#932). På en PR kjører hver
# mutasjon bare filene med målene sine, og den nattlige kjøringen hele samlingen
# (oppdragsgiver 19.10, #934). Den tar fortsatt lang tid, så den holdes utenfor ci.yml.
# Repoet er offentlig, så standardrunnerne koster ingen minutter; vilkårene under
# holder køen kort.
#
# Kjøres (arbeidsvalget 10.10 i #348):
# - nattlig, men bare når noe under STIER er endret siden forrige vellykkede
#   kjøring på samme gren; ellers avsluttes den grønt uten å bygge basen;
# - ved manuell start, alltid, eller som den nattlige med `som_planlagt`;
# - på en PR bare når den har etiketten `feilinnfoering`.
name: Feilinnføring

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      som_planlagt:
        description: Kjør som den nattlige (avslutt når ingenting er endret)
        type: boolean
        default: false
  pull_request:
    # Ikke `opened`: en PR som opprettes med etiketten, får også `labeled`.
    types: [synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  endret:
    name: Endret siden forrige vellykkede kjøring
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.state == 'open' &&
       ((github.event.action == 'labeled' && github.event.label.name == 'feilinnfoering') ||
        (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'feilinnfoering'))))
    runs-on: ubuntu-latest
    # Egen gruppe, så en nyere push på PR-en avbryter også denne, og en eldre
    # kjøring ikke kan stille seg bak den nyere i gruppen til feilinnfoering.
    concurrency:
      group: feilinnfoering-endret-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: read
    outputs:
      kjoer: ${{ steps.sammenlikn.outputs.kjoer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Det kjernetestene, lagringstestene og testbasen leser, og verktøykjeden.
      - name: Sammenlikn med forrige vellykkede kjøring
        id: sammenlikn
        env:
          GH_TOKEN: ${{ github.token }}
          PLANLAGT: ${{ github.event_name == 'schedule' || inputs.som_planlagt == true }}
          STIER: >-
            kjerne
            sprakprove/kjernelagring
            server
            sprakprove/kjerne
            docs/domenetabell
            docs/datamodell/kjernehendelser.toml
            database/migrasjoner
            scripts/testbase/docker_sqlserver.sh
            scripts/ci/hent_bilde.sh
            .github/workflows/feilinnfoering.yml
            package.json
            package-lock.json
            vite.config.ts
            src/test-setup.ts
            svelte.config.js
            tsconfig.json
        run: |
          if [ "$PLANLAGT" != true ]; then
            echo "kjoer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          forrige="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/feilinnfoering.yml/runs?branch=$GITHUB_REF_NAME&status=success&per_page=50" \
            --jq '[.workflow_runs[] | select(.event != "pull_request")][0].head_sha // ""')" ||
            { echo "::warning::Fant ikke forrige vellykkede kjøring; kjører fullt."; forrige=""; }
          echo "Forrige vellykkede kjøring på $GITHUB_REF_NAME: ${forrige:-ingen}"
          if [ -z "$forrige" ] || ! git cat-file -e "$forrige^{commit}" 2>/dev/null; then
            echo "kjoer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # shellcheck disable=SC2086
          endringer="$(git diff --name-only "$forrige" HEAD -- $STIER)"
          echo "${endringer:-Ingen endringer under stiene.}"
          if [ -n "$endringer" ]; then
            echo "kjoer=true" >> "$GITHUB_OUTPUT"
          else
            echo "kjoer=false" >> "$GITHUB_OUTPUT"
          fi

  feilinnfoering:
    name: Feilinnføringene for kjernen (del ${{ matrix.del }} av 6)
    needs: endret
    if: needs.endret.outputs.kjoer == 'true'
    # Skriptet fordeler mutasjonene på delene etter rekkefølgen, så en ny
    # mutasjon trenger ingen endring her.
    strategy:
      fail-fast: false
      matrix:
        del: [1, 2, 3, 4, 5, 6]
    # På jobben, ikke workflowen: en PR-hendelse som hoppes over (en annen
    # etikett), skal ikke avbryte en kjøring som går. Én gruppe per del, ellers
    # venter delene på hverandre.
    concurrency:
      group: feilinnfoering-${{ github.event_name }}-${{ github.ref }}-${{ matrix.del }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # Den nattlige kjøringen tar lagringstestene mot SQL Server i hver mutasjon, om lag
    # 220 s per kjøring og kopi (#932).
    timeout-minutes: 90
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Som SQL Server-jobben i ci.yml. Malen for basene bygges av den første
      # testfilen som trenger den.
      - name: Start SQL Server
        run: |
          scripts/testbase/docker_sqlserver.sh start > /dev/null
          tilkobling="$(scripts/testbase/docker_sqlserver.sh tilkobling)"
          passord="${tilkobling#*Password=}"
          echo "::add-mask::${passord%%;*}"
          echo "KOE_SQLSERVER_TILKOBLING=$tilkobling" >> "$GITHUB_ENV"

      - name: Kjør feilinnføringene
        id: feilinnfoering
        env:
          FEILINNFOERING_DEL: ${{ matrix.del }}/6
          FEILINNFOERING_UTVALG: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: |
          echo "Prosessorer: $(nproc)"
          node kjerne/tester/feilinnfoering.ts

      # Et tidsavbrudd på en test som ikke er et mål, gjør mutasjonen «IKKE OPPDAGET».
      # Steget viser om SQL Server eller runneren stanset (#961): minnet, OOM-killeren
      # og errorlog fra containeren.
      - name: Vis minnet og loggen fra SQL Server
        if: failure() && steps.feilinnfoering.outcome == 'failure'
        run: |
          free -m
          docker stats --no-stream
          sudo dmesg | grep -iE 'oom|killed process|hung task' || true
          docker exec koe-sqlserver-14331 cat /var/opt/mssql/log/errorlog \
            | grep -aiE 'paged out|longer than 15 seconds|non-yielding|memory|backup|restore|deadlock|error' \
            | grep -avE 'This is an informational message only|Database was restored|Restore is complete|RESTORE DATABASE successfully' \
            | tail -n 200 || true

      # Skriptet muterer bare kopier utenfor treet (#378). Kontrollen fanger et
      # skript som likevel skriver i treet.
      - name: Kontroller at arbeidskopien er ren
        if: always() && steps.feilinnfoering.outcome != 'skipped'
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
