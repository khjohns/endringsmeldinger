# Konfigurasjon for Supabase CLI. Formålet er DA-03: at migrasjonsmappa er
# eneste kilde, og at «anvendt» kan avledes framfor å huskes.
#
# Basen kjører PostgreSQL 17.6 (kontrollert 2026-09-22). CI-jobben `database`
# bygger migrasjonssettet fra tom mot PostgreSQL 17 ved hver PR; se
# scripts/testbase/bygg_testbase.sh.

project_id = "gwdxadexwktegkklyobv"

[db]
major_version = 17

[db.migrations]
# Filene kjøres i filnavnrekkefølge. Rekkefølgen er en skranke:
# project_memberships har fremmednøkkel til projects og må komme etter den.
# CI-jobben `database` feiler hvis en fil sorterer feil.
schema_paths = []
