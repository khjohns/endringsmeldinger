# Unntak fra skanningen av kjøretidsavhengighetene i TS (#269 punkt 3).
#
# Hver post gjelder én advisory i én pakke, med datoen unntaket ble ført, issuet
# som skal fjerne det, og hvorfor det ikke er rettet nå. Skanningen varsler når
# en advisory ikke lenger treffer, så posten kan fjernes.
#
# Postene fra 18.10 er sårbarhetene som fantes da skanningen ble innført. De har
# rettede versjoner, men oppgraderingen av frontendavhengighetene hører til #268
# og ble ikke gjort her.

